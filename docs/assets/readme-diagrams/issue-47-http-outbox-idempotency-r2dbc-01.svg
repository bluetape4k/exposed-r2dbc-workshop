<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 12 HTTP outbox idempotency flow</title>
  <desc id="desc">Spring Boot 4 and Ktor persist outbound work before dispatch, claim retryable rows, call HTTP clients outside transactions, and persist the outcome.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 8; }
      .spring { fill: #ecfdf5; stroke: #047857; }
      .ktor { fill: #eef2ff; stroke: #4338ca; }
      .db { fill: #fff7ed; stroke: #c2410c; }
      .external { fill: #fdf2f8; stroke: #be185d; }
      .state { fill: #f1f5f9; stroke: #475569; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 16px; fill: #334155; }
      .tiny { font-size: 14px; fill: #475569; }
      .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke-dasharray: 8 7; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M 0 0 L 12 4 L 0 8 z" fill="#111827"/>
    </marker>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <text class="text title" x="70" y="72">HTTP Outbox Idempotency with Exposed R2DBC</text>
  <text class="text subtitle" x="70" y="104">Persist first, dispatch outside the transaction, and record retry-safe outcomes.</text>

  <rect class="panel spring" x="70" y="150" width="300" height="140" rx="8"/>
  <text class="text label" x="96" y="190">Spring Boot 4</text>
  <text class="text small" x="96" y="224">WebFlux controller</text>
  <text class="text small" x="96" y="250">WebClient dispatch boundary</text>

  <rect class="panel ktor" x="70" y="470" width="300" height="140" rx="8"/>
  <text class="text label" x="96" y="510">Ktor 3</text>
  <text class="text small" x="96" y="544">Routing DSL + Sessions</text>
  <text class="text small" x="96" y="570">HttpClient / MockEngine boundary</text>

  <rect class="panel" x="450" y="190" width="280" height="110" rx="8"/>
  <text class="text label" x="478" y="232">Inbound Request</text>
  <text class="text small" x="478" y="264">idempotencyKey + payload</text>

  <rect class="panel db" x="800" y="160" width="330" height="170" rx="8"/>
  <text class="text label" x="828" y="202">OutboundRequests</text>
  <text class="text small" x="828" y="236">unique idempotency key</text>
  <text class="text small" x="828" y="262">status, attempts, lastStatusCode</text>
  <text class="text small" x="828" y="288">sanitized lastError</text>

  <rect class="panel state" x="455" y="420" width="265" height="150" rx="8"/>
  <text class="text label" x="483" y="462">Claim Batch</text>
  <text class="text small" x="483" y="496">PENDING / RETRYABLE_FAILED</text>
  <text class="text small" x="483" y="522">to IN_FLIGHT</text>
  <text class="text tiny" x="483" y="548">short R2DBC transaction</text>

  <rect class="panel external" x="815" y="440" width="305" height="150" rx="8"/>
  <text class="text label" x="843" y="482">External HTTP API</text>
  <text class="text small" x="843" y="516">2xx success</text>
  <text class="text small" x="843" y="542">408 / 429 / 5xx retryable</text>
  <text class="text small" x="843" y="568">ordinary 4xx permanent</text>

  <rect class="panel" x="1185" y="240" width="155" height="285" rx="8"/>
  <text class="text label" x="1210" y="280">States</text>
  <text class="text small" x="1210" y="320">PENDING</text>
  <text class="text small" x="1210" y="360">IN_FLIGHT</text>
  <text class="text small" x="1210" y="400">SUCCEEDED</text>
  <text class="text small" x="1210" y="440">RETRYABLE_FAILED</text>
  <text class="text small" x="1210" y="480">PERMANENT_FAILED</text>

  <path class="arrow" d="M 370 220 L 450 220"/>
  <path class="arrow" d="M 730 245 L 800 245"/>
  <path class="arrow" d="M 965 330 L 965 440"/>
  <path class="arrow" d="M 720 495 L 815 495"/>
  <path class="arrow" d="M 970 440 C 1040 390 1050 330 1130 300"/>
  <path class="arrow dash" d="M 815 550 C 730 620 570 615 520 570"/>
  <path class="arrow" d="M 370 540 C 420 540 430 495 455 495"/>
  <path class="arrow" d="M 370 540 C 465 410 690 330 800 285"/>

  <text class="text tiny" x="385" y="208">POST /production/outbound</text>
  <text class="text tiny" x="742" y="232">persist before dispatch</text>
  <text class="text tiny" x="980" y="390">release transaction</text>
  <text class="text tiny" x="741" y="486">HTTP call</text>
  <text class="text tiny" x="1035" y="365">record outcome</text>
  <text class="text tiny" x="585" y="638">retry until maxAttempts, then permanent</text>
</svg>
