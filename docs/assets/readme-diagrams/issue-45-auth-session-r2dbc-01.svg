<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 12 Authentication and Session Metadata</title>
  <desc id="desc">Spring Boot 4 WebFlux Security and Ktor Authentication create BCrypt-backed users and SHA-256 session-token metadata in Exposed R2DBC tables.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .spring { fill: #ecfdf5; stroke: #2f855a; }
      .ktor { fill: #eef2ff; stroke: #4f46e5; }
      .db { fill: #fff7ed; stroke: #c2410c; }
      .guard { fill: #fefce8; stroke: #a16207; }
      .title { font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive; font-size:34px; font-weight:400; fill: #172033; }
      .subtitle { font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size:18px; font-weight:400; fill: #516070; }
      .label { font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive; font-size:20px; font-weight:400; fill: #172033; }
      .small { font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size:15px; font-weight:400; fill: #425466; }
      .mono { font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive; font-size:14px; font-weight:400; fill: #172033; }
      .arrow { stroke: #5d6b7a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <text x="70" y="70" class="title">Authentication and Session Metadata</text>
  <text x="70" y="105" class="subtitle">BCrypt credentials, opaque session tokens, and role denial are persisted and tested in both stacks</text>

  <rect x="60" y="145" width="590" height="450" class="panel spring"/>
  <text x="95" y="190" class="label">Spring Boot 4 WebFlux Security</text>
  <text x="95" y="220" class="small">ReactiveUserDetailsService reads account rows before Basic auth succeeds</text>

  <rect x="100" y="260" width="180" height="78" class="panel guard"/>
  <text x="125" y="292" class="mono">httpBasic</text>
  <text x="125" y="315" class="small">profile / admin</text>

  <rect x="330" y="260" width="190" height="78" class="panel"/>
  <text x="355" y="292" class="mono">auth config</text>
  <text x="355" y="315" class="small">stateless security</text>

  <rect x="330" y="385" width="190" height="78" class="panel"/>
  <text x="355" y="417" class="mono">repository</text>
  <text x="355" y="440" class="small">BCrypt + SHA-256</text>

  <rect x="100" y="385" width="180" height="78" class="panel"/>
  <text x="125" y="417" class="mono">sessions</text>
  <text x="125" y="440" class="small">raw token once</text>

  <rect x="215" y="510" width="210" height="60" class="panel db"/>
  <text x="240" y="535" class="mono">accounts + sessions</text>
  <text x="240" y="557" class="small">Exposed R2DBC tables</text>

  <path class="arrow" d="M280 299 H330"/>
  <path class="arrow" d="M425 338 V385"/>
  <path class="arrow" d="M425 463 C425 492 425 502 425 520"/>
  <path class="arrow" d="M330 424 H280"/>

  <rect x="750" y="145" width="590" height="450" class="panel ktor"/>
  <text x="785" y="190" class="label">Ktor Authentication + Sessions</text>
  <text x="785" y="220" class="small">Basic auth creates DB session rows, then a signed cookie carries only the opaque token</text>

  <rect x="790" y="260" width="180" height="78" class="panel guard"/>
  <text x="815" y="292" class="mono">auth-basic</text>
  <text x="815" y="315" class="small">profile / sessions</text>

  <rect x="1020" y="260" width="190" height="78" class="panel"/>
  <text x="1045" y="292" class="mono">auth-session</text>
  <text x="1045" y="315" class="small">cookie token check</text>

  <rect x="1020" y="385" width="190" height="78" class="panel"/>
  <text x="1045" y="417" class="mono">repository</text>
  <text x="1045" y="440" class="small">BCrypt + SHA-256</text>

  <rect x="790" y="385" width="180" height="78" class="panel"/>
  <text x="815" y="417" class="mono">routes</text>
  <text x="815" y="440" class="small">403 role denial</text>

  <rect x="905" y="510" width="210" height="60" class="panel db"/>
  <text x="930" y="535" class="mono">accounts + sessions</text>
  <text x="930" y="557" class="small">Exposed R2DBC tables</text>

  <path class="arrow" d="M970 299 H1020"/>
  <path class="arrow" d="M1115 338 V385"/>
  <path class="arrow" d="M1115 463 C1115 492 1115 502 1115 520"/>
  <path class="arrow" d="M1020 424 H970"/>

  <rect x="360" y="630" width="680" height="70" class="panel"/>
  <text x="390" y="660" class="label">Verified auth outcomes</text>
  <text x="390" y="685" class="small">authorized access, missing credentials, invalid credentials, role denial, session list without raw tokens</text>
</svg>
