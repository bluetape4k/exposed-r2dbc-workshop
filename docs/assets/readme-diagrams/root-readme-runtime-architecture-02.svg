<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Exposed R2DBC Workshop runtime architecture</title>
  <desc id="desc">Runtime architecture from HTTP clients through WebFlux or Ktor, coroutine services, Exposed R2DBC transactions, routing connection factories, databases, Redis, and outbox diagnostics.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#63758A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#203040;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:17px;fill:#536476;font-weight:400}
      .lane{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;fill:#203040;font-weight:400}
      .label{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:16px;fill:#2F4053;font-weight:400}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#5F6F82;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .line{stroke:#63758A;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#63758A;stroke-width:2.2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="980"/>
  <rect class="frame" x="34" y="30" width="1432" height="918" rx="24"/>
  <text class="title" x="72" y="84">Runtime architecture</text>
  <text class="subtitle" x="76" y="116">The workshop examples explain how request context, coroutine transactions, routing, cache, and production diagnostics fit together.</text>

  <rect class="lane" x="76" y="150" width="1348" height="120" rx="16"/>
  <text class="laneTitle" x="104" y="190">Entry adapters</text>
  <g transform="translate(315,178)">
    <rect class="card" x="0" y="0" width="250" height="64" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="label" x="125" y="28" text-anchor="middle">Spring WebFlux</text>
    <text class="small" x="125" y="50" text-anchor="middle">controller, filter, WebClient</text>
  </g>
  <g transform="translate(610,178)">
    <rect class="card" x="0" y="0" width="250" height="64" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="label" x="125" y="28" text-anchor="middle">Ktor</text>
    <text class="small" x="125" y="50" text-anchor="middle">routing, call attributes, client</text>
  </g>
  <g transform="translate(905,178)">
    <rect class="card" x="0" y="0" width="250" height="64" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="label" x="125" y="28" text-anchor="middle">Request context</text>
    <text class="small" x="125" y="50" text-anchor="middle">tenant, auth, correlation id</text>
  </g>

  <rect class="lane" x="76" y="306" width="1348" height="150" rx="16"/>
  <text class="laneTitle" x="104" y="346">Application patterns</text>
  <g transform="translate(250,340)">
    <rect class="card" x="0" y="0" width="230" height="76" rx="12" fill="#FDECEF" stroke="#DB7890"/>
    <text class="label" x="115" y="30" text-anchor="middle">Repository</text>
    <text class="small" x="115" y="54" text-anchor="middle">coroutine service boundary</text>
  </g>
  <g transform="translate(525,340)">
    <rect class="card" x="0" y="0" width="230" height="76" rx="12" fill="#E9F7F6" stroke="#55B5AF"/>
    <text class="label" x="115" y="30" text-anchor="middle">Suspended cache</text>
    <text class="small" x="115" y="54" text-anchor="middle">Redis and single-flight</text>
  </g>
  <g transform="translate(800,340)">
    <rect class="card" x="0" y="0" width="230" height="76" rx="12" fill="#F1ECFF" stroke="#A58BE3"/>
    <text class="label" x="115" y="30" text-anchor="middle">Multi-tenant</text>
    <text class="small" x="115" y="54" text-anchor="middle">schema, pool, authorization</text>
  </g>
  <g transform="translate(1075,340)">
    <rect class="card" x="0" y="0" width="230" height="76" rx="12" fill="#F7F1E7" stroke="#B68C55"/>
    <text class="label" x="115" y="30" text-anchor="middle">Production integration</text>
    <text class="small" x="115" y="54" text-anchor="middle">outbox, readiness, diagnostics</text>
  </g>

  <rect class="lane" x="76" y="492" width="1348" height="156" rx="16"/>
  <text class="laneTitle" x="104" y="532">Exposed R2DBC core</text>
  <g transform="translate(236,535)">
    <rect class="card" x="0" y="0" width="272" height="78" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="label" x="136" y="30" text-anchor="middle">suspendTransaction</text>
    <text class="small" x="136" y="54" text-anchor="middle">all database access enters here</text>
  </g>
  <g transform="translate(614,535)">
    <rect class="card" x="0" y="0" width="272" height="78" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="label" x="136" y="30" text-anchor="middle">SQL DSL and Flow</text>
    <text class="small" x="136" y="54" text-anchor="middle">selectAll Flow, DDL, DML, custom types</text>
  </g>
  <g transform="translate(992,535)">
    <rect class="card" x="0" y="0" width="272" height="78" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="label" x="136" y="30" text-anchor="middle">ConnectionFactory routing</text>
    <text class="small" x="136" y="54" text-anchor="middle">tenant and read/write decisions</text>
  </g>

  <rect class="lane" x="76" y="684" width="1348" height="150" rx="16"/>
  <text class="laneTitle" x="104" y="724">Infrastructure</text>
  <g transform="translate(235,718)">
    <rect class="card" x="0" y="0" width="220" height="78" rx="12" fill="#E9F7F6" stroke="#55B5AF"/>
    <text class="label" x="110" y="30" text-anchor="middle">Primary DB</text>
    <text class="small" x="110" y="54" text-anchor="middle">writes, schema lifecycle</text>
  </g>
  <g transform="translate(505,718)">
    <rect class="card" x="0" y="0" width="220" height="78" rx="12" fill="#FDECEF" stroke="#DB7890"/>
    <text class="label" x="110" y="30" text-anchor="middle">Replica DB</text>
    <text class="small" x="110" y="54" text-anchor="middle">read routing examples</text>
  </g>
  <g transform="translate(775,718)">
    <rect class="card" x="0" y="0" width="220" height="78" rx="12" fill="#F1ECFF" stroke="#A58BE3"/>
    <text class="label" x="110" y="30" text-anchor="middle">Redis</text>
    <text class="small" x="110" y="54" text-anchor="middle">suspended cache examples</text>
  </g>
  <g transform="translate(1045,718)">
    <rect class="card" x="0" y="0" width="220" height="78" rx="12" fill="#F7F1E7" stroke="#B68C55"/>
    <text class="label" x="110" y="30" text-anchor="middle">Outbox store</text>
    <text class="small" x="110" y="54" text-anchor="middle">idempotency and realtime replay</text>
  </g>

  <path class="line" d="M565 210 C585 210 590 210 610 210"/>
  <path class="line" d="M860 210 C880 210 885 210 905 210"/>
  <path class="line" d="M1030 242 C1030 286 365 286 365 340"/>
  <path class="line" d="M1030 242 C1030 286 640 286 640 340"/>
  <path class="line" d="M1030 242 C1030 286 915 286 915 340"/>
  <path class="line" d="M1030 242 C1030 286 1190 286 1190 340"/>

  <path class="line" d="M365 416 C365 470 372 470 372 535"/>
  <path class="line" d="M640 416 C640 470 750 470 750 535"/>
  <path class="line" d="M915 416 C915 470 1128 470 1128 535"/>
  <path class="dashed" d="M1190 416 C1190 470 1128 470 1128 535"/>

  <path class="line" d="M508 574 C560 574 562 574 614 574"/>
  <path class="line" d="M886 574 C938 574 940 574 992 574"/>
  <path class="line" d="M1128 613 C1128 666 345 666 345 718"/>
  <path class="line" d="M1128 613 C1128 666 615 666 615 718"/>
  <path class="dashed" d="M640 416 C540 505 540 665 885 718"/>
  <path class="dashed" d="M1190 416 C1190 675 1155 675 1155 718"/>

  <text class="small" x="750" y="890" text-anchor="middle">Use this diagram as the README-level mental model; module READMEs provide focused architecture, sequence, class, and ERD PNG diagrams.</text>
</svg>
