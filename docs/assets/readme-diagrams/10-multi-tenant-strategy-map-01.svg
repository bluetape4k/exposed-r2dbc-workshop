<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 10 Multi-Tenant R2DBC Strategy Architecture</title>
  <desc id="desc">Chapter 10 compares Spring WebFlux and Ktor tenant request boundaries with shared Exposed R2DBC isolation contracts.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/>
    </marker>
    <style>
      .bg{fill:#F7F9FC}
      .panel{fill:#FFFFFF;stroke:#BCC7D6;stroke-width:2;rx:18;filter:url(#shadow)}
      .spring{fill:#E8F7EE;stroke:#3A8B57}
      .ktor{fill:#EDF1FF;stroke:#5067C5}
      .shared{fill:#FFF7E6;stroke:#B7791F}
      .db{fill:#F1F5F9;stroke:#475569}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:37px;fill:#172033;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:17px;fill:#516070;font-weight:400}
      .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#172033;font-weight:400}
      .component{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;fill:#172033;font-weight:400}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;fill:#425466;font-weight:400}
      .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#172033;font-weight:400}
      .arrow{stroke:#5D6B7A;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#5D6B7A;stroke-width:2.2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1400" height="760"/>
  <text x="70" y="70" class="title">Chapter 10 Multi-Tenant Strategy Architecture</text>
  <text x="70" y="105" class="subtitle">Two request boundaries, one Exposed R2DBC tenant-isolation decision model</text>

  <rect x="60" y="145" width="590" height="470" class="panel spring"/>
  <text x="95" y="190" class="label">Spring WebFlux tenant boundary</text>
  <text x="95" y="220" class="small">Filters, ReactorContext, authorization, and tenant-owned pool variants</text>

  <rect x="100" y="255" width="190" height="80" class="panel"/>
  <text x="126" y="287" class="component">request filter</text>
  <text x="126" y="312" class="small">X-TENANT-ID</text>

  <rect x="330" y="255" width="190" height="80" class="panel"/>
  <text x="356" y="287" class="component">tenant context</text>
  <text x="356" y="312" class="small">Reactor to coroutine</text>

  <rect x="330" y="380" width="190" height="80" class="panel"/>
  <text x="356" y="412" class="component">strategy service</text>
  <text x="356" y="437" class="small">schema, auth, onboarding</text>

  <rect x="100" y="380" width="190" height="80" class="panel"/>
  <text x="126" y="412" class="component">fail closed</text>
  <text x="126" y="437" class="small">invalid tenant</text>

  <rect x="215" y="505" width="190" height="70" class="panel db"/>
  <text x="241" y="535" class="component">tenant registry</text>
  <text x="241" y="558" class="small">startup pools or metadata</text>

  <path class="arrow" d="M290 295 H330"/>
  <path class="arrow" d="M425 335 V380"/>
  <path class="arrow" d="M425 460 C425 500 405 520 405 540"/>
  <path class="arrow" d="M330 420 H290"/>

  <rect x="750" y="145" width="590" height="470" class="panel ktor"/>
  <text x="785" y="190" class="label">Ktor tenant boundary</text>
  <text x="785" y="220" class="small">Plugin and call attributes model the same schema-per-tenant request flow</text>

  <rect x="790" y="255" width="190" height="80" class="panel"/>
  <text x="816" y="287" class="component">routing plugin</text>
  <text x="816" y="312" class="small">header validation</text>

  <rect x="1020" y="255" width="190" height="80" class="panel"/>
  <text x="1046" y="287" class="component">call attributes</text>
  <text x="1046" y="312" class="small">tenant context</text>

  <rect x="1020" y="380" width="190" height="80" class="panel"/>
  <text x="1046" y="412" class="component">schema switch</text>
  <text x="1046" y="437" class="small">module 07 flow</text>

  <rect x="790" y="380" width="190" height="80" class="panel"/>
  <text x="816" y="412" class="component">status pages</text>
  <text x="816" y="437" class="small">tenant errors</text>

  <rect x="905" y="505" width="190" height="70" class="panel db"/>
  <text x="931" y="535" class="component">tenant schema</text>
  <text x="931" y="558" class="small">H2-focused verification</text>

  <path class="arrow" d="M980 295 H1020"/>
  <path class="arrow" d="M1115 335 V380"/>
  <path class="arrow" d="M1115 460 C1115 500 1095 520 1095 540"/>
  <path class="arrow" d="M1020 420 H980"/>

  <rect x="365" y="645" width="670" height="72" class="panel shared"/>
  <text x="395" y="674" class="label">Shared R2DBC contracts</text>
  <text x="395" y="700" class="small">suspendTransaction, fail-closed tenant validation, schema-per-tenant, connection-factory-per-tenant, onboarding cleanup</text>

  <path class="dashed" d="M520 420 C610 520 650 610 700 645"/>
  <path class="dashed" d="M1020 420 C930 520 850 610 770 645"/>
</svg>
