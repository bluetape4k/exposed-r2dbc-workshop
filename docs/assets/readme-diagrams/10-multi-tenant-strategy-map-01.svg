<rect class="canvas" width="1600" height="940"/>
<rect class="frame" x="28" y="26" width="1544" height="888" rx="22"/>
<text x="70" y="80" class="title">Chapter 10 Multi-Tenant Strategy Map</text>
<text x="72" y="112" class="subtitle">Repository-backed chooser for schema switching, tenant-owned pools, authorization, runtime onboarding, and Ktor call-scoped routing.</text>

<rect class="lane" x="54" y="148" width="1492" height="246" rx="18"/>
<text x="82" y="180" class="laneTitle">REQUEST ROUTING STRATEGY</text>
<rect class="lane" x="54" y="430" width="1492" height="158" rx="18"/>
<text x="82" y="462" class="laneTitle">ISOLATION MODEL</text>
<rect class="lane" x="54" y="624" width="1492" height="174" rx="18"/>
<text x="82" y="656" class="laneTitle">WHEN TO CHOOSE</text>

<g data-card="03 Schema Switch" data-x="76" data-y="210" data-width="270" data-height="136">
<rect class="card" x="76" y="210" width="270" height="136" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.2"/>
<path class="header" d="M76,254 L76,224 Q76,210 90,210 L332,210 Q346,210 346,224 L346,254 Z" fill="#eef5fa"/>
<text x="211" y="230" class="tag" text-anchor="middle">03-multitenant-spring-webflux</text>
<text x="211" y="251" class="cardTitle" text-anchor="middle">Schema Switch</text>
<text x="100" y="282" class="detail">TenantFilter -> ReactorContext</text>
<text x="100" y="306" class="detail">currentReactorTenant()</text>
<text x="100" y="330" class="detail">SchemaUtils.setSchema(...)</text>
</g>

<g data-card="04 Tenant Pool" data-x="376" data-y="210" data-width="270" data-height="136">
<rect class="card" x="376" y="210" width="270" height="136" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.2"/>
<path class="header" d="M376,254 L376,224 Q376,210 390,210 L632,210 Q646,210 646,224 L646,254 Z" fill="#f1f6ec"/>
<text x="511" y="230" class="tag" text-anchor="middle">04-connection-factory</text>
<text x="511" y="251" class="cardTitle" text-anchor="middle">Tenant Pool</text>
<text x="400" y="282" class="detail">TenantFilter validates header</text>
<text x="400" y="306" class="detail">RoutingConnectionFactory</text>
<text x="400" y="330" class="detail">TenantTransactionExecutor</text>
</g>

<g data-card="05 Authorized Pool" data-x="676" data-y="210" data-width="270" data-height="136">
<rect class="card" x="676" y="210" width="270" height="136" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.2"/>
<path class="header" d="M676,254 L676,224 Q676,210 690,210 L932,210 Q946,210 946,224 L946,254 Z" fill="#f5eef2"/>
<text x="811" y="230" class="tag" text-anchor="middle">05-spring-security</text>
<text x="811" y="251" class="cardTitle" text-anchor="middle">Authorized Pool</text>
<text x="700" y="282" class="detail">tenant_id from auth</text>
<text x="700" y="306" class="detail">compare X-TENANT-ID</text>
<text x="700" y="330" class="detail">write context only on match</text>
</g>

<g data-card="06 Runtime Onboarding" data-x="976" data-y="210" data-width="270" data-height="136">
<rect class="card" x="976" y="210" width="270" height="136" rx="14" fill="#fff" stroke="#b78632" stroke-width="2.2"/>
<path class="header" d="M976,254 L976,224 Q976,210 990,210 L1232,210 Q1246,210 1246,224 L1246,254 Z" fill="#f5eee4"/>
<text x="1111" y="230" class="tag" text-anchor="middle">06-tenant-onboarding</text>
<text x="1111" y="251" class="cardTitle" text-anchor="middle">Runtime Onboarding</text>
<text x="1000" y="282" class="detail">POST /api/tenants</text>
<text x="1000" y="306" class="detail">reserve -> pool -> schema</text>
<text x="1000" y="330" class="detail">register runtime resources</text>
</g>

<g data-card="07 Ktor Attributes" data-x="1276" data-y="210" data-width="270" data-height="136">
<rect class="card" x="1276" y="210" width="270" height="136" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.2"/>
<path class="header" d="M1276,254 L1276,224 Q1276,210 1290,210 L1532,210 Q1546,210 1546,224 L1546,254 Z" fill="#eef7f6"/>
<text x="1411" y="230" class="tag" text-anchor="middle">07-multitenant-ktor</text>
<text x="1411" y="251" class="cardTitle" text-anchor="middle">Ktor Attributes</text>
<text x="1300" y="282" class="detail">TenantPlugin validates header</text>
<text x="1300" y="306" class="detail">call.attributes stores tenant</text>
<text x="1300" y="330" class="detail">suspendTransactionWithTenant</text>
</g>

<path class="connector" data-connector="strategy-03-isolation" d="M 211 346 L 211 430" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
<path class="connector" data-connector="strategy-04-isolation" d="M 511 346 L 511 430" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
<path class="connector" data-connector="strategy-05-isolation" d="M 811 346 L 811 430" stroke="#a85f7f" marker-end="url(#arrow-red)"/>
<path class="connector" data-connector="strategy-06-isolation" d="M 1111 346 L 1111 430" stroke="#b78632" marker-end="url(#arrow-amber)"/>
<path class="connector" data-connector="strategy-07-isolation" d="M 1411 346 L 1411 430" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>

<g data-card="One DB, Schema per Tenant" data-x="76" data-y="480" data-width="270" data-height="72">
<rect class="card" x="76" y="480" width="270" height="72" rx="14" fill="#eef5fa" stroke="#4f86c6" stroke-width="2"/>
<text x="211" y="510" class="cardTitle" text-anchor="middle">One R2DBC DB</text>
<text x="211" y="535" class="detail" text-anchor="middle">schema per tenant</text>
</g>
<g data-card="R2DBC URL per Tenant" data-x="376" data-y="480" data-width="270" data-height="72">
<rect class="card" x="376" y="480" width="270" height="72" rx="14" fill="#f1f6ec" stroke="#6f8f52" stroke-width="2"/>
<text x="511" y="510" class="cardTitle" text-anchor="middle">Tenant-owned Pool</text>
<text x="511" y="535" class="detail" text-anchor="middle">R2DBC URL per tenant</text>
</g>
<g data-card="Auth Gate plus Pool" data-x="676" data-y="480" data-width="270" data-height="72">
<rect class="card" x="676" y="480" width="270" height="72" rx="14" fill="#f5eef2" stroke="#a85f7f" stroke-width="2"/>
<text x="811" y="510" class="cardTitle" text-anchor="middle">Auth Gate + Pool</text>
<text x="811" y="535" class="detail" text-anchor="middle">authorized tenant routes</text>
</g>
<g data-card="Runtime Registry" data-x="976" data-y="480" data-width="270" data-height="72">
<rect class="card" x="976" y="480" width="270" height="72" rx="14" fill="#f5eee4" stroke="#b78632" stroke-width="2"/>
<text x="1111" y="510" class="cardTitle" text-anchor="middle">Runtime Registry</text>
<text x="1111" y="535" class="detail" text-anchor="middle">pool + database wrappers</text>
</g>
<g data-card="Ktor Schema Switch" data-x="1276" data-y="480" data-width="270" data-height="72">
<rect class="card" x="1276" y="480" width="270" height="72" rx="14" fill="#eef7f6" stroke="#4f8f8b" stroke-width="2"/>
<text x="1411" y="510" class="cardTitle" text-anchor="middle">One R2DBC DB</text>
<text x="1411" y="535" class="detail" text-anchor="middle">Ktor schema switch</text>
</g>

<path class="connector" data-connector="isolation-03-choice" d="M 211 552 L 211 624" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
<path class="connector" data-connector="isolation-04-choice" d="M 511 552 L 511 624" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
<path class="connector" data-connector="isolation-05-choice" d="M 811 552 L 811 624" stroke="#a85f7f" marker-end="url(#arrow-red)"/>
<path class="connector" data-connector="isolation-06-choice" d="M 1111 552 L 1111 624" stroke="#b78632" marker-end="url(#arrow-amber)"/>
<path class="connector" data-connector="isolation-07-choice" d="M 1411 552 L 1411 624" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>

<g data-card="Choose 03" data-x="76" data-y="682" data-width="270" data-height="76">
<rect x="76" y="682" width="270" height="76" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2"/>
<text x="211" y="710" class="detail" text-anchor="middle">shared DB is enough</text>
<text x="211" y="735" class="detail" text-anchor="middle">need WebFlux + schema isolation</text>
</g>
<g data-card="Choose 04" data-x="376" data-y="682" data-width="270" data-height="76">
<rect x="376" y="682" width="270" height="76" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2"/>
<text x="511" y="710" class="detail" text-anchor="middle">tenants are known at startup</text>
<text x="511" y="735" class="detail" text-anchor="middle">separate pools are required</text>
</g>
<g data-card="Choose 05" data-x="676" data-y="682" data-width="270" data-height="76">
<rect x="676" y="682" width="270" height="76" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2"/>
<text x="811" y="710" class="detail" text-anchor="middle">tenant claim must match header</text>
<text x="811" y="735" class="detail" text-anchor="middle">reject mismatch before routing</text>
</g>
<g data-card="Choose 06" data-x="976" data-y="682" data-width="270" data-height="76">
<rect x="976" y="682" width="270" height="76" rx="14" fill="#fff" stroke="#b78632" stroke-width="2"/>
<text x="1111" y="710" class="detail" text-anchor="middle">tenants are created at runtime</text>
<text x="1111" y="735" class="detail" text-anchor="middle">provision + cleanup must exist</text>
</g>
<g data-card="Choose 07" data-x="1276" data-y="682" data-width="270" data-height="76">
<rect x="1276" y="682" width="270" height="76" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2"/>
<text x="1411" y="710" class="detail" text-anchor="middle">same schema strategy in Ktor</text>
<text x="1411" y="735" class="detail" text-anchor="middle">no ReactorContext or filters</text>
</g>

<rect x="96" y="832" width="1408" height="34" rx="10" class="noteBox"/>
<text x="800" y="854" class="legend" text-anchor="middle">Every request-routed example validates X-TENANT-ID and fails closed; 05 adds identity authorization, 06 adds admin-token onboarding.</text>
</svg>
