<style>
.canvas{fill:#f6f9fc}
.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
.lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.4}
.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:36px;fill:#1e293b}
.subtitle,.detail,.note,.legend{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
.laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;letter-spacing:.08em;fill:#8ca2b4}
.cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;fill:#1e293b}
