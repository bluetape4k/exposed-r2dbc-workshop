<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Example parity map for exposed-r2dbc-workshop issue 89</title>
  <desc id="desc">A concept-level parity map between exposed-r2dbc-workshop and exposed-workshop examples and GitHub issue topics.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#63758A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#203040;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:17px;fill:#536476;font-weight:400}
      .head{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:27px;fill:#203040;font-weight:400}
      .label{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:16px;fill:#2F4053;font-weight:400}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;fill:#5F6F82;font-weight:400}
      .tiny{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#647386;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .line{stroke:#63758A;stroke-width:2;fill:none;marker-end:url(#arrow)}
      .mutedLine{stroke:#AAB6C4;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="920"/>
  <rect class="frame" x="34" y="30" width="1432" height="858" rx="24"/>
  <text class="title" x="72" y="84">Example parity map</text>
  <text class="subtitle" x="76" y="116">Issue #89 compares concepts, not exact module names, so platform-specific R2DBC/JDBC examples stay distinct.</text>

  <g transform="translate(78,150)">
    <rect class="card" x="0" y="0" width="405" height="646" rx="16" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="head" x="202" y="44" text-anchor="middle">exposed-r2dbc-workshop</text>
    <text class="small" x="202" y="72" text-anchor="middle">Reactive R2DBC, Flow, WebFlux, Ktor</text>

    <rect x="30" y="104" width="345" height="70" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="132">10 / 07 Ktor multi-tenant</text>
    <text class="tiny" x="54" y="156">closed #33, implemented module</text>

    <rect x="30" y="196" width="345" height="86" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="224">11 / 04-06 Ktor cache and routing</text>
    <text class="tiny" x="54" y="248">closed #34, #35, #69</text>
    <text class="tiny" x="54" y="268">R2DBC cache, single-flight, routing datasource</text>

    <rect x="30" y="304" width="345" height="86" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="332">10 WebFlux tenant strategies</text>
    <text class="tiny" x="54" y="356">closed #37-#42</text>
    <text class="tiny" x="54" y="376">schema, connection factory, auth, onboarding</text>

    <rect x="30" y="412" width="345" height="86" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="440">12 production integration</text>
    <text class="tiny" x="54" y="464">closed #43-#49</text>
    <text class="tiny" x="54" y="484">Spring Boot 4 and Ktor service boundary</text>

    <rect x="30" y="520" width="345" height="78" rx="10" fill="#FDF7E7" stroke="#D9AA4D"/>
    <text class="label" x="54" y="548">R2DBC-only architecture</text>
    <text class="tiny" x="54" y="572">connection-factory-per-tenant, Flow collection</text>
  </g>

  <g transform="translate(1038,150)">
    <rect class="card" x="0" y="0" width="405" height="646" rx="16" fill="#EAF7EF" stroke="#69B888"/>
    <text class="head" x="202" y="44" text-anchor="middle">exposed-workshop</text>
    <text class="small" x="202" y="72" text-anchor="middle">Blocking JDBC, DAO, Spring MVC/WebFlux, Ktor</text>

    <rect x="30" y="104" width="345" height="70" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="132">Ktor multi-tenant</text>
    <text class="tiny" x="54" y="156">open #45, #46</text>

    <rect x="30" y="196" width="345" height="86" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="224">Ktor cache and routing</text>
    <text class="tiny" x="54" y="248">open #47, #48, #49, #50</text>
    <text class="tiny" x="54" y="268">JDBC cache, coroutine cache, routing datasource</text>

    <rect x="30" y="304" width="345" height="86" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="332">Spring Boot tenant strategies</text>
    <text class="tiny" x="54" y="356">open #51, #55, #56; closed #52-#54</text>
    <text class="tiny" x="54" y="376">schema, database, auth, onboarding</text>

    <rect x="30" y="412" width="345" height="86" rx="10" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="label" x="54" y="440">12 production integration</text>
    <text class="tiny" x="54" y="464">open epic #57; closed #58-#63</text>
    <text class="tiny" x="54" y="484">granular Spring and Ktor modules</text>

    <rect x="30" y="520" width="345" height="78" rx="10" fill="#FDECEF" stroke="#DB7890"/>
    <text class="label" x="54" y="548">JDBC-only architecture</text>
    <text class="tiny" x="54" y="572">DAO/entities, transaction template, benchmark</text>
  </g>

  <g transform="translate(555,178)">
    <rect class="card" x="0" y="0" width="390" height="574" rx="16" fill="#FFFFFF" stroke="#D7E2EC"/>
    <text class="head" x="195" y="42" text-anchor="middle">Parity decision</text>
    <text class="small" x="195" y="70" text-anchor="middle">Create new issues only for portable gaps.</text>

    <rect x="38" y="104" width="314" height="72" rx="10" fill="#E9F7F6" stroke="#55B5AF"/>
    <text class="label" x="195" y="132" text-anchor="middle">Counterpart exists</text>
    <text class="tiny" x="195" y="156" text-anchor="middle">Ktor, tenant, chapter 12 topics map both ways</text>

    <rect x="38" y="212" width="314" height="84" rx="10" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="label" x="195" y="240" text-anchor="middle">Platform-specific</text>
    <text class="tiny" x="195" y="264" text-anchor="middle">R2DBC connection factory and Flow</text>
    <text class="tiny" x="195" y="284" text-anchor="middle">JDBC DAO/entities and blocking transactions</text>

    <rect x="38" y="332" width="314" height="84" rx="10" fill="#F1ECFF" stroke="#A58BE3"/>
    <text class="label" x="195" y="360" text-anchor="middle">README requirement</text>
    <text class="tiny" x="195" y="384" text-anchor="middle">Architecture diagrams must be PNG in README</text>
    <text class="tiny" x="195" y="404" text-anchor="middle">SVG sources stay beside rendered PNG files</text>

    <rect x="38" y="452" width="314" height="76" rx="10" fill="#EAF7EF" stroke="#69B888"/>
    <text class="label" x="195" y="480" text-anchor="middle">Current stop condition</text>
    <text class="tiny" x="195" y="504" text-anchor="middle">No duplicate implementation issue from #89</text>
  </g>

  <path class="line" d="M483 139 C520 139 520 230 555 230"/>
  <path class="line" d="M945 230 C980 230 980 139 1038 139"/>
  <path class="line" d="M483 240 C520 240 520 272 555 272"/>
  <path class="line" d="M945 272 C980 272 980 240 1038 240"/>
  <path class="line" d="M483 348 C520 348 520 374 555 374"/>
  <path class="line" d="M945 374 C980 374 980 348 1038 348"/>
  <path class="line" d="M483 456 C520 456 520 492 555 492"/>
  <path class="line" d="M945 492 C980 492 980 456 1038 456"/>
  <path class="mutedLine" d="M483 560 C520 560 520 254 555 254"/>
  <path class="mutedLine" d="M945 254 C980 254 980 560 1038 560"/>

  <text class="tiny" x="750" y="842" text-anchor="middle">Evidence date: 2026-05-24. Issue states can change; this README captures the parity decision for issue #89.</text>
</svg>
