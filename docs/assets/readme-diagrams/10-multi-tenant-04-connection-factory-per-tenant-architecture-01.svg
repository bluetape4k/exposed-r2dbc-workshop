<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1040" width="1500" height="1040" role="img" aria-label="Connection Factory Per Tenant Routing architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%"><feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/></filter>
  <style>
    .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}.lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}.card{filter:url(#shadow)}.header{opacity:.98}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:38px;fill:#1e293b}.subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#536476;font-weight:700}
    .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#64748b;font-weight:700}.laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;letter-spacing:.08em;fill:#91a4b6}
    .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;fill:#1f2937}.cardTitleSmall{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1f2937}
    .connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.legend{fill:#fff;stroke:#d7e2ec;stroke-width:1.1}.noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
  </style>
  <g id="h2Icon"><image data-bluetape4k-icon="database/h2.svg" href="data:image/svg+xml;base64," width="40" height="40"/></g>
</defs>
<rect width="1500" height="1040" class="canvas"/>
<rect x="28" y="28" width="1444" height="984" rx="22" class="frame"/>
<text x="70" y="82" class="title">Connection Factory Per Tenant Routing</text>
<text x="70" y="113" class="subtitle">Spring WebFlux validates X-TENANT-ID, then Exposed uses an explicit routing R2dbcDatabase backed by tenant-owned pools.</text>

<rect x="56" y="145" width="1388" height="210" rx="18" class="lane"/><text x="86" y="177" class="laneTitle">REQUEST PATH</text>
<rect x="56" y="388" width="1388" height="260" rx="18" class="lane"/><text x="86" y="420" class="laneTitle">EXPOSED + SPRING R2DBC ROUTING</text>
<rect x="56" y="681" width="1388" height="220" rx="18" class="lane"/><text x="86" y="713" class="laneTitle">TENANT-OWNED POOLS AND STARTUP INIT</text>
<rect x="56" y="924" width="1388" height="62" rx="18" class="lane"/><text x="86" y="958" class="laneTitle">READER CONTRACT</text>

<g data-card="HTTP request" data-x="82" data-y="218" data-width="220" data-height="98">
  <rect x="82" y="218" width="220" height="98" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.2" class="card"/>
  <path class="header" d="M82,259 L82,232 Q82,218 96,218 L288,218 Q302,218 302,232 L302,259 Z" fill="#eef5fa"/>
  <text x="192" y="237" class="tiny" text-anchor="middle">&lt;&lt;webflux&gt;&gt;</text>
  <text x="192" y="258" class="cardTitle" text-anchor="middle">HTTP request</text>
  <text x="105" y="283" class="detail">GET /actors</text>
  <text x="105" y="303" class="detail">X-TENANT-ID</text>
</g>
<g data-card="TenantFilter" data-x="352" data-y="218" data-width="230" data-height="98">
  <rect x="352" y="218" width="230" height="98" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.2" class="card"/>
  <path class="header" d="M352,259 L352,232 Q352,218 366,218 L568,218 Q582,218 582,232 L582,259 Z" fill="#f1f6ec"/>
  <text x="467" y="237" class="tiny" text-anchor="middle">&lt;&lt;WebFilter&gt;&gt;</text>
  <text x="467" y="258" class="cardTitle" text-anchor="middle">TenantFilter</text>
  <text x="374" y="283" class="detail">normalize + validate</text>
  <text x="374" y="303" class="detail">bad header =&gt; 400</text>
</g>
<g data-card="Reactor context" data-x="632" data-y="218" data-width="230" data-height="98">
  <rect x="632" y="218" width="230" height="98" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.2" class="card"/>
  <path class="header" d="M632,259 L632,232 Q632,218 646,218 L848,218 Q862,218 862,232 L862,259 Z" fill="#eef7f6"/>
  <text x="747" y="237" class="tiny" text-anchor="middle">&lt;&lt;lookup key&gt;&gt;</text>
  <text x="747" y="258" class="cardTitle" text-anchor="middle">Reactor context</text>
  <text x="654" y="283" class="detail">TENANT_ID string</text>
  <text x="654" y="303" class="detail">korean | english</text>
</g>
<g data-card="ActorController" data-x="912" data-y="218" data-width="250" data-height="98">
  <rect x="912" y="218" width="250" height="98" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.2" class="card"/>
  <path class="header" d="M912,259 L912,232 Q912,218 926,218 L1148,218 Q1162,218 1162,232 L1162,259 Z" fill="#f5eee4"/>
  <text x="1037" y="237" class="tiny" text-anchor="middle">&lt;&lt;REST controller&gt;&gt;</text>
  <text x="1037" y="258" class="cardTitle" text-anchor="middle">ActorController</text>
  <text x="934" y="283" class="detail">transactionExecutor.execute</text>
  <text x="934" y="303" class="detail">repository Flow.toList()</text>
</g>
<g data-card="Default fallback" data-x="1212" data-y="222" data-width="205" data-height="90">
  <rect x="1212" y="222" width="205" height="90" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.2" class="card"/>
  <path class="header" d="M1212,259 L1212,236 Q1212,222 1226,222 L1403,222 Q1417,222 1417,236 L1417,259 Z" fill="#f5eef2"/>
  <text x="1314.5" y="241" class="tiny" text-anchor="middle">&lt;&lt;outside HTTP&gt;&gt;</text>
  <text x="1314.5" y="259" class="cardTitleSmall" text-anchor="middle">Default fallback</text>
  <text x="1232" y="285" class="detail">default tenant: korean</text>
  <text x="1232" y="304" class="detail">unknown key fails closed</text>
</g>

<g data-card="TenantTransactionExecutor" data-x="172" data-y="478" data-width="286" data-height="112">
  <rect x="172" y="478" width="286" height="112" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.2" class="card"/>
  <path class="header" d="M172,521 L172,492 Q172,478 186,478 L444,478 Q458,478 458,492 L458,521 Z" fill="#eef5fa"/>
  <text x="315" y="498" class="tiny" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
  <text x="315" y="520" class="cardTitleSmall" text-anchor="middle">TenantTransactionExecutor</text>
  <text x="195" y="547" class="detail">bridges ReactorContext</text>
  <text x="195" y="567" class="detail">suspendTransaction(db=...)</text>
</g>
<g data-card="tenantRoutingDatabase" data-x="516" data-y="478" data-width="260" data-height="112">
  <rect x="516" y="478" width="260" height="112" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.2" class="card"/>
  <path class="header" d="M516,521 L516,492 Q516,478 530,478 L762,478 Q776,478 776,492 L776,521 Z" fill="#f1f6ec"/>
  <text x="646" y="498" class="tiny" text-anchor="middle">&lt;&lt;R2dbcDatabase&gt;&gt;</text>
  <text x="646" y="520" class="cardTitleSmall" text-anchor="middle">tenantRoutingDatabase</text>
  <text x="538" y="547" class="detail">explicit Exposed database</text>
  <text x="538" y="567" class="detail">uses routing factory</text>
</g>
<g data-card="TenantRoutingConnectionFactory" data-x="836" data-y="478" data-width="286" data-height="112">
  <rect x="836" y="478" width="286" height="112" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.2" class="card"/>
  <path class="header" d="M836,521 L836,492 Q836,478 850,478 L1108,478 Q1122,478 1122,492 L1122,521 Z" fill="#eef7f6"/>
  <text x="979" y="498" class="tiny" text-anchor="middle">&lt;&lt;AbstractRoutingConnectionFactory&gt;&gt;</text>
  <text x="979" y="520" class="cardTitleSmall" text-anchor="middle">Routing ConnectionFactory</text>
  <text x="858" y="547" class="detail">determineCurrentLookupKey()</text>
  <text x="858" y="567" class="detail">Mono.deferContextual</text>
</g>
<g data-card="TenantConnectionFactoryRegistry" data-x="1192" data-y="478" data-width="240" data-height="112">
  <rect x="1192" y="478" width="240" height="112" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.2" class="card"/>
  <path class="header" d="M1192,521 L1192,492 Q1192,478 1206,478 L1418,478 Q1432,478 1432,492 L1432,521 Z" fill="#f5eee4"/>
  <text x="1312" y="498" class="tiny" text-anchor="middle">&lt;&lt;pool owner&gt;&gt;</text>
  <text x="1312" y="520" class="cardTitleSmall" text-anchor="middle">Tenant CF Registry</text>
  <text x="1214" y="547" class="detail">targetConnectionFactories()</text>
  <text x="1214" y="567" class="detail">dispose pools on shutdown</text>
</g>

<g data-card="app.tenants configuration" data-x="82" data-y="756" data-width="250" data-height="112">
  <rect x="82" y="756" width="250" height="112" rx="14" fill="#fff" stroke="#8a6f55" stroke-width="2.2" class="card"/>
  <path class="header" d="M82,799 L82,770 Q82,756 96,756 L318,756 Q332,756 332,770 L332,799 Z" fill="#f3eee8"/>
  <text x="207" y="776" class="tiny" text-anchor="middle">&lt;&lt;properties&gt;&gt;</text>
  <text x="207" y="798" class="cardTitleSmall" text-anchor="middle">app.tenants config</text>
  <text x="104" y="825" class="detail">defaultTenant=korean</text>
  <text x="104" y="845" class="detail">bounded tenant set</text>
</g>
<g data-card="Korean tenant pool" data-x="382" data-y="740" data-width="330" data-height="144">
  <rect x="382" y="740" width="330" height="144" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.2" class="card"/>
  <path class="header" d="M382,789 L382,754 Q382,740 396,740 L698,740 Q712,740 712,754 L712,789 Z" fill="#eef5fa"/>
  <use href="#h2Icon" x="406" y="751"/>
  <text x="558" y="767" class="tiny" text-anchor="middle">&lt;&lt;ConnectionPool&gt;&gt;</text>
  <text x="558" y="789" class="cardTitle" text-anchor="middle">Korean tenant pool</text>
  <text x="416" y="823" class="detail">id: korean</text>
  <text x="416" y="844" class="detail">r2dbc:h2:mem:///tenant_cf_korean</text>
  <text x="416" y="865" class="detail">Actor/Movie fixture data</text>
</g>
<g data-card="English tenant pool" data-x="762" data-y="740" data-width="330" data-height="144">
  <rect x="762" y="740" width="330" height="144" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.2" class="card"/>
  <path class="header" d="M762,789 L762,754 Q762,740 776,740 L1078,740 Q1092,740 1092,754 L1092,789 Z" fill="#f1f6ec"/>
  <use href="#h2Icon" x="786" y="751"/>
  <text x="938" y="767" class="tiny" text-anchor="middle">&lt;&lt;ConnectionPool&gt;&gt;</text>
  <text x="938" y="789" class="cardTitle" text-anchor="middle">English tenant pool</text>
  <text x="796" y="823" class="detail">id: english</text>
  <text x="796" y="844" class="detail">r2dbc:h2:mem:///tenant_cf_english</text>
  <text x="796" y="865" class="detail">Actor/Movie fixture data</text>
</g>
<g data-card="Startup initialization" data-x="1142" data-y="756" data-width="250" data-height="112">
  <rect x="1142" y="756" width="250" height="112" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.2" class="card"/>
  <path class="header" d="M1142,799 L1142,770 Q1142,756 1156,756 L1378,756 Q1392,756 1392,770 L1392,799 Z" fill="#f5eef2"/>
  <text x="1267" y="776" class="tiny" text-anchor="middle">&lt;&lt;ApplicationReadyEvent&gt;&gt;</text>
  <text x="1267" y="798" class="cardTitleSmall" text-anchor="middle">Startup initialization</text>
  <text x="1164" y="825" class="detail">TenantInitializer loops tenants</text>
  <text x="1164" y="845" class="detail">DataInitializer creates + seeds</text>
</g>

<path class="connector" data-connector="request-header" d="M302 267 L352 267" stroke="#4f86c6"/><polygon points="352,267 338,260 338,274" fill="#4f86c6"/>
<path class="connector" data-connector="validated-tenant" d="M582 267 L632 267" stroke="#6f8f52"/><polygon points="632,267 618,260 618,274" fill="#6f8f52"/>
