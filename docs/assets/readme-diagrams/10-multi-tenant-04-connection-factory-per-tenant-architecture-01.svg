<path class="connector" data-connector="controller-executor" d="M1037 316 L1037 374 Q1037 390 1021 390 L331 390 Q315 390 315 406 L315 478" stroke="#4f86c6"/><polygon points="315,478 308,464 322,464" fill="#4f86c6"/>
<path class="connector" data-connector="executor-database" d="M458 534 L516 534" stroke="#6f8f52"/><polygon points="516,534 502,527 502,541" fill="#6f8f52"/>
<path class="connector" data-connector="database-routing-factory" d="M776 534 L836 534" stroke="#4f8f8b"/><polygon points="836,534 822,527 822,541" fill="#4f8f8b"/>
<path class="connector" data-connector="factory-targets" d="M1122 534 L1192 534" stroke="#a66a3f"/><polygon points="1192,534 1178,527 1178,541" fill="#a66a3f"/>
<path class="connector" data-connector="registry-korean-pool" d="M1275 590 L1275 660 Q1275 676 1259 676 L563 676 Q547 676 547 692 L547 740" stroke="#4f86c6"/><polygon points="547,740 540,726 554,726" fill="#4f86c6"/>
<path class="connector" data-connector="registry-english-pool" d="M1349 590 L1349 688 Q1349 704 1333 704 L943 704 Q927 704 927 720 L927 740" stroke="#6f8f52"/><polygon points="927,740 920,726 934,726" fill="#6f8f52"/>
<path class="connector" data-connector="config-builds-pools" d="M332 812 L382 812" stroke="#8a6f55"/><polygon points="382,812 368,805 368,819" fill="#8a6f55"/>
<path class="connector" data-connector="startup-seeds-pools" d="M1142 812 L1092 812" stroke="#a85f7f"/><polygon points="1092,812 1106,805 1106,819" fill="#a85f7f"/>

<g>
  <rect x="1208" y="156" width="210" height="50" rx="12" class="legend"/>
  <line x1="1226" y1="176" x2="1268" y2="176" stroke="#4f86c6" stroke-width="3.2" stroke-linecap="round"/><polygon points="1268,176 1254,169 1254,183" fill="#4f86c6"/>
  <text x="1280" y="181" class="tiny">request / execution</text>
  <line x1="1226" y1="196" x2="1268" y2="196" stroke="#a66a3f" stroke-width="3.2" stroke-linecap="round"/><polygon points="1268,196 1254,189 1254,203" fill="#a66a3f"/>
  <text x="1280" y="201" class="tiny">routing / ownership</text>
</g>
<rect x="355" y="943" width="850" height="30" rx="10" class="noteBox"/>
<text x="780" y="964" class="note" text-anchor="middle">Known tenant IDs select separate H2 pools; invalid HTTP headers return 400 before routing.</text>
</svg>
