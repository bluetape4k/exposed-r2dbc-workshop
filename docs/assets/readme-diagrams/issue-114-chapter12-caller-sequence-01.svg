<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc">
  <title id="title">Chapter 12 Caller Outbox And Realtime Sequence</title>
  <desc id="desc">A caller registers and authenticates, creates work, replays realtime outbox events, enqueues outbound HTTP, and dispatches persisted requests through Spring or Ktor runtime boundaries.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="seqArrowBlue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6"/></marker>
    <marker id="seqArrowGreen" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4d9470" stroke="#4d9470"/></marker>
    <marker id="seqArrowAmber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b7791f" stroke="#b7791f"/></marker>
    <marker id="seqArrowTeal" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f8f8c" stroke="#2f8f8c"/></marker>
    <marker id="seqArrowRed" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bf5b64" stroke="#bf5b64"/></marker>
    <style>
      .canvas { fill:#f7f9fc; }
      .frame { fill:#fffefb; stroke:#d8e0ea; stroke-width:1.5; }
      .title { font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive; font-size:40px; font-weight:400; fill:#102033; }
      .subtitle { font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size:16px; fill:#536273; }
      .participant-title { font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive; font-size:22px; fill:#102033; }
      .role { font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size:12px; fill:#536273; }
      .labelText { font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size:13px; fill:#2f3f52; }
      .badgeText { font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif; font-size:13px; fill:#2f3f52; }
      .header { filter:url(#shadow); fill:#f8fafc; stroke:#607385; stroke-width:2; }
      .lifeline { stroke:#a7b5c5; stroke-width:1.7; stroke-dasharray:8 9; }
      .activation { fill:#f7f3ff; stroke:#8a63d2; stroke-width:2; }
      .label { fill:#ffffff; stroke:#d7e0ea; stroke-width:1.5; }
      .num { fill:#f8fbff; stroke-width:1.4; }
      .callBlue { stroke:#4f86c6; stroke-width:3; fill:none; marker-end:url(#seqArrowBlue); stroke-linecap:round; }
      .callGreen { stroke:#4d9470; stroke-width:3; fill:none; marker-end:url(#seqArrowGreen); stroke-linecap:round; }
      .callAmber { stroke:#b7791f; stroke-width:3; fill:none; marker-end:url(#seqArrowAmber); stroke-linecap:round; }
      .callRed { stroke:#bf5b64; stroke-width:3; fill:none; marker-end:url(#seqArrowRed); stroke-linecap:round; }
      .seqReturn { stroke:#2f8f8c; stroke-width:2.6; fill:none; marker-end:url(#seqArrowTeal); stroke-dasharray:8 6; stroke-linecap:round; }
      .alt { fill:none; stroke:#8da0b2; stroke-width:2; stroke-dasharray:8 8; }
      .branchDivider { stroke:#d1dbe6; stroke-width:1.4; stroke-dasharray:6 8; }
      .branchLabel { fill:#fffaf0; stroke:#e2c07a; stroke-width:1.3; }
      .footer { fill:#ffffff; stroke:#d8e0ea; stroke-width:1.3; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1160"/>
  <rect class="frame" x="24" y="24" width="1452" height="1112" rx="24"/>
  <text class="title" x="70" y="82">Chapter 12 Caller / Outbox / Realtime Sequence</text>
  <text class="subtitle" x="74" y="114">One caller story covers both runtime stacks: Spring uses API-key + SSE, Ktor uses session cookie + WebSocket.</text>

  <g aria-label="Participant headers">
    <rect class="header participant card" x="82" y="168" width="210" height="82" rx="14"/>
    <text class="participant-title" x="187" y="202" text-anchor="middle">Caller</text>
    <text class="role" x="187" y="226" text-anchor="middle">alice/admin account</text>

    <rect class="header participant card" x="374" y="168" width="250" height="82" rx="14"/>
    <text class="participant-title" x="499" y="202" text-anchor="middle">Runtime boundary</text>
    <text class="role" x="499" y="226" text-anchor="middle">Spring WebFlux or Ktor routes</text>

    <rect class="header participant card" x="708" y="168" width="250" height="82" rx="14"/>
    <text class="participant-title" x="833" y="202" text-anchor="middle">Repository</text>
    <text class="role" x="833" y="226" text-anchor="middle">Exposed R2DBC suspendTransaction</text>

    <rect class="header participant card" x="1042" y="168" width="240" height="82" rx="14"/>
    <text class="participant-title" x="1162" y="202" text-anchor="middle">Delivery edge</text>
    <text class="role" x="1162" y="226" text-anchor="middle">SSE/WebSocket or HTTP client</text>

    <rect class="header participant card" x="1318" y="168" width="130" height="82" rx="14"/>
    <image data-bluetape4k-icon="database/h2.svg" x="1367" y="178" width="28" height="28" href="data:image/svg+xml;base64,"/>
    <text class="participant-title" x="1383" y="223" text-anchor="middle">H2</text>
    <text class="role" x="1383" y="240" text-anchor="middle">R2DBC DB</text>
  </g>

  <line class="lifeline" x1="187" y1="250" x2="187" y2="1078"/>
  <line class="lifeline" x1="499" y1="250" x2="499" y2="1078"/>
  <line class="lifeline" x1="833" y1="250" x2="833" y2="1078"/>
  <line class="lifeline" x1="1162" y1="250" x2="1162" y2="1078"/>
  <line class="lifeline" x1="1394" y1="250" x2="1394" y2="1078"/>

  <rect class="activation" x="491" y="304" width="16" height="640" rx="5"/>
  <rect class="activation" x="825" y="376" width="16" height="514" rx="5"/>
  <rect class="activation" x="1154" y="560" width="16" height="248" rx="5"/>

  <path class="call callBlue" d="M187 326 H499"/>
  <rect class="label labelPill" x="288" y="288" width="150" height="28" rx="12"/>
  <circle class="num" cx="306" cy="302" r="13" stroke="#4f86c6"/>
  <text class="badgeText" x="306" y="307" text-anchor="middle">1</text>
  <text class="labelText" x="329" y="307">register / session</text>

  <path class="call callBlue" d="M499 398 H833"/>
  <rect class="label labelPill" x="596" y="360" width="150" height="28" rx="12"/>
  <circle class="num" cx="614" cy="374" r="13" stroke="#4f86c6"/>
  <text class="badgeText" x="614" y="379" text-anchor="middle">2</text>
  <text class="labelText" x="637" y="379">auth + permission</text>

  <path class="call callGreen" d="M833 470 H1394"/>
  <rect class="label labelPill" x="1010" y="432" width="206" height="28" rx="12"/>
  <circle class="num" cx="1028" cy="446" r="13" stroke="#4d9470"/>
  <text class="badgeText" x="1028" y="451" text-anchor="middle">3</text>
  <text class="labelText" x="1051" y="451">insert account/session row</text>

  <path class="call callBlue" d="M187 542 H499"/>
  <rect class="label labelPill" x="276" y="504" width="174" height="28" rx="12"/>
  <circle class="num" cx="294" cy="518" r="13" stroke="#4f86c6"/>
  <text class="badgeText" x="294" y="523" text-anchor="middle">4</text>
  <text class="labelText" x="317" y="523">create work item</text>

  <path class="call callGreen" d="M499 614 H833"/>
  <rect class="label labelPill" x="589" y="576" width="164" height="28" rx="12"/>
  <circle class="num" cx="607" cy="590" r="13" stroke="#4d9470"/>
  <text class="badgeText" x="607" y="595" text-anchor="middle">5</text>
  <text class="labelText" x="630" y="595">repository command</text>

  <path class="call callGreen" d="M833 686 H1394"/>
  <rect class="label labelPill" x="1000" y="648" width="226" height="28" rx="12"/>
  <circle class="num" cx="1018" cy="662" r="13" stroke="#4d9470"/>
  <text class="badgeText" x="1018" y="667" text-anchor="middle">6</text>
  <text class="labelText" x="1041" y="667">write work + PENDING outbox</text>

  <path class="call callAmber" d="M187 758 H499"/>
  <rect class="label labelPill" x="267" y="720" width="194" height="28" rx="12"/>
  <circle class="num" cx="285" cy="734" r="13" stroke="#b7791f"/>
  <text class="badgeText" x="285" y="739" text-anchor="middle">7</text>
  <text class="labelText" x="308" y="739">subscribe after sequence</text>

  <path class="call callAmber" d="M499 830 H833"/>
  <rect class="label labelPill" x="594" y="792" width="154" height="28" rx="12"/>
  <circle class="num" cx="612" cy="806" r="13" stroke="#b7791f"/>
  <text class="badgeText" x="612" y="811" text-anchor="middle">8</text>
  <text class="labelText" x="635" y="811">replay PUBLISHED</text>

  <path class="return seqReturn" d="M1162 902 H187"/>
  <rect class="label labelPill" x="552" y="864" width="244" height="28" rx="12"/>
  <circle class="num" cx="570" cy="878" r="13" stroke="#2f8f8c"/>
  <text class="badgeText" x="570" y="883" text-anchor="middle">9</text>
  <text class="labelText" x="593" y="883">SSE or WebSocket events</text>

  <rect class="alt branch" x="332" y="948" width="998" height="142" rx="16"/>
  <rect class="branchLabel" x="356" y="932" width="214" height="28" rx="12"/>
  <text class="labelText" x="372" y="952">alt outbound dispatch result</text>
  <line class="branchDivider" x1="356" y1="1012" x2="1306" y2="1012"/>

  <path class="call callAmber" d="M499 984 H833"/>
  <rect class="label labelPill" x="578" y="946" width="186" height="28" rx="12"/>
  <circle class="num" cx="596" cy="960" r="13" stroke="#b7791f"/>
  <text class="badgeText" x="596" y="965" text-anchor="middle">10</text>
  <text class="labelText" x="622" y="965">claim IN_FLIGHT row</text>

  <path class="call callRed" d="M833 1032 H1162"/>
  <rect class="label labelPill" x="914" y="994" width="172" height="28" rx="12"/>
  <circle class="num" cx="932" cy="1008" r="13" stroke="#bf5b64"/>
  <text class="badgeText" x="932" y="1013" text-anchor="middle">11</text>
  <text class="labelText" x="958" y="1013">WebClient / Ktor client</text>

  <path class="call callGreen" d="M833 1082 H1394"/>
  <rect class="label labelPill" x="995" y="1044" width="236" height="28" rx="12"/>
  <circle class="num" cx="1013" cy="1058" r="13" stroke="#4d9470"/>
  <text class="badgeText" x="1013" y="1063" text-anchor="middle">12</text>
  <text class="labelText" x="1039" y="1063">SUCCEEDED / retryable / permanent</text>

  <rect class="footer" x="230" y="1110" width="1040" height="34" rx="12"/>
  <text class="role" x="750" y="1132" text-anchor="middle">Duplicate idempotency keys return 409; durable database replay is the recovery path for realtime delivery.</text>
</svg>
