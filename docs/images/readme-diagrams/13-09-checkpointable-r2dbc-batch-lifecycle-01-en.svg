<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1500" viewBox="0 0 1700 1500" role="img" aria-labelledby="title desc">
  <title id="title">Checkpointable R2DBC batch lifecycle</title>
  <desc id="desc">The first committed chunk checkpoints key 3, cancellation records STOPPED, and restart resumes keys 4 through 8 without duplicates.</desc>
  <defs>
    <style>
      text{letter-spacing:0}.canvas{fill:#f6f9fc}.frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:40px;font-weight:400;fill:#263238}.subtitle,.role,.msg,.note,.footer{font-family:"Comic Mono","SFMono-Regular",monospace;fill:#36464f}.subtitle{font-size:16px}.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;font-weight:400;fill:#1f3138}.role{font-size:13px;fill:#546a73}.header{fill:#fff;stroke:#546e7a;stroke-width:2}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#f3ecdf;stroke:#8f784e;stroke-width:1.5}.msg{font-size:14px}.note{font-size:13px}.call,.flow,.state,.failure,.ret{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ret{stroke-dasharray:8 6;stroke-width:2.5}.alt{fill:#f8fafc;fill-opacity:.65;stroke:#78909c;stroke-width:3;stroke-dasharray:12 7}.branchDivider{stroke:#78909c;stroke-width:3;stroke-dasharray:12 8}.pill{fill:#fff;stroke-width:1.5}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.badge{stroke-width:1.5}.blueText{fill:#2f6f8e}.tealText{fill:#2d7772}.amberText{fill:#855a29}.redText{fill:#9d4f4f}.greenText{fill:#55783f}.bluePill{stroke:#9cc2d1}.tealPill{stroke:#8fc5bf}.amberPill{stroke:#d0b078}.redPill{stroke:#d9abab}.greenPill{stroke:#b6c9a4}.blueBadge{fill:#eaf4f8;stroke:#4f83bf}.tealBadge{fill:#eaf7f6;stroke:#2e8f89}.amberBadge{fill:#fff4df;stroke:#a2743d}.redBadge{fill:#fff0f0;stroke:#b86868}.greenBadge{fill:#eef7f0;stroke:#6e8f4f}
    </style>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M0 0 L16 8 L0 16 Z" fill="#4f83bf" stroke="#4f83bf" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M0 0 L16 8 L0 16 Z" fill="#2e8f89" stroke="#2e8f89" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M0 0 L16 8 L0 16 Z" fill="#a2743d" stroke="#a2743d" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M0 0 L16 8 L0 16 Z" fill="#b86868" stroke="#b86868" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 16 16" refX="14" refY="8" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M0 0 L16 8 L0 16 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect class="canvas" width="1700" height="1500"/><rect class="frame" x="28" y="26" width="1644" height="1448" rx="26"/>
  <text class="title" x="850" y="82" text-anchor="middle">Checkpointable R2DBC batch lifecycle</text>
  <text class="subtitle" x="850" y="116" text-anchor="middle">Commit key 3, cancel into STOPPED, then restart from the typed keyset checkpoint.</text>

  <g id="participant-caller"><rect class="header" x="80" y="150" width="200" height="78" rx="10"/><text class="participant" x="180" y="182" text-anchor="middle">Test / caller</text><text class="role" x="180" y="207" text-anchor="middle">runTest + Job</text><line class="lifeline" x1="180" y1="228" x2="180" y2="1370"/></g>
  <g id="participant-job"><rect class="header" x="300" y="150" width="200" height="78" rx="10"/><text class="participant" x="400" y="182" text-anchor="middle">Batch job</text><text class="role" x="400" y="207" text-anchor="middle">provider DSL</text><line class="lifeline" x1="400" y1="228" x2="400" y2="1370"/></g>
  <g id="participant-reader"><rect class="header" x="520" y="150" width="200" height="78" rx="10"/><text class="participant" x="620" y="182" text-anchor="middle">Keyset reader</text><text class="role" x="620" y="207" text-anchor="middle">Flow &gt; lastKey</text><line class="lifeline" x1="620" y1="228" x2="620" y2="1370"/></g>
  <g id="participant-processor"><rect class="header" x="740" y="150" width="200" height="78" rx="10"/><text class="participant" x="840" y="182" text-anchor="middle">Processor</text><text class="role" x="840" y="207" text-anchor="middle">suspend transform</text><line class="lifeline" x1="840" y1="228" x2="840" y2="1370"/></g>
  <g id="participant-writer"><rect class="header" x="960" y="150" width="200" height="78" rx="10"/><text class="participant" x="1060" y="182" text-anchor="middle">R2DBC writer</text><text class="role" x="1060" y="207" text-anchor="middle">batchInsert</text><line class="lifeline" x1="1060" y1="228" x2="1060" y2="1370"/></g>
  <g id="participant-target"><rect class="header" x="1180" y="150" width="200" height="78" rx="10"/><text class="participant" x="1280" y="182" text-anchor="middle">Target table</text><text class="role" x="1280" y="207" text-anchor="middle">sourceId primary key</text><line class="lifeline" x1="1280" y1="228" x2="1280" y2="1370"/></g>
  <g id="participant-metadata"><rect class="header" x="1400" y="150" width="200" height="78" rx="10"/><text class="participant" x="1500" y="182" text-anchor="middle">Metadata</text><text class="role" x="1500" y="207" text-anchor="middle">job / step / JSON</text><line class="lifeline" x1="1500" y1="228" x2="1500" y2="1370"/></g>

  <rect class="activation" x="173" y="270" width="14" height="1080" rx="6"/><rect class="activation" x="393" y="310" width="14" height="1040" rx="6"/><rect class="activation" x="613" y="400" width="14" height="100" rx="6"/><rect class="activation" x="833" y="460" width="14" height="120" rx="6"/><rect class="activation" x="1053" y="550" width="14" height="700" rx="6"/><rect class="activation" x="1273" y="630" width="14" height="620" rx="6"/><rect class="activation" x="1493" y="650" width="14" height="660" rx="6"/>

  <g data-message="1"><rect class="pill bluePill" x="125" y="258" width="310" height="34" rx="17"/><circle class="badge blueBadge" cx="149" cy="275" r="13"/><text class="badgeText blueText" x="149" y="280" text-anchor="middle">1</text><text class="msg blueText" x="173" y="280">launch with job parameters</text><path class="call" d="M180 300 H400" stroke="#4f83bf" marker-end="url(#arrow-blue)"/></g>
  <g data-message="2"><rect class="pill bluePill" x="360" y="348" width="300" height="34" rx="17"/><circle class="badge blueBadge" cx="384" cy="365" r="13"/><text class="badgeText blueText" x="384" y="370" text-anchor="middle">2</text><text class="msg blueText" x="408" y="370">read page keys 1..3</text><path class="call" d="M400 390 H620" stroke="#4f83bf" marker-end="url(#arrow-blue)"/></g>
  <g data-message="3"><rect class="pill tealPill" x="575" y="438" width="310" height="34" rx="17"/><circle class="badge tealBadge" cx="599" cy="455" r="13"/><text class="badgeText tealText" x="599" y="460" text-anchor="middle">3</text><text class="msg tealText" x="623" y="460">process immutable chunk</text><path class="flow" d="M620 480 H840" stroke="#2e8f89" marker-end="url(#arrow-teal)"/></g>
  <g data-message="4"><rect class="pill tealPill" x="790" y="528" width="350" height="34" rx="17"/><circle class="badge tealBadge" cx="814" cy="545" r="13"/><text class="badgeText tealText" x="814" y="550" text-anchor="middle">4</text><text class="msg tealText" x="838" y="550">write transformed keys 1..3</text><path class="flow" d="M840 570 H1060" stroke="#2e8f89" marker-end="url(#arrow-teal)"/></g>
  <g data-message="5"><rect class="pill amberPill" x="1000" y="618" width="360" height="34" rx="17"/><circle class="badge amberBadge" cx="1024" cy="635" r="13"/><text class="badgeText amberText" x="1024" y="640" text-anchor="middle">5</text><text class="msg amberText" x="1048" y="640">commit + checkpoint key 3</text><path class="state" d="M1060 660 H1280" stroke="#a2743d" marker-end="url(#arrow-amber)"/></g>
  <g data-message="6"><rect class="pill amberPill" x="1230" y="648" width="420" height="34" rx="17"/><circle class="badge amberBadge" cx="1254" cy="665" r="13"/><text class="badgeText amberText" x="1254" y="670" text-anchor="middle">6</text><text class="msg amberText" x="1278" y="670">persist typed checkpoint JSON</text><path class="state" d="M400 690 H1500" stroke="#a2743d" marker-end="url(#arrow-amber)"/></g>

  <rect class="alt" x="60" y="715" width="1580" height="500" rx="16"/><rect class="pill redPill" x="90" y="697" width="420" height="34" rx="17"/><text class="note redText" x="114" y="719">alt cancellation after first committed chunk</text>
  <g data-message="7"><rect class="pill redPill" x="110" y="748" width="350" height="34" rx="17"/><circle class="badge redBadge" cx="134" cy="765" r="13"/><text class="badgeText redText" x="134" y="770" text-anchor="middle">7</text><text class="msg redText" x="158" y="770">cancel during next write</text><path class="failure" d="M180 790 H400" stroke="#b86868" marker-end="url(#arrow-red)"/></g>
  <g data-message="8"><rect class="pill redPill" x="1110" y="838" width="370" height="34" rx="17"/><circle class="badge redBadge" cx="1134" cy="855" r="13"/><text class="badgeText redText" x="1134" y="860" text-anchor="middle">8</text><text class="msg redText" x="1158" y="860">save status STOPPED</text><path class="failure" d="M400 880 H1500" stroke="#b86868" marker-end="url(#arrow-red)"/></g>
  <line class="branchDivider" x1="60" y1="930" x2="1640" y2="930"/><rect class="pill greenPill" x="90" y="912" width="350" height="34" rx="17"/><text class="note greenText" x="114" y="934">else restart with same parameters</text>
  <g data-message="9"><rect class="pill bluePill" x="110" y="958" width="360" height="34" rx="17"/><circle class="badge blueBadge" cx="134" cy="975" r="13"/><text class="badgeText blueText" x="134" y="980" text-anchor="middle">9</text><text class="msg blueText" x="158" y="980">restart after STOPPED</text><path class="call" d="M180 1000 H400" stroke="#4f83bf" marker-end="url(#arrow-blue)"/></g>
  <g data-message="10"><rect class="pill bluePill" x="330" y="1048" width="450" height="34" rx="17"/><circle class="badge blueBadge" cx="354" cy="1065" r="13"/><text class="badgeText blueText" x="354" y="1070" text-anchor="middle">10</text><text class="msg blueText" x="378" y="1070">restore checkpoint key 3</text><path class="call" d="M400 1090 H620" stroke="#4f83bf" marker-end="url(#arrow-blue)"/></g>
  <g data-message="11"><rect class="pill tealPill" x="785" y="1138" width="390" height="34" rx="17"/><circle class="badge tealBadge" cx="809" cy="1155" r="13"/><text class="badgeText tealText" x="809" y="1160" text-anchor="middle">11</text><text class="msg tealText" x="833" y="1160">write remaining keys 4..8</text><path class="flow" d="M840 1180 H1060" stroke="#2e8f89" marker-end="url(#arrow-teal)"/></g>
  <g data-message="12"><rect class="pill amberPill" x="1090" y="1228" width="420" height="34" rx="17"/><circle class="badge amberBadge" cx="1114" cy="1245" r="13"/><text class="badgeText amberText" x="1114" y="1250" text-anchor="middle">12</text><text class="msg amberText" x="1138" y="1250">checkpoint key 8 + COMPLETED</text><path class="state" d="M400 1270 H1500" stroke="#a2743d" marker-end="url(#arrow-amber)"/></g>
  <g data-message="13"><rect class="pill greenPill" x="170" y="1318" width="620" height="34" rx="17"/><circle class="badge greenBadge" cx="194" cy="1335" r="13"/><text class="badgeText greenText" x="194" y="1340" text-anchor="middle">13</text><text class="msg greenText" x="218" y="1340">return completed report; target IDs 1..8</text><path class="ret" d="M1500 1360 H180" stroke="#6e8f4f" marker-end="url(#arrow-green)"/></g>

  <rect x="90" y="1390" width="1520" height="48" rx="12" fill="#fff" stroke="#d7e0e4" stroke-width="1.8"/><text class="note" x="115" y="1420">Cancellation rethrows CancellationException; NonCancellable cleanup closes reader/writer, while the caller owns the pool lifecycle.</text>
  <text class="footer" x="850" y="1460" text-anchor="middle">exposed-r2dbc-workshop / Chapter 13 / checkpointable R2DBC batch</text>
</svg>
