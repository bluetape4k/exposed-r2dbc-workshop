<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Cockroach Inventory Schema</title>
  <desc id="desc">Inventory rows own quantity and version state; ledger rows record successful reservations by SKU; the retry policy protects the transaction boundary.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <style>
      text{letter-spacing:0}
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#1f2a37}
      .subtitle,.attr,.note,.cardinality,.relText{font-family:"Comic Mono","SFMono-Regular",ui-monospace,monospace;font-weight:700;fill:#405268}
      .subtitle{font-size:16px}
      .entityTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:23px;font-weight:400;fill:#1f2a37}
      .attr{font-size:15px}
      .note{font-size:15px}
      .cardinality{font-size:13px;fill:#53697c}
      .relText{font-size:12px;fill:#53697c}
      .entity{filter:url(#shadow);stroke-width:2.5}
      .header{opacity:.95}
      .divider{stroke-width:1.5}
      .rel{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .relDash{fill:none;stroke-width:2.6;stroke-dasharray:9 8;stroke-linecap:butt;stroke-linejoin:round}
      .relBox{fill:#fffefa;stroke:#d7e3ed;stroke-width:1.4}
      .foot{fill:#f7fffe;stroke:#9fd0cb;stroke-width:2}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="650"/>
  <rect class="frame" x="28" y="26" width="1444" height="598" rx="24"/>
  <text id="diagram-title" class="title" x="68" y="86">Cockroach Inventory Schema</text>
  <text class="subtitle" x="72" y="122">Retryable SQLSTATE 40001 reruns the reservation transaction; successful attempts leave one ledger row.</text>

  <g data-card="Inventory items" data-x="74" data-y="200" data-width="318" data-height="210">
    <rect class="entity" x="74" y="200" width="318" height="210" rx="10" fill="#eef7fd" stroke="#4f83bf"/>
    <rect class="header" x="74" y="200" width="318" height="70" rx="10" fill="#e3f1fb"/>
    <line class="divider" x1="74" y1="270" x2="392" y2="270" stroke="#4f83bf"/>
    <text class="entityTitle" x="233" y="246" text-anchor="middle">cockroach_inventory_items</text>
    <text class="attr" x="104" y="302">sku varchar(64) PK</text>
    <text class="attr" x="104" y="336">quantity_on_hand int</text>
    <text class="attr" x="104" y="370">version long</text>
  </g>

  <g data-card="Reservation ledger" data-x="510" data-y="200" data-width="318" data-height="210">
    <rect class="entity" x="510" y="200" width="318" height="210" rx="10" fill="#f1f8ef" stroke="#6e8f4f"/>
    <rect class="header" x="510" y="200" width="318" height="70" rx="10" fill="#e8f3e4"/>
    <line class="divider" x1="510" y1="270" x2="828" y2="270" stroke="#6e8f4f"/>
    <text class="entityTitle" x="669" y="246" text-anchor="middle">cockroach_inventory_ledger</text>
    <text class="attr" x="540" y="302">sku varchar(64) FK</text>
    <text class="attr" x="540" y="336">quantity int</text>
    <text class="attr" x="540" y="370">reason varchar(64)</text>
  </g>

  <g data-card="Inventory snapshot" data-x="946" data-y="200" data-width="292" data-height="210">
    <rect class="entity" x="946" y="200" width="292" height="210" rx="10" fill="#fff5df" stroke="#a2743d"/>
    <rect class="header" x="946" y="200" width="292" height="70" rx="10" fill="#f8ead2"/>
    <line class="divider" x1="946" y1="270" x2="1238" y2="270" stroke="#a2743d"/>
    <text class="entityTitle" x="1092" y="246" text-anchor="middle">InventorySnapshot</text>
    <text class="attr" x="976" y="302">sku</text>
    <text class="attr" x="976" y="336">quantityOnHand</text>
    <text class="attr" x="976" y="370">version</text>
  </g>

  <g data-card="Retry policy" data-x="1290" data-y="200" data-width="148" data-height="210">
    <rect class="entity" x="1290" y="200" width="148" height="210" rx="10" fill="#fff1f2" stroke="#b86868"/>
    <rect class="header" x="1290" y="200" width="148" height="70" rx="10" fill="#f9e5e7"/>
    <line class="divider" x1="1290" y1="270" x2="1438" y2="270" stroke="#b86868"/>
    <text class="entityTitle" x="1364" y="246" text-anchor="middle">Retry</text>
    <text class="attr" x="1314" y="302">max=3</text>
    <text class="attr" x="1314" y="336">40001</text>
    <text class="attr" x="1314" y="370">fail else</text>
  </g>

  <path class="rel" data-connector="inventory-to-ledger" d="M392 302 H510" stroke="#758297"/>
  <polygon points="510,302 496,294 496,310" fill="#758297" stroke="#758297" stroke-width="2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="relBox" x="410" y="266" width="42" height="24" rx="8"/>
  <text class="cardinality" x="431" y="283" text-anchor="middle">1</text>
  <rect class="relBox" x="462" y="266" width="42" height="24" rx="8"/>
  <text class="cardinality" x="483" y="283" text-anchor="middle">N</text>

  <path class="rel" data-connector="inventory-to-snapshot" d="M828 302 H946" stroke="#a2743d"/>
  <polygon points="946,302 932,294 932,310" fill="#a2743d" stroke="#a2743d" stroke-width="2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="relBox" x="846" y="266" width="42" height="24" rx="8"/>
  <text class="cardinality" x="867" y="283" text-anchor="middle">1</text>
  <rect class="relBox" x="900" y="266" width="42" height="24" rx="8"/>
  <text class="cardinality" x="921" y="283" text-anchor="middle">N</text>

  <path class="relDash" data-connector="retry-policy-protects" d="M1364 410 V450 H1092 V410" stroke="#b86868"/>
  <polygon points="1092,410 1084,424 1100,424" fill="#b86868" stroke="#b86868" stroke-width="2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="relBox" x="1192" y="436" width="78" height="24" rx="8"/>
  <text class="relText" x="1231" y="453" text-anchor="middle">protects</text>

  <rect class="foot" x="86" y="560" width="1328" height="50" rx="14"/>
  <text class="note" x="112" y="582">ERD scope: inventory state, reservation ledger, snapshot projection, and SQLSTATE 40001 retry policy.</text>
  <text class="note" x="112" y="604">Cardinality: one inventory SKU can create many successful ledger rows and many observed snapshots across attempts.</text>
</svg>
