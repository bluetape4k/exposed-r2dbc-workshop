<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="895" viewBox="0 0 1366 895" role="img" aria-label="Structure Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1366" height="895"/>
<rect class="frame" x="32" y="28" width="1302" height="839" rx="28"/>
<text class="title" x="66" y="82">Structure Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="inheritLine" d="M1103 450 C1103 383 473 383 473 316"/>
<path class="inheritLine" d="M683 450 C683 383 473 383 473 316"/>
<path class="inheritLine" d="M263 450 C263 383 473 383 473 316"/>
<g transform="translate(298,180)">
  <rect class="card" x="0" y="0" width="350" height="128" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="56.5" text-anchor="middle">Abstract R2dbc Redisson</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Repository</text>

</g>
<g transform="translate(718,180)">
  <rect class="card" x="0" y="0" width="350" height="128" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#58A978"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="56.5" text-anchor="middle">Abstract R2dbc Redisson</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Repository K</text>

</g>
<g transform="translate(88,458)">
  <rect class="card" x="0" y="0" width="350" height="217" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">UserCacheRepository</text>
  <text class="mono" x="18" y="108">+strategy:</text>
<text class="mono" x="18" y="129">READ_WRITE_THROUGH_WITH_NEAR_CACHE</text>
<text class="mono" x="18" y="150">+get(id: Long) UserRecord?</text>
<text class="mono" x="18" y="171">+put(id: Long, user: UserRecord) void</text>
<text class="mono" x="18" y="192">+evict(id: Long) void</text>
</g>
<g transform="translate(508,458)">
  <rect class="card" x="0" y="0" width="350" height="191" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#DC6B82"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="56.5" text-anchor="middle">User Credentials Cache</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Repository</text>
  <text class="mono" x="18" y="124">+strategy: READ_ONLY</text>
<text class="mono" x="18" y="145">+get(id: Long) UserCredentialsRecord?</text>
<text class="mono" x="18" y="166">+evict(id: Long) void</text>
</g>
<g transform="translate(928,458)">
  <rect class="card" x="0" y="0" width="350" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#45A7A1"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">UserEventCacheRepository</text>
  <text class="mono" x="18" y="108">+strategy: WRITE_BEHIND</text>
<text class="mono" x="18" y="129">+put(id: Long, event: UserEventRecord) void</text>
<text class="mono" x="18" y="150">+flush() void</text>
</g>
</svg>
