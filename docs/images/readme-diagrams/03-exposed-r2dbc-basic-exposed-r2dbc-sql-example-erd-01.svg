<svg xmlns="http://www.w3.org/2000/svg" width="842" height="695" viewBox="0 0 842 695" role="img" aria-label="Structure Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none}

  .cardinalityBox{fill:#ffffff;stroke:#94a3b8;stroke-width:1;rx:7;opacity:.94}
  .cardinalityLabel{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;font-weight:700;fill:#334155}
.erdRelation{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
</style>
</defs>
<rect class="canvas" width="842" height="695"/>
<rect class="frame" x="32" y="28" width="778" height="639" rx="28"/>
<text class="title" x="66" y="82">Structure Diagram</text>
<text class="subtitle" x="70" y="118">ERD tables and relationships from the original Mermaid source</text>
<path class="erdRelation" d="M421 336 L421 412"/>
<g transform="translate(261,170)">
  <rect class="card" x="0" y="0" width="320" height="166" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#5B8DEF"/>
  <text class="label" x="160" y="44" text-anchor="middle">cities</text>
  <text class="mono" x="18" y="104">int id PK SERIAL, auto increment</text>
<text class="mono" x="18" y="131">varchar(50) name NOT NULL</text>
</g>
<g transform="translate(261,412)">
  <rect class="card" x="0" y="0" width="320" height="193" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#58A978"/>
  <text class="label" x="160" y="44" text-anchor="middle">users</text>
  <text class="mono" x="18" y="104">varchar(10) id PK</text>
<text class="mono" x="18" y="131">varchar(50) name NOT NULL</text>
<text class="mono" x="18" y="158">int city_id FK NULL, references c.</text>
</g>

<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="384.0" y="342.0" width="74" height="22"/><text class="cardinalityLabel" x="421.0" y="358.0" text-anchor="middle">1 : N</text></g>
</svg>
