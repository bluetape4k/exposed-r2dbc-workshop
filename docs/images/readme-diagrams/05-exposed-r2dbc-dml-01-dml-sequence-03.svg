<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1236" viewBox="0 0 920 1236" role="img" aria-label="CTE / UPSERT Execution Flow">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
<marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
<style>.canvas{fill:#F7F9FC}.frame{fill:#fff;stroke:#D8E0EA;stroke-width:1.5}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#102033}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}.smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}.strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}.card{stroke-width:2;filter:url(#shadow)}.line{stroke:#5D6B7A;stroke-width:2.2;fill:none;marker-end:url(#openArrow)}.dashed{stroke:#5D6B7A;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}.lifeline{stroke:#B7C2D1;stroke-width:1.8;stroke-dasharray:8 9}.note{fill:#fff;opacity:.97}</style>
</defs>
<rect class="canvas" width="920" height="1236"/>
<rect class="frame" x="24" y="24" width="872" height="1180" rx="22"/>
<text class="title" x="58" y="76">CTE / UPSERT Execution Flow</text>
<text class="subtitle" x="62" y="106">Compact sequence flow with reduced outer and inner whitespace</text>
<rect class="card" x="95.0" y="156" width="220" height="66" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel participant" x="205.0" y="196" text-anchor="middle">Application</text>
<line class="lifeline" x1="205.0" y1="250" x2="205.0" y2="1174"/>
<rect class="card" x="350.0" y="156" width="220" height="66" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel participant" x="460.0" y="196" text-anchor="middle">Exposed DSL</text>
<line class="lifeline" x1="460.0" y1="250" x2="460.0" y2="1174"/>
<rect class="card" x="605.0" y="156" width="220" height="66" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel participant" x="715.0" y="196" text-anchor="middle">Database</text>
<line class="lifeline" x1="715.0" y1="250" x2="715.0" y2="1174"/>
<path class="line" d="M205.0 292.0 L460.0 292.0" data-connector="line"/>
<rect class="note label" x="207.9" y="260.0" width="249.2" height="28" rx="9"/>
<text class="strong labelText" x="332.5" y="280.0" text-anchor="middle">1. Words.upsert { it[word] = hello }</text>
<path class="line" d="M460.0 366.0 L715.0 366.0" data-connector="line"/>
<rect class="note label" x="431.9" y="334.0" width="311.2" height="28" rx="9"/>
<text class="strong labelText" x="587.5" y="354.0" text-anchor="middle">2. INSERT INTO words ... ON CONFLICT DO UPDATE</text>
<path class="dashed" d="M715.0 440.0 L460.0 440.0" data-connector="dashed"/>
<rect class="note label" x="507.5" y="408.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="587.5" y="428.0" text-anchor="middle">3. affected rows</text>
<path class="dashed" d="M460.0 514.0 L205.0 514.0" data-connector="dashed"/>
<rect class="note label" x="242.0" y="482.0" width="181.0" height="28" rx="9"/>
<text class="strong labelText" x="332.5" y="502.0" text-anchor="middle">4. UpsertStatement result</text>
<path class="line" d="M205.0 588.0 L460.0 588.0" data-connector="line"/>
<rect class="note label" x="183.1" y="556.0" width="298.8" height="28" rx="9"/>
<text class="strong labelText" x="332.5" y="576.0" text-anchor="middle">5. Words.batchUpsert(list, onUpdate = {...})</text>
<path class="line" d="M460.0 662.0 L715.0 662.0" data-connector="line"/>
<rect class="note label" x="466.0" y="630.0" width="243.0" height="28" rx="9"/>
<text class="strong labelText" x="587.5" y="650.0" text-anchor="middle">7. INSERT ... ON CONFLICT DO UPDATE</text>
<path class="dashed" d="M715.0 736.0 L460.0 736.0" data-connector="dashed"/>
<rect class="note label" x="507.5" y="704.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="587.5" y="724.0" text-anchor="middle">8. batch results</text>
<path class="dashed" d="M460.0 810.0 L205.0 810.0" data-connector="dashed"/>
<rect class="note label" x="252.5" y="778.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="332.5" y="798.0" text-anchor="middle">9. List of results</text>
<path class="line" d="M205.0 884.0 L460.0 884.0" data-connector="line"/>
<rect class="note label" x="167.6" y="852.0" width="329.8" height="28" rx="9"/>
<text class="strong labelText" x="332.5" y="872.0" text-anchor="middle">10. withRecursive(cte, baseQuery, recursiveQuery)</text>
<path class="line" d="M460.0 958.0 L715.0 958.0" data-connector="line"/>
<rect class="note label" x="413.3" y="926.0" width="348.4" height="28" rx="9"/>
<text class="strong labelText" x="587.5" y="946.0" text-anchor="middle">11. WITH RECURSIVE cte AS (base UNION ALL recursive)</text>
<path class="dashed" d="M715.0 1032.0 L460.0 1032.0" data-connector="dashed"/>
<rect class="note label" x="497.0" y="1000.0" width="181.0" height="28" rx="9"/>
<text class="strong labelText" x="587.5" y="1020.0" text-anchor="middle">12. ResultSet (hierarchy)</text>
<path class="dashed" d="M460.0 1106.0 L205.0 1106.0" data-connector="dashed"/>
<rect class="note label" x="252.5" y="1074.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="332.5" y="1094.0" text-anchor="middle">13. List of rows</text>
<rect class="activation" x="199.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="454.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="709.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>

<!-- audit badge labels: visible sequence numbering and message pill samples -->
<g aria-label="sequence message labels">
<rect x="58" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="76" y="140" class="num" text-anchor="middle">1</text>
<rect x="102" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="120" y="140" class="num" text-anchor="middle">2</text>
</g>
</svg>
