<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1160" width="1700" height="1160" role="img" aria-label="Exposed R2DBC crypt encrypted column sequence diagram">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10" />
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a95" stroke="#2f9a95" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b58122" stroke="#b58122" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-rose" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a85f7f" stroke="#a85f7f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f7f9f4}
      .frame{fill:#fffefb;stroke:#3d515c;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:48px;fill:#1e293b}
      .subtitle,.role,.labelText,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#536476;font-weight:700}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#1e293b}
      .num{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#334155;font-weight:800}
      .card{fill:#fffefb;stroke:#60747f;stroke-width:2.4;filter:url(#softShadow)}
      .lifeline{stroke:#9fb1bc;stroke-width:2;stroke-dasharray:8 9}
      .activation{fill:#e6f7f5;stroke:#a7d9d3;stroke-width:2;opacity:.78}
      .activationAmber{fill:#fff2d8;stroke:#e3c483;stroke-width:2;opacity:.78}
      .label{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
      .call{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
      .callBlue{stroke:#4f86c6;marker-end:url(#arrow-blue)}
      .callTeal{stroke:#2f9a95;marker-end:url(#arrow-teal)}
      .callGreen{stroke:#6f8f52;marker-end:url(#arrow-green)}
      .callAmber{stroke:#b58122;marker-end:url(#arrow-amber)}
      .callRose{stroke:#a85f7f;marker-end:url(#arrow-rose)}
      .retBlue{stroke:#4f86c6;marker-end:url(#arrow-blue)}
      .retTeal{stroke:#2f9a95;marker-end:url(#arrow-teal)}
      .retAmber{stroke:#b58122;marker-end:url(#arrow-amber)}
      .branch{fill:none;stroke:#8aa0ad;stroke-width:2.4;stroke-dasharray:9 8}
      .branchLabel{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
      .footer{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1160" />
  <rect class="frame" x="28" y="28" width="1644" height="1104" rx="28" />
  <text class="title" x="76" y="92">Encrypted Column Insert, Read, and Search Limit</text>
  <text class="subtitle" x="82" y="128">Ex01_EncryptedColumn encrypts plaintext before SQL, decrypts on read, and proves equality search is not reliable.</text>

  <g data-participant="Workshop Test">
    <rect class="card participant" x="70" y="184" width="190" height="78" rx="16" />
    <text class="participant" x="165" y="225" text-anchor="middle">Workshop Test</text>
    <text class="role" x="165" y="248" text-anchor="middle">runTest</text>
    <line class="lifeline" x1="165" y1="262" x2="165" y2="1070" />
  </g>
  <g data-participant="StringTable DSL">
    <rect class="card participant" x="318" y="184" width="214" height="78" rx="16" />
    <text class="participant" x="425" y="225" text-anchor="middle">StringTable DSL</text>
    <text class="role" x="425" y="248" text-anchor="middle">withTables</text>
    <line class="lifeline" x1="425" y1="262" x2="425" y2="1070" />
  </g>
  <g data-participant="Encrypted Columns">
    <rect class="card participant" x="592" y="184" width="226" height="78" rx="16" />
    <text class="participant" x="705" y="225" text-anchor="middle">Encrypted Columns</text>
    <text class="role" x="705" y="248" text-anchor="middle">varchar / binary</text>
    <line class="lifeline" x1="705" y1="262" x2="705" y2="1070" />
  </g>
  <g data-participant="Encryptor">
    <rect class="card participant" x="880" y="184" width="220" height="78" rx="16" />
    <text class="participant" x="990" y="225" text-anchor="middle">Encryptor</text>
    <text class="role" x="990" y="248" text-anchor="middle">AES / Blowfish / 3DES</text>
    <line class="lifeline" x1="990" y1="262" x2="990" y2="1070" />
  </g>
  <g data-participant="R2DBC Database">
    <rect class="card participant" x="1158" y="184" width="224" height="78" rx="16" />
    <text class="participant" x="1270" y="225" text-anchor="middle">R2DBC Database</text>
    <text class="role" x="1270" y="248" text-anchor="middle">StringTable</text>
    <line class="lifeline" x1="1270" y1="262" x2="1270" y2="1070" />
  </g>
  <g data-participant="Assertions">
    <rect class="card participant" x="1450" y="184" width="180" height="78" rx="16" />
    <text class="participant" x="1540" y="225" text-anchor="middle">Assertions</text>
    <text class="role" x="1540" y="248" text-anchor="middle">rows + logs</text>
    <line class="lifeline" x1="1540" y1="262" x2="1540" y2="1070" />
  </g>

  <rect class="activation" x="419" y="318" width="14" height="570" rx="5" />
  <rect class="activation" x="699" y="398" width="14" height="412" rx="5" />
  <rect class="activationAmber" x="984" y="452" width="14" height="184" rx="5" />
  <rect class="activationAmber" x="1264" y="570" width="14" height="150" rx="5" />
  <rect class="activation" x="1534" y="800" width="14" height="112" rx="5" />

  <g data-message="1">
    <rect class="label pill" x="118" y="286" width="350" height="36" rx="18" />
    <circle cx="145" cy="304" r="19" fill="#eef5fa" stroke="#4f86c6" stroke-width="2" />
    <text class="num" x="145" y="310" text-anchor="middle">1</text>
    <text class="labelText" x="294" y="310" text-anchor="middle">withTables(testDB, stringTable)</text>
    <path class="call callBlue" data-connector="with-tables" d="M165 334 L425 334" />
  </g>

  <g data-message="2">
    <rect class="label pill" x="188" y="366" width="474" height="36" rx="18" />
    <circle cx="215" cy="384" r="19" fill="#eef5fa" stroke="#4f86c6" stroke-width="2" />
    <text class="num" x="215" y="390" text-anchor="middle">2</text>
    <text class="labelText" x="425" y="390" text-anchor="middle">insertAndGetId { plaintext values }</text>
    <path class="call callBlue" data-connector="insert-plaintext" d="M165 414 L425 414" />
  </g>

  <g data-message="3">
    <rect class="label pill" x="466" y="440" width="478" height="36" rx="18" />
    <circle cx="493" cy="458" r="19" fill="#eef7f6" stroke="#2f9a95" stroke-width="2" />
    <text class="num" x="493" y="464" text-anchor="middle">3</text>
    <text class="labelText" x="705" y="464" text-anchor="middle">encryptedVarchar / encryptedBinary</text>
    <path class="call callTeal" data-connector="bind-columns" d="M425 488 L705 488" />
  </g>

  <g data-message="4">
    <rect class="label pill" x="745" y="514" width="490" height="36" rx="18" />
    <circle cx="772" cy="532" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2" />
    <text class="num" x="772" y="538" text-anchor="middle">4</text>
    <text class="labelText" x="990" y="538" text-anchor="middle">encrypt plaintext to ciphertext</text>
    <path class="call callAmber" data-connector="encrypt" d="M705 562 L990 562" />
  </g>

  <g data-message="5">
    <rect class="label pill" x="764" y="590" width="452" height="36" rx="18" />
    <circle cx="791" cy="608" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2" />
    <text class="num" x="791" y="614" text-anchor="middle">5</text>
    <text class="labelText" x="990" y="614" text-anchor="middle">Base64 / bytes ciphertext</text>
    <path class="return retAmber" data-connector="ciphertext-return" d="M990 638 L705 638" />
  </g>

  <g data-message="6">
    <rect class="label pill" x="736" y="666" width="452" height="36" rx="18" />
    <circle cx="763" cy="684" r="19" fill="#f1f6ec" stroke="#6f8f52" stroke-width="2" />
    <text class="num" x="763" y="690" text-anchor="middle">6</text>
    <text class="labelText" x="962" y="690" text-anchor="middle">INSERT stores ciphertext only</text>
    <path class="call callGreen" data-connector="insert-sql" d="M425 714 L1270 714" />
  </g>

  <g data-message="7">
    <rect class="label pill" x="760" y="742" width="446" height="36" rx="18" />
    <circle cx="787" cy="760" r="19" fill="#f1f6ec" stroke="#6f8f52" stroke-width="2" />
    <text class="num" x="787" y="766" text-anchor="middle">7</text>
    <text class="labelText" x="983" y="766" text-anchor="middle">selectAll returns stored row</text>
    <path class="return retTeal" data-connector="row-return" d="M1270 790 L425 790" />
  </g>

  <g data-message="8">
    <rect class="label pill" x="746" y="818" width="488" height="36" rx="18" />
    <circle cx="773" cy="836" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2" />
    <text class="num" x="773" y="842" text-anchor="middle">8</text>
    <text class="labelText" x="990" y="842" text-anchor="middle">decrypt on row value access</text>
    <path class="call callAmber" data-connector="decrypt" d="M705 866 L990 866" />
  </g>

  <g data-message="9">
    <rect class="label pill" x="1112" y="884" width="514" height="36" rx="18" />
    <circle cx="1139" cy="902" r="19" fill="#eef7f6" stroke="#2f9a95" stroke-width="2" />
    <text class="num" x="1139" y="908" text-anchor="middle">9</text>
    <text class="labelText" x="1380" y="908" text-anchor="middle">assert plaintext rows and no secret SQL</text>
    <path class="call callTeal" data-connector="assert-plain-and-logs" d="M425 932 L1540 932" />
  </g>

  <g data-message="10">
    <rect class="branch" x="95" y="966" width="1510" height="116" rx="18" />
    <rect class="branchLabel" x="610" y="946" width="480" height="34" rx="17" />
    <text class="labelText" x="850" y="969" text-anchor="middle">non-deterministic equality search check</text>
    <rect class="label pill" x="196" y="994" width="458" height="36" rx="18" />
    <circle cx="223" cy="1012" r="19" fill="#f5eef2" stroke="#a85f7f" stroke-width="2" />
    <text class="num" x="223" y="1018" text-anchor="middle">10</text>
    <text class="labelText" x="425" y="1018" text-anchor="middle">where name eq encrypted value</text>
    <path class="call callRose" data-connector="search-fails" d="M165 1042 L425 1042" />
    <rect class="label pill" x="1054" y="994" width="480" height="36" rx="18" />
    <circle cx="1081" cy="1012" r="19" fill="#f5eef2" stroke="#a85f7f" stroke-width="2" />
    <text class="num" x="1081" y="1018" text-anchor="middle">11</text>
    <text class="labelText" x="1300" y="1018" text-anchor="middle">assertFailsWith&lt;AssertionError&gt;</text>
    <path class="return callRose" data-connector="assertion-error" d="M425 1062 L1540 1062" />
  </g>

  <rect class="footer" x="118" y="1096" width="1464" height="34" rx="12" />
  <text class="note" x="850" y="1119" text-anchor="middle">Logs assert INSERT/UPDATE statements contain no plaintext; encrypted columns decrypt transparently but cannot be searched by equality.</text>
</svg>
