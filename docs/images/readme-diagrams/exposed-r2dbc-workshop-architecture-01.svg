<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" role="img" aria-label="Exposed R2DBC Workshop learning architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.8}
      .lane{stroke:#d7e2ec;stroke-width:1.6}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:19px;letter-spacing:.06em;fill:#73899c}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:38px;fill:#1e293b}
      .subtitle,.detail,.note,.tiny{font-family:"Comic Mono","SFMono-Regular",monospace;fill:#536476;font-weight:700}
      .subtitle{font-size:16px}.detail{font-size:13px}.note{font-size:13px}.tiny{font-size:11px;fill:#64748b}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;fill:#1e293b}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .head{stroke-dasharray:none;style:stroke-dasharray:none!important}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1600" height="920" class="canvas"/>
  <rect x="30" y="30" width="1540" height="860" rx="22" class="frame"/>
  <text x="800" y="84" class="title" text-anchor="middle">Exposed R2DBC Workshop Learning Architecture</text>
  <text x="800" y="118" class="subtitle" text-anchor="middle">The root README learning path moves from shared R2DBC fixtures to SQL mechanics, integration patterns, and production examples.</text>

  <rect x="60" y="150" width="330" height="615" rx="18" fill="#eef5fa" class="lane"/>
  <rect x="430" y="150" width="330" height="615" rx="18" fill="#f1f6ec" class="lane"/>
  <rect x="800" y="150" width="330" height="615" rx="18" fill="#f5eef2" class="lane"/>
  <rect x="1170" y="150" width="330" height="615" rx="18" fill="#fbf4ea" class="lane"/>
  <text x="88" y="188" class="laneTitle">FOUNDATION</text>
  <text x="458" y="188" class="laneTitle">CORE R2DBC</text>
  <text x="828" y="188" class="laneTitle">APP PATTERNS</text>
  <text x="1198" y="188" class="laneTitle">OPERATIONS</text>

  <g data-card="00 shared" data-x="86" data-y="228" data-width="278" data-height="112">
    <rect x="86" y="228" width="278" height="112" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.4" class="card"/>
    <path class="header" d="M86,272 L86,242 Q86,228 100,228 L350,228 Q364,228 364,242 L364,272 Z" fill="#eef5fa"/>
    <text x="225" y="252" class="tiny" text-anchor="middle">&lt;&lt;00-shared&gt;&gt;</text>
    <text x="225" y="278" class="cardTitle" text-anchor="middle">Shared Fixtures</text>
    <text x="108" y="307" class="detail">test DB helpers, sample tables</text>
  </g>
  <g data-card="01 spring boot" data-x="86" data-y="402" data-width="278" data-height="112">
    <rect x="86" y="402" width="278" height="112" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M86,446 L86,416 Q86,402 100,402 L350,402 Q364,402 364,416 L364,446 Z" fill="#f1f6ec"/>
    <text x="225" y="426" class="tiny" text-anchor="middle">&lt;&lt;01-spring-boot&gt;&gt;</text>
    <text x="225" y="452" class="cardTitle" text-anchor="middle">WebFlux Entry</text>
    <text x="108" y="481" class="detail">Spring route into R2DBC work</text>
  </g>
  <g data-card="03 basic sql" data-x="86" data-y="576" data-width="278" data-height="112">
    <rect x="86" y="576" width="278" height="112" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M86,620 L86,590 Q86,576 100,576 L350,576 Q364,576 364,590 L364,620 Z" fill="#f5eee4"/>
    <text x="225" y="600" class="tiny" text-anchor="middle">&lt;&lt;03-basic&gt;&gt;</text>
    <text x="225" y="626" class="cardTitle" text-anchor="middle">SQL DSL Basics</text>
    <text x="108" y="655" class="detail">select, join, conditions, Flow</text>
  </g>

  <g data-card="04 ddl" data-x="456" data-y="228" data-width="278" data-height="112">
    <rect x="456" y="228" width="278" height="112" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M456,272 L456,242 Q456,228 470,228 L720,228 Q734,228 734,242 L734,272 Z" fill="#eef7f6"/>
    <text x="595" y="252" class="tiny" text-anchor="middle">&lt;&lt;04-DDL&gt;&gt;</text>
    <text x="595" y="278" class="cardTitle" text-anchor="middle">Connection + DDL</text>
    <text x="478" y="307" class="detail">ConnectionFactory and SchemaUtils</text>
  </g>
  <g data-card="05 dml" data-x="456" data-y="402" data-width="278" data-height="112">
    <rect x="456" y="402" width="278" height="112" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.4" class="card"/>
    <path class="header" d="M456,446 L456,416 Q456,402 470,402 L720,402 Q734,402 734,416 L734,446 Z" fill="#f5eef2"/>
    <text x="595" y="426" class="tiny" text-anchor="middle">&lt;&lt;05-DML&gt;&gt;</text>
    <text x="595" y="452" class="cardTitle" text-anchor="middle">CRUD + Transactions</text>
    <text x="478" y="481" class="detail">insert, update, functions, tx</text>
  </g>
  <g data-card="06 advanced" data-x="456" data-y="576" data-width="278" data-height="112">
    <rect x="456" y="576" width="278" height="112" rx="14" fill="#fff" stroke="#8a6f55" stroke-width="2.4" class="card"/>
    <path class="header" d="M456,620 L456,590 Q456,576 470,576 L720,576 Q734,576 734,590 L734,620 Z" fill="#f3eee8"/>
    <text x="595" y="600" class="tiny" text-anchor="middle">&lt;&lt;06 / 07&gt;&gt;</text>
    <text x="595" y="626" class="cardTitle" text-anchor="middle">Advanced Mapping</text>
    <text x="478" y="655" class="detail">JSON, Money, custom columns, JPA</text>
  </g>

  <g data-card="08 coroutines" data-x="826" data-y="228" data-width="278" data-height="112">
    <rect x="826" y="228" width="278" height="112" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.4" class="card"/>
    <path class="header" d="M826,272 L826,242 Q826,228 840,228 L1090,228 Q1104,228 1104,242 L1104,272 Z" fill="#eef5fa"/>
    <text x="965" y="252" class="tiny" text-anchor="middle">&lt;&lt;08-coroutines&gt;&gt;</text>
    <text x="965" y="278" class="cardTitle" text-anchor="middle">Coroutines / VT</text>
    <text x="848" y="307" class="detail">Flow collection and virtual threads</text>
  </g>
  <g data-card="09 spring" data-x="826" data-y="402" data-width="278" data-height="112">
    <rect x="826" y="402" width="278" height="112" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M826,446 L826,416 Q826,402 840,402 L1090,402 Q1104,402 1104,416 L1104,446 Z" fill="#f1f6ec"/>
    <text x="965" y="426" class="tiny" text-anchor="middle">&lt;&lt;09-spring&gt;&gt;</text>
    <text x="965" y="452" class="cardTitle" text-anchor="middle">Repository + Cache</text>
    <text x="848" y="481" class="detail">R2DBC repository, suspended cache</text>
  </g>
  <g data-card="10 multi tenant" data-x="826" data-y="576" data-width="278" data-height="112">
    <rect x="826" y="576" width="278" height="112" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M826,620 L826,590 Q826,576 840,576 L1090,576 Q1104,576 1104,590 L1104,620 Z" fill="#f5eee4"/>
    <text x="965" y="600" class="tiny" text-anchor="middle">&lt;&lt;10-multi-tenant&gt;&gt;</text>
    <text x="965" y="626" class="cardTitle" text-anchor="middle">Tenant Strategies</text>
    <text x="848" y="655" class="detail">schema context, auth, onboarding</text>
  </g>

  <g data-card="11 high performance" data-x="1196" data-y="228" data-width="278" data-height="112">
    <rect x="1196" y="228" width="278" height="112" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M1196,272 L1196,242 Q1196,228 1210,228 L1460,228 Q1474,228 1474,242 L1474,272 Z" fill="#eef7f6"/>
    <text x="1335" y="252" class="tiny" text-anchor="middle">&lt;&lt;11-high-performance&gt;&gt;</text>
    <text x="1335" y="278" class="cardTitle" text-anchor="middle">Cache + Routing</text>
    <text x="1218" y="307" class="detail">Redis cache, read/write routing</text>
  </g>
  <g data-card="12 production" data-x="1196" data-y="402" data-width="278" data-height="112">
    <rect x="1196" y="402" width="278" height="112" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1196,446 L1196,416 Q1196,402 1210,402 L1460,402 Q1474,402 1474,416 L1474,446 Z" fill="#f5eef2"/>
    <text x="1335" y="426" class="tiny" text-anchor="middle">&lt;&lt;12-production&gt;&gt;</text>
    <text x="1335" y="452" class="cardTitle" text-anchor="middle">Service Boundaries</text>
    <text x="1218" y="481" class="detail">outbox, idempotency, readiness</text>
  </g>
  <g data-card="13 ecosystem" data-x="1196" data-y="576" data-width="278" data-height="112">
    <rect x="1196" y="576" width="278" height="112" rx="14" fill="#fff" stroke="#8a6f55" stroke-width="2.4" class="card"/>
    <path class="header" d="M1196,620 L1196,590 Q1196,576 1210,576 L1460,576 Q1474,576 1474,590 L1474,620 Z" fill="#f3eee8"/>
    <text x="1335" y="600" class="tiny" text-anchor="middle">&lt;&lt;13-ecosystem&gt;&gt;</text>
    <text x="1335" y="626" class="cardTitle" text-anchor="middle">Cockroach Retry</text>
    <text x="1218" y="655" class="detail">PostgreSQL-compatible R2DBC</text>
  </g>

  <path class="connector" data-connector="foundation-core-ddl" d="M364 284 L444 284" stroke="#4f86c6"/>
  <polygon data-head="foundation-core-ddl" class="head" points="456,284 442,276 442,292" fill="#4f86c6" stroke="#4f86c6" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector" data-connector="core-app-coroutines" d="M734 284 L814 284" stroke="#4f86c6"/>
  <polygon data-head="core-app-coroutines" class="head" points="826,284 812,276 812,292" fill="#4f86c6" stroke="#4f86c6" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector" data-connector="app-ops-performance" d="M1104 284 L1184 284" stroke="#4f86c6"/>
  <polygon data-head="app-ops-performance" class="head" points="1196,284 1182,276 1182,292" fill="#4f86c6" stroke="#4f86c6" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector" data-connector="foundation-core-dml" d="M364 458 L444 458" stroke="#6f8f52"/>
  <polygon data-head="foundation-core-dml" class="head" points="456,458 442,450 442,466" fill="#6f8f52" stroke="#6f8f52" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector" data-connector="core-app-cache" d="M734 458 L814 458" stroke="#6f8f52"/>
  <polygon data-head="core-app-cache" class="head" points="826,458 812,450 812,466" fill="#6f8f52" stroke="#6f8f52" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector" data-connector="app-ops-production" d="M1104 458 L1184 458" stroke="#6f8f52"/>
  <polygon data-head="app-ops-production" class="head" points="1196,458 1182,450 1182,466" fill="#6f8f52" stroke="#6f8f52" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector" data-connector="foundation-core-advanced" d="M364 632 L444 632" stroke="#a66a3f"/>
  <polygon data-head="foundation-core-advanced" class="head" points="456,632 442,624 442,640" fill="#a66a3f" stroke="#a66a3f" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector" data-connector="core-app-tenant" d="M734 632 L814 632" stroke="#a66a3f"/>
  <polygon data-head="core-app-tenant" class="head" points="826,632 812,624 812,640" fill="#a66a3f" stroke="#a66a3f" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector" data-connector="app-ops-ecosystem" d="M1104 632 L1184 632" stroke="#a66a3f"/>
  <polygon data-head="app-ops-ecosystem" class="head" points="1196,632 1182,624 1182,640" fill="#a66a3f" stroke="#a66a3f" stroke-width="1.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect x="220" y="805" width="1160" height="34" rx="11" class="noteBox"/>
  <text x="800" y="827" class="note" text-anchor="middle">Vertical lanes match the root README learning path; solid arrows show recommended progression across chapter groups.</text>
</svg>
