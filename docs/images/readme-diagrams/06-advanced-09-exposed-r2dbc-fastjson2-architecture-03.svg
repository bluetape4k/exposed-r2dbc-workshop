<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1360" viewBox="0 0 2200 1360" role="img" aria-label="Advanced 09 Exposed R2DBC Fastjson2 architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.11"/>
    </filter>
    <style>
      .canvas{fill:#f4f7fa}
      .frame{fill:#fffefb;stroke:#b8ccdf;stroke-width:5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:3}
      .laneWarm{fill:#fffaf0;stroke:#dccb9e;stroke-width:3}
      .laneGreen{fill:#f2f8f2;stroke:#c5dab6;stroke-width:3}
      .laneTeal{fill:#eef7f6;stroke:#bdd9d6;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:64px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#536476;font-weight:700}
      .laneTitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;letter-spacing:.06em;fill:#8ca2b4;font-weight:800}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .cardSub{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:22px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:19px;fill:#64748b;font-weight:800}
      .card{filter:url(#shadow)}
      .cardWhite{fill:#ffffff}
      .blue{stroke:#4f86c6}
      .green{stroke:#6f8f52}
      .amber{stroke:#b8891f}
      .teal{stroke:#4f8f8b}
      .red{stroke:#ad5f82}
      .brown{stroke:#8a6f55}
      .blueFill{fill:#eef5fa}
      .greenFill{fill:#f1f6ec}
      .amberFill{fill:#fff8e6}
      .tealFill{fill:#eef7f6}
      .redFill{fill:#f8edf3}
      .brownFill{fill:#f3eee8}
      .connector{fill:none;stroke-width:5;stroke-linecap:butt;stroke-linejoin:round}
      .head{stroke-dasharray:none;style:stroke-dasharray:none!important}
      .footer{fill:#ffffff;stroke:#d9e3ec;stroke-width:2.4}
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1360"/>
  <rect class="frame" x="36" y="34" width="2128" height="1292" rx="38"/>
  <text class="title" x="1100" y="126" text-anchor="middle">Fastjson2 JSON Column Responsibility Map</text>
  <text class="subtitle" x="1100" y="176" text-anchor="middle">Fastjson2 swaps the serializer engine while keeping the Exposed JSON/JSONB column and query contract familiar.</text>

  <rect class="lane" x="92" y="238" width="466" height="790" rx="30"/>
  <text class="laneTitle" x="132" y="286">EXPOSED COLUMN API</text>
  <rect class="laneWarm" x="612" y="238" width="466" height="790" rx="30"/>
  <text class="laneTitle" x="652" y="286">FASTJSON2 ENGINE</text>
  <rect class="laneGreen" x="1132" y="238" width="466" height="790" rx="30"/>
  <text class="laneTitle" x="1172" y="286">PERSISTENCE SURFACE</text>
  <rect class="laneTeal" x="1652" y="238" width="456" height="790" rx="30"/>
  <text class="laneTitle" x="1692" y="286">QUERY CONTRACT</text>

  <g data-card="fastjson JSON Column" data-x="136" data-y="334" data-width="378" data-height="126">
    <rect class="card cardWhite blue" x="136" y="334" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="325" y="366" text-anchor="middle">&lt;&lt;column extension&gt;&gt;</text>
    <text class="cardTitle" x="325" y="408" text-anchor="middle">fastjson&lt;T&gt;(name)</text>
    <text class="cardSub" x="325" y="442" text-anchor="middle">standard JSON text column</text>
  </g>
  <g data-card="Kotlin Data Classes" data-x="136" data-y="550" data-width="378" data-height="126">
    <rect class="card cardWhite green" x="136" y="550" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="325" y="582" text-anchor="middle">&lt;&lt;domain value&gt;&gt;</text>
    <text class="cardTitle" x="325" y="624" text-anchor="middle">DataHolder / User</text>
    <text class="cardSub" x="325" y="658" text-anchor="middle">no special annotations required</text>
  </g>
  <g data-card="fastjsonb JSONB Column" data-x="136" data-y="766" data-width="378" data-height="126">
    <rect class="card cardWhite teal" x="136" y="766" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="325" y="798" text-anchor="middle">&lt;&lt;column extension&gt;&gt;</text>
    <text class="cardTitle" x="325" y="840" text-anchor="middle">fastjsonb&lt;T&gt;(name)</text>
    <text class="cardSub" x="325" y="874" text-anchor="middle">optimized JSONB storage</text>
  </g>

  <g data-card="Fastjson Serializer" data-x="656" data-y="334" data-width="378" data-height="126">
    <rect class="card cardWhite blue" x="656" y="334" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="845" y="366" text-anchor="middle">&lt;&lt;serialization engine&gt;&gt;</text>
    <text class="cardTitle" x="845" y="408" text-anchor="middle">FastjsonSerializer</text>
    <text class="cardSub" x="845" y="442" text-anchor="middle">writeValue / readValue boundary</text>
  </g>
  <g data-card="Reflection Mapping" data-x="656" data-y="550" data-width="378" data-height="126">
    <rect class="card cardWhite green" x="656" y="550" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="845" y="582" text-anchor="middle">&lt;&lt;codec behavior&gt;&gt;</text>
    <text class="cardTitle" x="845" y="624" text-anchor="middle">Reflection Mapping</text>
    <text class="cardSub" x="845" y="658" text-anchor="middle">Kotlin POJO friendly JSON</text>
  </g>
  <g data-card="Array Value Codec" data-x="656" data-y="766" data-width="378" data-height="126">
    <rect class="card cardWhite teal" x="656" y="766" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="845" y="798" text-anchor="middle">&lt;&lt;collection support&gt;&gt;</text>
    <text class="cardTitle" x="845" y="840" text-anchor="middle">Array Value Codec</text>
    <text class="cardSub" x="845" y="874" text-anchor="middle">UserGroup, IntArray, lists</text>
  </g>

  <g data-card="fastjson_table" data-x="1176" data-y="334" data-width="378" data-height="126">
    <rect class="card cardWhite blue" x="1176" y="334" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="1365" y="366" text-anchor="middle">&lt;&lt;IntIdTable&gt;&gt;</text>
    <text class="cardTitle" x="1365" y="408" text-anchor="middle">fastjson_table</text>
    <text class="cardSub" x="1365" y="442" text-anchor="middle">fastjson_column JSON</text>
  </g>
  <g data-card="fastjson_b_table" data-x="1176" data-y="550" data-width="378" data-height="126">
    <rect class="card cardWhite teal" x="1176" y="550" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="1365" y="582" text-anchor="middle">&lt;&lt;IntIdTable&gt;&gt;</text>
    <text class="cardTitle" x="1365" y="624" text-anchor="middle">fastjson_b_table</text>
    <text class="cardSub" x="1365" y="658" text-anchor="middle">fastjson_b_column JSONB</text>
  </g>
  <g data-card="array table pair" data-x="1176" data-y="766" data-width="378" data-height="126">
    <rect class="card cardWhite green" x="1176" y="766" width="378" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="1365" y="798" text-anchor="middle">&lt;&lt;array fixtures&gt;&gt;</text>
    <text class="cardTitle" x="1365" y="840" text-anchor="middle">array table pair</text>
    <text class="cardSub" x="1365" y="874" text-anchor="middle">groups + numbers documents</text>
  </g>

  <g data-card="extract Query" data-x="1694" data-y="334" data-width="370" data-height="126">
    <rect class="card cardWhite blue" x="1694" y="334" width="370" height="126" rx="22" stroke-width="4"/>
    <text class="tiny" x="1879" y="366" text-anchor="middle">&lt;&lt;JSON query&gt;&gt;</text>
    <text class="cardTitle" x="1879" y="408" text-anchor="middle">extract&lt;T&gt;(path)</text>
    <text class="cardSub" x="1879" y="442" text-anchor="middle">active, user, user.name</text>
  </g>
  <g data-card="contains Query" data-x="1694" data-y="550" data-width="370" data-height="138">
    <rect class="card cardWhite amber" x="1694" y="550" width="370" height="138" rx="22" stroke-width="4"/>
    <text class="tiny" x="1879" y="582" text-anchor="middle">&lt;&lt;JSON query&gt;&gt;</text>
    <text class="cardTitle" x="1879" y="624" text-anchor="middle">contains(value)</text>
    <text class="cardSub" x="1879" y="654" text-anchor="middle">Postgres @&gt;</text>
    <text class="cardSub" x="1879" y="680" text-anchor="middle">MySQL JSON_CONTAINS</text>
  </g>
  <g data-card="exists Query" data-x="1694" data-y="766" data-width="370" data-height="138">
    <rect class="card cardWhite brown" x="1694" y="766" width="370" height="138" rx="22" stroke-width="4"/>
    <text class="tiny" x="1879" y="798" text-anchor="middle">&lt;&lt;JSON query&gt;&gt;</text>
    <text class="cardTitle" x="1879" y="840" text-anchor="middle">exists(path)</text>
    <text class="cardSub" x="1879" y="870" text-anchor="middle">JSONPath key</text>
    <text class="cardSub" x="1879" y="896" text-anchor="middle">and filter checks</text>
  </g>

  <path class="connector blue" data-connector="json-column-to-serializer"  d="M 514 397 L 642 397"/>
  <polygon class="head"  points="656,397 642,390 642,404" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector blue" data-connector="serializer-to-json-table"  d="M 1034 397 L 1162 397"/>
  <polygon class="head"  points="1176,397 1162,390 1162,404" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector blue" data-connector="json-table-to-extract"  d="M 1554 397 L 1680 397"/>
  <polygon class="head"  points="1694,397 1680,390 1680,404" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector green" data-connector="data-class-to-reflection"  d="M 514 613 L 642 613"/>
  <polygon class="head"  points="656,613 642,606 642,620" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector teal" data-connector="reflection-to-jsonb-table"  d="M 1034 613 L 1162 613"/>
  <polygon class="head"  points="1176,613 1162,606 1162,620" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector amber" data-connector="jsonb-table-to-contains"  d="M 1554 613 L 1680 613"/>
  <polygon class="head"  points="1694,613 1680,606 1680,620" fill="#b8891f" stroke="#b8891f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector teal" data-connector="jsonb-column-to-array-codec"  d="M 514 829 L 642 829"/>
  <polygon class="head"  points="656,829 642,822 642,836" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector green" data-connector="array-codec-to-array-table"  d="M 1034 829 L 1162 829"/>
  <polygon class="head"  points="1176,829 1162,822 1162,836" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector brown" data-connector="array-table-to-exists"  d="M 1554 829 L 1680 829"/>
  <polygon class="head"  points="1694,829 1680,822 1680,836" fill="#8a6f55" stroke="#8a6f55" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="lane" x="156" y="1082" width="1888" height="148" rx="30"/>
  <text class="laneTitle" x="196" y="1130">JSON LIBRARY COMPARISON</text>
  <g data-card="exposed-json" data-x="302" data-y="1152" data-width="430" data-height="56">
    <rect class="cardWhite green" x="302" y="1152" width="430" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="517" y="1189" text-anchor="middle">exposed-json: kotlinx.serialization</text>
  </g>
  <g data-card="exposed-jackson" data-x="885" data-y="1152" data-width="430" data-height="56">
    <rect class="cardWhite blue" x="885" y="1152" width="430" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="1100" y="1189" text-anchor="middle">exposed-jackson: ObjectMapper</text>
  </g>
  <g data-card="exposed-fastjson2" data-x="1468" data-y="1152" data-width="430" data-height="56">
    <rect class="cardWhite amber" x="1468" y="1152" width="430" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="1683" y="1189" text-anchor="middle">exposed-fastjson2: speed focused</text>
  </g>

  <rect class="footer" x="216" y="1258" width="1768" height="48" rx="18"/>
  <text class="note" x="1100" y="1290" text-anchor="middle">Reader contract: choose JSON or JSONB storage, keep standard Kotlin data classes, and reuse the same Exposed JSON query functions.</text>
</svg>
