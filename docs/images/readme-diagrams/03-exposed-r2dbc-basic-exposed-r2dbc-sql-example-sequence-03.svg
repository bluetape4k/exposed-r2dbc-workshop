<svg xmlns="http://www.w3.org/2000/svg" width="1845" height="2336" viewBox="0 0 1845 2336" role="img" aria-label="Query Execution Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1845" height="2336"/>
<rect class="frame" x="32" y="28" width="1781" height="2280" rx="28"/>
<text class="title" x="66" y="82">Query Execution Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="1.5" y="166" width="277" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Test Code</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2276" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="392.75" y="166" width="277" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="531.25" y="209" text-anchor="middle">withTables</text>
<line class="lifeline" x1="531.25" y1="252" x2="531.25" y2="2276" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="784" y="166" width="277" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="922.5" y="209" text-anchor="middle">suspendTransaction</text>
<line class="lifeline" x1="922.5" y1="252" x2="922.5" y2="2276" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1175.25" y="166" width="277" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1313.75" y="209" text-anchor="middle">Exposed DSL</text>
<line class="lifeline" x1="1313.75" y1="252" x2="1313.75" y2="2276" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1566.5" y="166" width="277" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1705" y="209" text-anchor="middle">R2DBC Database</text>
<line class="lifeline" x1="1705" y1="252" x2="1705" y2="2276" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="144.125" y="286" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="162.125" y="313" text-anchor="start">1. withTables(testDB, CityTable, UserTable)</text>
<path class="line" d="M140 344 L531.25 344"/>
<rect x="523.375" y="396" width="407" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="541.375" y="423" text-anchor="start">2. suspendTransaction { SchemaUtils.create() }</text>
<path class="line" d="M531.25 454 L922.5 454"/>
<rect x="1178.75" y="506" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1196.75" y="533" text-anchor="start">3. CREATE TABLE cities, users</text>
<path class="line" d="M922.5 564 L1705 564"/>
<rect x="1208.75" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1226.75" y="643" text-anchor="start">4. done</text>
<path class="dashed" d="M1705 674 L922.5 674"/>
<rect x="621.875" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="639.875" y="753" text-anchor="start">5. Tables created</text>
<path class="dashed" d="M922.5 784 L531.25 784"/>
<rect x="230.625" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="248.625" y="863" text-anchor="start">6. Execute block</text>
<path class="line" d="M531.25 894 L140 894"/>
<rect x="547.375" y="946" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="565.375" y="973" text-anchor="start">7. CityTable.insert { it[name] = Seoul }</text>
<path class="line" d="M140 1004 L1313.75 1004"/>
<rect x="1353.875" y="1056" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1371.875" y="1083" text-anchor="start">8. INSERT INTO cities VALUES (...)</text>
<path class="line" d="M1313.75 1114 L1705 1114"/>
<rect x="1404.375" y="1166" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1422.375" y="1193" text-anchor="start">9. ResultRow (id=1)</text>
<path class="dashed" d="M1705 1224 L1313.75 1224"/>
<rect x="621.875" y="1276" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="639.875" y="1303" text-anchor="start">10. id</text>
<path class="dashed" d="M1313.75 1334 L140 1334"/>
<rect x="466.875" y="1386" width="520" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="484.875" y="1413" text-anchor="start">11. UserTable.innerJoin(CityTable).select(...).where { ... }</text>
<path class="line" d="M140 1444 L1313.75 1444"/>
<rect x="1289.875" y="1496" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1307.875" y="1523" text-anchor="start">12. SELECT ... FROM users INNER JOIN cities ON ...</text>
<path class="line" d="M1313.75 1554 L1705 1554"/>
<rect x="1404.375" y="1606" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1422.375" y="1633" text-anchor="start">13. Flow&lt;ResultRow&gt;</text>
<path class="dashed" d="M1705 1664 L1313.75 1664"/>
<rect x="621.875" y="1716" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="639.875" y="1743" text-anchor="start">14. List&lt;ResultRow&gt;</text>
<path class="dashed" d="M1313.75 1774 L140 1774"/>
<rect x="230.625" y="1826" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="248.625" y="1853" text-anchor="start">15. Block complete</text>
<path class="line" d="M140 1884 L531.25 1884"/>
<rect x="527.375" y="1936" width="399" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="545.375" y="1963" text-anchor="start">16. suspendTransaction { SchemaUtils.drop() }</text>
<path class="line" d="M531.25 1994 L922.5 1994"/>
<rect x="1182.75" y="2046" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1200.75" y="2073" text-anchor="start">17. DROP TABLE users, cities</text>
<path class="line" d="M922.5 2104 L1705 2104"/>
<rect x="1208.75" y="2156" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1226.75" y="2183" text-anchor="start">18. done</text>
<path class="dashed" d="M1705 2214 L922.5 2214"/>
</svg>
