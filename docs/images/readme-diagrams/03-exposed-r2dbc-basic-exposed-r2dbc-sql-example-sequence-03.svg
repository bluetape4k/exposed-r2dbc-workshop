<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" width="1600" height="1300" role="img" aria-label="Exposed R2DBC SQL DSL query execution sequence">
  <defs>
    <marker id="seqArrowBlue" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowAmber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b68432" stroke="#b68432" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowTeal" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowSlate" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowPurple" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8a6bb8" stroke="#8a6bb8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#fbfaf7}.frame{fill:#fffefb;stroke:#425563;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:40px;fill:#1e293b}
      .subtitle,.role,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#536476;font-weight:700}
      .small{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#64748b;font-weight:700}
      .header{fill:#ffffff;stroke:#5a7180;stroke-width:2.2}
      .participant,.participantTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#1e293b;stroke:none}
      .lifeline{stroke:#9eb0bd;stroke-width:2.2;stroke-dasharray:7 9}
      .activationBlue{fill:#eaf5ff;stroke:#9ecdf0;stroke-width:1.8}
      .activationGreen{fill:#eff9ef;stroke:#87b578;stroke-width:1.8}
      .activationAmber{fill:#fff7e7;stroke:#c69443;stroke-width:1.8}
      .activationTeal{fill:#eaf8f7;stroke:#63aaa6;stroke-width:1.8}
      .activationSlate{fill:#f5f7fb;stroke:#7b8794;stroke-width:1.8}
      .msg{fill:none;stroke-width:3;stroke-linecap:butt}
      .ret{fill:none;stroke-width:2.8;stroke-dasharray:8 7;stroke-linecap:butt}
      .pill{fill:#ffffff;stroke-width:1.7}
      .num{fill:#ffffff;stroke-width:1.7}
      .label{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:15px;font-weight:700}
      .altFrame{fill:none;stroke:#7d98a8;stroke-width:2.5;stroke-dasharray:8 7}
      .altHeader{fill:#fffaf0;stroke:#d1a257;stroke-width:1.8}
      .footer{fill:#ffffff;stroke:#d7e2ec;stroke-width:1.4}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1300"/>
  <rect class="frame" x="26" y="26" width="1548" height="1248" rx="26"/>
  <text class="title" x="72" y="88">Exposed R2DBC SQL DSL Query Flow</text>
  <text class="subtitle" x="74" y="124">withCityUsers creates schema, seeds sample rows, then R2DBC Flow terminal operators verify update/delete/join/groupBy queries.</text>

  <g data-participant="WorkshopTest">
    <rect class="header" x="70" y="170" width="240" height="78" rx="10"/>
    <text class="participant participantTitle" x="190" y="210" text-anchor="middle">Workshop Test</text>
    <text class="role" x="190" y="232" text-anchor="middle">R2dbcExposedSQLExample</text>
    <line class="lifeline" x1="190" y1="248" x2="190" y2="1134"/>
  </g>
  <g data-participant="Fixture">
    <rect class="header" x="360" y="170" width="240" height="78" rx="10"/>
    <text class="participant participantTitle" x="480" y="210" text-anchor="middle">withCityUsers</text>
    <text class="role" x="480" y="232" text-anchor="middle">withTables fixture</text>
    <line class="lifeline" x1="480" y1="248" x2="480" y2="1134"/>
  </g>
  <g data-participant="Transaction">
    <rect class="header" x="660" y="170" width="260" height="78" rx="10"/>
    <text class="participant participantTitle" x="790" y="210" text-anchor="middle">R2dbcTransaction</text>
    <text class="role" x="790" y="232" text-anchor="middle">statement receiver</text>
    <line class="lifeline" x1="790" y1="248" x2="790" y2="1134"/>
  </g>
  <g data-participant="ExposedDSL">
    <rect class="header" x="1000" y="170" width="240" height="78" rx="10"/>
    <text class="participant participantTitle" x="1120" y="210" text-anchor="middle">Exposed DSL</text>
    <text class="role" x="1120" y="232" text-anchor="middle">CityTable / UserTable</text>
    <line class="lifeline" x1="1120" y1="248" x2="1120" y2="1134"/>
  </g>
  <g data-participant="Database">
    <rect class="header" x="1330" y="170" width="210" height="78" rx="10"/>
    <text class="participant participantTitle" x="1435" y="210" text-anchor="middle">R2DBC DB</text>
    <text class="role" x="1435" y="232" text-anchor="middle">tables + rows</text>
    <line class="lifeline" x1="1435" y1="248" x2="1435" y2="1134"/>
  </g>

  <rect class="activationBlue" x="180" y="304" width="18" height="754" rx="5"/>
  <rect class="activationGreen" x="471" y="330" width="18" height="258" rx="5"/>
  <rect class="activationTeal" x="781" y="360" width="18" height="210" rx="5"/>
  <rect class="activationAmber" x="1111" y="596" width="18" height="370" rx="5"/>
  <rect class="activationSlate" x="1426" y="444" width="18" height="630" rx="5"/>

  <rect class="pill" x="90" y="272" width="360" height="32" rx="15" stroke="#9ecdf0"/>
  <circle class="num" cx="116" cy="288" r="15" stroke="#9ecdf0"/>
  <text class="label" x="116" y="294" text-anchor="middle" fill="#276b9d">1</text>
  <text class="label" x="155" y="294" fill="#276b9d">withCityUsers(testDB)</text>
  <path class="msg" d="M 198 318 H 466" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>

  <rect class="pill" x="318" y="346" width="430" height="32" rx="15" stroke="#9ecdf0"/>
  <circle class="num" cx="344" cy="362" r="15" stroke="#9ecdf0"/>
  <text class="label" x="344" y="368" text-anchor="middle" fill="#276b9d">2</text>
  <text class="label" x="382" y="368" fill="#276b9d">withTables(testDB, CityTable, UserTable)</text>
  <path class="msg" d="M 489 392 H 776" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>

  <rect class="pill" x="798" y="424" width="430" height="32" rx="15" stroke="#91ad78"/>
  <circle class="num" cx="824" cy="440" r="15" stroke="#91ad78"/>
  <text class="label" x="824" y="446" text-anchor="middle" fill="#557339">3</text>
  <text class="label" x="862" y="446" fill="#557339">create cities and users tables</text>
  <path class="msg" d="M 799 470 H 1421" stroke="#6f8f52" marker-end="url(#seqArrowGreen)"/>

  <rect class="pill" x="1048" y="504" width="250" height="32" rx="15" stroke="#d1a257"/>
  <circle class="num" cx="1074" cy="520" r="15" stroke="#d1a257"/>
  <text class="label" x="1074" y="526" text-anchor="middle" fill="#8a5f22">4</text>
  <text class="label" x="1112" y="526" fill="#8a5f22">DDL committed</text>
  <path class="ret" d="M 1426 548 H 804" stroke="#b68432" marker-end="url(#seqArrowAmber)"/>

  <rect class="pill" x="238" y="574" width="324" height="32" rx="15" stroke="#63aaa6"/>
  <circle class="num" cx="264" cy="590" r="15" stroke="#63aaa6"/>
  <text class="label" x="264" y="596" text-anchor="middle" fill="#2f7774">5</text>
  <text class="label" x="302" y="596" fill="#2f7774">statement block starts</text>
  <path class="ret" d="M 471 620 H 204" stroke="#4f8f8b" marker-end="url(#seqArrowTeal)"/>

  <rect class="pill" x="316" y="652" width="560" height="32" rx="15" stroke="#d1a257"/>
  <circle class="num" cx="342" cy="668" r="15" stroke="#d1a257"/>
  <text class="label" x="342" y="674" text-anchor="middle" fill="#8a5f22">6</text>
  <text class="label" x="380" y="674" fill="#8a5f22">insertSampleData: city + user inserts</text>
  <path class="msg" d="M 198 698 H 1106" stroke="#b68432" marker-end="url(#seqArrowAmber)"/>

  <rect class="pill" x="1042" y="724" width="350" height="32" rx="15" stroke="#d1a257"/>
  <circle class="num" cx="1068" cy="740" r="15" stroke="#d1a257"/>
  <text class="label" x="1068" y="746" text-anchor="middle" fill="#8a5f22">7</text>
  <text class="label" x="1106" y="746" fill="#8a5f22">INSERT cities/users rows</text>
  <path class="msg" d="M 1129 770 H 1421" stroke="#b68432" marker-end="url(#seqArrowAmber)"/>

  <rect class="branch altFrame" x="642" y="812" width="838" height="244" rx="22"/>
  <rect class="altHeader" x="760" y="792" width="420" height="34" rx="16"/>
  <text class="label" x="970" y="815" text-anchor="middle" fill="#8a5f22">alt query variant: mutation, join, or aggregate</text>

  <rect class="pill" x="300" y="838" width="585" height="32" rx="15" stroke="#9ecdf0"/>
  <circle class="num" cx="326" cy="854" r="15" stroke="#9ecdf0"/>
  <text class="label" x="326" y="860" text-anchor="middle" fill="#276b9d">8</text>
  <text class="label" x="364" y="860" fill="#276b9d">update/deleteWhere/innerJoin/groupBy DSL</text>
  <path class="msg" d="M 198 884 H 1106" stroke="#4f86c6" marker-end="url(#seqArrowBlue)"/>

  <rect class="pill" x="1075" y="902" width="340" height="32" rx="15" stroke="#b996da"/>
  <circle class="num" cx="1101" cy="918" r="15" stroke="#b996da"/>
  <text class="label" x="1101" y="924" text-anchor="middle" fill="#6e4fa3">9</text>
  <text class="label" x="1139" y="924" fill="#6e4fa3">SQL statement over R2DBC</text>
  <path class="msg" d="M 1129 946 H 1421" stroke="#8a6bb8" marker-end="url(#seqArrowPurple)"/>

  <rect class="pill" x="1048" y="990" width="285" height="32" rx="15" stroke="#63aaa6"/>
  <circle class="num" cx="1074" cy="1006" r="15" stroke="#63aaa6"/>
  <text class="label" x="1074" y="1012" text-anchor="middle" fill="#2f7774">10</text>
  <text class="label" x="1114" y="1012" fill="#2f7774">rows / Flow&lt;ResultRow&gt;</text>
  <path class="ret" d="M 1426 1034 H 1134" stroke="#4f8f8b" marker-end="url(#seqArrowTeal)"/>

  <rect class="pill" x="635" y="1070" width="410" height="32" rx="15" stroke="#63aaa6"/>
  <circle class="num" cx="661" cy="1086" r="15" stroke="#63aaa6"/>
  <text class="label" x="661" y="1092" text-anchor="middle" fill="#2f7774">11</text>
  <text class="label" x="700" y="1092" fill="#2f7774">collect / single / toList assertions</text>
  <path class="ret" d="M 1111 1114 H 204" stroke="#4f8f8b" marker-end="url(#seqArrowTeal)"/>

  <rect class="pill" x="760" y="1130" width="358" height="32" rx="15" stroke="#91ad78"/>
  <circle class="num" cx="786" cy="1146" r="15" stroke="#91ad78"/>
  <text class="label" x="786" y="1152" text-anchor="middle" fill="#557339">12</text>
  <text class="label" x="824" y="1152" fill="#557339">drop tables and leave fixture</text>
  <path class="msg" d="M 489 1174 H 1421" stroke="#6f8f52" marker-end="url(#seqArrowGreen)"/>

  <rect class="footer" x="84" y="1228" width="1432" height="30" rx="8"/>
  <text class="note" x="800" y="1248" text-anchor="middle">The module verifies SQL DSL behavior through R2DBC Flow results, not blocking JDBC calls.</text>
</svg>
