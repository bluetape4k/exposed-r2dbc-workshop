<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 880" width="1320" height="880" role="img" aria-label="Advanced 06 Exposed R2DBC Custom Columns architecture diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#a66a3f" stroke="#a66a3f" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .laneA{fill:#f5f9ff}
      .laneB{fill:#f7fbf4}
      .laneC{fill:#fff8f1}
      .card{filter:url(#shadow)}
      .header{opacity:.98}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1320" height="880" class="canvas"/>
  <rect x="22" y="22" width="1276" height="836" rx="18" class="frame"/>

  <text x="58" y="72" class="title" text-anchor="start">Custom Column Extension Coverage</text>
  <text x="58" y="102" class="subtitle" text-anchor="start">Repository-backed responsibility map for client defaults, transparent byte transforms, and binary object storage.</text>

  <rect x="52" y="132" width="1216" height="184" rx="16" class="lane laneA"/>
  <text x="78" y="163" class="laneTitle" text-anchor="start">CLIENT DEFAULT GENERATORS</text>

  <g data-card="ClientGenerated table" data-x="82" data-y="190" data-width="230" data-height="92">
    <rect x="82" y="190" width="230" height="92" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.1" class="card"/>
    <path class="header" d="M82,232 L82,204 Q82,190 96,190 L298,190 Q312,190 312,204 L312,232 Z" fill="#eef5fa"/>
    <text x="197" y="209" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable&gt;&gt;</text>
    <text x="197" y="228" class="cardTitle" text-anchor="middle">ClientGenerated</text>
    <text x="102" y="254" class="detail" text-anchor="start">batchInsert without IDs</text>
  </g>
  <g data-card="clientDefault extensions" data-x="382" data-y="190" data-width="230" data-height="92">
    <rect x="382" y="190" width="230" height="92" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.1" class="card"/>
    <path class="header" d="M382,232 L382,204 Q382,190 396,190 L598,190 Q612,190 612,204 L612,232 Z" fill="#eef5fa"/>
    <text x="497" y="209" class="tiny" text-anchor="middle">&lt;&lt;column DSL&gt;&gt;</text>
    <text x="497" y="228" class="cardTitle" text-anchor="middle">clientDefault wrappers</text>
    <text x="402" y="254" class="detail" text-anchor="start">timebased / snowflake</text>
  </g>
  <g data-card="K-sortable IDs" data-x="682" data-y="190" data-width="230" data-height="92">
    <rect x="682" y="190" width="230" height="92" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.1" class="card"/>
    <path class="header" d="M682,232 L682,204 Q682,190 696,190 L898,190 Q912,190 912,204 L912,232 Z" fill="#eef5fa"/>
    <text x="797" y="209" class="tiny" text-anchor="middle">&lt;&lt;generated values&gt;&gt;</text>
    <text x="797" y="228" class="cardTitle" text-anchor="middle">UUID / KSUID</text>
    <text x="702" y="254" class="detail" text-anchor="start">ksuidMillis included</text>
  </g>
  <g data-card="Distinct rows asserted" data-x="982" data-y="190" data-width="230" data-height="92">
    <rect x="982" y="190" width="230" height="92" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.1" class="card"/>
    <path class="header" d="M982,232 L982,204 Q982,190 996,190 L1198,190 Q1212,190 1212,204 L1212,232 Z" fill="#eef5fa"/>
    <text x="1097" y="209" class="tiny" text-anchor="middle">&lt;&lt;query check&gt;&gt;</text>
    <text x="1097" y="228" class="cardTitle" text-anchor="middle">100 unique rows</text>
    <text x="1002" y="254" class="detail" text-anchor="start">selectAll().distinct()</text>
  </g>

  <path class="connector" data-connector="defaults-1" d="M 312 236 L 382 236" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="defaults-2" d="M 612 236 L 682 236" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="defaults-3" d="M 912 236 L 982 236" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>

  <rect x="52" y="340" width="1216" height="184" rx="16" class="lane laneB"/>
  <text x="78" y="371" class="laneTitle" text-anchor="start">TRANSPARENT BYTE TRANSFORMS</text>

  <g data-card="ByteArray input" data-x="82" data-y="398" data-width="230" data-height="92">
    <rect x="82" y="398" width="230" height="92" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.1" class="card"/>
    <path class="header" d="M82,440 L82,412 Q82,398 96,398 L298,398 Q312,398 312,412 L312,440 Z" fill="#f1f6ec"/>
    <text x="197" y="417" class="tiny" text-anchor="middle">&lt;&lt;test data&gt;&gt;</text>
    <text x="197" y="436" class="cardTitle" text-anchor="middle">ByteArray payload</text>
    <text x="102" y="462" class="detail" text-anchor="start">random UTF-8 content</text>
  </g>
  <g data-card="compressed columns" data-x="382" data-y="398" data-width="230" data-height="92">
    <rect x="382" y="398" width="230" height="92" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.1" class="card"/>
    <path class="header" d="M382,440 L382,412 Q382,398 396,398 L598,398 Q612,398 612,412 L612,440 Z" fill="#f1f6ec"/>
    <text x="497" y="417" class="tiny" text-anchor="middle">&lt;&lt;ColumnType&gt;&gt;</text>
    <text x="497" y="436" class="cardTitle" text-anchor="middle">compressedBinary</text>
    <text x="402" y="462" class="detail" text-anchor="start">compressedBlob sibling</text>
  </g>
  <g data-card="compression codecs" data-x="682" data-y="398" data-width="230" data-height="92">
    <rect x="682" y="398" width="230" height="92" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.1" class="card"/>
    <path class="header" d="M682,440 L682,412 Q682,398 696,398 L898,398 Q912,398 912,412 L912,440 Z" fill="#f1f6ec"/>
    <text x="797" y="417" class="tiny" text-anchor="middle">&lt;&lt;Compressors&gt;&gt;</text>
    <text x="797" y="436" class="cardTitle" text-anchor="middle">LZ4 / Snappy / Zstd</text>
    <text x="702" y="462" class="detail" text-anchor="start">VARBINARY or BLOB</text>
  </g>
  <g data-card="Restored bytes asserted" data-x="982" data-y="398" data-width="230" data-height="92">
    <rect x="982" y="398" width="230" height="92" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.1" class="card"/>
    <path class="header" d="M982,440 L982,412 Q982,398 996,398 L1198,398 Q1212,398 1212,412 L1212,440 Z" fill="#f1f6ec"/>
    <text x="1097" y="417" class="tiny" text-anchor="middle">&lt;&lt;read contract&gt;&gt;</text>
    <text x="1097" y="436" class="cardTitle" text-anchor="middle">original bytes restored</text>
    <text x="1002" y="462" class="detail" text-anchor="start">null path also tested</text>
  </g>

  <path class="connector" data-connector="compress-1" d="M 312 444 L 382 444" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="compress-2" d="M 612 444 L 682 444" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="compress-3" d="M 912 444 L 982 444" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <rect x="52" y="548" width="1216" height="184" rx="16" class="lane laneC"/>
  <text x="78" y="579" class="laneTitle" text-anchor="start">BINARY OBJECT SERIALIZATION</text>

  <g data-card="Serializable payloads" data-x="82" data-y="606" data-width="230" data-height="92">
    <rect x="82" y="606" width="230" height="92" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.1" class="card"/>
    <path class="header" d="M82,648 L82,620 Q82,606 96,606 L298,606 Q312,606 312,620 L312,648 Z" fill="#f5eee4"/>
    <text x="197" y="625" class="tiny" text-anchor="middle">&lt;&lt;data classes&gt;&gt;</text>
    <text x="197" y="644" class="cardTitle" text-anchor="middle">Embeddable objects</text>
    <text x="102" y="670" class="detail" text-anchor="start">Serializable + versions</text>
  </g>
  <g data-card="serialized columns" data-x="382" data-y="606" data-width="230" data-height="92">
    <rect x="382" y="606" width="230" height="92" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.1" class="card"/>
    <path class="header" d="M382,648 L382,620 Q382,606 396,606 L598,606 Q612,606 612,620 L612,648 Z" fill="#f5eee4"/>
    <text x="497" y="625" class="tiny" text-anchor="middle">&lt;&lt;ColumnType&gt;&gt;</text>
    <text x="497" y="644" class="cardTitle" text-anchor="middle">binarySerialized*</text>
    <text x="402" y="670" class="detail" text-anchor="start">Binary and Blob variants</text>
  </g>
  <g data-card="binary serializers" data-x="682" data-y="606" data-width="230" data-height="92">
    <rect x="682" y="606" width="230" height="92" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.1" class="card"/>
    <path class="header" d="M682,648 L682,620 Q682,606 696,606 L898,606 Q912,606 912,620 L912,648 Z" fill="#f5eee4"/>
    <text x="797" y="625" class="tiny" text-anchor="middle">&lt;&lt;BinarySerializers&gt;&gt;</text>
    <text x="797" y="644" class="cardTitle" text-anchor="middle">LZ4 / Zstd + Fory</text>
    <text x="702" y="670" class="detail" text-anchor="start">Kryo variants covered</text>
  </g>
  <g data-card="Deserialized value asserted" data-x="982" data-y="606" data-width="230" data-height="92">
    <rect x="982" y="606" width="230" height="92" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.1" class="card"/>
    <path class="header" d="M982,648 L982,620 Q982,606 996,606 L1198,606 Q1212,606 1212,620 L1212,648 Z" fill="#f5eee4"/>
    <text x="1097" y="625" class="tiny" text-anchor="middle">&lt;&lt;read contract&gt;&gt;</text>
    <text x="1097" y="644" class="cardTitle" text-anchor="middle">typed object restored</text>
    <text x="1002" y="670" class="detail" text-anchor="start">equality assertion</text>
  </g>

  <path class="connector" data-connector="serialize-1" d="M 312 652 L 382 652" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="serialize-2" d="M 612 652 L 682 652" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="serialize-3" d="M 912 652 L 982 652" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>

  <rect x="86" y="772" width="1148" height="38" rx="11" class="noteBox"/>
  <text x="660" y="796" class="note" text-anchor="middle">Current test source covers generated IDs, compression, and binary serialization; README encryption text has no matching test package in this tree.</text>
</svg>
