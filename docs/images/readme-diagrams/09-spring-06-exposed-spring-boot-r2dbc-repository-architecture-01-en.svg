<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000" width="1800" height="1000" role="img" aria-label="Spring Boot Exposed R2DBC repository ownership architecture">
  <defs>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.6}.lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      text{font-family:"Comic Mono","SFMono-Regular",monospace;fill:#536476;font-weight:700}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:36px;fill:#1e293b;font-weight:400}.subtitle{font-size:15px;fill:#536476}.laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;letter-spacing:.09em;fill:#91a6b7}.cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#1e293b;font-weight:400}.cardTitleCompact{font-size:17px}.detail{font-size:14px}.tiny{font-size:12px;fill:#64748b}.connector{fill:none;stroke-width:4.6;stroke-linecap:round;stroke-linejoin:round}.noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
    <marker id="arrow-request" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0,0 L14,7 L0,14 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-transaction" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0,0 L14,7 L0,14 Z" fill="#a66a3f" stroke="#a66a3f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-data" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0,0 L14,7 L0,14 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect width="1800" height="1000" class="canvas"/><rect x="30" y="30" width="1740" height="940" rx="22" class="frame"/>
  <text x="78" y="88" class="title">Spring Boot Exposed R2DBC repository ownership</text>
  <text x="78" y="120" class="subtitle">The application owns the database and pool; the provider supplies a scanned repository proxy and one-call transaction.</text>
  <rect x="64" y="160" width="1672" height="292" rx="18" class="lane"/><text x="90" y="194" class="laneTitle">REQUEST, SERVICE, AND PROVIDER BOUNDARIES</text>
  <rect x="64" y="500" width="1672" height="330" rx="18" class="lane"/><text x="90" y="534" class="laneTitle">APPLICATION-OWNED R2DBC INFRASTRUCTURE</text>
  <g data-card="http-suspend-caller"><rect x="90" y="238" width="220" height="116" rx="12" fill="#fff" stroke="#4f86c6" stroke-width="2.4"/><path d="M90 278 L90 250 Q90 238 102 238 L298 238 Q310 238 310 250 L310 278 Z" fill="#eef5fa"/><text x="200" y="258" class="tiny" text-anchor="middle">&lt;&lt;REST&gt;&gt;</text><text x="200" y="278" class="cardTitle" text-anchor="middle">ProductController</text><text x="110" y="309" class="detail">suspend endpoints</text><text x="110" y="331" class="detail">JSON + validation</text></g>
  <g data-card="product-service"><rect x="360" y="238" width="240" height="116" rx="12" fill="#fff" stroke="#4f86c6" stroke-width="2.4"/><path d="M360 278 L360 250 Q360 238 372 238 L588 238 Q600 238 600 250 L600 278 Z" fill="#eef5fa"/><text x="480" y="258" class="tiny" text-anchor="middle">&lt;&lt;service&gt;&gt;</text><text x="480" y="278" class="cardTitle cardTitleCompact" text-anchor="middle">ProductTransactionService</text><text x="380" y="309" class="detail">single save / Flow</text><text x="380" y="331" class="detail">explicit outer tx</text></g>
  <g data-card="provider-single-call-tx"><rect x="680" y="205" width="280" height="100" rx="12" fill="#fff" stroke="#a66a3f" stroke-width="2.4"/><path d="M680 241 L680 217 Q680 205 692 205 L948 205 Q960 205 960 217 L960 241 Z" fill="#f5eee4"/><text x="820" y="228" class="tiny" text-anchor="middle">&lt;&lt;provider&gt;&gt;</text><text x="820" y="251" class="cardTitle" text-anchor="middle">one-call transaction</text><text x="700" y="278" class="detail">CRUD call scope</text></g>
  <g data-card="optional-outer-tx"><rect x="680" y="345" width="280" height="100" rx="12" fill="#fff" stroke="#a66a3f" stroke-width="2.4"/><path d="M680 381 L680 357 Q680 345 692 345 L948 345 Q960 345 960 357 L960 381 Z" fill="#f5eee4"/><text x="820" y="368" class="tiny" text-anchor="middle">&lt;&lt;optional&gt;&gt;</text><text x="820" y="391" class="cardTitle" text-anchor="middle">outer suspendTransaction</text><text x="700" y="418" class="detail">multi-call atomicity</text></g>
  <g data-card="repository-scan-proxy"><rect x="1020" y="258" width="300" height="116" rx="12" fill="#fff" stroke="#64748b" stroke-width="2.4"/><path d="M1020 298 L1020 270 Q1020 258 1032 258 L1308 258 Q1320 258 1320 270 L1320 298 Z" fill="#f8fafc"/><text x="1170" y="278" class="tiny" text-anchor="middle">&lt;&lt;scan + proxy&gt;&gt;</text><text x="1170" y="299" class="cardTitle" text-anchor="middle">ExposedR2dbcRepository</text><text x="1040" y="330" class="detail">@EnableExposedR2dbcRepositories</text><text x="1040" y="352" class="detail">provider CRUD contract</text></g>
  <g data-card="exposed-mapping"><rect x="1380" y="258" width="300" height="116" rx="12" fill="#fff" stroke="#6f8f52" stroke-width="2.4"/><path d="M1380 298 L1380 270 Q1380 258 1392 258 L1668 258 Q1680 258 1680 270 L1680 298 Z" fill="#f1f6ec"/><text x="1530" y="278" class="tiny" text-anchor="middle">&lt;&lt;mapping&gt;&gt;</text><text x="1530" y="299" class="cardTitle" text-anchor="middle">Product table mapping</text><text x="1400" y="330" class="detail">table / extractId</text><text x="1400" y="352" class="detail">toDomain / persist values</text></g>
  <g data-card="r2dbc-database"><rect x="90" y="604" width="300" height="116" rx="12" fill="#fff" stroke="#4f8f8b" stroke-width="2.4"/><path d="M90 644 L90 616 Q90 604 102 604 L378 604 Q390 604 390 616 L390 644 Z" fill="#eef7f6"/><text x="240" y="624" class="tiny" text-anchor="middle">&lt;&lt;application-owned&gt;&gt;</text><text x="240" y="646" class="cardTitle" text-anchor="middle">R2dbcDatabase</text><text x="110" y="677" class="detail">Exposed config + IO dispatcher</text><text x="110" y="699" class="detail">H2 regular profile</text></g>
  <g data-card="connection-pool"><rect x="470" y="604" width="300" height="116" rx="12" fill="#fff" stroke="#4f8f8b" stroke-width="2.4"/><path d="M470 644 L470 616 Q470 604 482 604 L758 604 Q770 604 770 616 L770 644 Z" fill="#eef7f6"/><text x="620" y="624" class="tiny" text-anchor="middle">&lt;&lt;bounded bean&gt;&gt;</text><text x="620" y="646" class="cardTitle" text-anchor="middle">ConnectionPool</text><text x="490" y="677" class="detail">maxSize=8, acquireRetry=0</text><text x="490" y="699" class="detail">bounded timeouts</text></g>
  <g data-card="h2-r2dbc-driver"><rect x="850" y="604" width="300" height="116" rx="12" fill="#fff" stroke="#4f8f8b" stroke-width="2.4"/><path d="M850 644 L850 616 Q850 604 862 604 L1138 604 Q1150 604 1150 616 L1150 644 Z" fill="#eef7f6"/><text x="1000" y="624" class="tiny" text-anchor="middle">&lt;&lt;runtime&gt;&gt;</text><text x="1000" y="646" class="cardTitle" text-anchor="middle">H2 R2DBC driver</text><text x="870" y="677" class="detail">r2dbc:h2:mem</text><text x="870" y="699" class="detail">demo-only regular DB</text></g>
  <g data-card="pool-lifecycle"><rect x="1230" y="604" width="300" height="116" rx="12" fill="#fff" stroke="#a66a3f" stroke-width="2.4"/><path d="M1230 644 L1230 616 Q1230 604 1242 604 L1518 604 Q1530 604 1530 616 L1530 644 Z" fill="#f5eee4"/><text x="1380" y="624" class="tiny" text-anchor="middle">&lt;&lt;destroy boundary&gt;&gt;</text><text x="1380" y="646" class="cardTitle" text-anchor="middle">ConnectionPoolLifecycle</text><text x="1250" y="677" class="detail">AtomicBoolean dispose once</text><text x="1250" y="699" class="detail">graceful context close</text></g>
  <path data-connector="http-to-service" data-source="http-suspend-caller" data-target="product-service" class="connector" d="M310 296 L348 296" stroke="#4f86c6" marker-end="url(#arrow-request)"/>
  <path data-connector="service-to-single-call" data-source="product-service" data-target="provider-single-call-tx" class="connector" d="M600 270 L640 270 Q660 270 680 270" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>
  <path data-connector="service-to-outer" data-source="product-service" data-target="optional-outer-tx" class="connector" d="M520 354 L520 410 Q520 425 540 425 L640 425 Q660 425 680 425" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>
  <path data-connector="single-call-to-proxy" data-source="provider-single-call-tx" data-target="repository-scan-proxy" class="connector" d="M960 270 L1005 270 L1020 270" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>
  <path data-connector="outer-to-proxy" data-source="optional-outer-tx" data-target="repository-scan-proxy" class="connector" d="M960 400 L980 400 Q1000 400 1000 380 L1000 320 Q997 300 1005 300 L1020 300" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>
  <path data-connector="proxy-to-mapping" data-source="repository-scan-proxy" data-target="exposed-mapping" class="connector" d="M1320 316 L1368 316" stroke="#4f8f8b" marker-end="url(#arrow-data)"/>
  <path data-connector="mapping-to-database" data-source="exposed-mapping" data-target="r2dbc-database" class="connector" d="M1530 374 L1530 530 Q1530 560 1500 560 L270 560 Q240 560 240 589 L240 604" stroke="#4f8f8b" marker-end="url(#arrow-data)"/>
  <path data-connector="database-to-pool" data-source="r2dbc-database" data-target="connection-pool" class="connector" d="M390 662 L458 662" stroke="#4f8f8b" marker-end="url(#arrow-data)"/>
  <path data-connector="pool-to-driver" data-source="connection-pool" data-target="h2-r2dbc-driver" class="connector" d="M770 662 L838 662" stroke="#4f8f8b" marker-end="url(#arrow-data)"/>
  <path data-connector="database-to-lifecycle" data-source="r2dbc-database" data-target="pool-lifecycle" class="connector" d="M390 700 L420 700 Q440 700 440 750 L440 770 Q440 790 460 790 L1190 790 Q1210 790 1210 770 L1210 720 Q1207 700 1215 700 L1230 700" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>
  <rect x="90" y="878" width="1620" height="42" rx="14" class="noteBox"/><text x="900" y="905" class="detail" text-anchor="middle">Legend: blue=request, amber=transaction choice/lifecycle, teal=provider mapping and application-owned R2DBC infrastructure.</text>
</svg>
