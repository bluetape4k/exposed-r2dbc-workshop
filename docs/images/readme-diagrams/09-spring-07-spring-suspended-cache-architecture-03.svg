<svg xmlns="http://www.w3.org/2000/svg" width="1378" height="692" viewBox="0 0 1378 692" role="img" aria-label="Cache-Aside Pattern Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
  <marker id="inheritArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inheritArrow)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1378" height="692"/>
<rect class="frame" x="32" y="28" width="1314" height="636" rx="28"/>
<text class="title" x="66" y="82">Cache-Aside Pattern Flow</text>
<text class="subtitle" x="70" y="118">Architecture nodes and edges from the original Mermaid source</text>
<path class="line" d="M338 552 C338 552 372 552 372 552" data-connector="line"/>
<path class="line" d="M1040 386 C1040 469 338 469 338 552" data-connector="line"/>
<path class="line" d="M672 386 C672 386 706 386 706 386" data-connector="line"/>
<path class="line" d="M338 386 C338 386 372 386 372 386" data-connector="line"/>
<path class="line" d="M1006 220 C1006 386 1040 386 1040 552" data-connector="line"/>
<path class="line" d="M856 280 C856 386 856 386 856 492" data-connector="line"/>
<path class="line" d="M672 220 C672 220 706 220 706 220" data-connector="line"/>
<path class="line" d="M338 220 C338 220 372 220 372 220" data-connector="line"/>
<g transform="translate(48,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Request:</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">findByCode(code)</text>
</g>
<g transform="translate(382,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Redis GET</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">caches:country:code:</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">{code}</text>
</g>
<g transform="translate(716,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Cache HIT?</text>
</g>
<g transform="translate(1050,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Return cached result</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">immediate response</text>
</g>
<g transform="translate(48,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">DB query</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">suspendTransaction</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">SELECT</text>
</g>
<g transform="translate(382,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Redis SET (TTL 60s)</text>
</g>
<g transform="translate(716,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Return DB result</text>
</g>
<g transform="translate(1050,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Request:</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">update(record)</text>
</g>
<g transform="translate(48,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Redis DEL cache</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">invalidation</text>
</g>
<g transform="translate(382,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">DB update</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">suspendTransaction</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">UPDATE</text>
</g>
<g transform="translate(716,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">HIT</text>
</g>
<g transform="translate(1050,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">MISS</text>
</g>
</svg>
