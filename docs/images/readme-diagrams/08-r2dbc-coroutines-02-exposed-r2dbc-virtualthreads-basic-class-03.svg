<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="895" viewBox="0 0 1754 895" role="img" aria-label="Virtual Thread API Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
  <marker id="inheritArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inheritArrow)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1754" height="895"/>
<rect class="frame" x="32" y="28" width="1690" height="839" rx="28"/>
<text class="title" x="66" y="82">Virtual Thread API Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1492 313 L1492 454 L877 454 L877 521" data-connector="line"/>
<path class="line" d="M1082 371 L1082 446 L877 446 L877 521" data-connector="line"/>
<path class="line" d="M262 334 L262 438 L877 438 L877 521" data-connector="line"/>
<path class="inheritLine" d="M877 521 L877 430 L672 430 L672 313"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">R2dbcTransaction</text>
  <text class="mono" x="18" y="108">+virtualThreadTransaction(block)</text>
<text class="mono" x="18" y="129">+maxAttempts Int</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="170" y="61" text-anchor="middle">CoroutineDispatcher</text>
  <text class="mono" x="18" y="108">+dispatch(context, block)</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="191" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«suspend fun»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">In Top Level Suspend</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Transaction</text>
  <text class="mono" x="18" y="124">+db R2dbcDatabase</text>
<text class="mono" x="18" y="145">+transactionIsolation IsolationLevel</text>
<text class="mono" x="18" y="166">+statement suspend block</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«JUnit5 extension»</text>
  <text class="label" x="170" y="61" text-anchor="middle">RunSuspendVT</text>
  <text class="mono" x="18" y="108">+invoke(testBody) Unit</text>
</g>
<g transform="translate(707,521)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«bluetape4k»</text>
  <text class="label" x="170" y="61" text-anchor="middle">VirtualThreadDispatcher</text>
  <text class="mono" x="18" y="108">+newVT() CoroutineDispatcher</text>
<text class="mono" x="18" y="129">+dispatch(context, block)</text>
</g>
</svg>
