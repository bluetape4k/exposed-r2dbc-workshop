<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-label="Virtual Thread API class structure diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
      .inherit{fill:none;stroke:#64748b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .use{fill:none;stroke-width:2.3;stroke-dasharray:7 6;stroke-linecap:round;stroke-linejoin:round}
      .hollowHead{fill:#fff;stroke:#64748b;stroke-width:2.5;stroke-dasharray:none}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}
    </style>
  </defs>

  <rect width="1280" height="880" class="canvas"/>
  <rect x="22" y="22" width="1236" height="836" rx="18" class="frame"/>
  <text x="58" y="70" class="title" text-anchor="start">Virtual Thread API Class Structure</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">Concrete UML view for Ex01_VirtualThreads, table objects, record mapping, and virtual-thread transaction helpers.</text>

  <rect x="48" y="130" width="1184" height="172" rx="16" class="lane"/>
  <text x="72" y="160" class="laneTitle" text-anchor="start">BASE CONTRACTS</text>

  <g data-card="AbstractR2dbcExposedTest" data-x="78" data-y="190" data-width="230" data-height="76">
    <rect x="78" y="190" width="230" height="76" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M78,228 L78,204 Q78,190 92,190 L294,190 Q308,190 308,204 L308,228 Z" fill="#eef5fa"/>
    <text x="193" y="207" class="tiny" text-anchor="middle">&lt;&lt;base test&gt;&gt;</text>
    <text x="193" y="222" class="cardTitle" text-anchor="middle">AbstractR2dbc</text>
    <text x="193" y="244" class="cardTitle" text-anchor="middle">ExposedTest</text>
    <text x="96" y="258" class="detail" text-anchor="start">ENABLE_DIALECTS_METHOD</text>
  </g>

  <g data-card="IntIdTable" data-x="382" data-y="190" data-width="200" data-height="76">
    <rect x="382" y="190" width="200" height="76" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M382,228 L382,204 Q382,190 396,190 L568,190 Q582,190 582,204 L582,228 Z" fill="#f1f6ec"/>
    <text x="482" y="207" class="tiny" text-anchor="middle">&lt;&lt;table base&gt;&gt;</text>
    <text x="482" y="225" class="cardTitle" text-anchor="middle">IntIdTable</text>
    <text x="400" y="248" class="detail" text-anchor="start">integer id PK</text>
  </g>

  <g data-card="Table" data-x="690" data-y="190" data-width="200" data-height="76">
    <rect x="690" y="190" width="200" height="76" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M690,228 L690,204 Q690,190 704,190 L876,190 Q890,190 890,204 L890,228 Z" fill="#f5eee4"/>
    <text x="790" y="207" class="tiny" text-anchor="middle">&lt;&lt;table base&gt;&gt;</text>
    <text x="790" y="225" class="cardTitle" text-anchor="middle">Table</text>
    <text x="708" y="248" class="detail" text-anchor="start">custom primary key</text>
  </g>

  <g data-card="Serializable" data-x="998" data-y="190" data-width="200" data-height="76">
    <rect x="998" y="190" width="200" height="76" rx="14" fill="#fff" stroke="#64748b" stroke-width="2" class="card"/>
    <path class="header" d="M998,228 L998,204 Q998,190 1012,190 L1184,190 Q1198,190 1198,204 L1198,228 Z" fill="#f8fafc"/>
    <text x="1098" y="207" class="tiny" text-anchor="middle">&lt;&lt;JVM&gt;&gt;</text>
    <text x="1098" y="225" class="cardTitle" text-anchor="middle">Serializable</text>
    <text x="1016" y="248" class="detail" text-anchor="start">serialVersionUID</text>
  </g>

  <rect x="48" y="330" width="1184" height="218" rx="16" class="lane"/>
  <text x="72" y="360" class="laneTitle" text-anchor="start">SOURCE TYPES IN EX01_VIRTUALTHREADS</text>

  <g data-card="Ex01_VirtualThreads" data-x="78" data-y="404" data-width="230" data-height="82">
    <rect x="78" y="404" width="230" height="82" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M78,444 L78,418 Q78,404 92,404 L294,404 Q308,404 308,418 L308,444 Z" fill="#eef5fa"/>
    <text x="193" y="422" class="tiny" text-anchor="middle">&lt;&lt;test class&gt;&gt;</text>
    <text x="193" y="441" class="cardTitle" text-anchor="middle">Ex01_VirtualThreads</text>
    <text x="96" y="466" class="detail" text-anchor="start">@EnabledOnJre(JAVA_21)</text>
  </g>

  <g data-card="VTester" data-x="382" data-y="404" data-width="200" data-height="82">
    <rect x="382" y="404" width="200" height="82" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M382,444 L382,418 Q382,404 396,404 L568,404 Q582,404 582,418 L582,444 Z" fill="#f1f6ec"/>
    <text x="482" y="422" class="tiny" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
    <text x="482" y="441" class="cardTitle" text-anchor="middle">VTester</text>
    <text x="400" y="466" class="detail" text-anchor="start">name varchar nullable</text>
  </g>

  <g data-card="VTesterUnique" data-x="690" data-y="404" data-width="200" data-height="82">
    <rect x="690" y="404" width="200" height="82" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M690,444 L690,418 Q690,404 704,404 L876,404 Q890,404 890,418 L890,444 Z" fill="#f5eee4"/>
    <text x="790" y="422" class="tiny" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
    <text x="790" y="441" class="cardTitle" text-anchor="middle">VTesterUnique</text>
    <text x="708" y="466" class="detail" text-anchor="start">integer id unique PK</text>
  </g>

  <g data-card="VRecord" data-x="998" data-y="404" data-width="200" data-height="82">
    <rect x="998" y="404" width="200" height="82" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M998,444 L998,418 Q998,404 1012,404 L1184,404 Q1198,404 1198,418 L1198,444 Z" fill="#f5eef2"/>
    <text x="1098" y="422" class="tiny" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
    <text x="1098" y="441" class="cardTitle" text-anchor="middle">VRecord</text>
    <text x="1016" y="466" class="detail" text-anchor="start">id + nullable name</text>
  </g>

  <path class="inherit" data-connector="inherit-test" d="M 193 404 L 193 282"/>
  <polygon class="hollowHead" points="193,266 184,282 202,282" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="inherit" data-connector="inherit-vtester" d="M 482 404 L 482 282"/>
  <polygon class="hollowHead" points="482,266 473,282 491,282" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="inherit" data-connector="inherit-unique" d="M 790 404 L 790 282"/>
  <polygon class="hollowHead" points="790,266 781,282 799,282" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="inherit" data-connector="inherit-record" d="M 1098 404 L 1098 282"/>
  <polygon class="hollowHead" points="1098,266 1089,282 1107,282" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect x="48" y="574" width="1184" height="198" rx="16" class="lane"/>
  <text x="72" y="604" class="laneTitle" text-anchor="start">EXTENSIONS AND COLLABORATORS</text>

  <g data-card="getTesterById" data-x="92" data-y="650" data-width="220" data-height="76">
    <rect x="92" y="650" width="220" height="76" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M92,688 L92,664 Q92,650 106,650 L298,650 Q312,650 312,664 L312,688 Z" fill="#eef7f6"/>
    <text x="202" y="667" class="tiny" text-anchor="middle">&lt;&lt;R2dbcTransaction ext&gt;&gt;</text>
    <text x="202" y="685" class="cardTitle" text-anchor="middle">getTesterById(id)</text>
    <text x="110" y="708" class="detail" text-anchor="start">singleOrNull ResultRow</text>
  </g>

  <g data-card="virtualThreadTransaction" data-x="372" data-y="650" data-width="230" data-height="76">
    <rect x="372" y="650" width="230" height="76" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M372,688 L372,664 Q372,650 386,650 L588,650 Q602,650 602,664 L602,688 Z" fill="#f1f6ec"/>
    <text x="487" y="667" class="tiny" text-anchor="middle">&lt;&lt;bluetape4k&gt;&gt;</text>
    <text x="487" y="685" class="cardTitle" text-anchor="middle">virtualThreadTx</text>
    <text x="390" y="708" class="detail" text-anchor="start">new VT-based transaction</text>
  </g>

  <g data-card="Dispatchers.newVT" data-x="662" data-y="650" data-width="220" data-height="76">
    <rect x="662" y="650" width="220" height="76" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M662,688 L662,664 Q662,650 676,650 L868,650 Q882,650 882,664 L882,688 Z" fill="#f5eee4"/>
    <text x="772" y="667" class="tiny" text-anchor="middle">&lt;&lt;dispatcher&gt;&gt;</text>
    <text x="772" y="685" class="cardTitle" text-anchor="middle">Dispatchers.newVT</text>
    <text x="680" y="708" class="detail" text-anchor="start">CoroutineScope launch</text>
  </g>

  <g data-card="CopyOnWriteArrayList" data-x="942" data-y="650" data-width="220" data-height="76">
    <rect x="942" y="650" width="220" height="76" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M942,688 L942,664 Q942,650 956,650 L1148,650 Q1162,650 1162,664 L1162,688 Z" fill="#f5eef2"/>
    <text x="1052" y="667" class="tiny" text-anchor="middle">&lt;&lt;shared result&gt;&gt;</text>
    <text x="1052" y="685" class="cardTitle" text-anchor="middle">CopyOnWriteArrayList</text>
    <text x="960" y="708" class="detail" text-anchor="start">thread-safe collection</text>
  </g>

  <path class="use" data-connector="use-vt-transaction" d="M 312 688 L 360 688" stroke="#4f8f8b"/>
  <polygon points="372,688 360,681 360,695" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use" data-connector="use-vtester" d="M 482 650 L 482 500" stroke="#5f8848"/>
  <polygon points="482,486 475,500 489,500" fill="#5f8848" stroke="#5f8848" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use" data-connector="use-vrecord" d="M 602 688 L 650 688" stroke="#a66a3f"/>
  <polygon points="662,688 650,681 650,695" fill="#a66a3f" stroke="#a66a3f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use" data-connector="use-result-list" d="M 882 688 L 930 688" stroke="#a85f7f"/>
  <polygon points="942,688 930,681 930,695" fill="#a85f7f" stroke="#a85f7f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect x="86" y="806" width="1108" height="30" rx="10" class="noteBox"/>
  <text x="640" y="826" class="note" text-anchor="middle">Hollow triangles show inheritance or implementation; dashed dependencies use direct solid heads to avoid dashed arrowhead rendering.</text>
</svg>
