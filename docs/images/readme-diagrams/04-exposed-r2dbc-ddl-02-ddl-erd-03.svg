<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-label="Exposed R2DBC DDL Users Orders Products ERD">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .cardinality{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#334155;font-weight:800}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:19px;fill:#1e293b}
      .connector{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .labelPill{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.2}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1280" height="860" class="canvas"/>
  <rect x="22" y="22" width="1236" height="816" rx="18" class="frame"/>

  <text x="58" y="70" class="title" text-anchor="start">Users / Orders / Products ERD</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">Repository-backed DDL sample: IntIdTable entities, foreign keys, unique constraints, and composite indexes.</text>

  <rect x="48" y="128" width="1184" height="574" rx="16" class="lane"/>
  <text x="72" y="160" class="laneTitle" text-anchor="start">README SAMPLE TABLES</text>

  <rect x="48" y="730" width="1184" height="78" rx="16" class="lane"/>
  <text x="72" y="760" class="laneTitle" text-anchor="start">READER CONTRACT</text>

  <g data-card="Users" data-x="94" data-y="232" data-width="280" data-height="158">
    <rect x="94" y="232" width="280" height="158" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M94,278 L94,246 Q94,232 108,232 L360,232 Q374,232 374,246 L374,278 Z" fill="#eef5fa"/>
    <text x="234" y="252" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable("users")&gt;&gt;</text>
    <text x="234" y="273" class="cardTitle" text-anchor="middle">Users</text>
    <text x="114" y="304" class="detail" text-anchor="start">id PK</text>
    <text x="114" y="324" class="detail" text-anchor="start">name varchar(255)</text>
    <text x="114" y="344" class="detail" text-anchor="start">email UNIQUE</text>
    <text x="114" y="364" class="detail" text-anchor="start">created_at default</text>
  </g>

  <g data-card="Orders" data-x="500" data-y="232" data-width="280" data-height="158">
    <rect x="500" y="232" width="280" height="158" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M500,278 L500,246 Q500,232 514,232 L766,232 Q780,232 780,246 L780,278 Z" fill="#f1f6ec"/>
    <text x="640" y="252" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable("orders")&gt;&gt;</text>
    <text x="640" y="273" class="cardTitle" text-anchor="middle">Orders</text>
    <text x="520" y="304" class="detail" text-anchor="start">id PK</text>
    <text x="520" y="324" class="detail" text-anchor="start">user_id FK -&gt; users</text>
    <text x="520" y="344" class="detail" text-anchor="start">amount CHECK &gt; 0</text>
    <text x="520" y="364" class="detail" text-anchor="start">status enum by name</text>
  </g>

  <g data-card="Products" data-x="906" data-y="232" data-width="280" data-height="158">
    <rect x="906" y="232" width="280" height="158" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M906,278 L906,246 Q906,232 920,232 L1172,232 Q1186,232 1186,246 L1186,278 Z" fill="#f5eee4"/>
    <text x="1046" y="252" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable("products")&gt;&gt;</text>
    <text x="1046" y="273" class="cardTitle" text-anchor="middle">Products</text>
    <text x="926" y="304" class="detail" text-anchor="start">id PK</text>
    <text x="926" y="324" class="detail" text-anchor="start">name INDEX</text>
    <text x="926" y="344" class="detail" text-anchor="start">sku UNIQUE</text>
    <text x="926" y="364" class="detail" text-anchor="start">email named UNIQUE</text>
  </g>

  <g data-card="OrderItems" data-x="500" data-y="512" data-width="280" data-height="168">
    <rect x="500" y="512" width="280" height="168" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M500,558 L500,526 Q500,512 514,512 L766,512 Q780,512 780,526 L780,558 Z" fill="#f5eef2"/>
    <text x="640" y="532" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable("order_items")&gt;&gt;</text>
    <text x="640" y="553" class="cardTitle" text-anchor="middle">OrderItems</text>
    <text x="520" y="584" class="detail" text-anchor="start">id PK</text>
    <text x="520" y="604" class="detail" text-anchor="start">order_id FK -&gt; orders</text>
    <text x="520" y="624" class="detail" text-anchor="start">product_id FK -&gt; products</text>
    <text x="520" y="644" class="detail" text-anchor="start">UNIQUE(order_id, product_id)</text>
    <text x="520" y="664" class="detail" text-anchor="start">INDEX(product_id, quantity)</text>
  </g>

  <path class="connector" data-connector="users-orders" d="M 374 311 L 500 311" stroke="#4f86c6"/>
  <text x="392" y="301" class="cardinality" text-anchor="middle">1</text>
  <text x="482" y="301" class="cardinality" text-anchor="middle">N</text>
  <rect x="404" y="276" width="66" height="24" rx="9" class="labelPill"/>
  <text x="437" y="293" class="tiny" text-anchor="middle">user_id FK</text>

  <path class="connector" data-connector="orders-orderitems" d="M 640 390 L 640 512" stroke="#6f8f52"/>
  <text x="621" y="412" class="cardinality" text-anchor="middle">1</text>
  <text x="621" y="492" class="cardinality" text-anchor="middle">N</text>
  <rect x="662" y="441" width="86" height="24" rx="9" class="labelPill"/>
  <text x="705" y="458" class="tiny" text-anchor="middle">order_id FK</text>

  <path class="connector" data-connector="products-orderitems" d="M 1046 390 L 1046 566 Q 1046 596 1016 596 L 780 596" stroke="#a66a3f"/>
  <text x="1065" y="412" class="cardinality" text-anchor="middle">1</text>
  <text x="800" y="590" class="cardinality" text-anchor="middle">N</text>
  <rect x="876" y="558" width="104" height="24" rx="9" class="labelPill"/>
  <text x="928" y="575" class="tiny" text-anchor="middle">product_id FK</text>

  <rect x="92" y="778" width="1096" height="28" rx="10" class="noteBox"/>
  <text x="640" y="797" class="note" text-anchor="middle">Endpoint cardinality is small text near each connection point; relationship labels are separate pills and never cover 1/N markers.</text>
</svg>
