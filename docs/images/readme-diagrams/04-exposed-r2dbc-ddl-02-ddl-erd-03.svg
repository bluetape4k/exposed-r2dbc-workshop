<svg xmlns="http://www.w3.org/2000/svg" width="842" height="803" viewBox="0 0 842 803" role="img" aria-label="Sample Table ERD (Users / Orders / Products)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none}

  .cardinalityBox{fill:#ffffff;stroke:#94a3b8;stroke-width:1;rx:7;opacity:.94}
  .cardinalityLabel{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;font-weight:700;fill:#334155}
.erdRelation{fill:none;stroke:#64748b;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 6}
</style>
</defs>
<rect class="canvas" width="842" height="803"/>
<rect class="frame" x="32" y="28" width="778" height="747" rx="28"/>
<text class="title" x="66" y="82">Sample Table ERD</text>
<text class="subtitle" x="70" y="118">ERD tables and relationships from the original Mermaid source</text>
<path class="erdRelation" d="M220 466 L220 390"/>
<path class="erdRelation" d="M622 390 L622 122 L220 122 L220 170"/>
<path class="erdRelation" d="M622 466 L622 390"/>
<g transform="translate(60,170)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="220" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#5B8DEF"/>
  <text class="label" x="160" y="44" text-anchor="middle">order_items</text>
  <text class="mono" x="18" y="104">int id PK auto increment</text>
<text class="mono" x="18" y="131">int order_id FK NOT NULL</text>
<text class="mono" x="18" y="158">int product_id FK NOT NULL</text>
<text class="mono" x="18" y="185">int quantity NOT NULL</text>
</g>
<g transform="translate(462,170)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="220" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#58A978"/>
  <text class="label" x="160" y="44" text-anchor="middle">orders</text>
  <text class="mono" x="18" y="104">int id PK auto increment</text>
<text class="mono" x="18" y="131">int user_id FK NOT NULL</text>
<text class="mono" x="18" y="158">decimal amount CHECK amount &gt; 0</text>
<text class="mono" x="18" y="185">varchar status NOT NULL</text>
</g>
<g transform="translate(60,466)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="193" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#D6A441"/>
  <text class="label" x="160" y="44" text-anchor="middle">products</text>
  <text class="mono" x="18" y="104">int id PK auto increment</text>
<text class="mono" x="18" y="131">varchar name NOT NULL, indexed</text>
<text class="mono" x="18" y="158">varchar sku UNIQUE NOT NULL</text>
</g>
<g transform="translate(462,466)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="247" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#DC6B82"/>
  <text class="label" x="160" y="44" text-anchor="middle">users</text>
  <text class="mono" x="18" y="104">int id PK auto increment</text>
<text class="mono" x="18" y="131">varchar name NOT NULL</text>
<text class="mono" x="18" y="158">varchar email UNIQUE NOT NULL</text>
<text class="mono" x="18" y="185">timestamp created_at DEFAULT now</text>
<text class="mono" x="18" y="212">boolean is_active DEFAULT true</text>
</g>

<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="183.0" y="396.0" width="74" height="22"/><text class="cardinalityLabel" x="220.0" y="412.0" text-anchor="middle">1 : N</text></g>
<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="494.0" y="90.0" width="74" height="22"/><text class="cardinalityLabel" x="531.0" y="106.0" text-anchor="middle">1 : N</text></g>
<g class="cardinality" data-cardinality="1 : N"><rect class="cardinalityBox" x="585.0" y="396.0" width="74" height="22"/><text class="cardinalityLabel" x="622.0" y="412.0" text-anchor="middle">1 : N</text></g>
</svg>
