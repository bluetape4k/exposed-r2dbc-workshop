<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" width="1320" height="820" role="img" aria-label="Coroutine Scope Management architecture diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#3c82b4" stroke="#3c82b4" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#5f8848" stroke="#5f8848" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#a66a3f" stroke="#a66a3f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
      .connector{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}
      .legendBox{fill:#fff;stroke:#d7e2ec;stroke-width:1.1}
    </style>
  </defs>

  <rect width="1320" height="820" class="canvas"/>
  <rect x="22" y="22" width="1276" height="776" rx="18" class="frame"/>
  <text x="58" y="70" class="title" text-anchor="start">Coroutine Scope Management</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">Concrete map of dispatcher switching, nested suspend transactions, and independent top-level transactions.</text>

  <rect x="48" y="130" width="1224" height="174" rx="16" class="lane"/>
  <text x="72" y="160" class="laneTitle" text-anchor="start">CURRENT COROUTINE CONTEXT</text>

  <g data-card="runSuspendIO" data-x="86" data-y="190" data-width="200" data-height="88">
    <rect x="86" y="190" width="200" height="88" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M86,232 L86,204 Q86,190 100,190 L272,190 Q286,190 286,204 L286,232 Z" fill="#eef5fa"/>
    <text x="186" y="208" class="tiny" text-anchor="middle">&lt;&lt;test entry&gt;&gt;</text>
    <text x="186" y="227" class="cardTitle" text-anchor="middle">runSuspendIO</text>
    <text x="104" y="252" class="detail" text-anchor="start">JUnit coroutine boundary</text>
  </g>

  <g data-card="withContext" data-x="332" data-y="190" data-width="200" data-height="88">
    <rect x="332" y="190" width="200" height="88" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M332,232 L332,204 Q332,190 346,190 L518,190 Q532,190 532,204 L532,232 Z" fill="#eef7f6"/>
    <text x="432" y="208" class="tiny" text-anchor="middle">&lt;&lt;dispatcher&gt;&gt;</text>
    <text x="432" y="227" class="cardTitle" text-anchor="middle">withContext</text>
    <text x="350" y="252" class="detail" text-anchor="start">IO / Default / single</text>
  </g>

  <g data-card="suspendTransaction" data-x="578" data-y="190" data-width="200" data-height="88">
    <rect x="578" y="190" width="200" height="88" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M578,232 L578,204 Q578,190 592,190 L764,190 Q778,190 778,204 L778,232 Z" fill="#f1f6ec"/>
    <text x="678" y="208" class="tiny" text-anchor="middle">&lt;&lt;nested&gt;&gt;</text>
    <text x="678" y="227" class="cardTitle" text-anchor="middle">suspend tx</text>
    <text x="596" y="252" class="detail" text-anchor="start">reuse context state</text>
  </g>

  <g data-card="connection state" data-x="824" data-y="190" data-width="200" data-height="88">
    <rect x="824" y="190" width="200" height="88" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M824,232 L824,204 Q824,190 838,190 L1010,190 Q1024,190 1024,204 L1024,232 Z" fill="#f5eee4"/>
    <text x="924" y="208" class="tiny" text-anchor="middle">&lt;&lt;R2DBC&gt;&gt;</text>
    <text x="924" y="227" class="cardTitle" text-anchor="middle">connection state</text>
    <text x="842" y="252" class="detail" text-anchor="start">same coroutine path</text>
  </g>

  <path class="connector" data-connector="context-run" d="M 286 234 L 332 234" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="context-dispatch" d="M 532 234 L 578 234" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="context-transaction" d="M 778 234 L 824 234" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>

  <rect x="48" y="328" width="1224" height="162" rx="16" class="lane"/>
  <text x="72" y="358" class="laneTitle" text-anchor="start">NESTED WORK INSIDE SUSPEND TRANSACTION</text>

  <g data-card="transaction block" data-x="166" data-y="386" data-width="200" data-height="78">
    <rect x="166" y="386" width="200" height="78" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M166,426 L166,400 Q166,386 180,386 L352,386 Q366,386 366,400 L366,426 Z" fill="#f1f6ec"/>
    <text x="266" y="404" class="tiny" text-anchor="middle">&lt;&lt;block&gt;&gt;</text>
    <text x="266" y="423" class="cardTitle" text-anchor="middle">tx block</text>
    <text x="184" y="447" class="detail" text-anchor="start">connection().isolation</text>
  </g>

  <g data-card="insertTester" data-x="436" data-y="386" data-width="200" data-height="78">
    <rect x="436" y="386" width="200" height="78" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M436,426 L436,400 Q436,386 450,386 L622,386 Q636,386 636,400 L636,426 Z" fill="#f5eee4"/>
    <text x="536" y="404" class="tiny" text-anchor="middle">&lt;&lt;helper&gt;&gt;</text>
    <text x="536" y="423" class="cardTitle" text-anchor="middle">insertTester</text>
    <text x="454" y="447" class="detail" text-anchor="start">uses current db</text>
  </g>

  <g data-card="getTesterById" data-x="706" data-y="386" data-width="200" data-height="78">
    <rect x="706" y="386" width="200" height="78" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M706,426 L706,400 Q706,386 720,386 L892,386 Q906,386 906,400 L906,426 Z" fill="#eef7f6"/>
    <text x="806" y="404" class="tiny" text-anchor="middle">&lt;&lt;query&gt;&gt;</text>
    <text x="806" y="423" class="cardTitle" text-anchor="middle">getTesterById</text>
    <text x="724" y="447" class="detail" text-anchor="start">select + singleOrNull</text>
  </g>

  <g data-card="assert result" data-x="976" data-y="386" data-width="200" data-height="78">
    <rect x="976" y="386" width="200" height="78" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M976,426 L976,400 Q976,386 990,386 L1162,386 Q1176,386 1176,400 L1176,426 Z" fill="#f5eef2"/>
    <text x="1076" y="404" class="tiny" text-anchor="middle">&lt;&lt;assert&gt;&gt;</text>
    <text x="1076" y="423" class="cardTitle" text-anchor="middle">result row</text>
    <text x="994" y="447" class="detail" text-anchor="start">same tx scope</text>
  </g>

  <path class="connector" data-connector="nested-insert" d="M 366 425 L 436 425" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="nested-query" d="M 636 425 L 706 425" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="nested-assert" d="M 906 425 L 976 425" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>

  <rect x="48" y="514" width="1224" height="188" rx="16" class="lane"/>
  <text x="72" y="544" class="laneTitle" text-anchor="start">INDEPENDENT TOP-LEVEL TRANSACTIONS</text>

  <g data-card="CoroutineScope" data-x="76" data-y="594" data-width="190" data-height="78">
    <rect x="76" y="594" width="190" height="78" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M76,634 L76,608 Q76,594 90,594 L252,594 Q266,594 266,608 L266,634 Z" fill="#eef5fa"/>
    <text x="171" y="612" class="tiny" text-anchor="middle">&lt;&lt;scope&gt;&gt;</text>
    <text x="171" y="631" class="cardTitle" text-anchor="middle">CoroutineScope</text>
    <text x="94" y="655" class="detail" text-anchor="start">IO / Default</text>
  </g>

  <g data-card="async jobs" data-x="314" data-y="594" data-width="190" data-height="78">
    <rect x="314" y="594" width="190" height="78" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M314,634 L314,608 Q314,594 328,594 L490,594 Q504,594 504,608 L504,634 Z" fill="#eef7f6"/>
    <text x="409" y="612" class="tiny" text-anchor="middle">&lt;&lt;parallel&gt;&gt;</text>
    <text x="409" y="631" class="cardTitle" text-anchor="middle">async jobs</text>
    <text x="332" y="655" class="detail" text-anchor="start">one value per task</text>
  </g>

  <g data-card="top-level tx" data-x="552" data-y="594" data-width="190" data-height="78">
    <rect x="552" y="594" width="190" height="78" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M552,634 L552,608 Q552,594 566,594 L728,594 Q742,594 742,608 L742,634 Z" fill="#f1f6ec"/>
    <text x="647" y="612" class="tiny" text-anchor="middle">&lt;&lt;new tx&gt;&gt;</text>
    <text x="647" y="631" class="cardTitle" text-anchor="middle">top-level tx</text>
    <text x="570" y="655" class="detail" text-anchor="start">new connection</text>
  </g>

  <g data-card="maxAttempts" data-x="790" data-y="594" data-width="190" data-height="78">
    <rect x="790" y="594" width="190" height="78" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M790,634 L790,608 Q790,594 804,594 L966,594 Q980,594 980,608 L980,634 Z" fill="#f5eee4"/>
    <text x="885" y="612" class="tiny" text-anchor="middle">&lt;&lt;retry&gt;&gt;</text>
    <text x="885" y="631" class="cardTitle" text-anchor="middle">maxAttempts</text>
    <text x="808" y="655" class="detail" text-anchor="start">5 / 20 in tests</text>
  </g>

  <g data-card="awaitAll verify" data-x="1028" data-y="594" data-width="190" data-height="78">
    <rect x="1028" y="594" width="190" height="78" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1028,634 L1028,608 Q1028,594 1042,594 L1204,594 Q1218,594 1218,608 L1218,634 Z" fill="#f5eef2"/>
    <text x="1123" y="612" class="tiny" text-anchor="middle">&lt;&lt;join&gt;&gt;</text>
    <text x="1123" y="631" class="cardTitle" text-anchor="middle">awaitAll</text>
    <text x="1046" y="655" class="detail" text-anchor="start">ordered verify</text>
  </g>

  <path class="connector" data-connector="parallel-scope" d="M 266 633 L 314 633" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="parallel-async" d="M 504 633 L 552 633" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="parallel-top-level" d="M 742 633 L 790 633" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="parallel-join" d="M 980 633 L 1028 633" stroke="#5f8848" marker-end="url(#arrow-green)"/>

  <rect x="76" y="725" width="930" height="34" rx="10" class="noteBox"/>
  <text x="541" y="747" class="note" text-anchor="middle">Rule: suspendTransaction stays in the current coroutine context; inTopLevelSuspendTransaction opens independent transactions.</text>
  <rect x="1034" y="718" width="184" height="46" rx="10" class="legendBox"/>
  <path d="M1054 733 L1098 733" class="connector" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <text x="1110" y="737" class="tiny" text-anchor="start">context reuse</text>
  <path d="M1054 750 L1098 750" class="connector" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <text x="1110" y="754" class="tiny" text-anchor="start">independent tx</text>
</svg>
