<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-label="Coroutine Scope Management">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#5D6B7A"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}
    .line{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .plain{stroke:#758297;stroke-width:2.0;fill:none}.dash{stroke:#758297;stroke-width:2.0;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1120" height="760"/>
<rect class="frame" x="32" y="28" width="1056" height="704" rx="28"/>
<text class="title" x="66" y="82">Coroutine Scope Management</text>
<text class="subtitle" x="70" y="118">R2DBC test transaction scope, nested suspend work, and cleanup boundaries</text>
<g transform="translate(420,160)">
  <rect class="card" x="0" y="0" width="280" height="82" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="48" text-anchor="middle">runTest / runSuspendIO</text>
</g><g transform="translate(380,280)">
  <rect class="card" x="0" y="0" width="360" height="98" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="180" y="43.5" text-anchor="middle">withTables(testDB, table)</text>
<text class="smallLabel" x="180" y="68.5" text-anchor="middle">create table + transaction context</text>
</g><g transform="translate(92,430)">
  <rect class="card" x="0" y="0" width="290" height="106" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="145" y="35" text-anchor="middle">suspendTransaction { }</text>
<text class="smallLabel" x="145" y="60" text-anchor="middle">reuse current context</text>
<text class="smallLabel" x="145" y="85" text-anchor="middle">R2DBC async SQL</text>
</g><g transform="translate(415,430)">
  <rect class="card" x="0" y="0" width="290" height="106" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="145" y="35" text-anchor="middle">CoroutineScope(IO)</text>
<text class="smallLabel" x="145" y="60" text-anchor="middle">async { top-level tx }</text>
<text class="smallLabel" x="145" y="85" text-anchor="middle">new connection</text>
</g><g transform="translate(738,430)">
  <rect class="card" x="0" y="0" width="290" height="106" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="145" y="35" text-anchor="middle">awaitAll(...)</text>
<text class="smallLabel" x="145" y="60" text-anchor="middle">wait for async work</text>
<text class="smallLabel" x="145" y="85" text-anchor="middle">before cleanup</text>
</g><g transform="translate(420,610)">
  <rect class="card" x="0" y="0" width="280" height="82" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="35.5" text-anchor="middle">DROP tables</text>
<text class="smallLabel" x="140" y="60.5" text-anchor="middle">auto cleanup</text>
</g><path class="line" d="M560 242 L560 280"/><path class="line" d="M470 378 L236 430"/><path class="line" d="M560 378 L560 430"/><path class="line" d="M650 378 L884 430"/><path class="line" d="M884 536 L560 610"/><path class="line" d="M560 536 L560 610"/><path class="line" d="M236 536 L560 610"/></svg>
