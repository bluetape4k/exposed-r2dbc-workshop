<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-label="Cache Decorator Layering">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#5D6B7A"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}
    .line{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .plain{stroke:#758297;stroke-width:2.0;fill:none}.dash{stroke:#758297;stroke-width:2.0;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1120" height="610"/>
<rect class="frame" x="32" y="28" width="1056" height="554" rx="28"/>
<text class="title" x="66" y="82">Cache Decorator Layering</text>
<text class="subtitle" x="70" y="118">Repository decorator applies Redis cache without changing the default R2DBC repository</text>
<g transform="translate(82,255)">
  <rect class="card" x="0" y="0" width="230" height="92" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="115" y="40.5" text-anchor="middle">Controller</text>
<text class="smallLabel" x="115" y="65.5" text-anchor="middle">suspend handler</text>
</g><g transform="translate(390,220)">
  <rect class="card" x="0" y="0" width="300" height="124" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="150" y="44" text-anchor="middle">CachedCountryRepository</text>
<text class="smallLabel" x="150" y="69" text-anchor="middle">cache-aside decorator</text>
<text class="smallLabel" x="150" y="94" text-anchor="middle">wraps default repository</text>
</g><g transform="translate(790,170)">
  <rect class="card" x="0" y="0" width="240" height="96" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="120" y="42.5" text-anchor="middle">Redis Cache</text>
<text class="smallLabel" x="120" y="67.5" text-anchor="middle">GET / SETEX / DEL</text>
</g><g transform="translate(790,368)">
  <rect class="card" x="0" y="0" width="240" height="96" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="120" y="42.5" text-anchor="middle">R2DBC Database</text>
<text class="smallLabel" x="120" y="67.5" text-anchor="middle">source of truth</text>
</g><g transform="translate(410,420)">
  <rect class="card" x="0" y="0" width="260" height="92" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="40.5" text-anchor="middle">DefaultCountryRepository</text>
<text class="smallLabel" x="130" y="65.5" text-anchor="middle">Exposed R2DBC</text>
</g><path class="line" d="M312 301 L390 282"/>
<text class="small" x="351" y="283.5" text-anchor="middle">request</text><path class="line" d="M690 262 L790 218"/>
<text class="small" x="740" y="232" text-anchor="middle">cache hit</text><path class="line" d="M540 344 L540 420"/>
<text class="small" x="540" y="374" text-anchor="middle">cache miss</text><path class="line" d="M670 466 L790 416"/>
<text class="small" x="730" y="433" text-anchor="middle">SQL</text><path class="line" d="M540 420 L540 344"/>
<text class="small" x="540" y="374" text-anchor="middle">result</text><path class="line" d="M790 218 L690 262"/>
<text class="small" x="740" y="232" text-anchor="middle">cached result</text></svg>
