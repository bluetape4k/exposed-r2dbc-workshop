<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1500" viewBox="0 0 1840 1500" role="img" aria-label="R2DBC Caffeine adapter request and lifecycle sequence">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#25384d" flood-opacity="0.10"/></filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f83b8" stroke="#3f83b8" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a36f3e" stroke="#a36f3e" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}.title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:44px;fill:#192538;font-weight:400}.subtitle,.foot{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:17px;font-weight:700;fill:#556678}.participantTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#192538;font-weight:400}.participantRole,.role{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#556678}.labelText{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:700;fill:#40566e}.num{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:700}.altTitle{font-family:"Comic Sans MS","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:700;fill:#6f7d89}.card{stroke-width:2.4;filter:url(#softShadow)}.lifeline{stroke:#9fb1c2;stroke-width:2.1;stroke-dasharray:8 10}.activation{fill:#f9fffb;stroke:#7ca985;stroke-width:2.2}.connector{fill:none;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round}.blue{stroke:#3f83b8;marker-end:url(#arrowBlue)}.green{stroke:#6f8f52;marker-end:url(#arrowGreen)}.amber{stroke:#a36f3e;marker-end:url(#arrowAmber)}.teal{stroke:#4f8f8b;marker-end:url(#arrowTeal)}.return{stroke-dasharray:10 8}.label{fill:#fffefa;stroke-width:2}.labelBlue{stroke:#abd0e9}.labelGreen{stroke:#b9d5aa}.labelAmber{stroke:#d7b37e}.labelTeal{stroke:#a7d0cc}.pillBlue{fill:#f9fcff;stroke:#74afd7}.pillGreen{fill:#fbfff7;stroke:#91b576}.pillAmber{fill:#fff9ee;stroke:#bd8b50}.pillTeal{fill:#f7fffe;stroke:#79b8b3}.altFrame{fill:none;stroke:#86a2b4;stroke-width:3.2;stroke-dasharray:11 10}.altSplit{stroke:#a9bbc9;stroke-width:2;stroke-dasharray:8 8}
    </style>
  </defs>
  <rect class="canvas" width="1840" height="1500"/><rect class="frame" x="32" y="32" width="1776" height="1436" rx="24"/>
  <text class="title" x="82" y="96">R2DBC Caffeine Adapter Request / Lifecycle Sequence</text><text class="subtitle" x="86" y="132">A cache hit returns before H2; a miss reads the table, publishes the record, and the write-behind branch flushes in bounded batches.</text>

  <g id="participants">
    <rect class="card" x="60" y="180" width="140" height="88" rx="13" fill="#ffffff" stroke="#5d7486"/><text class="participantTitle participant" x="130" y="220" text-anchor="middle">HTTP Client</text><text class="participantRole role" x="130" y="246" text-anchor="middle">GET / PUT</text><line class="lifeline" x1="130" y1="306" x2="130" y2="1418"/>
    <rect class="card" x="270" y="180" width="160" height="88" rx="13" fill="#f7fcff" stroke="#5d7486"/><text class="participantTitle participant" x="350" y="220" text-anchor="middle">Routes</text><text class="participantRole role" x="350" y="246" text-anchor="middle">Ktor endpoints</text><line class="lifeline" x1="350" y1="306" x2="350" y2="1418"/>
    <rect class="card" x="490" y="180" width="160" height="88" rx="13" fill="#f8fcf7" stroke="#5d7486"/><text class="participantTitle participant" x="570" y="220" text-anchor="middle">Service</text><text class="participantRole role" x="570" y="246" text-anchor="middle">cache + version</text><line class="lifeline" x1="570" y1="306" x2="570" y2="1418"/>
    <rect class="card" x="700" y="180" width="180" height="88" rx="13" fill="#fff9ef" stroke="#5d7486"/><text class="participantTitle participant" x="790" y="220" text-anchor="middle">Repository</text><text class="participantRole role" x="790" y="246" text-anchor="middle">provider adapter</text><line class="lifeline" x1="790" y1="306" x2="790" y2="1418"/>
    <rect class="card" x="920" y="180" width="180" height="88" rx="13" fill="#f8fff2" stroke="#5d7486"/><text class="participantTitle participant" x="1010" y="220" text-anchor="middle">AsyncCache</text><text class="participantRole role" x="1010" y="246" text-anchor="middle">Caffeine</text><line class="lifeline" x1="1010" y1="306" x2="1010" y2="1418"/>
    <rect class="card" x="1140" y="180" width="180" height="88" rx="13" fill="#fff7f7" stroke="#5d7486"/><text class="participantTitle participant" x="1230" y="220" text-anchor="middle">H2 R2DBC DB</text><text class="participantRole role" x="1230" y="246" text-anchor="middle">ProductTable</text><line class="lifeline" x1="1230" y1="306" x2="1230" y2="1418"/>
    <rect class="card" x="1360" y="180" width="180" height="88" rx="13" fill="#fff7f7" stroke="#5d7486"/><text class="participantTitle participant" x="1450" y="220" text-anchor="middle">Cache Health</text><text class="participantRole role" x="1450" y="246" text-anchor="middle">health response</text><line class="lifeline" x1="1450" y1="306" x2="1450" y2="1418"/>
    <rect class="card" x="1580" y="180" width="180" height="88" rx="13" fill="#f7fffe" stroke="#5d7486"/><text class="participantTitle participant" x="1670" y="220" text-anchor="middle">Resources</text><text class="participantRole role" x="1670" y="246" text-anchor="middle">close owner</text><line class="lifeline" x1="1670" y1="306" x2="1670" y2="1418"/>
  </g>
  <g id="activations"><rect class="activation" x="124" y="335" width="12" height="1080" rx="5"/><rect class="activation" x="344" y="380" width="12" height="1040" rx="5"/><rect class="activation" x="564" y="425" width="12" height="980" rx="5"/><rect class="activation" x="784" y="735" width="12" height="480" rx="5"/><rect class="activation" x="1004" y="515" width="12" height="440" rx="5"/><rect class="activation" x="1224" y="785" width="12" height="385" rx="5"/><rect class="activation" x="1444" y="1285" width="12" height="70" rx="5"/><rect class="activation" x="1664" y="1385" width="12" height="35" rx="5"/></g>

  <g id="messages">
    <path class="connector blue" d="M136 350 L344 350" data-connector="request"/><rect class="label labelBlue" x="150" y="312" width="178" height="30" rx="15"/><circle class="pillBlue" cx="174" cy="327" r="14" stroke-width="2"/><text class="num" x="174" y="332" text-anchor="middle" fill="#3f83b8">1</text><text class="labelText" x="245" y="332" text-anchor="middle">GET /products/{sku}</text>
    <path class="connector blue" d="M356 400 L564 400" data-connector="route-get"/><rect class="label labelBlue" x="372" y="362" width="166" height="30" rx="15"/><circle class="pillBlue" cx="396" cy="377" r="14" stroke-width="2"/><text class="num" x="396" y="382" text-anchor="middle" fill="#3f83b8">2</text><text class="labelText" x="465" y="382" text-anchor="middle">service.get(sku)</text>
    <path class="connector green" d="M576 470 L1004 470" data-connector="cache-probe"/><rect class="label labelGreen" x="700" y="432" width="208" height="30" rx="15"/><circle class="pillGreen" cx="724" cy="447" r="14" stroke-width="2"/><text class="num" x="724" y="452" text-anchor="middle" fill="#6f8f52">3</text><text class="labelText" x="816" y="452" text-anchor="middle">probe cache key</text>
  </g>

  <g id="alt-cache-hit-miss"><rect class="altFrame alt" x="82" y="520" width="1676" height="430" rx="20"/><text class="altTitle" x="116" y="550">alt cache result</text><line class="altSplit branchDivider" x1="104" y1="700" x2="1736" y2="700"/><rect class="label labelGreen" x="160" y="570" width="130" height="28" rx="14"/><text class="labelText" x="225" y="589" text-anchor="middle">cache HIT</text><rect class="label labelAmber" x="160" y="720" width="130" height="28" rx="14"/><text class="labelText" x="225" y="739" text-anchor="middle">cache MISS</text>
    <path class="connector return" stroke="#8b6fb3" d="M1004 620 L576 620" marker-end="url(#arrowGreen)" data-connector="cache-hit"/><rect class="label labelGreen" x="690" y="582" width="198" height="30" rx="15"/><circle class="pillGreen" cx="714" cy="597" r="14" stroke-width="2"/><text class="num" x="714" y="602" text-anchor="middle" fill="#6f8f52">4</text><text class="labelText" x="800" y="602" text-anchor="middle">cached ProductRecord</text>
    <path class="connector" stroke="#c16b45" d="M576 770 L784 770" marker-end="url(#arrowAmber)" data-connector="provider-get"/><rect class="label labelAmber" x="580" y="732" width="192" height="30" rx="15"/><circle class="pillAmber" cx="604" cy="747" r="14" stroke-width="2"/><text class="num" x="604" y="752" text-anchor="middle" fill="#a36f3e">5</text><text class="labelText" x="687" y="752" text-anchor="middle">repository.get(sku)</text>
    <path class="connector" stroke="#c16b45" d="M796 815 L1224 815" marker-end="url(#arrowAmber)" data-connector="db-select"/><rect class="label labelAmber" x="884" y="777" width="210" height="30" rx="15"/><circle class="pillAmber" cx="908" cy="792" r="14" stroke-width="2"/><text class="num" x="908" y="797" text-anchor="middle" fill="#a36f3e">6</text><text class="labelText" x="1000" y="797" text-anchor="middle">SELECT ProductTable</text>
    <path class="connector return" stroke="#d17b51" d="M1224 860 L796 860" marker-end="url(#arrowTeal)" data-connector="db-record"/><rect class="label labelTeal" x="884" y="822" width="238" height="30" rx="15"/><circle class="pillTeal" cx="908" cy="837" r="14" stroke-width="2"/><text class="num" x="908" y="842" text-anchor="middle" fill="#4f8f8b">7</text><text class="labelText" x="1018" y="842" text-anchor="middle">ResultRow → ProductRecord</text>
    <path class="connector" stroke="#8b6fb3" d="M796 905 L1004 905" marker-end="url(#arrowGreen)" data-connector="cache-store"/><rect class="label labelGreen" x="804" y="867" width="190" height="30" rx="15"/><circle class="pillGreen" cx="828" cy="882" r="14" stroke-width="2"/><text class="num" x="828" y="887" text-anchor="middle" fill="#6f8f52">8</text><text class="labelText" x="910" y="887" text-anchor="middle">publish cache entry</text>
  </g>

  <g id="get-response"><path class="connector teal return" d="M564 1000 L356 1000" data-connector="get-response"/><rect class="label labelTeal" x="378" y="962" width="162" height="30" rx="15"/><circle class="pillTeal" cx="402" cy="977" r="14" stroke-width="2"/><text class="num" x="402" y="982" text-anchor="middle" fill="#4f8f8b">9</text><text class="labelText" x="470" y="982" text-anchor="middle">ProductReadResponse</text>
    <path class="connector teal return" d="M344 1045 L136 1045" data-connector="http-response"/><rect class="label labelTeal" x="145" y="1007" width="205" height="30" rx="15"/><circle class="pillTeal" cx="169" cy="1022" r="14" stroke-width="2"/><text class="num" x="169" y="1027" text-anchor="middle" fill="#4f8f8b">10</text><text class="labelText" x="270" y="1027" text-anchor="middle">HTTP 200 + HIT/MISS</text></g>

  <g id="put-flow"><path class="connector blue" d="M136 1100 L344 1100" data-connector="put-request"/><rect class="label labelBlue" x="152" y="1062" width="174" height="30" rx="15"/><circle class="pillBlue" cx="176" cy="1077" r="14" stroke-width="2"/><text class="num" x="176" y="1082" text-anchor="middle" fill="#3f83b8">11</text><text class="labelText" x="247" y="1082" text-anchor="middle">PUT name payload</text>
    <path class="connector blue" d="M356 1145 L564 1145" data-connector="update-call"/><rect class="label labelBlue" x="374" y="1107" width="164" height="30" rx="15"/><circle class="pillBlue" cx="398" cy="1122" r="14" stroke-width="2"/><text class="num" x="398" y="1127" text-anchor="middle" fill="#3f83b8">12</text><text class="labelText" x="468" y="1127" text-anchor="middle">service.update()</text>
    <path class="connector amber" d="M576 1190 L784 1190" data-connector="put-admission"/><rect class="label labelAmber" x="582" y="1152" width="192" height="30" rx="15"/><circle class="pillAmber" cx="606" cy="1167" r="14" stroke-width="2"/><text class="num" x="606" y="1172" text-anchor="middle" fill="#a36f3e">13</text><text class="labelText" x="690" y="1172" text-anchor="middle">WRITE_BEHIND admit</text>
    <path class="connector green" d="M796 1240 L1004 1240" data-connector="publish"/><rect class="label labelGreen" x="804" y="1202" width="190" height="30" rx="15"/><circle class="pillGreen" cx="828" cy="1217" r="14" stroke-width="2"/><text class="num" x="828" y="1222" text-anchor="middle" fill="#6f8f52">14</text><text class="labelText" x="910" y="1222" text-anchor="middle">publish new version</text>
    <path class="connector amber" d="M796 1285 L1224 1285" data-connector="flush"/><rect class="label labelAmber" x="890" y="1247" width="204" height="30" rx="15"/><circle class="pillAmber" cx="914" cy="1262" r="14" stroke-width="2"/><text class="num" x="914" y="1267" text-anchor="middle" fill="#a36f3e">15</text><text class="labelText" x="1000" y="1267" text-anchor="middle">bounded batch flush</text>
  </g>

  <g id="health-and-shutdown"><path class="connector blue" d="M356 1320 L1444 1320" data-connector="health-read"/><rect class="label labelBlue" x="820" y="1282" width="194" height="30" rx="15"/><circle class="pillBlue" cx="844" cy="1297" r="14" stroke-width="2"/><text class="num" x="844" y="1302" text-anchor="middle" fill="#3f83b8">16</text><text class="labelText" x="918" y="1302" text-anchor="middle">GET /cache/health</text>
    <path class="connector teal return" d="M1444 1365 L356 1365" data-connector="health-report"/><rect class="label labelTeal" x="872" y="1327" width="210" height="30" rx="15"/><circle class="pillTeal" cx="896" cy="1342" r="14" stroke-width="2"/><text class="num" x="896" y="1347" text-anchor="middle" fill="#4f8f8b">17</text><text class="labelText" x="992" y="1347" text-anchor="middle">CacheHealthResponse</text>
    <path class="connector teal" d="M1664 1405 L796 1405" data-connector="shutdown"/><rect class="label labelTeal" x="1080" y="1367" width="196" height="30" rx="15"/><circle class="pillTeal" cx="1104" cy="1382" r="14" stroke-width="2"/><text class="num" x="1104" y="1387" text-anchor="middle" fill="#4f8f8b">18</text><text class="labelText" x="1190" y="1387" text-anchor="middle">close + drain queue</text></g>

  <rect x="96" y="1435" width="1648" height="28" rx="12" fill="#fbfdff" stroke="#d7e3ed" stroke-width="2"/><text class="foot" x="920" y="1455" text-anchor="middle">WRITE_BEHIND publishes the cache immediately; shutdown drains admitted work before the R2DBC pool is disposed.</text>
</svg>
