<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">체크포인트 가능한 Exposed R2DBC 배치 책임 경계</title>
  <desc id="desc">호출자가 소유한 R2dbcDatabase에 Exposed R2DBC reader, processor, writer와 provider 체크포인트 메타데이터를 조합한다.</desc>
  <defs>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.6}.lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      text{font-family:"goorm Sans Code","Noto Sans KR",monospace;fill:#536476;font-weight:700}.title{font-family:"goorm Sans","Noto Sans KR",sans-serif;font-size:38px;fill:#1e293b;font-weight:500}.subtitle{font-size:15px;fill:#536476}.laneTitle{font-family:"goorm Sans","Noto Sans KR",sans-serif;font-size:17px;letter-spacing:.06em;fill:#91a6b7}.cardTitle{font-family:"goorm Sans","Noto Sans KR",sans-serif;font-size:22px;fill:#1e293b;font-weight:500}.compact{font-size:18px}.detail{font-size:14px}.tiny{font-size:12px;fill:#64748b}.connector{fill:none;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}.noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
    <marker id="arrow-request" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0,0 L14,7 L0,14 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-flow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0,0 L14,7 L0,14 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-transaction" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0,0 L14,7 L0,14 Z" fill="#a66a3f" stroke="#a66a3f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect width="1800" height="1100" class="canvas"/><rect x="30" y="30" width="1740" height="1040" rx="22" class="frame"/>
  <text x="78" y="88" class="title">체크포인트 가능한 Exposed R2DBC 배치 책임 경계</text>
  <text x="78" y="120" class="subtitle">호출자가 소유한 R2dbcDatabase를 provider DSL에 조합하고 keyset 진행과 typed checkpoint 메타데이터를 드러낸다.</text>
  <rect x="64" y="160" width="1672" height="350" rx="18" class="lane"/><text x="90" y="194" class="laneTitle">코루틴 배치 파이프라인</text>
  <rect x="64" y="560" width="1672" height="390" rx="18" class="lane"/><text x="90" y="594" class="laneTitle">호출자 소유 R2DBC 인프라와 영속 상태</text>

  <g data-card="caller"><rect x="90" y="240" width="250" height="120" rx="12" fill="#fff" stroke="#4f86c6" stroke-width="2.4"/><path d="M90 280 L90 252 Q90 240 102 240 L328 240 Q340 240 340 252 L340 280 Z" fill="#eef5fa"/><text x="215" y="262" class="tiny" text-anchor="middle">&lt;&lt;진입점&gt;&gt;</text><text x="215" y="286" class="cardTitle" text-anchor="middle">호출자 코루틴</text><text x="110" y="320" class="detail">database lifecycle 소유</text><text x="110" y="342" class="detail">시작 / 취소 / 재시작</text></g>
  <g data-card="job"><rect x="400" y="240" width="300" height="120" rx="12" fill="#fff" stroke="#a66a3f" stroke-width="2.4"/><path d="M400 280 L400 252 Q400 240 412 240 L688 240 Q700 240 700 252 L700 280 Z" fill="#f5eee4"/><text x="550" y="262" class="tiny" text-anchor="middle">&lt;&lt;provider DSL&gt;&gt;</text><text x="550" y="286" class="cardTitle compact" text-anchor="middle">checkpointableR2dbcBatchJob</text><text x="420" y="320" class="detail">chunk / retry / skip / timeout</text><text x="420" y="342" class="detail">suspendTransaction 경계</text></g>
  <g data-card="reader"><rect x="760" y="220" width="270" height="120" rx="12" fill="#fff" stroke="#4f8f8b" stroke-width="2.4"/><path d="M760 260 L760 232 Q760 220 772 220 L1018 220 Q1030 220 1030 232 L1030 260 Z" fill="#eef7f6"/><text x="895" y="242" class="tiny" text-anchor="middle">&lt;&lt;keyset&gt;&gt;</text><text x="895" y="266" class="cardTitle compact" text-anchor="middle">ExposedR2dbcBatchReader</text><text x="780" y="300" class="detail">Flow + 증가하는 Long key</text><text x="780" y="322" class="detail">commit 뒤에 진행</text></g>
  <g data-card="processor"><rect x="1090" y="220" width="260" height="120" rx="12" fill="#fff" stroke="#6f8f52" stroke-width="2.4"/><path d="M1090 260 L1090 232 Q1090 220 1102 220 L1338 220 Q1350 220 1350 232 L1350 260 Z" fill="#f1f6ec"/><text x="1220" y="242" class="tiny" text-anchor="middle">&lt;&lt;suspend&gt;&gt;</text><text x="1220" y="266" class="cardTitle" text-anchor="middle">Processor</text><text x="1110" y="300" class="detail">immutable source → target</text><text x="1110" y="322" class="detail">오류는 skip policy로 전달</text></g>
  <g data-card="writer"><rect x="1410" y="220" width="300" height="120" rx="12" fill="#fff" stroke="#4f8f8b" stroke-width="2.4"/><path d="M1410 260 L1410 232 Q1410 220 1422 220 L1698 220 Q1710 220 1710 232 L1710 260 Z" fill="#eef7f6"/><text x="1560" y="242" class="tiny" text-anchor="middle">&lt;&lt;provider&gt;&gt;</text><text x="1560" y="266" class="cardTitle compact" text-anchor="middle">ExposedR2dbcBatchWriter</text><text x="1430" y="300" class="detail">BatchInsertStatement</text><text x="1430" y="322" class="detail">target sourceId는 primary key</text></g>

  <g data-card="database"><rect x="90" y="680" width="300" height="120" rx="12" fill="#fff" stroke="#4f8f8b" stroke-width="2.4"/><path d="M90 720 L90 692 Q90 680 102 680 L378 680 Q390 680 390 692 L390 720 Z" fill="#eef7f6"/><text x="240" y="702" class="tiny" text-anchor="middle">&lt;&lt;호출자 소유&gt;&gt;</text><text x="240" y="726" class="cardTitle" text-anchor="middle">R2dbcDatabase</text><text x="110" y="760" class="detail">모든 step이 같은 instance 사용</text><text x="110" y="782" class="detail">helper가 아닌 호출자가 close</text></g>
  <g data-card="pool"><rect x="460" y="680" width="300" height="120" rx="12" fill="#fff" stroke="#4f8f8b" stroke-width="2.4"/><path d="M460 720 L460 692 Q460 680 472 680 L748 680 Q760 680 760 692 L760 720 Z" fill="#eef7f6"/><text x="610" y="702" class="tiny" text-anchor="middle">&lt;&lt;runtime&gt;&gt;</text><text x="610" y="726" class="cardTitle compact" text-anchor="middle">H2 R2DBC pool / driver</text><text x="480" y="760" class="detail">r2dbc:h2:mem 테스트 backend</text><text x="480" y="782" class="detail">Flow connection 경계</text></g>
  <g data-card="metadata"><rect x="830" y="630" width="260" height="120" rx="12" fill="#fff" stroke="#a66a3f" stroke-width="2.4"/><path d="M830 670 L830 642 Q830 630 842 630 L1078 630 Q1090 630 1090 642 L1090 670 Z" fill="#f5eee4"/><text x="960" y="652" class="tiny" text-anchor="middle">&lt;&lt;영속 상태&gt;&gt;</text><text x="960" y="676" class="cardTitle compact" text-anchor="middle">Provider metadata</text><text x="850" y="710" class="detail">job / step execution</text><text x="850" y="732" class="detail">typed checkpoint JSON</text></g>
  <g data-card="source-table"><rect x="1140" y="630" width="270" height="120" rx="12" fill="#fff" stroke="#6f8f52" stroke-width="2.4"/><path d="M1140 670 L1140 642 Q1140 630 1152 630 L1398 630 Q1410 630 1410 642 L1410 670 Z" fill="#f1f6ec"/><text x="1275" y="652" class="tiny" text-anchor="middle">&lt;&lt;source&gt;&gt;</text><text x="1275" y="676" class="cardTitle" text-anchor="middle">r2dbc_batch_source</text><text x="1160" y="710" class="detail">id ↑ keyset, name, value</text><text x="1160" y="732" class="detail">Flow로 읽기</text></g>
  <g data-card="target-table"><rect x="1460" y="630" width="270" height="120" rx="12" fill="#fff" stroke="#6f8f52" stroke-width="2.4"/><path d="M1460 670 L1460 642 Q1460 630 1472 630 L1718 630 Q1730 630 1730 642 L1730 670 Z" fill="#f1f6ec"/><text x="1595" y="652" class="tiny" text-anchor="middle">&lt;&lt;target&gt;&gt;</text><text x="1595" y="676" class="cardTitle" text-anchor="middle">r2dbc_batch_target</text><text x="1480" y="710" class="detail">sourceId primary key</text><text x="1480" y="732" class="detail">재시작 중복이 보임</text></g>

  <path data-connector="caller-job" data-source="caller" data-target="job" class="connector" d="M340 300 H388" stroke="#4f86c6" marker-end="url(#arrow-request)"/>
  <path data-connector="job-reader" data-source="job" data-target="reader" class="connector" d="M700 300 H760" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>
  <path data-connector="reader-processor" data-source="reader" data-target="processor" class="connector" d="M1030 280 H1090" stroke="#4f8f8b" marker-end="url(#arrow-flow)"/>
  <path data-connector="processor-writer" data-source="processor" data-target="writer" class="connector" d="M1350 280 H1410" stroke="#4f8f8b" marker-end="url(#arrow-flow)"/>
  <path data-connector="database-pool" data-source="database" data-target="pool" class="connector" d="M390 740 H460" stroke="#4f8f8b" marker-end="url(#arrow-flow)"/>
  <path data-connector="pool-metadata" data-source="pool" data-target="metadata" class="connector" d="M760 690 H830" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>
  <path data-connector="pool-source" data-source="pool" data-target="source-table" class="connector" d="M760 760 H1080 Q1100 760 1100 720 Q1100 700 1120 700 H1140" stroke="#4f8f8b" marker-end="url(#arrow-flow)"/>
  <path data-connector="pool-target" data-source="pool" data-target="target-table" class="connector" d="M760 792 H1340 Q1360 792 1360 760 Q1360 740 1380 740 H1460" stroke="#4f8f8b" marker-end="url(#arrow-flow)"/>
  <path data-connector="reader-source" data-source="reader" data-target="source-table" class="connector" d="M895 340 V540 Q895 560 915 560 H1270 Q1290 560 1290 580 V630" stroke="#4f8f8b" marker-end="url(#arrow-flow)"/>
  <path data-connector="writer-target" data-source="writer" data-target="target-table" class="connector" d="M1560 340 V560 Q1560 580 1580 580 Q1590 580 1590 600 V630" stroke="#4f8f8b" marker-end="url(#arrow-flow)"/>
  <path data-connector="job-metadata" data-source="job" data-target="metadata" class="connector" d="M550 360 V500 Q550 520 570 520 H830 Q850 520 850 540 V630" stroke="#a66a3f" marker-end="url(#arrow-transaction)"/>

  <rect x="90" y="1000" width="1620" height="44" rx="14" class="noteBox"/><text x="900" y="1028" class="detail" text-anchor="middle">범례: 파랑=호출자 실행, 황갈색=provider transaction/checkpoint, 청록=R2DBC 데이터 흐름과 소유권.</text>
</svg>
