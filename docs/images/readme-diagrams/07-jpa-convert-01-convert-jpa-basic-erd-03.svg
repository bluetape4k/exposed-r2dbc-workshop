<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-label="Blog domain ERD for JPA to Exposed R2DBC conversion">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:2}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.7}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:43px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:18px;fill:#536476;font-weight:700}
      .small{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#64748b;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:27px;fill:#1e293b}
      .table{filter:url(#softShadow)}
      .header{opacity:.96}
      .rel{fill:none;stroke:#64748b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .one{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#334155;font-weight:800}
      .many{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#334155;font-weight:800}
      .labelPill{fill:#fff;stroke:#d7e2ec;stroke-width:1.4}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.6}
    </style>
  </defs>

  <rect width="1600" height="1040" class="canvas"/>
  <rect x="28" y="28" width="1544" height="984" rx="22" class="frame"/>

  <text x="72" y="86" class="title">Blog Domain ERD</text>
  <text x="72" y="121" class="subtitle">Exposed R2DBC schema from BlogSchema.kt: shared PK 1:1, indexed 1:N comments, and N:M tags through post_tags.</text>

  <rect x="60" y="150" width="1480" height="720" rx="18" class="lane"/>
  <text x="88" y="188" class="laneTitle">RELATIONAL MODEL</text>

  <rect x="60" y="904" width="1480" height="74" rx="18" class="lane"/>
  <text x="88" y="949" class="note">Endpoint labels show table cardinality; FK labels name the owning column and cascade/index rule from the source schema.</text>

  <g data-card="posts" data-x="120" data-y="392" data-width="290" data-height="178">
    <rect x="120" y="392" width="290" height="178" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.4" class="table card"/>
    <path class="header" d="M120,440 L120,406 Q120,392 134,392 L396,392 Q410,392 410,406 L410,440 Z" fill="#eef5fa"/>
    <text x="265" y="423" class="cardTitle" text-anchor="middle">posts</text>
    <text x="146" y="466" class="small">PK id BIGSERIAL</text>
    <text x="146" y="494" class="small">title varchar(255)</text>
    <text x="146" y="536" class="tiny">PostTable : LongIdTable</text>
  </g>

  <g data-card="post_details" data-x="570" data-y="220" data-width="320" data-height="168">
    <rect x="570" y="220" width="320" height="168" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="table card"/>
    <path class="header" d="M570,268 L570,234 Q570,220 584,220 L876,220 Q890,220 890,234 L890,268 Z" fill="#eef6e9"/>
    <text x="730" y="251" class="cardTitle" text-anchor="middle">post_details</text>
    <text x="596" y="294" class="small">PK/FK id -> posts.id</text>
    <text x="596" y="322" class="small">created_on date</text>
    <text x="596" y="350" class="small">created_by varchar(255)</text>
  </g>

  <g data-card="post_comments" data-x="570" data-y="610" data-width="320" data-height="168">
    <rect x="570" y="610" width="320" height="168" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="table card"/>
    <path class="header" d="M570,658 L570,624 Q570,610 584,610 L876,610 Q890,610 890,624 L890,658 Z" fill="#f5eee4"/>
    <text x="730" y="641" class="cardTitle" text-anchor="middle">post_comments</text>
    <text x="596" y="684" class="small">PK id BIGSERIAL</text>
    <text x="596" y="712" class="small">FK post_id index</text>
    <text x="596" y="740" class="small">review varchar(255)</text>
  </g>

  <g data-card="post_tags" data-x="955" data-y="392" data-width="300" data-height="178">
    <rect x="955" y="392" width="300" height="178" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="table card"/>
    <path class="header" d="M955,440 L955,406 Q955,392 969,392 L1241,392 Q1255,392 1255,406 L1255,440 Z" fill="#eef7f6"/>
    <text x="1105" y="423" class="cardTitle" text-anchor="middle">post_tags</text>
    <text x="981" y="466" class="small">PK id BIGSERIAL</text>
    <text x="981" y="494" class="small">FK post_id cascade</text>
    <text x="981" y="522" class="small">FK tag_id cascade</text>
    <text x="981" y="550" class="small">unique(post_id, tag_id)</text>
  </g>

  <g data-card="tags" data-x="1300" data-y="392" data-width="230" data-height="178">
    <rect x="1300" y="392" width="230" height="178" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.4" class="table card"/>
    <path class="header" d="M1300,440 L1300,406 Q1300,392 1314,392 L1516,392 Q1530,392 1530,406 L1530,440 Z" fill="#f5eef2"/>
    <text x="1415" y="423" class="cardTitle" text-anchor="middle">tags</text>
    <text x="1326" y="466" class="small">PK id BIGSERIAL</text>
    <text x="1326" y="494" class="small">name varchar(255)</text>
    <text x="1326" y="536" class="tiny">TagTable : LongIdTable</text>
  </g>

  <path class="rel" data-connector="posts-to-detail" d="M 410 436 L 500 436 Q 516 436 516 420 L 516 318 Q 516 302 532 302 L 570 302" stroke="#6f8f52"/>
  <text x="424" y="429" class="one">1</text>
  <text x="552" y="295" class="one">1</text>
  <rect x="350" y="325" width="146" height="28" rx="9" class="labelPill"/>
  <text x="423" y="345" class="tiny" text-anchor="middle">shared PK/FK id</text>

  <path class="rel" data-connector="posts-to-comments" d="M 410 526 L 500 526 Q 516 526 516 542 L 516 694 Q 516 710 532 710 L 570 710" stroke="#a66a3f"/>
  <text x="424" y="548" class="one">1</text>
  <text x="552" y="703" class="many">N</text>
  <rect x="380" y="612" width="120" height="28" rx="9" class="labelPill"/>
  <text x="440" y="632" class="tiny" text-anchor="middle">post_id index</text>

  <path class="rel" data-connector="posts-to-post-tags" d="M 410 481 L 955 481" stroke="#4f8f8b"/>
  <text x="424" y="474" class="one">1</text>
  <text x="936" y="474" class="many">N</text>
  <rect x="612" y="446" width="146" height="28" rx="9" class="labelPill"/>
  <text x="685" y="466" class="tiny" text-anchor="middle">post_id cascade</text>

  <path class="rel" data-connector="tags-to-post-tags" d="M 1415 392 L 1415 354 Q 1415 338 1399 338 L 1121 338 Q 1105 338 1105 354 L 1105 392" stroke="#a85f7f"/>
  <text x="1428" y="386" class="one">1</text>
  <text x="1118" y="386" class="many">N</text>
  <rect x="1210" y="304" width="136" height="28" rx="9" class="labelPill"/>
  <text x="1278" y="324" class="tiny" text-anchor="middle">tag_id cascade</text>

  <g data-card="many-to-many-contract" data-x="500" data-y="816" data-width="820" data-height="36">
    <rect x="500" y="816" width="820" height="36" rx="12" class="noteBox"/>
    <text x="910" y="840" class="note" text-anchor="middle">DAO uses PostTagTable for Post.tags and Tag.posts; no implicit join table.</text>
  </g>
</svg>
