<svg xmlns="http://www.w3.org/2000/svg" width="924" height="848" viewBox="0 0 924 848" role="img" aria-label="JPA Entity vs Exposed Table Comparison">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>


  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none}
  </style>
</defs>
<rect class="canvas" width="924" height="848"/>
<rect class="frame" x="32" y="28" width="860" height="792" rx="28"/>
<text class="title" x="66" y="82">JPA Entity vs Exposed Table Co.</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<g transform="translate(514,170)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Exposed DAO»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ExposedEntity</text>
  <text class="mono" x="18" y="108">+EntityID~Long~ id</text>
<text class="mono" x="18" y="129">+String name</text>
<text class="mono" x="18" y="150">+String description</text>
</g>
<g transform="translate(70,170)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Exposed DSL»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ExposedTable</text>
  <text class="mono" x="18" y="108">+Column~Long~ id</text>
<text class="mono" x="18" y="129">+Column~String~ name</text>
<text class="mono" x="18" y="150">+Column~String~ description</text>
<text class="mono" x="18" y="171">+insert()</text>
<text class="mono" x="18" y="192">+selectAll()</text>
<text class="mono" x="18" y="213">+update()</text>
</g>
<g transform="translate(440,540)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«JPA Entity»</text>
  <text class="label" x="170" y="61" text-anchor="middle">JpaEntity</text>
  <text class="mono" x="18" y="108">+Long id</text>
<text class="mono" x="18" y="129">+String name</text>
<text class="mono" x="18" y="150">+String description</text>
<text class="mono" x="18" y="171">+persist()</text>
<text class="mono" x="18" y="192">+find()</text>
<text class="mono" x="18" y="213">+merge()</text>
</g>
</svg>
