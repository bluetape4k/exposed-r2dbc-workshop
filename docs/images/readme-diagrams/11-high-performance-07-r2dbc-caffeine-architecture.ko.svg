<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="Exposed R2DBC Caffeine 어댑터 아키텍처">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#25384d" flood-opacity="0.10"/></filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 7 L 0 14 Z" fill="#3f83b8" stroke="#3f83b8" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 7 L 0 14 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="12" refY="7" orient="auto" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 12 7 L 0 14 Z" fill="#a36f3e" stroke="#a36f3e" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="8" refY="5" orient="auto" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 8 5 L 0 10 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}.lane{fill:#f8fbfd;stroke:#dce8f2;stroke-width:2}
      .title{font-family:"Nanum Pen","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:42px;fill:#192538;font-weight:400}.subtitle,.foot{font-family:"Noto Sans KR","Apple SD Gothic Neo","Nanum Gothic",sans-serif;font-size:16px;font-weight:700;fill:#556678}.laneTitle{font-family:"Noto Sans KR","Apple SD Gothic Neo","Nanum Gothic",sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;fill:#91a5b7}.cardTitle{font-family:"Nanum Pen","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:23px;fill:#192538;font-weight:400}.mono{font-family:"Noto Sans KR","Apple SD Gothic Neo","Nanum Gothic",monospace;font-size:14px;font-weight:700;fill:#506176}.small{font-family:"Noto Sans KR","Apple SD Gothic Neo","Nanum Gothic",monospace;font-size:12px;font-weight:700;fill:#627287}.card{filter:url(#softShadow);stroke-width:2.4}.header{opacity:.96}.connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 8}.legendLine{stroke-width:3;stroke-linecap:round}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1000"/><rect class="frame" x="30" y="30" width="1540" height="940" rx="24"/>
  <text class="title" x="70" y="90">Exposed R2DBC Caffeine 어댑터</text>
  <text class="subtitle" x="74" y="124">Ktor 요청은 작은 서비스 경계를 통과하고, provider는 캐시 의미론을, R2dbcCaffeineResources는 DB와 종료 순서를 소유합니다.</text>

  <rect class="lane" x="60" y="155" width="1480" height="210" rx="18"/><text class="laneTitle" x="84" y="188">HTTP 계약</text>
  <g data-card="R2dbcCaffeineCacheApplication"><rect class="card" x="90" y="225" width="310" height="105" rx="15" fill="#f7fcff" stroke="#3f83b8"/><path class="header" d="M90 258 V241 Q90 225 106 225 H384 Q400 225 400 241 V258 Z" fill="#eef5fa"/><text class="cardTitle" x="245" y="250" text-anchor="middle">R2dbcCaffeineCacheApplication</text><text class="mono" x="112" y="284">시작 시 schema + seed</text><text class="mono" x="112" y="307">ApplicationStopped close</text></g>
  <g data-card="ProductCacheRoutes"><rect class="card" x="455" y="225" width="310" height="105" rx="15" fill="#ffffff" stroke="#5d7486"/><path class="header" d="M455 258 V241 Q455 225 471 225 H749 Q765 225 765 241 V258 Z" fill="#f4f8fb"/><text class="cardTitle" x="610" y="250" text-anchor="middle">ProductCacheRoutes</text><text class="mono" x="477" y="284">GET /products/{sku}</text><text class="mono" x="477" y="307">PUT + DELETE cache route</text></g>
  <g data-card="ProductCacheService"><rect class="card" x="820" y="225" width="310" height="105" rx="15" fill="#f8fcf7" stroke="#6f8f52"/><path class="header" d="M820 258 V241 Q820 225 836 225 H1114 Q1130 225 1130 241 V258 Z" fill="#eef6ea"/><text class="cardTitle" x="975" y="250" text-anchor="middle">ProductCacheService</text><text class="mono" x="842" y="284">캐시 상태 + version</text><text class="mono" x="842" y="307">입력/오류 경계</text></g>
  <g data-card="CacheHealthReport"><rect class="card" x="1195" y="225" width="310" height="105" rx="15" fill="#fff7f7" stroke="#a85f7f"/><path class="header" d="M1195 258 V241 Q1195 225 1211 225 H1489 Q1505 225 1505 241 V258 Z" fill="#f5eef2"/><text class="cardTitle" x="1350" y="250" text-anchor="middle">CacheHealthReport</text><text class="mono" x="1217" y="284">mode + workerState</text><text class="mono" x="1217" y="307">queueDepth + lastFlushError</text></g>
  <path class="connector blue" d="M400 290 H455" marker-end="url(#arrowBlue)" data-connector="application-routes" data-source="R2dbcCaffeineCacheApplication" data-target="ProductCacheRoutes"/><path class="connector blue" d="M765 290 H820" marker-end="url(#arrowBlue)" data-connector="routes-service" data-source="ProductCacheRoutes" data-target="ProductCacheService"/><path class="connector" d="M1130 290 H1195" stroke="#a85f7f" marker-end="url(#arrowTeal)" data-connector="service-health" data-source="ProductCacheService" data-target="CacheHealthReport"/>

  <rect class="lane" x="60" y="395" width="1480" height="245" rx="18"/><text class="laneTitle" x="84" y="428">PROVIDER 어댑터</text>
  <g data-card="R2dbcCaffeineResources"><rect class="card" x="90" y="470" width="310" height="125" rx="15" fill="#f7fffe" stroke="#4f8f8b"/><path class="header" d="M90 503 V486 Q90 470 106 470 H384 Q400 470 400 486 V503 Z" fill="#edf8f7"/><text class="cardTitle" x="245" y="495" text-anchor="middle">R2dbcCaffeineResources</text><text class="mono" x="112" y="532">pool + database 소유</text><text class="mono" x="112" y="555">repository lifecycle 소유</text><text class="mono" x="112" y="578">default database 복원</text></g>
  <g data-card="ProductCaffeineRepository"><rect class="card" x="470" y="470" width="360" height="125" rx="15" fill="#fff9ef" stroke="#a36f3e"/><path class="header" d="M470 503 V486 Q470 470 486 470 H814 Q830 470 830 486 V503 Z" fill="#f5eee4"/><text class="cardTitle" x="650" y="495" text-anchor="middle">ProductCaffeineRepository</text><text class="mono" x="492" y="532">AbstractR2dbcCaffeineRepository</text><text class="mono" x="492" y="555">suspendTransaction mapping</text><text class="mono" x="492" y="578">READ_ONLY / THROUGH / BEHIND</text></g>
  <g data-card="Caffeine AsyncCache"><rect class="card" x="920" y="470" width="300" height="125" rx="15" fill="#f8fcf7" stroke="#6f8f52"/><path class="header" d="M920 503 V486 Q920 470 936 470 H1204 Q1220 470 1220 486 V503 Z" fill="#eef6ea"/><text class="cardTitle" x="1070" y="495" text-anchor="middle">Caffeine AsyncCache</text><text class="mono" x="942" y="532">read-through loader</text><text class="mono" x="942" y="555">cache publication</text><text class="mono" x="942" y="578">key/all invalidation</text></g>
  <g data-card="ProductTable"><rect class="card" x="1290" y="470" width="215" height="125" rx="15" fill="#fff7f7" stroke="#a85f7f"/><path class="header" d="M1290 503 V486 Q1290 470 1306 470 H1489 Q1505 470 1505 486 V503 Z" fill="#f5eef2"/><text class="cardTitle" x="1397" y="495" text-anchor="middle">ProductTable</text><text class="mono" x="1310" y="532">sku varchar(40)</text><text class="mono" x="1310" y="555">name varchar(120)</text><text class="mono" x="1310" y="578">version integer</text></g>
  <path class="connector teal dashed" d="M400 548 H470" marker-end="url(#arrowTeal)" data-connector="resources-repository" data-source="R2dbcCaffeineResources" data-target="ProductCaffeineRepository"/><path class="connector green" d="M830 535 H920" marker-end="url(#arrowGreen)" data-connector="repository-cache" data-source="ProductCaffeineRepository" data-target="Caffeine AsyncCache"/><path class="connector amber" d="M830 575 H850 Q860 575 860 585 V615 Q860 625 870 625 H1245 Q1260 625 1260 610 V560 Q1260 545 1275 545 H1290" marker-end="url(#arrowAmber)" data-connector="repository-table" data-source="ProductCaffeineRepository" data-target="ProductTable"/>

  <rect class="lane" x="60" y="670" width="1480" height="175" rx="18"/><text class="laneTitle" x="84" y="703">DB 및 종료 소유권</text>
  <g data-card="R2dbcDatabase"><rect class="card" x="90" y="735" width="310" height="75" rx="14" fill="#fff9ef" stroke="#a36f3e"/><text class="cardTitle" x="245" y="765" text-anchor="middle">R2dbcDatabase</text><text class="small" x="245" y="790" text-anchor="middle">Dispatchers.IO + suspendTransaction</text></g>
  <g data-card="Bounded H2 ConnectionPool"><rect class="card" x="470" y="735" width="330" height="75" rx="14" fill="#fff9ef" stroke="#a36f3e"/><text class="cardTitle" x="635" y="765" text-anchor="middle">Bounded H2 ConnectionPool</text><text class="small" x="635" y="790" text-anchor="middle">max 4 · initial 2 · minIdle 0</text></g>
  <g data-card="ApplicationStopped close"><rect class="card" x="870" y="735" width="350" height="75" rx="14" fill="#f7fffe" stroke="#4f8f8b"/><text class="cardTitle" x="1045" y="765" text-anchor="middle">ApplicationStopped close</text><text class="small" x="1045" y="790" text-anchor="middle">repository → manager → pool</text></g>
  <g data-card="Provider failure boundary"><rect class="card" x="1290" y="735" width="215" height="75" rx="14" fill="#fff7f7" stroke="#a85f7f"/><text class="cardTitle" x="1397" y="765" text-anchor="middle">실패 경계</text><text class="small" x="1397" y="790" text-anchor="middle">retry / durability 미보장</text></g>
  <path class="connector amber" d="M1505 535 H1520 Q1530 535 1530 550 V685 Q1530 700 1515 700 H350 Q330 700 330 720 V735" marker-end="url(#arrowAmber)" data-connector="table-database" data-source="ProductTable" data-target="R2dbcDatabase"/><path class="connector amber" d="M400 772 H470" marker-end="url(#arrowAmber)" data-connector="database-pool" data-source="R2dbcDatabase" data-target="Bounded H2 ConnectionPool"/><path class="connector teal" d="M800 772 H870" marker-end="url(#arrowTeal)" data-connector="pool-shutdown" data-source="Bounded H2 ConnectionPool" data-target="ApplicationStopped close"/><path class="connector teal dashed" d="M245 595 V735" marker-end="url(#arrowTeal)" data-connector="resources-database" data-source="R2dbcCaffeineResources" data-target="R2dbcDatabase"/><path class="connector teal dashed" d="M330 330 V410 Q330 430 350 430 H1530 Q1540 430 1540 440 V700 Q1540 720 1520 720 H1220" marker-end="url(#arrowTeal)" data-connector="application-stopped" data-source="R2dbcCaffeineCacheApplication" data-target="ApplicationStopped close"/>
  <rect x="90" y="875" width="1415" height="38" rx="12" fill="#fbfdff" stroke="#d7e3ed" stroke-width="2"/><line x1="120" y1="894" x2="170" y2="894" class="legendLine" stroke="#3f83b8"/><text class="small" x="180" y="899">요청</text><line x1="285" y1="894" x2="335" y2="894" class="legendLine" stroke="#6f8f52"/><text class="small" x="345" y="899">캐시</text><line x1="440" y1="894" x2="490" y2="894" class="legendLine" stroke="#a36f3e"/><text class="small" x="500" y="899">DB</text><line x1="635" y1="894" x2="685" y2="894" class="legendLine" stroke="#4f8f8b" stroke-dasharray="9 8"/><text class="small" x="695" y="899">소유권 / lifecycle</text><text class="foot" x="800" y="947" text-anchor="middle">하나의 ProductRecord가 route·cache·DB 경계를 통과하고, resources가 종료 순서를 명시합니다.</text>
</svg>
