  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">KotlinLocalDateTimeColumn</text>
  <text class="mono" x="18" y="108">+datetime(name) Column~kotlinx.datetime.LocalDateT.</text>
</g>
<g transform="translate(502,672)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">KotlinLocalTimeColumn</text>
  <text class="mono" x="18" y="108">+time(name) Column~kotlinx.datetime.LocalTime~</text>
</g>
<g transform="translate(912,672)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">KotlinTimestampWithTimeZoneColumn</text>
