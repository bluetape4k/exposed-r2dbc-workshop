  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">KotlinDurationColumn</text>
  <text class="mono" x="18" y="108">+duration(name) Column~kotlin.time.Duration~</text>
</g>
