<g transform="translate(707,180)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«exposed-kotlin-dateti.»</text>
  <text class="label" x="170" y="57" text-anchor="middle">KotlinDateTimeColumn</text>

</g>
<g transform="translate(92,426)">
