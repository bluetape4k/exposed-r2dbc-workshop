<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" role="img" aria-label="Movie schema ERD">
<defs><style>.canvas{fill:#f6f9fc} .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5} .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2} text{font-family:"Comic Mono","SFMono-Regular",monospace;fill:#536476;font-weight:700} .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b;font-weight:400} .subtitle{font-size:14px} .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#91a6b7} .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#1e293b;font-weight:400} .detail{font-size:13px} .cardinality{font-size:15px;fill:#1e293b} .relLabel{font-size:11px;fill:#536476} .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round} .labelPill{fill:#fff;stroke:#d7e2ec;stroke-width:1.2} .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}</style></defs>
<rect width="1180" height="720" class="canvas"/><rect x="24" y="24" width="1132" height="672" rx="20" class="frame"/>
<text x="60" y="74" class="title" text-anchor="start">Movie / Actor Repository ERD</text>
<text x="60" y="102" class="subtitle" text-anchor="start">Source tables from MovieSchema: a composite bridge table links movies and actors with cascade references.</text>
<rect x="54" y="132" width="1072" height="430" rx="18" class="lane"/>
<text x="78" y="164" class="laneTitle" text-anchor="start">RELATIONAL MODEL</text>
<g data-card="movies" data-x="90" data-y="260" data-width="280" data-height="178">
<rect class="card" x="90" y="260" width="280" height="178" rx="12" fill="#fff" stroke="#4f86c6" stroke-width="2.2"/>
<path d="M90,308 L90,272 Q90,260 102,260 L358,260 Q370,260 370,272 L370,308 Z" fill="#eef5fa"/>
<text x="230.0" y="291" class="cardTitle" text-anchor="middle">movies</text>
<text x="108" y="334" class="detail" text-anchor="start">id LongIdTable PK</text>
<text x="108" y="356" class="detail" text-anchor="start">name varchar(255) index</text>
<text x="108" y="378" class="detail" text-anchor="start">producer_name index</text>
<text x="108" y="400" class="detail" text-anchor="start">release_date date</text>
</g>
<g data-card="actors_in_movies" data-x="450" data-y="236" data-width="280" data-height="226">
<rect class="card" x="450" y="236" width="280" height="226" rx="12" fill="#fff" stroke="#6f8f52" stroke-width="2.2"/>
<path d="M450,284 L450,248 Q450,236 462,236 L718,236 Q730,236 730,248 L730,284 Z" fill="#f1f6ec"/>
<text x="590.0" y="267" class="cardTitle" text-anchor="middle">actors_in_movies</text>
<text x="468" y="310" class="detail" text-anchor="start">movie_id FK -&gt; movies.id</text>
<text x="468" y="332" class="detail" text-anchor="start">actor_id FK -&gt; actors.id</text>
<text x="468" y="354" class="detail" text-anchor="start">PK(movie_id, actor_id)</text>
<text x="468" y="376" class="detail" text-anchor="start">onDelete CASCADE</text>
</g>
<g data-card="actors" data-x="810" data-y="260" data-width="280" data-height="178">
<rect class="card" x="810" y="260" width="280" height="178" rx="12" fill="#fff" stroke="#a66a3f" stroke-width="2.2"/>
<path d="M810,308 L810,272 Q810,260 822,260 L1078,260 Q1090,260 1090,272 L1090,308 Z" fill="#f5eee4"/>
<text x="950.0" y="291" class="cardTitle" text-anchor="middle">actors</text>
<text x="828" y="334" class="detail" text-anchor="start">id LongIdTable PK</text>
<text x="828" y="356" class="detail" text-anchor="start">first_name index</text>
<text x="828" y="378" class="detail" text-anchor="start">last_name index</text>
<text x="828" y="400" class="detail" text-anchor="start">birthday nullable date</text>
</g>
<path data-connector="movie-bridge" class="connector" d="M 370 349 L 450 349" stroke="#4f8f8b"/>
<text x="392" y="337" class="cardinality" text-anchor="middle">1</text>
<text x="430" y="337" class="cardinality" text-anchor="middle">N</text>
<rect x="376" y="382" width="70" height="24" rx="9" class="labelPill"/><text x="411" y="398" class="relLabel" text-anchor="middle">movie FK</text>
<path data-connector="actor-bridge" class="connector" d="M 730 349 L 810 349" stroke="#4f8f8b"/>
<text x="750" y="337" class="cardinality" text-anchor="middle">N</text>
<text x="788" y="337" class="cardinality" text-anchor="middle">1</text>
<rect x="734" y="382" width="70" height="24" rx="9" class="labelPill"/><text x="769" y="398" class="relLabel" text-anchor="middle">actor FK</text>
<rect x="84" y="600" width="1012" height="34" rx="12" class="noteBox"/>
<text x="590" y="622" class="detail" text-anchor="middle">Bridge rows are N-side records; movies and actors remain 1-side owners through cascade FK references.</text>
</svg>