<svg xmlns="http://www.w3.org/2000/svg" width="920" height="866" viewBox="0 0 920 866" role="img" aria-label="R2DBC suspendTransaction Flow">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
<marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
<style>.canvas{fill:#F7F9FC}.frame{fill:#fff;stroke:#D8E0EA;stroke-width:1.5}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#102033}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}.smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}.strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}.card{stroke-width:2;filter:url(#shadow)}.line{stroke:#5D6B7A;stroke-width:2.2;fill:none;marker-end:url(#openArrow)}.dashed{stroke:#5D6B7A;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}.lifeline{stroke:#B7C2D1;stroke-width:1.8;stroke-dasharray:8 9}.note{fill:#fff;opacity:.97}</style>
</defs>
<rect class="canvas" width="920" height="866"/>
<rect class="frame" x="24" y="24" width="872" height="810" rx="22"/>
<text class="title" x="58" y="76">R2DBC suspendTransaction Flow</text>
<text class="subtitle" x="62" y="106">Compact sequence flow with reduced outer and inner whitespace</text>
<rect class="card" x="95.0" y="156" width="220" height="66" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="205.0" y="196" text-anchor="middle">Coroutine (Caller)</text>
<line class="lifeline" x1="205.0" y1="250" x2="205.0" y2="804"/>
<rect class="card" x="350.0" y="156" width="220" height="66" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="460.0" y="196" text-anchor="middle">suspendTransaction</text>
<line class="lifeline" x1="460.0" y1="250" x2="460.0" y2="804"/>
<rect class="card" x="605.0" y="156" width="220" height="66" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="715.0" y="196" text-anchor="middle">R2DBC Database</text>
<line class="lifeline" x1="715.0" y1="250" x2="715.0" y2="804"/>
<path class="line" d="M205.0 292.0 L460.0 292.0"/>
<rect class="note" x="242.0" y="260.0" width="181.0" height="28" rx="9"/>
<text class="strong" x="332.5" y="280.0" text-anchor="middle">1. suspendTransaction(db)</text>
<path class="line" d="M460.0 366.0 L715.0 366.0"/>
<rect class="note" x="507.5" y="334.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="587.5" y="354.0" text-anchor="middle">2. BEGIN</text>
<path class="line" d="M460.0 440.0 L715.0 440.0"/>
<rect class="note" x="472.2" y="408.0" width="230.6" height="28" rx="9"/>
<text class="strong" x="587.5" y="428.0" text-anchor="middle">3. Execute SQL (INSERT/SELECT...)</text>
<path class="line" d="M460.0 514.0 L715.0 514.0"/>
<rect class="note" x="507.5" y="482.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="587.5" y="502.0" text-anchor="middle">5. COMMIT</text>
<path class="dashed" d="M460.0 588.0 L205.0 588.0"/>
<rect class="note" x="252.5" y="556.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="332.5" y="576.0" text-anchor="middle">6. Return result</text>
<path class="line" d="M460.0 662.0 L715.0 662.0"/>
<rect class="note" x="507.5" y="630.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="587.5" y="650.0" text-anchor="middle">8. ROLLBACK</text>
<path class="dashed" d="M460.0 736.0 L205.0 736.0"/>
<rect class="note" x="251.3" y="704.0" width="162.4" height="28" rx="9"/>
<text class="strong" x="332.5" y="724.0" text-anchor="middle">9. Propagate exception</text>
</svg>
