<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-label="R2DBC cache strategy flow by type">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#25384d" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .lane{fill:#f9fbfd;stroke:#dbe7f0;stroke-width:1.8}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#192538;font-weight:400}
      .subtitle,.detail,.foot{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:700;fill:#556678}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#66788c}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:18px;letter-spacing:0.08em;fill:#8ba4b8;font-weight:400}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#192538;font-weight:400}
      .stereo{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#66788c}
      .card{filter:url(#softShadow);stroke-width:2.4}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .head{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .blue{stroke:#4f86c6}
      .green{stroke:#6f8f52}
      .amber{stroke:#a36f3e}
      .teal{stroke:#4f8f8b}
      .rose{stroke:#a85f7f}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1120"/>
  <rect class="frame" x="30" y="30" width="1640" height="1060" rx="24"/>
  <text class="title" x="72" y="94">Cache Strategy Flow by Type</text>
  <text class="subtitle" x="76" y="128">README strategy comparison mapped to concrete R2DBC repositories: read-through, write-through, write-behind, and read-only.</text>

  <rect class="lane" x="60" y="166" width="1580" height="800" rx="18"/>
  <text class="laneTitle" x="92" y="202">STRATEGY SELECTION MATRIX</text>

  <g id="read-through">
    <rect class="card" x="98" y="250" width="330" height="128" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <path class="header" d="M98,297 L98,264 Q98,250 112,250 L414,250 Q428,250 428,264 L428,297 Z" fill="#eef6fc"/>
    <text class="stereo" x="263" y="274" text-anchor="middle">&lt;&lt;read strategy&gt;&gt;</text>
    <text class="cardTitle" x="263" y="297" text-anchor="middle">Read Through</text>
    <text class="detail" x="124" y="326">miss fetches DB data</text>
    <text class="small" x="124" y="350">then loads Redis / Near Cache</text>

    <rect class="card" x="590" y="250" width="390" height="128" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <path class="header" d="M590,297 L590,264 Q590,250 604,250 L966,250 Q980,250 980,264 L980,297 Z" fill="#eef6fc"/>
    <text class="stereo" x="785" y="274" text-anchor="middle">&lt;&lt;repositories&gt;&gt;</text>
    <text class="cardTitle" x="785" y="297" text-anchor="middle">UserCache / Credentials</text>
    <text class="detail" x="618" y="326">get(id), getAll(ids)</text>
    <text class="small" x="618" y="350">frequently-read profiles and credentials</text>

    <rect class="card" x="1140" y="250" width="400" height="128" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <path class="header" d="M1140,297 L1140,264 Q1140,250 1154,250 L1526,250 Q1540,250 1540,264 L1540,297 Z" fill="#eef6fc"/>
    <text class="stereo" x="1340" y="274" text-anchor="middle">&lt;&lt;criteria&gt;&gt;</text>
    <text class="cardTitle" x="1340" y="297" text-anchor="middle">High consistency / medium write</text>
    <text class="detail" x="1168" y="326">profile reads stay fast after first miss</text>
    <text class="small" x="1168" y="350">cache stays hot after first miss</text>

    <path class="connector blue" data-connector="flow" d="M428 314 L576 314"/>
    <polyline class="head blue" points="576,307 590,314 576,321" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector blue" data-connector="flow" d="M980 314 L1126 314"/>
    <polyline class="head blue" points="1126,307 1140,314 1126,321" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  </g>

  <g id="write-through">
    <rect class="card" x="98" y="420" width="330" height="128" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <path class="header" d="M98,467 L98,434 Q98,420 112,420 L414,420 Q428,420 428,434 L428,467 Z" fill="#f2f8ed"/>
    <text class="stereo" x="263" y="444" text-anchor="middle">&lt;&lt;write strategy&gt;&gt;</text>
    <text class="cardTitle" x="263" y="467" text-anchor="middle">Write Through</text>
    <text class="detail" x="124" y="496">put writes cache and DB</text>
    <text class="small" x="124" y="520">synchronously reflects master data</text>

    <rect class="card" x="590" y="420" width="390" height="128" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <path class="header" d="M590,467 L590,434 Q590,420 604,420 L966,420 Q980,420 980,434 L980,467 Z" fill="#f2f8ed"/>
    <text class="stereo" x="785" y="444" text-anchor="middle">&lt;&lt;repository&gt;&gt;</text>
    <text class="cardTitle" x="785" y="467" text-anchor="middle">UserCacheRepository</text>
    <text class="detail" x="618" y="496">POST /users -> put(id, record)</text>
    <text class="small" x="618" y="520">insert/update maps UserTable columns</text>

    <rect class="card" x="1140" y="420" width="400" height="128" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <path class="header" d="M1140,467 L1140,434 Q1140,420 1154,420 L1526,420 Q1540,420 1540,434 L1540,467 Z" fill="#f2f8ed"/>
    <text class="stereo" x="1340" y="444" text-anchor="middle">&lt;&lt;criteria&gt;&gt;</text>
    <text class="cardTitle" x="1340" y="467" text-anchor="middle">High consistency / low write</text>
    <text class="detail" x="1168" y="496">cache and DB are updated together</text>
    <text class="small" x="1168" y="520">good for balanced read/write master data</text>

    <path class="connector green" data-connector="flow" d="M428 484 L576 484"/>
    <polyline class="head green" points="576,477 590,484 576,491" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector green" data-connector="flow" d="M980 484 L1126 484"/>
    <polyline class="head green" points="1126,477 1140,484 1126,491" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  </g>

  <g id="write-behind">
    <rect class="card" x="98" y="590" width="330" height="128" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <path class="header" d="M98,637 L98,604 Q98,590 112,590 L414,590 Q428,590 428,604 L428,637 Z" fill="#fff5e8"/>
    <text class="stereo" x="263" y="614" text-anchor="middle">&lt;&lt;write strategy&gt;&gt;</text>
    <text class="cardTitle" x="263" y="637" text-anchor="middle">Write Behind</text>
    <text class="detail" x="124" y="666">cache first, DB later</text>
    <text class="small" x="124" y="690">batch-friendly async writes</text>

    <rect class="card" x="590" y="590" width="390" height="128" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <path class="header" d="M590,637 L590,604 Q590,590 604,590 L966,590 Q980,590 980,604 L980,637 Z" fill="#fff5e8"/>
    <text class="stereo" x="785" y="614" text-anchor="middle">&lt;&lt;repository&gt;&gt;</text>
    <text class="cardTitle" x="785" y="637" text-anchor="middle">UserEventCacheRepository</text>
    <text class="detail" x="618" y="666">POST /user-events[/bulk]</text>
    <text class="small" x="618" y="690">put / putAll event records</text>

    <rect class="card" x="1140" y="590" width="400" height="128" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <path class="header" d="M1140,637 L1140,604 Q1140,590 1154,590 L1526,590 Q1540,590 1540,604 L1540,637 Z" fill="#fff5e8"/>
    <text class="stereo" x="1340" y="614" text-anchor="middle">&lt;&lt;criteria&gt;&gt;</text>
    <text class="cardTitle" x="1340" y="637" text-anchor="middle">Low consistency / high write</text>
    <text class="detail" x="1168" y="666">bulk logs, events, analytics data</text>
    <text class="small" x="1168" y="690">DB write can lag cache acceptance</text>

    <path class="connector amber" data-connector="flow" d="M428 654 L576 654"/>
    <polyline class="head amber" points="576,647 590,654 576,661" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector amber" data-connector="flow" d="M980 654 L1126 654"/>
    <polyline class="head amber" points="1126,647 1140,654 1126,661" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  </g>

  <g id="read-only">
    <rect class="card" x="98" y="760" width="330" height="128" rx="14" fill="#ffffff" stroke="#a85f7f"/>
    <path class="header" d="M98,807 L98,774 Q98,760 112,760 L414,760 Q428,760 428,774 L428,807 Z" fill="#f8eef4"/>
    <text class="stereo" x="263" y="784" text-anchor="middle">&lt;&lt;read strategy&gt;&gt;</text>
    <text class="cardTitle" x="263" y="807" text-anchor="middle">Read-Only Cache</text>
    <text class="detail" x="124" y="836">cache DB data as immutable</text>
    <text class="small" x="124" y="860">no repository write implementation</text>

    <rect class="card" x="590" y="760" width="390" height="128" rx="14" fill="#ffffff" stroke="#a85f7f"/>
    <path class="header" d="M590,807 L590,774 Q590,760 604,760 L966,760 Q980,760 980,774 L980,807 Z" fill="#f8eef4"/>
    <text class="stereo" x="785" y="784" text-anchor="middle">&lt;&lt;repository&gt;&gt;</text>
    <text class="cardTitle" x="785" y="807" text-anchor="middle">UserCredentialsCacheRepository</text>
    <text class="detail" x="618" y="836">GET /user-credentials/{id}</text>
    <text class="small" x="618" y="860">insertEntity/updateEntity are no-op</text>

    <rect class="card" x="1140" y="760" width="400" height="128" rx="14" fill="#ffffff" stroke="#a85f7f"/>
    <path class="header" d="M1140,807 L1140,774 Q1140,760 1154,760 L1526,760 Q1540,760 1540,774 L1540,807 Z" fill="#f8eef4"/>
    <text class="stereo" x="1340" y="784" text-anchor="middle">&lt;&lt;criteria&gt;&gt;</text>
    <text class="cardTitle" x="1340" y="807" text-anchor="middle">High consistency / write N/A</text>
    <text class="detail" x="1168" y="836">credentials and code-table data</text>
    <text class="small" x="1168" y="860">invalidated explicitly when needed</text>

    <path class="connector rose" data-connector="flow" d="M428 824 L576 824"/>
    <polyline class="head rose" points="576,817 590,824 576,831" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector rose" data-connector="flow" d="M980 824 L1126 824"/>
    <polyline class="head rose" points="1126,817 1140,824 1126,831" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  </g>

  <rect x="110" y="1010" width="1480" height="34" rx="12" fill="#fbfdff" stroke="#d7e3ed" stroke-width="2"/>
  <text class="foot" x="850" y="1033" text-anchor="middle">Choose read-through, write-through, write-behind, or read-only by consistency needs and write behavior.</text>
</svg>
