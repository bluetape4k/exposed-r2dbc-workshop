<svg xmlns="http://www.w3.org/2000/svg" width="2632" height="1606" viewBox="0 0 2632 1606" role="img" aria-label="Request → Routing → DB Selection Flow (sequenceDiagram)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2632" height="1606"/>
<rect class="frame" x="32" y="28" width="2568" height="1550" rx="28"/>
<text class="title" x="66" y="82">Request → Routing → DB Selection Flow (sequenceDiagram)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">HTTP Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1546" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="382" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="532" y="198.5" text-anchor="middle">Tenant Routing Web</text>
<text class="smallLabel" x="532" y="219.5" text-anchor="middle">Filter</text>
<line class="lifeline" x1="532" y1="252" x2="532" y2="1546" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="774" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="924" y="198.5" text-anchor="middle">Routing Marker</text>
<text class="smallLabel" x="924" y="219.5" text-anchor="middle">Controller</text>
<line class="lifeline" x1="924" y1="252" x2="924" y2="1546" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1166" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1316" y="198.5" text-anchor="middle">Routing</text>
<text class="smallLabel" x="1316" y="219.5" text-anchor="middle">Transactional</text>
<line class="lifeline" x1="1316" y1="252" x2="1316" y2="1546" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1558" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1708" y="198.5" text-anchor="middle">Dynamic Routing</text>
<text class="smallLabel" x="1708" y="219.5" text-anchor="middle">Connection Factory</text>
<line class="lifeline" x1="1708" y1="252" x2="1708" y2="1546" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1950" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2100" y="198.5" text-anchor="middle">Connection Factory</text>
<text class="smallLabel" x="2100" y="219.5" text-anchor="middle">Registry</text>
<line class="lifeline" x1="2100" y1="252" x2="2100" y2="1546" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2342" y="166" width="300" height="72" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="2492" y="209" text-anchor="middle">Actual DB</text>
<line class="lifeline" x1="2492" y1="252" x2="2492" y2="1546" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="120.5" y="286" width="431" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="138.5" y="313" text-anchor="start">1. GET /routing/marker/readonly X-Tenant-Id: acme</text>
<path class="line" d="M140 344 L532 344"/>
<rect x="441" y="396" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="459" y="423" text-anchor="start">2. TENANT=acme, READ_ONLY=true</text>
<path class="line" d="M532 454 C596 454 596 488 532 488"/>
<rect x="572.5" y="526" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="590.5" y="553" text-anchor="start">3. contextWrite(TENANT, READ_ONLY)</text>
<path class="line" d="M532 584 L924 584"/>
<rect x="981" y="636" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="999" y="663" text-anchor="start">4. txExecutor.readOnly { ... }</text>
<path class="line" d="M924 694 L1316 694"/>
<rect x="1240" y="746" width="544" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1258" y="773" text-anchor="start">5. readOnlyOperator.execute(Mono) contextWrite(READ_ONLY, true)</text>
<path class="line" d="M1316 804 L1708 804"/>
<rect x="1508" y="856" width="496" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1526" y="883" text-anchor="start">6. Mono.deferContextual keyResolver.currentLookupKey(ctx)</text>
<path class="line" d="M1708 914 C1772 914 1772 948 1708 948"/>
<rect x="1799" y="986" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1817" y="1013" text-anchor="start">7. get(acme:ro)</text>
<path class="line" d="M1708 1044 L2100 1044"/>
<rect x="1765" y="1096" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1783" y="1123" text-anchor="start">8. ConnectionFactory (acme RO)</text>
<path class="dashed" d="M2100 1154 L1708 1154"/>
<rect x="1985" y="1206" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2003" y="1233" text-anchor="start">9. create() → Connection</text>
<path class="line" d="M1708 1264 L2492 1264"/>
<rect x="1603" y="1316" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1621" y="1343" text-anchor="start">10. Query result</text>
<path class="dashed" d="M2492 1374 L924 1374"/>
<rect x="328.5" y="1426" width="407" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="346.5" y="1453" text-anchor="start">11. JSON response {tenant:acme, readOnly:true}</text>
<path class="dashed" d="M924 1484 L140 1484"/>
</svg>
