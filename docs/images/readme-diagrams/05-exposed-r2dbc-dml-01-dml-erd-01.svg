<svg xmlns="http://www.w3.org/2000/svg" width="1196.107621136839" height="983" viewBox="0 0 1196.107621136839 983" role="img" aria-label="Example Table Structure (ER Diagram)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
  <marker id="inheritArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inheritArrow)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1196.107621136839" height="983"/>
<rect class="frame" x="32" y="28" width="1132.107621136839" height="927" rx="28"/>
<text class="title" x="66" y="82">Example Table Structure (ER Diagram)</text>
<text class="subtitle" x="70" y="118">ERD tables and relationships from the original Mermaid source</text>
<path class="line" d="M966 486 L966 596" data-connector="line"/>
<path class="line" d="M620 424 L620 132 L569 132 L569 363" data-connector="line"/>
<path class="line" d="M230 534 L230 142 L48 142 L48 396 L620 396 L620 424" data-connector="line"/>
<g transform="translate(70,368)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="166" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#5B8DEF"/>
  <text class="label" x="160" y="44" text-anchor="middle">cities</text>
  <text class="mono" x="18" y="104">int city_id PK auto_increment</text>
<text class="mono" x="18" y="131">varchar name</text>
</g>
<g transform="translate(460,424)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="220" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#58A978"/>
  <text class="label" x="160" y="44" text-anchor="middle">users</text>
  <text class="mono" x="18" y="104">varchar id PK</text>
<text class="mono" x="18" y="131">varchar name</text>
<text class="mono" x="18" y="158">int city_id FK nullable</text>
<text class="mono" x="18" y="185">int flags</text>
</g>
<g transform="translate(409,170)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="193" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#D6A441"/>
  <text class="label" x="160" y="44" text-anchor="middle">userdata</text>
  <text class="mono" x="18" y="104">varchar user_id FK</text>
<text class="mono" x="18" y="131">varchar comment</text>
<text class="mono" x="18" y="158">int value</text>
</g>
<g transform="translate(806,293)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="193" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#DC6B82"/>
  <text class="label" x="160" y="44" text-anchor="middle">orgs</text>
  <text class="mono" x="18" y="104">int id PK</text>
<text class="mono" x="18" y="131">varchar uid UK</text>
<text class="mono" x="18" y="158">varchar name</text>
</g>
<g transform="translate(806,596)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="166" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#45A7A1"/>
  <text class="label" x="160" y="44" text-anchor="middle">orgmemberships</text>
  <text class="mono" x="18" y="104">int id PK</text>
<text class="mono" x="18" y="131">varchar org FK</text>
</g>
<g transform="translate(409,692)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="220" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#8A72D6"/>
  <text class="label" x="160" y="44" text-anchor="middle">sales</text>
  <text class="mono" x="18" y="104">int year</text>
<text class="mono" x="18" y="131">int month</text>
<text class="mono" x="18" y="158">varchar product nullable</text>
<text class="mono" x="18" y="185">decimal amount</text>
</g>
<g transform="translate(70,548)">
  <rect filter="url(#shadow)" x="0" y="0" width="320" height="139" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#B88A44"/>
  <text class="label" x="160" y="44" text-anchor="middle">someamounts</text>
  <text class="mono" x="18" y="104">decimal amount</text>
</g>
</svg>
