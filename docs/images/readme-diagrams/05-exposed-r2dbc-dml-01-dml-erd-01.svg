<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Exposed R2DBC DML shared fixture ERD">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;fill:#1e293b}
      .column{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .key{fill:#1f5f8f}
      .fk{fill:#925b2f}
      .rel{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .cardinality{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#334155;font-weight:800}
      .labelPill{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.2}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1440" height="900" class="canvas"/>
  <rect x="22" y="22" width="1396" height="856" rx="18" class="frame"/>

  <text x="58" y="70" class="title" text-anchor="start">DML Fixture Tables and Relationships</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">Shared 01-dml examples use Cities, Users, and UserData for joins; Sales and SomeAmounts are independent aggregation fixtures.</text>

  <rect x="50" y="132" width="1340" height="360" rx="16" class="lane"/>
  <text x="76" y="162" class="laneTitle" text-anchor="start">JOIN AND CRUD FIXTURE</text>

  <rect x="50" y="532" width="1340" height="230" rx="16" class="lane"/>
  <text x="76" y="562" class="laneTitle" text-anchor="start">AGGREGATION FIXTURES WITHOUT FOREIGN KEYS</text>

  <g data-card="Cities" data-x="104" data-y="228" data-width="310" data-height="170">
    <rect x="104" y="228" width="310" height="170" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M104,272 L104,242 Q104,228 118,228 L400,228 Q414,228 414,242 L414,272 Z" fill="#eef5fa"/>
    <text x="259" y="248" class="tiny" text-anchor="middle">&lt;&lt;Table: cities&gt;&gt;</text>
    <text x="259" y="267" class="cardTitle" text-anchor="middle">Cities</text>
    <text x="128" y="304" class="column key" text-anchor="start">PK city_id INT auto_inc</text>
    <text x="128" y="328" class="column" text-anchor="start">name VARCHAR(50)</text>
    <text x="128" y="362" class="tiny" text-anchor="start">created by withCitiesAndUsers()</text>
  </g>

  <g data-card="Users" data-x="566" data-y="210" data-width="340" data-height="208">
    <rect x="566" y="210" width="340" height="208" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M566,254 L566,224 Q566,210 580,210 L892,210 Q906,210 906,224 L906,254 Z" fill="#f1f6ec"/>
    <text x="736" y="230" class="tiny" text-anchor="middle">&lt;&lt;Table: users&gt;&gt;</text>
    <text x="736" y="249" class="cardTitle" text-anchor="middle">Users</text>
    <text x="590" y="286" class="column key" text-anchor="start">PK id VARCHAR(10)</text>
    <text x="590" y="310" class="column" text-anchor="start">name VARCHAR(50)</text>
    <text x="590" y="334" class="column fk" text-anchor="start">FK city_id INT NULL</text>
    <text x="590" y="358" class="column" text-anchor="start">flags INT DEFAULT 0</text>
    <text x="590" y="392" class="tiny" text-anchor="start">sample flags: admin, hasData</text>
  </g>

  <g data-card="UserData" data-x="1052" data-y="228" data-width="310" data-height="170">
    <rect x="1052" y="228" width="310" height="170" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M1052,272 L1052,242 Q1052,228 1066,228 L1348,228 Q1362,228 1362,242 L1362,272 Z" fill="#f5eee4"/>
    <text x="1207" y="248" class="tiny" text-anchor="middle">&lt;&lt;Table: userdata&gt;&gt;</text>
    <text x="1207" y="267" class="cardTitle" text-anchor="middle">UserData</text>
    <text x="1076" y="304" class="column fk" text-anchor="start">FK user_id VARCHAR(10)</text>
    <text x="1076" y="328" class="column" text-anchor="start">comment VARCHAR(30)</text>
    <text x="1076" y="352" class="column" text-anchor="start">value INT</text>
  </g>

  <path class="rel" data-connector="cities-users" d="M 414 314 L 566 314"/>
  <text x="434" y="336" class="cardinality" text-anchor="middle">1</text>
  <text x="544" y="336" class="cardinality" text-anchor="middle">0..N</text>
  <rect x="454" y="270" width="72" height="24" rx="9" class="labelPill"/>
  <text x="490" y="287" class="tiny" text-anchor="middle">city_id FK</text>

  <path class="rel" data-connector="users-userdata" d="M 906 314 L 1052 314"/>
  <text x="926" y="336" class="cardinality" text-anchor="middle">1</text>
  <text x="1030" y="336" class="cardinality" text-anchor="middle">N</text>
  <rect x="958" y="270" width="84" height="24" rx="9" class="labelPill"/>
  <text x="1000" y="287" class="tiny" text-anchor="middle">user_id FK</text>

  <g data-card="Sales" data-x="238" data-y="602" data-width="390" data-height="120">
    <rect x="238" y="602" width="390" height="120" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M238,646 L238,616 Q238,602 252,602 L614,602 Q628,602 628,616 L628,646 Z" fill="#f5eef2"/>
    <text x="433" y="622" class="tiny" text-anchor="middle">&lt;&lt;Table: sales&gt;&gt;</text>
    <text x="433" y="641" class="cardTitle" text-anchor="middle">Sales</text>
    <text x="262" y="678" class="column" text-anchor="start">year INT, month INT, product VARCHAR(30) NULL</text>
    <text x="262" y="702" class="column" text-anchor="start">amount DECIMAL(8, 2)</text>
  </g>

  <g data-card="SomeAmounts" data-x="812" data-y="602" data-width="350" data-height="120">
    <rect x="812" y="602" width="350" height="120" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M812,646 L812,616 Q812,602 826,602 L1148,602 Q1162,602 1162,616 L1162,646 Z" fill="#eef7f6"/>
    <text x="987" y="622" class="tiny" text-anchor="middle">&lt;&lt;Table: someamounts&gt;&gt;</text>
    <text x="987" y="641" class="cardTitle" text-anchor="middle">SomeAmounts</text>
    <text x="836" y="684" class="column" text-anchor="start">amount DECIMAL(8, 2)</text>
  </g>

  <rect x="92" y="812" width="1256" height="30" rx="10" class="noteBox"/>
  <text x="720" y="832" class="note" text-anchor="middle">Endpoint labels show relationship cardinality; Sales and SomeAmounts stay separate because the shared source defines no foreign keys between them.</text>
</svg>
