    <rect x="690" y="642" width="236" height="100" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.1" class="card"/>
    <path class="header" d="M690,684 L690,656 Q690,642 704,642 L912,642 Q926,642 926,656 L926,684 Z" fill="#f5eee4"/>
    <text x="808" y="661" class="tiny" text-anchor="middle">&lt;&lt;private IntIdTable&gt;&gt;</text>
    <text x="808" y="680" class="cardTitle" text-anchor="middle">Serialization T1</text>
    <text x="708" y="706" class="detail" text-anchor="start">name + binary columns</text>
  </g>
  <g data-card="Payload data classes" data-x="988" data-y="642" data-width="236" data-height="100">
    <rect x="988" y="642" width="236" height="100" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.1" class="card"/>
    <path class="header" d="M988,684 L988,656 Q988,642 1002,642 L1210,642 Q1224,642 1224,656 L1224,684 Z" fill="#eef7f6"/>
