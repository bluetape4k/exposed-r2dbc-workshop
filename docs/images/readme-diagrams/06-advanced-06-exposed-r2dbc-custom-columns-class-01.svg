    <rect x="90" y="382" width="220" height="100" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.1" class="card"/>
    <path class="header" d="M90,424 L90,396 Q90,382 104,382 L296,382 Q310,382 310,396 L310,424 Z" fill="#eef5fa"/>
