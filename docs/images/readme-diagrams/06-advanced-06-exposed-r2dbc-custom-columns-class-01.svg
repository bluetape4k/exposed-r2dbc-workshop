    <rect x="590" y="382" width="220" height="100" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.1" class="card"/>
    <path class="header" d="M590,424 L590,396 Q590,382 604,382 L796,382 Q810,382 810,396 L810,424 Z" fill="#f1f6ec"/>
