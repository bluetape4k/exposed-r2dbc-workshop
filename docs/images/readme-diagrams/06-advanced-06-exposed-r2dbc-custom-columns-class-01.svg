    <rect x="840" y="382" width="220" height="100" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.1" class="card"/>
    <path class="header" d="M840,424 L840,396 Q840,382 854,382 L1046,382 Q1060,382 1060,396 L1060,424 Z" fill="#f5eee4"/>
