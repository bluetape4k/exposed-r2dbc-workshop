  <polyline class="vhead"  points="974,685 988,692 974,699" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect x="126" y="848" width="1108" height="34" rx="11" class="noteBox"/>
  <text x="680" y="871" class="note" text-anchor="middle">Solid hollow triangles show the shared test base; dashed use arrows point to the private tables or payload classes each fixture exercises.</text>
</svg>
