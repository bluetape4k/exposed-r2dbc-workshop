  <polygon class="head"  points="700,262 691,278 709,278" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="inherit" data-connector="fixture-inherit-mid3"  d="M 950 382 L 950 308 Q 950 298 940 298 L 752 298 Q 742 298 742 278"/>
  <polygon class="head"  points="742,262 733,278 751,278" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
