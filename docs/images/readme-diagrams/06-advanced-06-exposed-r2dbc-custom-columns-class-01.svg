  <polyline class="vhead"  points="503,628 510,642 517,628" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use" data-connector="compress-blob-table"  d="M 700 482 L 700 572 Q 700 584 688 584 L 538 584 Q 526 584 526 596 L 526 628" stroke="#6f8f52"/>
  <polyline class="vhead"  points="519,628 526,642 533,628" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use" data-connector="serialize-binary-table"  d="M 950 482 L 950 530 Q 950 542 938 542 L 788 542 Q 776 542 776 554 L 776 628" stroke="#a66a3f"/>
  <polyline class="vhead"  points="769,628 776,642 783,628" stroke="#a66a3f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use" data-connector="serialize-blob-table"  d="M 1200 482 L 1200 548 Q 1200 560 1188 560 L 852 560 Q 840 560 840 572 L 840 628" stroke="#a66a3f"/>
  <polyline class="vhead"  points="833,628 840,642 847,628" stroke="#a66a3f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
