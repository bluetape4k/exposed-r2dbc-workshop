<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 940" width="1360" height="940" role="img" aria-label="Advanced 06 Exposed R2DBC Custom Columns class diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .laneA{fill:#f5f9ff}
      .laneB{fill:#f7fbf4}
      .laneC{fill:#fff8f1}
      .card{filter:url(#shadow)}
      .header{opacity:.98}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
      .connector{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .inherit{fill:none;stroke:#64748b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .use{fill:none;stroke-width:2.2;stroke-dasharray:7 6;stroke-linecap:butt;stroke-linejoin:round}
      .head{fill:white;stroke:#64748b;stroke-width:2.5;stroke-dasharray:none}
      .vhead{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1360" height="940" class="canvas"/>
  <rect x="22" y="22" width="1316" height="896" rx="18" class="frame"/>

  <text x="58" y="72" class="title" text-anchor="start">Custom Column Test Class Map</text>
  <text x="58" y="102" class="subtitle" text-anchor="start">UML-style map for R2DBC tests, private fixture tables, column extension families, and payload classes.</text>

  <rect x="52" y="132" width="1256" height="158" rx="16" class="lane laneA"/>
  <text x="78" y="163" class="laneTitle" text-anchor="start">SHARED TEST CONTRACT</text>

  <g data-card="AbstractR2dbcExposedTest" data-x="506" data-y="184" data-width="348" data-height="78">
    <rect x="506" y="184" width="348" height="78" rx="14" fill="#fff" stroke="#64748b" stroke-width="2.1" class="card"/>
    <path class="header" d="M506,226 L506,198 Q506,184 520,184 L840,184 Q854,184 854,198 L854,226 Z" fill="#f8fafc"/>
    <text x="680" y="203" class="tiny" text-anchor="middle">&lt;&lt;base test&gt;&gt;</text>
    <text x="680" y="222" class="cardTitle" text-anchor="middle">AbstractR2dbcExposedTest</text>
    <text x="532" y="246" class="detail" text-anchor="start">dialect matrix + coroutine boundary</text>
  </g>

  <rect x="52" y="314" width="1256" height="236" rx="16" class="lane laneB"/>
  <text x="78" y="345" class="laneTitle" text-anchor="start">R2DBC TEST FIXTURES</text>

