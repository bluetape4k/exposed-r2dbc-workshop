  <text x="78" y="605" class="laneTitle" text-anchor="start">PRIVATE TABLES AND COLUMN EXTENSION FAMILIES</text>

  <g data-card="ClientGenerated table" data-x="94" data-y="642" data-width="236" data-height="100">
    <rect x="94" y="642" width="236" height="100" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.1" class="card"/>
    <path class="header" d="M94,684 L94,656 Q94,642 108,642 L316,642 Q330,642 330,656 L330,684 Z" fill="#eef5fa"/>
    <text x="212" y="661" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable&gt;&gt;</text>
    <text x="212" y="680" class="cardTitle" text-anchor="middle">ClientGenerated</text>
    <text x="112" y="706" class="detail" text-anchor="start">UUID, Snowflake, KSUID</text>
  </g>
  <g data-card="Compression T1 tables" data-x="392" data-y="642" data-width="236" data-height="100">
    <rect x="392" y="642" width="236" height="100" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.1" class="card"/>
    <path class="header" d="M392,684 L392,656 Q392,642 406,642 L614,642 Q628,642 628,656 L628,684 Z" fill="#f1f6ec"/>
