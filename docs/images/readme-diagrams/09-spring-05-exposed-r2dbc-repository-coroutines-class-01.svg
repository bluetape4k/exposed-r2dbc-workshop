<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1097" viewBox="0 0 1420 1097" role="img" aria-label="Repository Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
  <marker id="inheritArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inheritArrow)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1420" height="1097"/>
<rect class="frame" x="32" y="28" width="1356" height="1041" rx="28"/>
<text class="title" x="66" y="82">Repository Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M970 499.5 L710 499.5 L710 520.5 L450 520.5" data-connector="line"/>
<path class="line" d="M710 791 L710 731 L710 731 L710 671" data-connector="line"/>
<path class="implLine" d="M260 412 L260 352 L260 352 L260 292"/>
<path class="implLine" d="M710 412 L710 352 L260 352 L260 292"/>
<g transform="translate(70,412)">
  <rect class="card" x="0" y="0" width="380" height="217" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">ActorR2dbcRepository</text>
  <text class="mono" x="18" y="108">+table ActorTable</text>
<text class="mono" x="18" y="129">+extractId(entity) Long</text>
<text class="mono" x="18" y="150">+toEntity(row) ActorRecord</text>
<text class="mono" x="18" y="171">+save(actor) ActorRecord</text>
<text class="mono" x="18" y="192">+searchActors(params) Flow~ActorRecord~</text>
</g>
<g transform="translate(970,180)">
  <rect class="card" x="0" y="0" width="380" height="112" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">R2dbcRepositoryID</text>

</g>
<g transform="translate(70,180)">
  <rect class="card" x="0" y="0" width="380" height="112" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">R2dbcRepository</text>

</g>
<g transform="translate(970,412)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">ActorController</text>
  <text class="mono" x="18" y="108">+getAllActors() List~ActorRecord~</text>
<text class="mono" x="18" y="129">+getActorById(id) ActorRecord?</text>
<text class="mono" x="18" y="150">+createActor(actor) ActorRecord</text>
</g>
<g transform="translate(520,412)">
  <rect class="card" x="0" y="0" width="380" height="259" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">MovieR2dbcRepository</text>
  <text class="mono" x="18" y="108">+table MovieTable</text>
<text class="mono" x="18" y="129">+extractId(entity) Long</text>
<text class="mono" x="18" y="150">+toEntity(row) MovieRecord</text>
<text class="mono" x="18" y="171">+save(movie) MovieRecord</text>
<text class="mono" x="18" y="192">+searchMovies(params) Flow~MovieRecord~</text>
<text class="mono" x="18" y="213">+getAllMoviesWithActors()</text>
<text class="mono" x="18" y="234">Flow~MovieWithActorRecord~</text>
</g>
<g transform="translate(520,791)">
  <rect class="card" x="0" y="0" width="380" height="196" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#8A72D6"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">MovieController</text>
  <text class="mono" x="18" y="108">+getMovieWithActors(id) MovieWithActorRecord?</text>
<text class="mono" x="18" y="129">+searchMovies(params) List~MovieRecord~</text>
<text class="mono" x="18" y="150">+createMovie(movie) MovieRecord</text>
<text class="mono" x="18" y="171">+deleteMovie(id) Int</text>
</g>
</svg>
