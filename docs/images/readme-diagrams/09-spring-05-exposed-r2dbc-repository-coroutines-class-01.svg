<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="1280" height="860" role="img" aria-label="Spring repository coroutine class diagram">
<defs><style>.canvas{fill:#f6f9fc} .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5} .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2} text{font-family:"Comic Mono","SFMono-Regular",monospace;fill:#536476;font-weight:700} .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b;font-weight:400} .subtitle{font-size:14px} .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.09em;fill:#91a6b7} .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b;font-weight:400} .detail{font-size:12.5px} .tiny{font-size:11px;fill:#64748b} .connector{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round} .use{stroke-dasharray:8 7;stroke-linecap:butt} .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}</style></defs>
