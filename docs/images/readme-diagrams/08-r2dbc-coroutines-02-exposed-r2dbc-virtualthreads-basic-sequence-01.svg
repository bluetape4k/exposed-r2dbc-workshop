<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980" role="img" aria-label="Virtual thread R2DBC execution sequence">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3c82b4" stroke="#3c82b4" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8848" stroke="#5f8848" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b78632" stroke="#b78632" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-return" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .participantText{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#1e293b}
      .participantHint,.labelText,.num{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#344256;font-weight:700}
      .card{filter:url(#shadow)}
      .lifeline{stroke:#9fb0bf;stroke-width:2;stroke-dasharray:8 10}
      .activation{fill:#ecfdf5;stroke:#7aa083;stroke-width:2}
      .call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .return{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
      .label{fill:#fff;stroke:#d7e2ec;stroke-width:1.4}
      .labelBlue{stroke:#b8d9eb}
      .labelGreen{stroke:#c5d9b6}
      .labelAmber{stroke:#dfc396}
      .labelReturn{stroke:#bdd9d3}
      .numCircle{fill:#fff}
      .noteBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
    </style>
  </defs>

  <rect class="canvas" width="1320" height="980"/>
  <rect class="frame" x="28" y="26" width="1264" height="928" rx="22"/>
  <text class="title" x="64" y="76">Virtual Thread R2DBC Execution Flow</text>
  <text class="subtitle" x="66" y="106">Concrete sequence from Ex01_VirtualThreads: virtualThreadTransaction plus Dispatchers.newVT fan-out.</text>

  <g data-card="Test Scope" data-x="56" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="56" y="146" width="208" height="72" rx="14" fill="#e8f3ff" stroke="#5b8def" stroke-width="2"/>
    <text class="participantText participant" x="160" y="182" text-anchor="middle">Test Scope</text>
    <text class="participantHint" x="160" y="202" text-anchor="middle">runSuspendVT</text>
  </g>
  <g data-card="withTables" data-x="296" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="296" y="146" width="208" height="72" rx="14" fill="#eaf7ef" stroke="#58a978" stroke-width="2"/>
    <text class="participantText participant" x="400" y="182" text-anchor="middle">withTables</text>
    <text class="participantHint" x="400" y="202" text-anchor="middle">testDB + VTester</text>
  </g>
  <g data-card="VT Scope" data-x="546" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="546" y="146" width="208" height="72" rx="14" fill="#fff3d9" stroke="#d6a441" stroke-width="2"/>
    <text class="participantText participant" x="650" y="182" text-anchor="middle">VT Scope</text>
    <text class="participantHint" x="650" y="202" text-anchor="middle">Dispatchers.newVT()</text>
  </g>
  <g data-card="VT Transaction" data-x="786" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="786" y="146" width="208" height="72" rx="14" fill="#eef7f6" stroke="#4f8f8b" stroke-width="2"/>
    <text class="participantText participant" x="890" y="182" text-anchor="middle">VT Transaction</text>
    <text class="participantHint" x="890" y="202" text-anchor="middle">virtual / top-level</text>
  </g>
  <g data-card="R2DBC DB" data-x="1036" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="1036" y="146" width="208" height="72" rx="14" fill="#fdecef" stroke="#dc6b82" stroke-width="2"/>
    <text class="participantText participant" x="1140" y="182" text-anchor="middle">R2DBC DB</text>
    <text class="participantHint" x="1140" y="202" text-anchor="middle">H2 / server DBs</text>
  </g>

  <line class="lifeline" x1="160" y1="248" x2="160" y2="878"/>
  <line class="lifeline" x1="400" y1="248" x2="400" y2="878"/>
  <line class="lifeline" x1="650" y1="248" x2="650" y2="878"/>
  <line class="lifeline" x1="890" y1="248" x2="890" y2="878"/>
  <line class="lifeline" x1="1140" y1="248" x2="1140" y2="878"/>

  <rect class="activation" x="154" y="278" width="12" height="516" rx="4"/>
  <rect class="activation" x="394" y="298" width="12" height="590" rx="4"/>
  <rect class="activation" x="644" y="608" width="12" height="230" rx="4"/>
  <rect class="activation" x="884" y="450" width="12" height="354" rx="4"/>
  <rect class="activation" x="1134" y="342" width="12" height="530" rx="4"/>

  <path class="call" data-connector="seq-01" d="M 160 300 L 400 300" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <rect class="label labelBlue" x="188" y="268" width="184" height="28" rx="14"/>
  <circle class="numCircle" cx="206" cy="282" r="13" stroke="#3c82b4" stroke-width="1.7"/>
  <text class="num" x="206" y="286" text-anchor="middle">1</text>
  <text class="labelText" x="228" y="286" text-anchor="start">withTables(testDB)</text>

  <path class="call" data-connector="seq-02" d="M 400 354 L 1140 354" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <rect class="label labelGreen" x="642" y="322" width="260" height="28" rx="14"/>
  <circle class="numCircle" cx="660" cy="336" r="13" stroke="#5f8848" stroke-width="1.7"/>
  <text class="num" x="660" y="340" text-anchor="middle">2</text>
  <text class="labelText" x="682" y="340" text-anchor="start">SchemaUtils.create(VTester)</text>

  <path class="call" data-connector="seq-03" d="M 400 408 L 1140 408" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="655" y="376" width="230" height="28" rx="14"/>
  <circle class="numCircle" cx="673" cy="390" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="673" y="394" text-anchor="middle">3</text>
  <text class="labelText" x="695" y="394" text-anchor="start">VTester.insertAndGetId</text>

  <path class="call" data-connector="seq-04" d="M 400 462 L 890 462" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <rect class="label labelBlue" x="548" y="430" width="286" height="28" rx="14"/>
  <circle class="numCircle" cx="566" cy="444" r="13" stroke="#3c82b4" stroke-width="1.7"/>
  <text class="num" x="566" y="448" text-anchor="middle">4</text>
  <text class="labelText" x="588" y="448" text-anchor="start">getTesterById(id)</text>

  <path class="call" data-connector="seq-05" d="M 890 516 L 1140 516" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="910" y="484" width="214" height="28" rx="14"/>
  <circle class="numCircle" cx="928" cy="498" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="928" y="502" text-anchor="middle">5</text>
  <text class="labelText" x="950" y="502" text-anchor="start">SELECT id via VT tx</text>

  <path class="return" data-connector="seq-06" d="M 1140 570 L 890 570" stroke="#4f8f8b" marker-end="url(#arrow-return)"/>
  <rect class="label labelReturn" x="928" y="538" width="174" height="28" rx="14"/>
  <circle class="numCircle" cx="946" cy="552" r="13" stroke="#4f8f8b" stroke-width="1.7"/>
  <text class="num" x="946" y="556" text-anchor="middle">6</text>
  <text class="labelText" x="968" y="556" text-anchor="start">ResultRow</text>

  <path class="call" data-connector="seq-07" d="M 400 624 L 650 624" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="430" y="592" width="190" height="28" rx="14"/>
  <circle class="numCircle" cx="448" cy="606" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="448" y="610" text-anchor="middle">7</text>
  <text class="labelText" x="470" y="610" text-anchor="start">newVT scope</text>

  <path class="call" data-connector="seq-08" d="M 650 678 L 890 678" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <rect class="label labelBlue" x="668" y="646" width="196" height="28" rx="14"/>
  <circle class="numCircle" cx="686" cy="660" r="13" stroke="#3c82b4" stroke-width="1.7"/>
  <text class="num" x="686" y="664" text-anchor="middle">8</text>
  <text class="labelText" x="708" y="664" text-anchor="start">launch top-level tx</text>

  <path class="call" data-connector="seq-09" d="M 890 732 L 1140 732" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="908" y="700" width="220" height="28" rx="14"/>
  <circle class="numCircle" cx="926" cy="714" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="926" y="718" text-anchor="middle">9</text>
  <text class="labelText" x="948" y="718" text-anchor="start">INSERT maxAttempts=5</text>

  <path class="return" data-connector="seq-10" d="M 890 786 L 650 786" stroke="#4f8f8b" marker-end="url(#arrow-return)"/>
  <rect class="label labelReturn" x="684" y="754" width="170" height="28" rx="14"/>
  <circle class="numCircle" cx="702" cy="768" r="13" stroke="#4f8f8b" stroke-width="1.7"/>
  <text class="num" x="702" y="772" text-anchor="middle">10</text>
  <text class="labelText" x="728" y="772" text-anchor="start">results.add</text>

  <path class="return" data-connector="seq-11" d="M 650 822 L 400 822" stroke="#4f8f8b" marker-end="url(#arrow-return)"/>
  <rect class="label labelReturn" x="454" y="790" width="146" height="28" rx="14"/>
  <circle class="numCircle" cx="472" cy="804" r="13" stroke="#4f8f8b" stroke-width="1.7"/>
  <text class="num" x="472" y="808" text-anchor="middle">11</text>
  <text class="labelText" x="498" y="808" text-anchor="start">joinAll()</text>

  <path class="call" data-connector="seq-12" d="M 400 858 L 1140 858" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <rect class="label labelGreen" x="648" y="826" width="244" height="28" rx="14"/>
  <circle class="numCircle" cx="666" cy="840" r="13" stroke="#5f8848" stroke-width="1.7"/>
  <text class="num" x="666" y="844" text-anchor="middle">12</text>
  <text class="labelText" x="692" y="844" text-anchor="start">count + SchemaUtils.drop</text>

  <rect x="82" y="902" width="1156" height="34" rx="10" class="noteBox"/>
  <text x="660" y="924" class="note" text-anchor="middle">Virtual-thread tests combine sequential virtualThreadTransaction with independent top-level launch jobs before final count assertions.</text>
</svg>
