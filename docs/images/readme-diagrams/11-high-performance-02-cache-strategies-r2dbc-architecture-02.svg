<text class="smallLabel" x="140" y="59" text-anchor="middle">Cache HIT?</text>
</g>
<g transform="translate(716,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">key</text>
</g>
<g transform="translate(48,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Return immediately</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">nanoseconds ⚡</text>
</g>
<g transform="translate(382,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">L2 Redisson MapCache</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">HIT?</text>
</g>
<g transform="translate(716,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Sync L1 + Return</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">microseconds ⚡</text>
</g>
<g transform="translate(215,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">DB query</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">suspendTransaction</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">Exposed R2DBC</text>
</g>
<g transform="translate(549,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Store in L2 with TTL</text>
</g>
</svg>
