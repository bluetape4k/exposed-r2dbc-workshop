<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="960" viewBox="0 0 1700 960" role="img" aria-label="Cache lookup flow for R2DBC read-through repository">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#25384d" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .lane{fill:#f9fbfd;stroke:#dbe7f0;stroke-width:1.8}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#192538;font-weight:400}
      .subtitle,.detail,.foot,.labelText{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:700;fill:#556678}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#66788c}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:18px;letter-spacing:0.08em;fill:#8ba4b8;font-weight:400}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:23px;fill:#192538;font-weight:400}
      .stereo{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#66788c}
      .card{filter:url(#softShadow);stroke-width:2.4}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:8 7}
      .head{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .label{fill:#fffefa;stroke-width:1.8}
      .blue{stroke:#4f86c6}
      .green{stroke:#6f8f52}
      .amber{stroke:#a36f3e}
      .teal{stroke:#4f8f8b}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="960"/>
  <rect class="frame" x="30" y="30" width="1640" height="900" rx="24"/>
  <text class="title" x="72" y="94">Cache Lookup Flow - Read Through with Near Cache</text>
  <text class="subtitle" x="76" y="128">UserController.get(id) calls UserCacheRepository.get(id); cache miss falls through Near Cache, Redis MapCache, and H2 R2DBC before re-populating both caches.</text>

  <rect class="lane" x="60" y="160" width="1580" height="286" rx="18"/>
  <text class="laneTitle" x="92" y="194">REQUEST / LOOKUP PATH</text>
  <rect class="lane" x="60" y="482" width="1580" height="240" rx="18"/>
  <text class="laneTitle" x="92" y="516">MISS POPULATE PATH</text>
  <rect class="lane" x="60" y="756" width="1580" height="110" rx="18"/>
  <text class="laneTitle" x="92" y="790">READER CONTRACT</text>

  <g data-card="HTTP Client" data-x="96" data-y="240" data-width="210" data-height="120">
    <rect class="card" x="96" y="240" width="210" height="120" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <path class="header" d="M96,286 L96,254 Q96,240 110,240 L292,240 Q306,240 306,254 L306,286 Z" fill="#eef6fc"/>
    <text class="stereo" x="201" y="264" text-anchor="middle">&lt;&lt;request&gt;&gt;</text>
    <text class="cardTitle" x="201" y="287" text-anchor="middle">HTTP Client</text>
    <text class="detail" x="120" y="318">GET /users/{id}</text>
    <text class="small" x="120" y="342">WebTestClient / caller</text>
  </g>

  <g data-card="UserController" data-x="356" data-y="240" data-width="230" data-height="120">
    <rect class="card" x="356" y="240" width="230" height="120" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <path class="header" d="M356,286 L356,254 Q356,240 370,240 L572,240 Q586,240 586,254 L586,286 Z" fill="#eef6fc"/>
    <text class="stereo" x="471" y="264" text-anchor="middle">&lt;&lt;webflux&gt;&gt;</text>
    <text class="cardTitle" x="471" y="287" text-anchor="middle">UserController</text>
    <text class="detail" x="380" y="314">suspend fun get(id)</text>
    <text class="small" x="380" y="338">delegates to repository</text>
    <text class="small" x="380" y="356">no transaction block</text>
  </g>

  <g data-card="UserCacheRepository" data-x="642" data-y="240" data-width="260" data-height="120">
    <rect class="card" x="642" y="240" width="260" height="120" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <path class="header" d="M642,286 L642,254 Q642,240 656,240 L888,240 Q902,240 902,254 L902,286 Z" fill="#f2f8ed"/>
    <text class="stereo" x="772" y="264" text-anchor="middle">&lt;&lt;repository&gt;&gt;</text>
    <text class="cardTitle" x="772" y="287" text-anchor="middle">UserCacheRepository</text>
    <text class="detail" x="666" y="318">READ_WRITE_THROUGH</text>
    <text class="small" x="666" y="342">key: exposed:coroutines:users:&lt;id&gt;</text>
  </g>

  <g data-card="Near Cache" data-x="958" data-y="240" data-width="220" data-height="120">
    <rect class="card" x="958" y="240" width="220" height="120" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <path class="header" d="M958,286 L958,254 Q958,240 972,240 L1164,240 Q1178,240 1178,254 L1178,286 Z" fill="#eef8f7"/>
    <text class="stereo" x="1068" y="264" text-anchor="middle">&lt;&lt;L1 cache&gt;&gt;</text>
    <text class="cardTitle" x="1068" y="287" text-anchor="middle">Caffeine Near Cache</text>
    <text class="detail" x="982" y="318">first local lookup</text>
    <text class="small" x="982" y="342">hit avoids Redis round trip</text>
  </g>

  <g data-card="Redis MapCache" data-x="1230" data-y="240" data-width="210" data-height="120">
    <rect class="card" x="1230" y="240" width="210" height="120" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <path class="header" d="M1230,286 L1230,254 Q1230,240 1244,240 L1426,240 Q1440,240 1440,254 L1440,286 Z" fill="#fff5e8"/>
    <text class="stereo" x="1335" y="264" text-anchor="middle">&lt;&lt;L2 cache&gt;&gt;</text>
    <text class="cardTitle" x="1335" y="287" text-anchor="middle">Redis MapCache</text>
    <text class="detail" x="1254" y="318">RedissonClient</text>
    <text class="small" x="1254" y="342">distributed cache tier</text>
  </g>

  <g data-card="H2 R2DBC DB" data-x="1482" data-y="240" data-width="130" data-height="120">
    <rect class="card" x="1482" y="240" width="130" height="120" rx="14" fill="#ffffff" stroke="#8a6f55"/>
    <path class="header" d="M1482,286 L1482,254 Q1482,240 1496,240 L1598,240 Q1612,240 1612,254 L1612,286 Z" fill="#f3eee8"/>
    <text class="stereo" x="1547" y="264" text-anchor="middle">&lt;&lt;DB&gt;&gt;</text>
    <text class="cardTitle" x="1547" y="287" text-anchor="middle">H2 R2DBC</text>
    <text class="detail" x="1502" y="318">UserTable</text>
    <text class="small" x="1502" y="342">DB fallback</text>
  </g>

  <g id="lookup-connectors">
    <path class="connector blue" data-connector="lookup" d="M306 300 L344 300"/>
    <polyline class="head blue" points="344,293 356,300 344,307" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector blue" data-connector="lookup" d="M586 300 L630 300"/>
    <polyline class="head blue" points="630,293 642,300 630,307" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector green" data-connector="lookup" d="M902 300 L946 300"/>
    <polyline class="head green" points="946,293 958,300 946,307" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector amber dash" data-connector="miss" d="M1178 300 L1218 300" stroke-linecap="butt"/>
    <polyline class="head amber" points="1218,293 1230,300 1218,307" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector amber dash" data-connector="miss" d="M1440 300 L1470 300" stroke-linecap="butt"/>
    <polyline class="head amber" points="1470,293 1482,300 1470,307" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  </g>

  <g id="labels">
    <rect class="label" x="1018" y="382" width="126" height="32" rx="16" stroke="#8ebf83"/>
    <text class="labelText" x="1081" y="403" text-anchor="middle">hit returns</text>
    <rect class="label" x="1214" y="382" width="144" height="32" rx="16" stroke="#c59a63"/>
    <text class="labelText" x="1286" y="403" text-anchor="middle">miss continues</text>
  </g>

  <g id="populate-corridor">
    <g data-card="Return UserRecord" data-x="510" data-y="565" data-width="270" data-height="110">
      <rect class="card" x="510" y="565" width="270" height="110" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
      <path class="header" d="M510,611 L510,579 Q510,565 524,565 L766,565 Q780,565 780,579 L780,611 Z" fill="#eef8f7"/>
      <text class="stereo" x="645" y="589" text-anchor="middle">&lt;&lt;response&gt;&gt;</text>
      <text class="cardTitle" x="645" y="612" text-anchor="middle">Return UserRecord</text>
      <text class="detail" x="534" y="642">repository result</text>
      <text class="small" x="534" y="664">suspend endpoint resumes</text>
    </g>

    <g data-card="Near Cache Warm" data-x="860" data-y="565" data-width="240" data-height="110">
      <rect class="card" x="860" y="565" width="240" height="110" rx="14" fill="#ffffff" stroke="#6f8f52"/>
      <path class="header" d="M860,611 L860,579 Q860,565 874,565 L1086,565 Q1100,565 1100,579 L1100,611 Z" fill="#f2f8ed"/>
      <text class="stereo" x="980" y="589" text-anchor="middle">&lt;&lt;L1 populate&gt;&gt;</text>
      <text class="cardTitle" x="980" y="612" text-anchor="middle">Warm Near Cache</text>
      <text class="detail" x="884" y="642">Caffeine entry</text>
      <text class="small" x="884" y="664">next read can skip Redis</text>
    </g>

    <g data-card="Redis Populate" data-x="1160" data-y="565" data-width="230" data-height="110">
      <rect class="card" x="1160" y="565" width="230" height="110" rx="14" fill="#ffffff" stroke="#6f8f52"/>
      <path class="header" d="M1160,611 L1160,579 Q1160,565 1174,565 L1376,565 Q1390,565 1390,579 L1390,611 Z" fill="#f2f8ed"/>
      <text class="stereo" x="1275" y="589" text-anchor="middle">&lt;&lt;L2 populate&gt;&gt;</text>
      <text class="cardTitle" x="1275" y="612" text-anchor="middle">Store Redis Value</text>
      <text class="detail" x="1184" y="642">MapCache write</text>
      <text class="small" x="1184" y="664">prefix exposed:coroutines:users</text>
    </g>

    <g data-card="DB Read" data-x="1462" data-y="565" data-width="170" data-height="110">
      <rect class="card" x="1462" y="565" width="170" height="110" rx="14" fill="#ffffff" stroke="#a36f3e"/>
      <path class="header" d="M1462,611 L1462,579 Q1462,565 1476,565 L1618,565 Q1632,565 1632,579 L1632,611 Z" fill="#fff5e8"/>
      <text class="stereo" x="1547" y="589" text-anchor="middle">&lt;&lt;R2DBC&gt;&gt;</text>
      <text class="cardTitle" x="1547" y="612" text-anchor="middle">DB Read</text>
      <text class="detail" x="1484" y="642">select users</text>
      <text class="small" x="1484" y="664">map ResultRow</text>
    </g>

    <path class="connector amber" data-connector="db-read" d="M1547 360 L1547 549"/>
    <polyline class="head amber" points="1540,549 1547,565 1554,549" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector green" data-connector="populate" d="M1462 620 L1406 620"/>
    <polyline class="head green" points="1406,612 1390,620 1406,628" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector green" data-connector="populate" d="M1160 620 L1116 620"/>
    <polyline class="head green" points="1116,612 1100,620 1116,628" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector teal" data-connector="return" d="M860 620 L796 620"/>
    <polyline class="head teal" points="796,612 780,620 796,628" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  </g>

  <rect x="110" y="815" width="1480" height="34" rx="12" fill="#fbfdff" stroke="#d7e3ed" stroke-width="2"/>
  <text class="foot" x="850" y="838" text-anchor="middle">Solid lines show lookup/populate/return; dashed amber means cache miss fallback. DB read writes Redis MapCache, warms Caffeine, then returns UserRecord.</text>
</svg>
