<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1100" viewBox="0 0 2000 1100" role="img" aria-label="Ktor R2DBC coroutine cache single-flight architecture">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#25384d" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .lane{fill:#f8fbfd;stroke:#dce8f2;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#192538;font-weight:400}
      .subtitle,.detail,.foot{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:17px;font-weight:700;fill:#556678}
      .laneTitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:.08em;fill:#91a5b7}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#192538;font-weight:400}
      .smallTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;fill:#192538;font-weight:400}
      .mono{font-family:"Comic Mono","SFMono-Regular",ui-monospace,monospace;font-size:15px;font-weight:700;fill:#506176}
      .tiny{font-family:"Comic Mono","SFMono-Regular",ui-monospace,monospace;font-size:13px;font-weight:700;fill:#627287}
      .card{filter:url(#softShadow);stroke-width:2.4}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .blue{stroke:#3f83b8}
      .green{stroke:#6f8f52}
      .amber{stroke:#a36f3e}
      .teal{stroke:#4f8f8b}
      .rose{stroke:#a85f7f}
      .brown{stroke:#8a6f55}
      .note{fill:#f7fffe;stroke:#9fd0cb;stroke-width:2}

    .syntax-keyword{fill:#7E22CE}.syntax-type{fill:#0F766E}.syntax-function{fill:#1D4ED8}.syntax-string{fill:#B45309}.syntax-number{fill:#C2410C}.syntax-comment{fill:#64748B}.syntax-operator{fill:#BE123C}</style>
  </defs>

  <rect class="canvas" width="2000" height="1100"/>
  <rect class="frame" x="30" y="30" width="1940" height="1040" rx="24"/>
  <text class="title" x="72" y="92">Coroutine Single-Flight Cache</text>
  <text class="subtitle" x="76" y="126">Concurrent Ktor suspend callers share one in-flight DB producer per key; cancellation and timeout clean up the producer state.</text>

  <rect class="lane" x="60" y="155" width="1880" height="230" rx="18"/>
  <text class="laneTitle" x="86" y="190">HTTP CONTRACTS AND COROUTINE OUTCOMES</text>

  <g data-card="Read endpoint outcomes" data-x="100" data-y="235" data-width="560" data-height="105">
    <rect class="card" x="100" y="235" width="560" height="105" rx="15" fill="#ffffff" stroke="#5d7486"/>
    <text class="smallTitle" x="380" y="270" text-anchor="middle">GET /users/{id}</text>
    <text class="mono" x="132" y="302">HIT / MISS / COALESCED / NOT_FOUND</text>
    <text class="mono" x="132" y="326">loadDelayMillis=0..1000 validates test timing</text>
  </g>

  <g data-card="Timeout and cancellation" data-x="720" data-y="235" data-width="520" data-height="105">
    <rect class="card" x="720" y="235" width="520" height="105" rx="15" fill="#fff9ef" stroke="#a36f3e"/>
    <text class="smallTitle" x="980" y="270" text-anchor="middle">Timeout and cancellation</text>
    <text class="mono" x="752" y="302">producer timeout -> CACHE_LOAD_TIMEOUT</text>
    <text class="mono" x="752" y="326">cancelled waiter rethrows cancellation</text>
  </g>

  <g data-card="Write invalidation stats" data-x="1300" data-y="235" data-width="520" data-height="105">
    <rect class="card" x="1300" y="235" width="520" height="105" rx="15" fill="#f8fcf7" stroke="#6f8f52"/>
    <text class="smallTitle" x="1560" y="270" text-anchor="middle">Write, invalidation, stats</text>
    <text class="mono" x="1332" y="302">POST/PUT refresh cache after DB write</text>
    <text class="mono" x="1332" y="326">stats add coalesced, failures, cancellations</text>
  </g>

  <rect class="lane" x="60" y="420" width="1880" height="385" rx="18"/>
  <text class="laneTitle" x="86" y="455">SUSPEND CACHE-ASIDE CORE</text>

  <g data-card="Coroutine routes" data-x="100" data-y="535" data-width="300" data-height="150">
    <rect class="card" x="100" y="535" width="300" height="150" rx="16" fill="#f7fcff" stroke="#3f83b8"/>
    <path class="header" d="M100,587 L100,551 Q100,535 116,535 L384,535 Q400,535 400,551 L400,587 Z" fill="#eef5fa"/>
    <text class="cardTitle" x="250" y="569" text-anchor="middle">Coroutine routes</text>
    <text class="mono" x="132" y="624">validate id + delay</text>
    <text class="mono" x="132" y="652">map read result to status</text>
  </g>

  <g data-card="CoroutineUserCacheRepository" data-x="500" data-y="510" data-width="390" data-height="205">
    <rect class="card" x="500" y="510" width="390" height="205" rx="16" fill="#fff9ef" stroke="#a36f3e"/>
    <path class="header" d="M500,562 L500,526 Q500,510 516,510 L874,510 Q890,510 890,526 L890,562 Z" fill="#f5eee4"/>
    <text class="cardTitle" x="695" y="544" text-anchor="middle">CoroutineUserCache</text>
    <text class="cardTitle" x="695" y="572" text-anchor="middle">Repository</text>
    <text class="mono" x="532" y="618">read cache on Dispatchers.IO</text>
    <text class="mono" x="532" y="646" data-code-snippet="kotlin">cold miss joins loader.<tspan class="syntax-function">load</tspan>(id)</text>
    <text class="mono" x="532" y="674">writeCacheSafely records failures</text>
  </g>

  <g data-card="SingleFlightCacheLoader" data-x="990" data-y="510" data-width="390" data-height="205">
    <rect class="card" x="990" y="510" width="390" height="205" rx="16" fill="#f8fcf7" stroke="#6f8f52"/>
    <path class="header" d="M990,562 L990,526 Q990,510 1006,510 L1364,510 Q1380,510 1380,526 L1380,562 Z" fill="#f1f6ec"/>
    <text class="cardTitle" x="1185" y="544" text-anchor="middle">SingleFlight</text>
    <text class="cardTitle" x="1185" y="572" text-anchor="middle">CacheLoader</text>
    <text class="mono" x="1022" y="618" data-code-snippet="kotlin"><tspan class="syntax-type">ConcurrentHashMap</tspan><tspan class="syntax-operator">&lt;</tspan><tspan class="syntax-type">K</tspan>, <tspan class="syntax-type">Deferred</tspan><tspan class="syntax-operator">&gt;</tspan></text>
    <text class="mono" x="1022" y="646">Primary performs DB fallback</text>
    <text class="mono" x="1022" y="674">Shared returns COALESCED</text>
  </g>

  <g data-card="CoroutineCacheObservation" data-x="1480" data-y="535" data-width="340" data-height="150">
    <rect class="card" x="1480" y="535" width="340" height="150" rx="16" fill="#fff7f7" stroke="#a85f7f"/>
    <path class="header" d="M1480,587 L1480,551 Q1480,535 1496,535 L1804,535 Q1820,535 1820,551 L1820,587 Z" fill="#f5eef2"/>
    <text class="cardTitle" x="1650" y="569" text-anchor="middle">Observation</text>
    <text class="mono" x="1512" y="624">hits misses coalesced</text>
    <text class="mono" x="1512" y="652">load/cache failures</text>
  </g>

  <path class="connector blue" d="M400 610 H500" data-connector="routes-repository"/>
  <polygon points="500,610 488,603 488,617" fill="#3f83b8" stroke="#3f83b8" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector amber" d="M890 610 H990" data-connector="repository-loader"/>
  <polygon points="990,610 978,603 978,617" fill="#a36f3e" stroke="#a36f3e" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector rose" d="M1380 610 H1480" data-connector="loader-observation"/>
  <polygon points="1480,610 1468,603 1468,617" fill="#a85f7f" stroke="#a85f7f" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="lane" x="60" y="835" width="1880" height="150" rx="18"/>
  <text class="laneTitle" x="86" y="870">OWNED RESOURCES</text>

  <g data-card="Redisson coroutine cache store" data-x="470" data-y="900" data-width="420" data-height="58">
    <rect class="card" x="470" y="900" width="420" height="58" rx="14" fill="#f7fffe" stroke="#4f8f8b"/>
    <image data-bluetape4k-icon="redis/redis-icon.svg" href="data:image/svg+xml;base64," x="500" y="911" width="36" height="36"/>
    <text class="mono" x="710" y="935" text-anchor="middle">Redis RMap on Dispatchers.IO</text>
  </g>
  <g data-card="Exposed R2DBC H2" data-x="1010" data-y="900" data-width="420" data-height="58">
    <rect class="card" x="1010" y="900" width="420" height="58" rx="14" fill="#ffffff" stroke="#5d7486"/>
    <image data-bluetape4k-icon="database/h2.svg" href="data:image/svg+xml;base64," x="1045" y="913" width="32" height="32"/>
    <text class="mono" x="1252" y="935" text-anchor="middle">Exposed R2DBC H2 pool UserTable</text>
  </g>

  <path class="connector teal" d="M680 715 V900" data-connector="repository-cache"/>
  <polygon points="680,900 673,888 687,888" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector brown" d="M1185 715 V900" data-connector="loader-db"/>
  <polygon points="1185,900 1178,888 1192,888" fill="#8a6f55" stroke="#8a6f55" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="note" x="120" y="1025" width="1760" height="34" rx="12"/>
  <text class="foot" x="1000" y="1048" text-anchor="middle">One producer owns DB fallback; waiters share the result or cancellation without stale in-flight entries.</text>
</svg>
