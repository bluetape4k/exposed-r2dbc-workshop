    <rect x="740" y="478" width="292" height="118" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M740,522 L740,492 Q740,478 754,478 L1018,478 Q1032,478 1032,492 L1032,522 Z" fill="#f5eee4"/>
    <text x="886" y="497" class="tiny" text-anchor="middle">&lt;&lt;source fixtures&gt;&gt;</text>
    <text x="886" y="517" class="cardTitle" text-anchor="middle">Array + Unsigned</text>
