<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" role="img" aria-label="Exposed R2DBC column type test class structure">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:19px;fill:#1e293b}
      .connector{fill:none;stroke:#64748b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#solidArrow)}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect width="1440" height="980" class="canvas"/>
  <rect x="22" y="22" width="1396" height="936" rx="18" class="frame"/>

  <text x="58" y="70" class="title" text-anchor="start">Column Type Test Class Structure</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">The 02-types module groups nine R2DBC tests by source class, table fixture, and column DSL responsibility.</text>

  <rect x="50" y="130" width="1340" height="244" rx="16" class="lane"/>
  <text x="76" y="160" class="laneTitle" text-anchor="start">TEST CLASS GROUPS</text>

  <rect x="50" y="404" width="1340" height="244" rx="16" class="lane"/>
  <text x="76" y="434" class="laneTitle" text-anchor="start">TABLE OBJECTS AND LOCAL TABLES</text>

  <rect x="50" y="678" width="1340" height="172" rx="16" class="lane"/>
  <text x="76" y="708" class="laneTitle" text-anchor="start">COLUMN TYPE HELPERS AND CONTRACTS</text>

  <g data-card="Scalar Tests" data-x="92" data-y="204" data-width="292" data-height="118">
    <rect x="92" y="204" width="292" height="118" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M92,248 L92,218 Q92,204 106,204 L370,204 Q384,204 384,218 L384,248 Z" fill="#eef5fa"/>
    <text x="238" y="223" class="tiny" text-anchor="middle">&lt;&lt;extends base test&gt;&gt;</text>
    <text x="238" y="243" class="cardTitle" text-anchor="middle">Scalar Tests</text>
    <text x="112" y="274" class="detail" text-anchor="start">Ex01 Boolean</text>
    <text x="112" y="292" class="detail" text-anchor="start">Ex03 Numeric</text>
    <text x="112" y="310" class="detail" text-anchor="start">Ex04 Double</text>
  </g>

  <g data-card="Text Tests" data-x="416" data-y="204" data-width="292" data-height="118">
    <rect x="416" y="204" width="292" height="118" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M416,248 L416,218 Q416,204 430,204 L694,204 Q708,204 708,218 L708,248 Z" fill="#f1f6ec"/>
