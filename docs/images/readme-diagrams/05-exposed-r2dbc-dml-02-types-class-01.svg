  <rect x="96" y="892" width="1248" height="30" rx="10" class="noteBox"/>
  <text x="720" y="912" class="note" text-anchor="middle">All classes extend the shared R2DBC test base; cards summarize source-local tables and column builders exercised by the README examples.</text>
