    <rect x="92" y="742" width="292" height="84" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M92,776 L92,756 Q92,742 106,742 L370,742 Q384,742 384,756 L384,776 Z" fill="#eef7f6"/>
