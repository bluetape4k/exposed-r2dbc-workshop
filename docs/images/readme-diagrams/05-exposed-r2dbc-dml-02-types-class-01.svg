  <g data-card="Scalar Builders" data-x="416" data-y="742" data-width="292" data-height="84">
    <rect x="416" y="742" width="292" height="84" rx="14" fill="#ffffff" stroke="#8a6f55" stroke-width="2" class="card"/>
    <path class="header" d="M416,776 L416,756 Q416,742 430,742 L694,742 Q708,742 708,756 L708,776 Z" fill="#f3eee8"/>
