    <rect x="1064" y="478" width="292" height="118" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1064,522 L1064,492 Q1064,478 1078,478 L1342,478 Q1356,478 1356,492 L1356,522 Z" fill="#f5eef2"/>
