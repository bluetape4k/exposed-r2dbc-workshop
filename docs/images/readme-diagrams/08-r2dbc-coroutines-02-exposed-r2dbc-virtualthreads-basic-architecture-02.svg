<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" width="1320" height="820" role="img" aria-label="Platform Thread vs Virtual Thread comparison diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#3c82b4" stroke="#3c82b4" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#5f8848" stroke="#5f8848" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#a66a3f" stroke="#a66a3f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
      .connector{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}
      .metric{fill:#fff;stroke:#d7e2ec;stroke-width:1.1}
    </style>
  </defs>

  <rect width="1320" height="820" class="canvas"/>
  <rect x="22" y="22" width="1276" height="776" rx="18" class="frame"/>
  <text x="58" y="70" class="title" text-anchor="start">Platform Thread vs Virtual Thread Comparison</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">Repository-backed view of why Ex01_VirtualThreads combines JDK 21 virtual threads with Exposed R2DBC.</text>

  <rect x="52" y="130" width="590" height="500" rx="16" class="lane"/>
  <text x="78" y="162" class="laneTitle" text-anchor="start">PLATFORM THREAD MODEL</text>

  <g data-card="request" data-x="92" data-y="208" data-width="210" data-height="88">
    <rect x="92" y="208" width="210" height="88" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M92,250 L92,222 Q92,208 106,208 L288,208 Q302,208 302,222 L302,250 Z" fill="#eef5fa"/>
    <text x="197" y="226" class="tiny" text-anchor="middle">&lt;&lt;request&gt;&gt;</text>
    <text x="197" y="245" class="cardTitle" text-anchor="middle">blocking task</text>
    <text x="110" y="270" class="detail" text-anchor="start">one OS thread held</text>
  </g>

  <g data-card="OS thread" data-x="372" data-y="208" data-width="210" data-height="88">
    <rect x="372" y="208" width="210" height="88" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M372,250 L372,222 Q372,208 386,208 L568,208 Q582,208 582,222 L582,250 Z" fill="#f5eee4"/>
    <text x="477" y="226" class="tiny" text-anchor="middle">&lt;&lt;platform&gt;&gt;</text>
    <text x="477" y="245" class="cardTitle" text-anchor="middle">OS thread</text>
    <text x="390" y="270" class="detail" text-anchor="start">high creation cost</text>
  </g>

  <g data-card="DB wait" data-x="92" data-y="380" data-width="210" data-height="88">
    <rect x="92" y="380" width="210" height="88" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M92,422 L92,394 Q92,380 106,380 L288,380 Q302,380 302,394 L302,422 Z" fill="#f5eef2"/>
    <text x="197" y="398" class="tiny" text-anchor="middle">&lt;&lt;I/O wait&gt;&gt;</text>
    <text x="197" y="417" class="cardTitle" text-anchor="middle">thread parked</text>
    <text x="110" y="442" class="detail" text-anchor="start">~1MB per thread</text>
  </g>

  <g data-card="pool limit" data-x="372" data-y="380" data-width="210" data-height="88">
    <rect x="372" y="380" width="210" height="88" rx="14" fill="#fff" stroke="#8a6f55" stroke-width="2" class="card"/>
    <path class="header" d="M372,422 L372,394 Q372,380 386,380 L568,380 Q582,380 582,394 L582,422 Z" fill="#f3eee8"/>
    <text x="477" y="398" class="tiny" text-anchor="middle">&lt;&lt;capacity&gt;&gt;</text>
    <text x="477" y="417" class="cardTitle" text-anchor="middle">limited pool</text>
    <text x="390" y="442" class="detail" text-anchor="start">thousands scale</text>
  </g>

  <path class="connector" data-connector="platform-request" d="M 302 252 L 372 252" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="platform-db-wait" d="M 197 296 L 197 380" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="platform-pool" d="M 477 296 L 477 380" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="platform-limit" d="M 302 424 L 372 424" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>

  <rect x="678" y="130" width="590" height="500" rx="16" class="lane"/>
  <text x="704" y="162" class="laneTitle" text-anchor="start">R2DBC + VIRTUAL THREAD MODEL</text>

  <g data-card="runSuspendVT" data-x="718" data-y="208" data-width="210" data-height="88">
    <rect x="718" y="208" width="210" height="88" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M718,250 L718,222 Q718,208 732,208 L914,208 Q928,208 928,222 L928,250 Z" fill="#eef5fa"/>
    <text x="823" y="226" class="tiny" text-anchor="middle">&lt;&lt;JUnit 5&gt;&gt;</text>
    <text x="823" y="245" class="cardTitle" text-anchor="middle">runSuspendVT</text>
    <text x="736" y="270" class="detail" text-anchor="start">JDK 21 gated test</text>
  </g>

  <g data-card="VT dispatcher" data-x="998" data-y="208" data-width="210" data-height="88">
    <rect x="998" y="208" width="210" height="88" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M998,250 L998,222 Q998,208 1012,208 L1194,208 Q1208,208 1208,222 L1208,250 Z" fill="#eef7f6"/>
    <text x="1103" y="226" class="tiny" text-anchor="middle">&lt;&lt;dispatcher&gt;&gt;</text>
    <text x="1103" y="245" class="cardTitle" text-anchor="middle">Dispatchers.newVT</text>
    <text x="1016" y="270" class="detail" text-anchor="start">cheap task threads</text>
  </g>

  <g data-card="transaction APIs" data-x="718" data-y="380" data-width="210" data-height="88">
    <rect x="718" y="380" width="210" height="88" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M718,422 L718,394 Q718,380 732,380 L914,380 Q928,380 928,394 L928,422 Z" fill="#f1f6ec"/>
    <text x="823" y="398" class="tiny" text-anchor="middle">&lt;&lt;Exposed&gt;&gt;</text>
    <text x="823" y="417" class="cardTitle" text-anchor="middle">VT tx APIs</text>
    <text x="736" y="442" class="detail" text-anchor="start">virtualThreadTransaction</text>
  </g>

  <g data-card="R2DBC database" data-x="998" data-y="380" data-width="210" data-height="88">
    <rect x="998" y="380" width="210" height="88" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M998,422 L998,394 Q998,380 1012,380 L1194,380 Q1208,380 1208,394 L1208,422 Z" fill="#f5eef2"/>
    <text x="1103" y="398" class="tiny" text-anchor="middle">&lt;&lt;R2DBC&gt;&gt;</text>
    <text x="1103" y="417" class="cardTitle" text-anchor="middle">nonblocking DB</text>
    <text x="1016" y="442" class="detail" text-anchor="start">Flow / ResultRow</text>
  </g>

  <path class="connector" data-connector="vt-dispatcher" d="M 928 252 L 998 252" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="vt-tx" d="M 823 296 L 823 380" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="vt-db" d="M 928 424 L 998 424" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="vt-remount" d="M 1103 296 L 1103 380" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>

  <rect x="92" y="528" width="490" height="56" rx="10" class="metric"/>
  <text x="337" y="551" class="detail" text-anchor="middle">Platform threads: high creation cost, high memory, OS-level switching.</text>
  <text x="337" y="572" class="detail" text-anchor="middle">Blocking I/O keeps carrier capacity occupied.</text>

  <rect x="718" y="528" width="490" height="56" rx="10" class="metric"/>
  <text x="963" y="551" class="detail" text-anchor="middle">Virtual threads: low creation cost, small memory, JVM-level scheduling.</text>
  <text x="963" y="572" class="detail" text-anchor="middle">Ex01 uses maxAttempts and thread-safe result collection.</text>

  <rect x="82" y="682" width="1156" height="34" rx="10" class="noteBox"/>
  <text x="660" y="704" class="note" text-anchor="middle">Ex01_VirtualThreads is guarded by @EnabledOnJre(JRE.JAVA_21); MariaDB-like nested transaction cases are skipped.</text>
</svg>
