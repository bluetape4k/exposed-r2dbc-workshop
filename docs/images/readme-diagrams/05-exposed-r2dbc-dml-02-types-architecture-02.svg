<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" role="img" aria-label="Exposed R2DBC column type mapping architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#1e293b}
      .connector{fill:none;stroke:#64748b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#solidArrow)}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect width="1500" height="1000" class="canvas"/>
  <rect x="24" y="24" width="1452" height="952" rx="18" class="frame"/>

  <text x="64" y="72" class="title">Column Type Mapping Architecture</text>
  <text x="66" y="102" class="subtitle">The 02-types tests group Kotlin values by column builders, dialect storage rules, and R2DBC result decoding.</text>

  <rect x="58" y="132" width="1384" height="230" rx="16" class="lane"/>
  <text x="84" y="162" class="laneTitle" text-anchor="start">SOURCE TEST CASE GROUPS</text>

  <rect x="58" y="396" width="1384" height="230" rx="16" class="lane"/>
  <text x="84" y="426" class="laneTitle" text-anchor="start">EXPOSED R2DBC COLUMN DSL</text>

  <rect x="58" y="660" width="1384" height="220" rx="16" class="lane"/>
  <text x="84" y="690" class="laneTitle" text-anchor="start">DIALECT STORAGE AND RESULT CONTRACT</text>

  <g data-card="Scalar primitives" data-x="102" data-y="218" data-width="300" data-height="108">
    <rect x="102" y="218" width="300" height="108" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M102,260 L102,232 Q102,218 116,218 L388,218 Q402,218 402,232 L402,260 Z" fill="#eef5fa"/>
    <text x="252" y="236" class="tiny" text-anchor="middle">&lt;&lt;Ex01 / Ex03 / Ex04&gt;&gt;</text>
    <text x="252" y="255" class="cardTitle" text-anchor="middle">Scalar Primitives</text>
    <text x="124" y="286" class="detail" text-anchor="start">Boolean, numeric, double</text>
    <text x="124" y="304" class="detail" text-anchor="start">booleanParam, literals</text>
  </g>

  <g data-card="Text columns" data-x="438" data-y="218" data-width="300" data-height="108">
    <rect x="438" y="218" width="300" height="108" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M438,260 L438,232 Q438,218 452,218 L724,218 Q738,218 738,232 L738,260 Z" fill="#f1f6ec"/>
    <text x="588" y="236" class="tiny" text-anchor="middle">&lt;&lt;Ex02&gt;&gt;</text>
    <text x="588" y="255" class="cardTitle" text-anchor="middle">Text Columns</text>
    <text x="460" y="286" class="detail" text-anchor="start">char, varchar, text</text>
    <text x="460" y="304" class="detail" text-anchor="start">mediumText, largeText</text>
  </g>

  <g data-card="Collection and unsigned" data-x="774" data-y="218" data-width="300" data-height="108">
    <rect x="774" y="218" width="300" height="108" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M774,260 L774,232 Q774,218 788,218 L1060,218 Q1074,218 1074,232 L1074,260 Z" fill="#f5eee4"/>
    <text x="924" y="236" class="tiny" text-anchor="middle">&lt;&lt;Ex05 / Ex07&gt;&gt;</text>
    <text x="924" y="255" class="cardTitle" text-anchor="middle">Array + Unsigned</text>
    <text x="796" y="286" class="detail" text-anchor="start">array&lt;T&gt;, anyFrom/allFrom</text>
    <text x="796" y="304" class="detail" text-anchor="start">ubyte, ushort, uint, ulong</text>
  </g>

  <g data-card="Binary and identity" data-x="1110" data-y="218" data-width="300" data-height="108">
    <rect x="1110" y="218" width="300" height="108" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1110,260 L1110,232 Q1110,218 1124,218 L1396,218 Q1410,218 1410,232 L1410,260 Z" fill="#f5eef2"/>
    <text x="1260" y="236" class="tiny" text-anchor="middle">&lt;&lt;Ex08 / Ex09 / Ex10&gt;&gt;</text>
    <text x="1260" y="255" class="cardTitle" text-anchor="middle">Binary + Identity</text>
    <text x="1132" y="286" class="detail" text-anchor="start">blob, ExposedBlob</text>
    <text x="1132" y="304" class="detail" text-anchor="start">javaUUID, kotlinUUID</text>
  </g>

  <g data-card="Column builders" data-x="102" data-y="480" data-width="300" data-height="112">
    <rect x="102" y="480" width="300" height="112" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M102,522 L102,494 Q102,480 116,480 L388,480 Q402,480 402,494 L402,522 Z" fill="#eef5fa"/>
    <text x="252" y="498" class="tiny" text-anchor="middle">&lt;&lt;ColumnType surface&gt;&gt;</text>
    <text x="252" y="517" class="cardTitle" text-anchor="middle">Column Builders</text>
    <text x="124" y="548" class="detail" text-anchor="start">bool, integer, decimal</text>
    <text x="124" y="566" class="detail" text-anchor="start">float, double, byte</text>
  </g>

  <g data-card="String builders" data-x="438" data-y="480" data-width="300" data-height="112">
    <rect x="438" y="480" width="300" height="112" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M438,522 L438,494 Q438,480 452,480 L724,480 Q738,480 738,494 L738,522 Z" fill="#f1f6ec"/>
    <text x="588" y="498" class="tiny" text-anchor="middle">&lt;&lt;Text column builders&gt;&gt;</text>
    <text x="588" y="517" class="cardTitle" text-anchor="middle">String Builders</text>
    <text x="460" y="548" class="detail" text-anchor="start">char, varchar, text</text>
    <text x="460" y="566" class="detail" text-anchor="start">alias and comparisons</text>
  </g>

  <g data-card="Capability gates" data-x="774" data-y="480" data-width="300" data-height="112">
    <rect x="774" y="480" width="300" height="112" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M774,522 L774,494 Q774,480 788,480 L1060,480 Q1074,480 1074,494 L1074,522 Z" fill="#f5eee4"/>
    <text x="924" y="498" class="tiny" text-anchor="middle">&lt;&lt;dialect support&gt;&gt;</text>
    <text x="924" y="517" class="cardTitle" text-anchor="middle">Capability Gates</text>
    <text x="796" y="548" class="detail" text-anchor="start">Assumptions for arrays</text>
    <text x="796" y="566" class="detail" text-anchor="start">expectException paths</text>
  </g>

  <g data-card="Binary and UUID builders" data-x="1110" data-y="480" data-width="300" data-height="112">
    <rect x="1110" y="480" width="300" height="112" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1110,522 L1110,494 Q1110,480 1124,480 L1396,480 Q1410,480 1410,494 L1410,522 Z" fill="#f5eef2"/>
    <text x="1260" y="498" class="tiny" text-anchor="middle">&lt;&lt;binary / identity&gt;&gt;</text>
    <text x="1260" y="517" class="cardTitle" text-anchor="middle">Blob + UUID Builders</text>
    <text x="1132" y="548" class="detail" text-anchor="start">blobParam, byte streams</text>
    <text x="1132" y="566" class="detail" text-anchor="start">Uuid.generateV7()</text>
  </g>

  <g data-card="Dialect mappings" data-x="160" data-y="736" data-width="360" data-height="98">
    <rect x="160" y="736" width="360" height="98" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M160,778 L160,750 Q160,736 174,736 L506,736 Q520,736 520,750 L520,778 Z" fill="#eef7f6"/>
    <text x="340" y="754" class="tiny" text-anchor="middle">&lt;&lt;H2 / PostgreSQL / MySQL / MariaDB&gt;&gt;</text>
    <text x="340" y="773" class="cardTitle" text-anchor="middle">Dialect Type Mapping</text>
    <text x="184" y="806" class="detail" text-anchor="start">BOOLEAN/TINYINT, TEXT/CLOB, UUID/BINARY(16)</text>
  </g>

  <g data-card="R2DBC decoding" data-x="570" data-y="736" data-width="360" data-height="98">
    <rect x="570" y="736" width="360" height="98" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M570,778 L570,750 Q570,736 584,736 L916,736 Q930,736 930,750 L930,778 Z" fill="#f1f6ec"/>
    <text x="750" y="754" class="tiny" text-anchor="middle">&lt;&lt;Flow&lt;ResultRow&gt;&gt;</text>
    <text x="750" y="773" class="cardTitle" text-anchor="middle">R2DBC Decoding</text>
    <text x="594" y="806" class="detail" text-anchor="start">single, first, toList, bytes/inputStream</text>
  </g>

  <g data-card="Assertions" data-x="980" data-y="736" data-width="360" data-height="98">
    <rect x="980" y="736" width="360" height="98" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M980,778 L980,750 Q980,736 994,736 L1326,736 Q1340,736 1340,750 L1340,778 Z" fill="#f5eee4"/>
    <text x="1160" y="754" class="tiny" text-anchor="middle">&lt;&lt;test contract&gt;&gt;</text>
    <text x="1160" y="773" class="cardTitle" text-anchor="middle">Value Assertions</text>
    <text x="1004" y="806" class="detail" text-anchor="start">round-trip equality and unsupported-type errors</text>
  </g>

  <path class="connector" data-connector="scalar-to-builders" d="M 252 326 L 252 480"/>
  <path class="connector" data-connector="text-to-builders" d="M 588 326 L 588 480"/>
  <path class="connector" data-connector="array-to-gates" d="M 924 326 L 924 480"/>
  <path class="connector" data-connector="binary-to-builders" d="M 1260 326 L 1260 480"/>
  <path class="connector" data-connector="builders-to-mapping" d="M 252 592 L 252 636 Q 252 646 262 646 L 330 646 Q 340 646 340 656 L 340 736"/>
  <path class="connector" data-connector="strings-to-decoding" d="M 588 592 L 588 636 Q 588 646 598 646 L 740 646 Q 750 646 750 656 L 750 736"/>
  <path class="connector" data-connector="gates-to-assertions" d="M 924 592 L 924 636 Q 924 646 934 646 L 1090 646 Q 1100 646 1100 656 L 1100 736"/>
  <path class="connector" data-connector="binary-to-assertions" d="M 1260 592 L 1260 636 Q 1260 646 1250 646 L 1230 646 Q 1220 646 1220 656 L 1220 736"/>

  <rect x="112" y="920" width="1276" height="30" rx="10" class="noteBox"/>
  <text x="750" y="940" class="note" text-anchor="middle">Solid arrows show repository-backed responsibility handoffs from type examples to Exposed builders, dialect mappings, and R2DBC value assertions.</text>
</svg>
