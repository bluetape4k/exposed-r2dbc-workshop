<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1216" viewBox="0 0 1366 1216" role="img" aria-label="Layer Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1366" height="1216"/>
<rect class="frame" x="32" y="28" width="1302" height="1160" rx="28"/>
<text class="title" x="66" y="82">Layer Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M473 355 L473 439 L1103 439 L1103 502"/>
<path class="line" d="M893 376 L893 753 L683 753 L683 824"/>
<path class="line" d="M683 502 L683 423 L473 423 L473 355"/>
<path class="line" d="M263 502 L263 415 L893 415 L893 376"/>
<g transform="translate(298,180)">
  <rect class="card" x="0" y="0" width="350" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">ActorRepository</text>
  <text class="mono" x="18" y="108">+findById(id)</text>
<text class="mono" x="18" y="129">+findAll()</text>
<text class="mono" x="18" y="150">+create(actor)</text>
</g>
<g transform="translate(718,180)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">MovieRepository</text>
  <text class="mono" x="18" y="108">+findById(id)</text>
<text class="mono" x="18" y="129">+findAll()</text>
<text class="mono" x="18" y="150">+create(movie)</text>
<text class="mono" x="18" y="171">+deleteById(id)</text>
</g>
<g transform="translate(88,502)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">MovieController</text>
  <text class="mono" x="18" y="108">+getMovieById(id)</text>
<text class="mono" x="18" y="129">+searchMovies(request)</text>
<text class="mono" x="18" y="150">+createMovie(movie)</text>
<text class="mono" x="18" y="171">+deleteMovie(id)</text>
</g>
<g transform="translate(508,502)">
  <rect class="card" x="0" y="0" width="350" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#DC6B82"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">ActorController</text>
  <text class="mono" x="18" y="108">+getAllActors()</text>
<text class="mono" x="18" y="129">+getActorById(id)</text>
<text class="mono" x="18" y="150">+createActor(actor)</text>
</g>
<g transform="translate(928,502)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#45A7A1"/>
  <text class="small" x="175" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="175" y="61" text-anchor="middle">ActorTable</text>
  <text class="mono" x="18" y="108">+id LongIdTable</text>
<text class="mono" x="18" y="129">+firstName varchar</text>
<text class="mono" x="18" y="150">+lastName varchar</text>
<text class="mono" x="18" y="171">+birthday date</text>
</g>
<g transform="translate(508,824)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#8A72D6"/>
  <text class="small" x="175" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="175" y="61" text-anchor="middle">MovieTable</text>
  <text class="mono" x="18" y="108">+id LongIdTable</text>
<text class="mono" x="18" y="129">+name varchar</text>
<text class="mono" x="18" y="150">+producerName varchar</text>
<text class="mono" x="18" y="171">+releaseDate datetime</text>
</g>
</svg>
