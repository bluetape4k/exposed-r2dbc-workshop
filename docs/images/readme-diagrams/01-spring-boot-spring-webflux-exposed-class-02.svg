<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920" role="img" aria-label="Spring WebFlux Exposed R2DBC class and layer map">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="126%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}.frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}.laneAlt{fill:#fbfdff;stroke:#d7e2ec;stroke-width:1.3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#1e293b}
      .stereo{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#6b7f92;font-weight:700}
      .card{filter:url(#shadow)}
      .connector{fill:none;stroke:#64748b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .dep{fill:none;stroke-width:2.3;stroke-dasharray:8 7;stroke-linecap:butt;stroke-linejoin:round}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
  </defs>
  <rect class="canvas" width="1440" height="920"/>
  <rect class="frame" x="24" y="24" width="1392" height="872" rx="22"/>
  <text class="title" x="72" y="86">Spring WebFlux Exposed R2DBC Layer Map</text>
  <text class="subtitle" x="74" y="120">Source-backed class view: suspend controllers call repositories inside Exposed R2DBC transactions.</text>

  <rect class="lane" x="54" y="150" width="1332" height="146" rx="18"/>
  <text class="laneTitle" x="84" y="184">WEBFLUX API</text>
  <rect class="laneAlt" x="54" y="318" width="1332" height="126" rx="18"/>
  <text class="laneTitle" x="84" y="352">TRANSACTION BOUNDARY</text>
  <rect class="lane" x="54" y="466" width="1332" height="170" rx="18"/>
  <text class="laneTitle" x="84" y="500">REPOSITORY + DSL</text>
  <rect class="laneAlt" x="54" y="658" width="1332" height="156" rx="18"/>
  <text class="laneTitle" x="84" y="692">SCHEMA + R2DBC CONFIG</text>

  <g class="card" data-node="MovieController">
    <rect x="106" y="200" width="270" height="74" rx="14" fill="#eef6ff" stroke="#4f86c6" stroke-width="2"/>
    <text class="stereo" x="241" y="222" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
    <text class="cardTitle" x="241" y="246" text-anchor="middle">MovieController</text>
    <text class="detail" x="241" y="264" text-anchor="middle">/movies CRUD + search</text>
  </g>
  <g class="card" data-node="ActorController">
    <rect x="438" y="200" width="270" height="74" rx="14" fill="#f1f8ed" stroke="#6f8f52" stroke-width="2"/>
    <text class="stereo" x="573" y="222" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
    <text class="cardTitle" x="573" y="246" text-anchor="middle">ActorController</text>
    <text class="detail" x="573" y="264" text-anchor="middle">/actors CRUD + search</text>
  </g>
  <g class="card" data-node="MovieActorsController">
    <rect x="770" y="200" width="330" height="74" rx="14" fill="#fff5e8" stroke="#b68432" stroke-width="2"/>
    <text class="stereo" x="935" y="222" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
    <text class="cardTitle" x="935" y="246" text-anchor="middle">MovieActorsController</text>
    <text class="detail" x="935" y="264" text-anchor="middle">/movie-actors join views</text>
  </g>
  <g class="card" data-node="DataInitializer">
    <rect x="1160" y="200" width="170" height="74" rx="14" fill="#f6f1fb" stroke="#805aa8" stroke-width="2"/>
    <text class="stereo" x="1245" y="222" text-anchor="middle">&lt;&lt;Component&gt;&gt;</text>
    <text class="cardTitle" x="1245" y="246" text-anchor="middle">DataInitializer</text>
    <text class="detail" x="1245" y="264" text-anchor="middle">seed data</text>
  </g>

  <g class="card" data-node="suspendTransaction">
    <rect x="385" y="360" width="670" height="58" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2.2"/>
    <text class="cardTitle" x="720" y="386" text-anchor="middle">suspendTransaction { ... }</text>
    <text class="detail" x="720" y="405" text-anchor="middle">controller handlers execute repository calls in Exposed R2DBC coroutine transactions</text>
  </g>

  <g class="card" data-node="MovieRepository">
    <rect x="182" y="520" width="360" height="82" rx="14" fill="#fff7ed" stroke="#a66a3f" stroke-width="2"/>
    <text class="stereo" x="362" y="542" text-anchor="middle">&lt;&lt;Repository&gt;&gt;</text>
    <text class="cardTitle" x="362" y="566" text-anchor="middle">MovieRepository</text>
    <text class="detail" x="362" y="584" text-anchor="middle">CRUD, joins, counts, acting producers</text>
  </g>
  <g class="card" data-node="ActorRepository">
    <rect x="622" y="520" width="300" height="82" rx="14" fill="#edf8f7" stroke="#4f8f8b" stroke-width="2"/>
    <text class="stereo" x="772" y="542" text-anchor="middle">&lt;&lt;Repository&gt;&gt;</text>
    <text class="cardTitle" x="772" y="566" text-anchor="middle">ActorRepository</text>
    <text class="detail" x="772" y="584" text-anchor="middle">CRUD + query-param search</text>
  </g>
  <g class="card" data-node="DTOs">
    <rect x="1002" y="520" width="250" height="82" rx="14" fill="#fdf2f8" stroke="#a85f7f" stroke-width="2"/>
    <text class="stereo" x="1127" y="542" text-anchor="middle">&lt;&lt;model&gt;&gt;</text>
    <text class="cardTitle" x="1127" y="566" text-anchor="middle">DTO + Mappers</text>
    <text class="detail" x="1127" y="584" text-anchor="middle">ResultRow -&gt; records</text>
  </g>

  <g class="card" data-node="MovieSchema">
    <rect x="190" y="712" width="382" height="74" rx="14" fill="#eef6ff" stroke="#4f86c6" stroke-width="2"/>
    <text class="stereo" x="381" y="734" text-anchor="middle">&lt;&lt;Exposed schema&gt;&gt;</text>
    <text class="cardTitle" x="381" y="758" text-anchor="middle">MovieSchema</text>
    <text class="detail" x="381" y="776" text-anchor="middle">movies, actors, actors_in_movies</text>
  </g>
  <g class="card" data-node="ExposedR2dbcConfig">
    <rect x="690" y="712" width="404" height="74" rx="14" fill="#f5f7fb" stroke="#64748b" stroke-width="2"/>
    <text class="stereo" x="892" y="734" text-anchor="middle">&lt;&lt;Configuration&gt;&gt;</text>
    <text class="cardTitle" x="892" y="758" text-anchor="middle">ExposedR2dbcConfig</text>
    <text class="detail" x="892" y="776" text-anchor="middle">profiles -&gt; ConnectionPool -&gt; R2dbcDatabase</text>
  </g>

  <path class="dep" d="M 241 274 V 300 Q 241 322 263 322 H 498 Q 520 322 520 330 V 346" stroke="#4f86c6"/>
  <polygon points="520,360 512,346 528,346" fill="#4f86c6" stroke="#4f86c6" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 573 274 V 300 Q 573 322 595 322 H 698 Q 720 322 720 330 V 346" stroke="#6f8f52"/>
  <polygon points="720,360 712,346 728,346" fill="#6f8f52" stroke="#6f8f52" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 935 274 V 300 C 935 314 920 308 920 322 V 346" stroke="#b68432"/>
  <polygon points="920,360 912,346 928,346" fill="#b68432" stroke="#b68432" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 1245 274 V 320 Q 1245 342 1267 342 H 1303 Q 1325 342 1325 364 V 728 Q 1325 749 1303 749 H 1108" stroke="#805aa8"/>
  <polygon points="1094,749 1108,741 1108,757" fill="#805aa8" stroke="#805aa8" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector" d="M 590 418 V 448 Q 590 470 568 470 H 384 Q 362 470 362 492 V 506" stroke="#a66a3f" style="stroke:#a66a3f"/>
  <polygon points="362,520 354,506 370,506" fill="#a66a3f" stroke="#a66a3f" stroke-width="1.6" stroke-linejoin="round"/>
  <path class="connector" d="M 770 418 V 506" stroke="#4f8f8b" style="stroke:#4f8f8b"/>
  <polygon points="770,520 762,506 778,506" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1.6" stroke-linejoin="round"/>
  <path class="dep" d="M 922 561 H 988" stroke="#a85f7f"/>
  <polygon points="1002,561 988,553 988,569" fill="#a85f7f" stroke="#a85f7f" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="dep" d="M 330 602 V 698" stroke="#a66a3f"/>
  <polygon points="330,712 322,698 338,698" fill="#a66a3f" stroke="#a66a3f" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 772 602 V 642 Q 772 664 750 664 H 454 Q 432 664 432 682 V 698" stroke="#4f8f8b"/>
  <polygon points="432,712 424,698 440,698" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 1020 418 V 450 Q 1020 472 1042 472 H 1258 Q 1280 472 1280 494 V 650 Q 1280 672 1258 672 H 982 Q 960 672 960 680 V 698" stroke="#64748b"/>
  <polygon points="960,712 952,698 968,698" fill="#64748b" stroke="#64748b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect x="116" y="842" width="1208" height="30" rx="10" class="noteBox"/>
  <text class="note" x="720" y="862" text-anchor="middle">Dashed arrows are source dependencies; solid arrows show transaction dispatch. Arrowheads are direct solid geometry for PNG safety.</text>
</svg>
