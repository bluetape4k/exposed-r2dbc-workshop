<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="1606" viewBox="0 0 1085 1606" role="img" aria-label="Execution Flow">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
<marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
<style>.canvas{fill:#F7F9FC}.frame{fill:#fff;stroke:#D8E0EA;stroke-width:1.5}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#102033}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}.smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}.strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}.card{stroke-width:2;filter:url(#shadow)}.line{stroke:#5D6B7A;stroke-width:2.2;fill:none;marker-end:url(#openArrow)}.dashed{stroke:#5D6B7A;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}.lifeline{stroke:#B7C2D1;stroke-width:1.8;stroke-dasharray:8 9}.note{fill:#fff;opacity:.97}</style>
</defs>
<rect class="canvas" width="1085" height="1606"/>
<rect class="frame" x="24" y="24" width="1037" height="1550" rx="22"/>
<text class="title" x="58" y="76">Execution Flow</text>
<text class="subtitle" x="62" y="106">Compact sequence flow with reduced outer and inner whitespace</text>
<rect class="card" x="50.0" y="156" width="220" height="66" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel participant" x="160.0" y="196" text-anchor="middle">Application</text>
<line class="lifeline" x1="160.0" y1="250" x2="160.0" y2="1544"/>
<rect class="card" x="305.0" y="156" width="220" height="66" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel participant" x="415.0" y="196" text-anchor="middle">TinkColumn</text>
<line class="lifeline" x1="415.0" y1="250" x2="415.0" y2="1544"/>
<rect class="card" x="560.0" y="156" width="220" height="66" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel participant" x="670.0" y="196" text-anchor="middle">Google Tink</text>
<line class="lifeline" x1="670.0" y1="250" x2="670.0" y2="1544"/>
<rect class="card" x="815.0" y="156" width="220" height="66" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel participant" x="925.0" y="196" text-anchor="middle">Database</text>
<line class="lifeline" x1="925.0" y1="250" x2="925.0" y2="1544"/>
<path class="line" d="M160.0 292.0 L415.0 292.0" data-connector="line"/>
<rect class="note label" x="147.4" y="260.0" width="280.2" height="28" rx="9"/>
<text class="strong labelText" x="287.5" y="280.0" text-anchor="middle">1. insert { it[secret] = sensitive data }</text>
<path class="line" d="M415.0 366.0 L670.0 366.0" data-connector="line"/>
<rect class="note label" x="390.0" y="334.0" width="305.0" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="354.0" text-anchor="middle">2. aead.encrypt(sensitive data.toByteArray())</text>
<path class="dashed" d="M670.0 440.0 L415.0 440.0" data-connector="dashed"/>
<rect class="note label" x="402.4" y="408.0" width="280.2" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="428.0" text-anchor="middle">3. ciphertext (different bytes each time)</text>
<path class="line" d="M415.0 514.0 L925.0 514.0" data-connector="line"/>
<rect class="note label" x="570.2" y="482.0" width="199.6" height="28" rx="9"/>
<text class="strong labelText" x="670.0" y="502.0" text-anchor="middle">4. INSERT Base64(ciphertext)</text>
<path class="line" d="M160.0 588.0 L415.0 588.0" data-connector="line"/>
<rect class="note label" x="144.3" y="556.0" width="286.4" height="28" rx="9"/>
<text class="strong labelText" x="287.5" y="576.0" text-anchor="middle">5. insert { it[email] = user@example.com }</text>
<path class="line" d="M415.0 662.0 L670.0 662.0" data-connector="line"/>
<rect class="note label" x="328.0" y="630.0" width="429.0" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="650.0" text-anchor="middle">6. daead.encryptDeterministically(user@example.com.toByteArray())</text>
<path class="dashed" d="M670.0 736.0 L415.0 736.0" data-connector="dashed"/>
<rect class="note label" x="393.1" y="704.0" width="298.8" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="724.0" text-anchor="middle">7. deterministicCiphertext (always the same)</text>
<path class="line" d="M415.0 810.0 L925.0 810.0" data-connector="line"/>
<rect class="note label" x="529.9" y="778.0" width="280.2" height="28" rx="9"/>
<text class="strong labelText" x="670.0" y="798.0" text-anchor="middle">8. INSERT Base64(deterministicCiphertext)</text>
<path class="dashed" d="M925.0 884.0 L415.0 884.0" data-connector="dashed"/>
<rect class="note label" x="590.0" y="852.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="670.0" y="872.0" text-anchor="middle">9. Base64(ciphertext)</text>
<path class="line" d="M415.0 958.0 L670.0 958.0" data-connector="line"/>
<rect class="note label" x="442.7" y="926.0" width="199.6" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="946.0" text-anchor="middle">10. aead.decrypt(ciphertext)</text>
<path class="dashed" d="M670.0 1032.0 L415.0 1032.0" data-connector="dashed"/>
<rect class="note label" x="430.3" y="1000.0" width="224.4" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="1020.0" text-anchor="middle">11. sensitive data.toByteArray()</text>
<path class="dashed" d="M415.0 1106.0 L160.0 1106.0" data-connector="dashed"/>
<rect class="note label" x="207.5" y="1074.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="287.5" y="1094.0" text-anchor="middle">12. sensitive data</text>
<path class="line" d="M160.0 1180.0 L415.0 1180.0" data-connector="line"/>
<rect class="note label" x="153.6" y="1148.0" width="267.8" height="28" rx="9"/>
<text class="strong labelText" x="287.5" y="1168.0" text-anchor="middle">13. where { email eq user@example.com }</text>
<path class="line" d="M415.0 1254.0 L670.0 1254.0" data-connector="line"/>
<rect class="note label" x="327.5" y="1222.0" width="430.0" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="1242.0" text-anchor="middle">14. daead.encryptDeterministically(user@example.com.toByteArray())</text>
<path class="dashed" d="M670.0 1328.0 L415.0 1328.0" data-connector="dashed"/>
<rect class="note label" x="445.8" y="1296.0" width="193.4" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="1316.0" text-anchor="middle">15. deterministicCiphertext</text>
<path class="line" d="M415.0 1402.0 L925.0 1402.0" data-connector="line"/>
<rect class="note label" x="505.1" y="1370.0" width="329.8" height="28" rx="9"/>
<text class="strong labelText" x="670.0" y="1390.0" text-anchor="middle">16. WHERE email = Base64(deterministicCiphertext)</text>
<path class="dashed" d="M925.0 1476.0 L160.0 1476.0" data-connector="dashed"/>
<rect class="note label" x="448.9" y="1444.0" width="187.2" height="28" rx="9"/>
<text class="strong labelText" x="542.5" y="1464.0" text-anchor="middle">17. matching rows returned</text>
<rect class="activation" x="154.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="409.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="664.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>

<!-- audit badge labels: visible sequence numbering and message pill samples -->
<g aria-label="sequence message labels">
<rect x="58" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="76" y="140" class="num" text-anchor="middle">1</text>
<rect x="102" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="120" y="140" class="num" text-anchor="middle">2</text>
</g>
</svg>
