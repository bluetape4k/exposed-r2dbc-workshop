<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="2226" viewBox="0 0 1344 2226" role="img" aria-label="Execution Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1344" height="2226"/>
<rect class="frame" x="32" y="28" width="1280" height="2170" rx="28"/>
<text class="title" x="66" y="82">Execution Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="25" y="166" width="230" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="379.6666666666667" y="166" width="230" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="494.6666666666667" y="209" text-anchor="middle">TinkColumn</text>
<line class="lifeline" x1="494.6666666666667" y1="252" x2="494.6666666666667" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="734.3333333333334" y="166" width="230" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="849.3333333333334" y="209" text-anchor="middle">Google Tink</text>
<line class="lifeline" x1="849.3333333333334" y1="252" x2="849.3333333333334" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1089" y="166" width="230" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1204" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1204" y1="252" x2="1204" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="133.83333333333337" y="286" width="367" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="151.83333333333337" y="313" text-anchor="start">1. insert { it[secret] = sensitive data }</text>
<path class="line" d="M140 344 L494.6666666666667 344"/>
<rect x="472.5" y="396" width="399" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="490.5" y="423" text-anchor="start">2. aead.encrypt(sensitive data.toByteArray())</text>
<path class="line" d="M494.6666666666667 454 L849.3333333333334 454"/>
<rect x="488.5" y="506" width="367" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="506.5" y="533" text-anchor="start">3. ciphertext (different bytes each time)</text>
<path class="dashed" d="M849.3333333333334 564 L494.6666666666667 564"/>
<rect x="718.3333333333334" y="616" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="736.3333333333334" y="643" text-anchor="start">4. INSERT Base64(ciphertext)</text>
<path class="line" d="M494.6666666666667 674 L1204 674"/>
<rect x="129.83333333333337" y="726" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="147.83333333333337" y="753" text-anchor="start">5. insert { it[email] = user@example.com }</text>
<path class="line" d="M140 784 L494.6666666666667 784"/>
<rect x="392" y="836" width="560" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="410" y="863" text-anchor="start">6. daead.encryptDeterministically(user@example.com.toByteArray())</text>
<path class="line" d="M494.6666666666667 894 L849.3333333333334 894"/>
<rect x="476.5" y="946" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="494.5" y="973" text-anchor="start">7. deterministicCiphertext (always the same)</text>
<path class="dashed" d="M849.3333333333334 1004 L494.6666666666667 1004"/>
<rect x="665.8333333333334" y="1056" width="367" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683.8333333333334" y="1083" text-anchor="start">8. INSERT Base64(deterministicCiphertext)</text>
<path class="line" d="M494.6666666666667 1114 L1204 1114"/>
<rect x="744.3333333333334" y="1166" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="762.3333333333334" y="1193" text-anchor="start">9. Base64(ciphertext)</text>
<path class="dashed" d="M1204 1224 L494.6666666666667 1224"/>
<rect x="541" y="1276" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="559" y="1303" text-anchor="start">10. aead.decrypt(ciphertext)</text>
<path class="line" d="M494.6666666666667 1334 L849.3333333333334 1334"/>
<rect x="525" y="1386" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="543" y="1413" text-anchor="start">11. sensitive data.toByteArray()</text>
<path class="dashed" d="M849.3333333333334 1444 L494.6666666666667 1444"/>
<rect x="212.33333333333337" y="1496" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="1523" text-anchor="start">12. sensitive data</text>
<path class="dashed" d="M494.6666666666667 1554 L140 1554"/>
<rect x="141.83333333333337" y="1606" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="159.83333333333337" y="1633" text-anchor="start">13. where { email eq user@example.com }</text>
<path class="line" d="M140 1664 L494.6666666666667 1664"/>
<rect x="388" y="1716" width="568" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="406" y="1743" text-anchor="start">14. daead.encryptDeterministically(user@example.com.toByteArray())</text>
<path class="line" d="M494.6666666666667 1774 L849.3333333333334 1774"/>
<rect x="545" y="1826" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="563" y="1853" text-anchor="start">15. deterministicCiphertext</text>
<path class="dashed" d="M849.3333333333334 1884 L494.6666666666667 1884"/>
<rect x="633.8333333333334" y="1936" width="431" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="651.8333333333334" y="1963" text-anchor="start">16. WHERE email = Base64(deterministicCiphertext)</text>
<path class="line" d="M494.6666666666667 1994 L1204 1994"/>
<rect x="549" y="2046" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="567" y="2073" text-anchor="start">17. matching rows returned</text>
<path class="dashed" d="M1204 2104 L140 2104"/>
</svg>
