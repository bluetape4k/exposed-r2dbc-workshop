<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="1456" viewBox="0 0 1584 1456" role="img" aria-label="Coroutine + R2DBC Transaction">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1584" height="1456"/>
<rect class="frame" x="32" y="28" width="1520" height="1400" rx="28"/>
<text class="title" x="66" y="82">Coroutine + R2DBC Transaction</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-5" y="166" width="290" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">runTest / TestScope</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1396" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="429.66666666666674" y="166" width="290" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="574.6666666666667" y="209" text-anchor="middle">withTables / withDb</text>
<line class="lifeline" x1="574.6666666666667" y1="252" x2="574.6666666666667" y2="1396" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="864.3333333333334" y="166" width="290" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1009.3333333333334" y="209" text-anchor="middle">suspendTransaction</text>
<line class="lifeline" x1="1009.3333333333334" y1="252" x2="1009.3333333333334" y2="1396" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1299" y="166" width="290" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1444" y="209" text-anchor="middle">R2DBC DB</text>
<line class="lifeline" x1="1444" y1="252" x2="1444" y2="1396" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="218.33333333333337" y="286" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="236.33333333333337" y="313" text-anchor="start">1. withTables(testDB, *tables)</text>
<path class="line" d="M140 344 L574.6666666666667 344"/>
<rect x="870.3333333333334" y="396" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="888.3333333333334" y="423" text-anchor="start">2. SchemaUtils.create(*tables)</text>
<path class="line" d="M574.6666666666667 454 L1444 454"/>
<rect x="657" y="506" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="675" y="533" text-anchor="start">3. suspendTransaction { ... }</text>
<path class="line" d="M574.6666666666667 564 L1009.3333333333334 564"/>
<rect x="1121.6666666666667" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1139.6666666666667" y="643" text-anchor="start">4. BEGIN</text>
<path class="line" d="M1009.3333333333334 674 L1444 674"/>
<rect x="1121.6666666666667" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1139.6666666666667" y="753" text-anchor="start">5. Execute DML</text>
<path class="line" d="M1009.3333333333334 784 L1444 784"/>
<rect x="1121.6666666666667" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1139.6666666666667" y="863" text-anchor="start">6. Flow / Result</text>
<path class="dashed" d="M1444 894 L1009.3333333333334 894"/>
<rect x="1121.6666666666667" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1139.6666666666667" y="973" text-anchor="start">7. COMMIT</text>
<path class="line" d="M1009.3333333333334 1004 L1444 1004"/>
<rect x="687" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="705" y="1083" text-anchor="start">8. result</text>
<path class="dashed" d="M1009.3333333333334 1114 L574.6666666666667 1114"/>
<rect x="878.3333333333334" y="1166" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="896.3333333333334" y="1193" text-anchor="start">9. SchemaUtils.drop(*tables)</text>
<path class="line" d="M574.6666666666667 1224 L1444 1224"/>
<rect x="252.33333333333337" y="1276" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="270.33333333333337" y="1303" text-anchor="start">10. done</text>
<path class="dashed" d="M574.6666666666667 1334 L140 1334"/>
</svg>
