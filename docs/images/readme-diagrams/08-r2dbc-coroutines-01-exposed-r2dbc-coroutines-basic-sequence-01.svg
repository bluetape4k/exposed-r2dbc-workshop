<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980" role="img" aria-label="Coroutine and R2DBC transaction sequence">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3c82b4" stroke="#3c82b4" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f8848" stroke="#5f8848" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b78632" stroke="#b78632" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-return" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .participantText{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#1e293b}
      .participantHint,.labelText,.num{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#344256;font-weight:700}
      .card{filter:url(#shadow)}
      .lifeline{stroke:#9fb0bf;stroke-width:2;stroke-dasharray:8 10}
      .activation{fill:#ecfdf5;stroke:#7aa083;stroke-width:2}
      .call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .return{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
      .label{fill:#fff;stroke:#d7e2ec;stroke-width:1.4}
      .labelBlue{stroke:#b8d9eb}
      .labelGreen{stroke:#c5d9b6}
      .labelAmber{stroke:#dfc396}
      .labelReturn{stroke:#bdd9d3}
      .numCircle{fill:#fff}
      .noteBox{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
    </style>
  </defs>

  <rect class="canvas" width="1320" height="980"/>
  <rect class="frame" x="28" y="26" width="1264" height="928" rx="22"/>
  <text class="title" x="64" y="76">Coroutine + R2DBC Transaction</text>
  <text class="subtitle" x="66" y="106">Concrete sequence from Ex01_Coroutines: table setup, suspend transaction, dispatcher switch, and cleanup.</text>

  <g data-card="Test Scope" data-x="56" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="56" y="146" width="208" height="72" rx="14" fill="#e8f3ff" stroke="#5b8def" stroke-width="2"/>
    <text class="participantText participant" x="160" y="182" text-anchor="middle">Test Scope</text>
    <text class="participantHint" x="160" y="202" text-anchor="middle">runSuspendIO</text>
  </g>
  <g data-card="withTables" data-x="296" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="296" y="146" width="208" height="72" rx="14" fill="#eaf7ef" stroke="#58a978" stroke-width="2"/>
    <text class="participantText participant" x="400" y="182" text-anchor="middle">withTables</text>
    <text class="participantHint" x="400" y="202" text-anchor="middle">testDB + tables</text>
  </g>
  <g data-card="Dispatcher" data-x="546" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="546" y="146" width="208" height="72" rx="14" fill="#fff3d9" stroke="#d6a441" stroke-width="2"/>
    <text class="participantText participant" x="650" y="182" text-anchor="middle">Dispatcher</text>
    <text class="participantHint" x="650" y="202" text-anchor="middle">single / IO / Default</text>
  </g>
  <g data-card="suspendTransaction" data-x="786" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="786" y="146" width="208" height="72" rx="14" fill="#eef7f6" stroke="#4f8f8b" stroke-width="2"/>
    <text class="participantText participant" x="890" y="182" text-anchor="middle">suspend tx</text>
    <text class="participantHint" x="890" y="202" text-anchor="middle">Exposed R2DBC</text>
  </g>
  <g data-card="R2DBC DB" data-x="1036" data-y="146" data-width="208" data-height="72">
    <rect class="card" x="1036" y="146" width="208" height="72" rx="14" fill="#fdecef" stroke="#dc6b82" stroke-width="2"/>
    <text class="participantText participant" x="1140" y="182" text-anchor="middle">R2DBC DB</text>
    <text class="participantHint" x="1140" y="202" text-anchor="middle">H2 / server DBs</text>
  </g>

  <line class="lifeline" x1="160" y1="248" x2="160" y2="878"/>
  <line class="lifeline" x1="400" y1="248" x2="400" y2="878"/>
  <line class="lifeline" x1="650" y1="248" x2="650" y2="878"/>
  <line class="lifeline" x1="890" y1="248" x2="890" y2="878"/>
  <line class="lifeline" x1="1140" y1="248" x2="1140" y2="878"/>

  <rect class="activation" x="154" y="278" width="12" height="526" rx="4"/>
  <rect class="activation" x="394" y="298" width="12" height="508" rx="4"/>
  <rect class="activation" x="644" y="682" width="12" height="94" rx="4"/>
  <rect class="activation" x="884" y="396" width="12" height="446" rx="4"/>
  <rect class="activation" x="1134" y="342" width="12" height="496" rx="4"/>

  <path class="call" data-connector="seq-01" d="M 160 300 L 400 300" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <rect class="label labelBlue" x="181" y="268" width="198" height="28" rx="14"/>
  <circle class="numCircle" cx="199" cy="282" r="13" stroke="#3c82b4" stroke-width="1.7"/>
  <text class="num" x="199" y="286" text-anchor="middle">1</text>
  <text class="labelText" x="221" y="286" text-anchor="start">withTables(testDB, Tester)</text>

  <path class="call" data-connector="seq-02" d="M 400 354 L 1140 354" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <rect class="label labelGreen" x="642" y="322" width="256" height="28" rx="14"/>
  <circle class="numCircle" cx="660" cy="336" r="13" stroke="#5f8848" stroke-width="1.7"/>
  <text class="num" x="660" y="340" text-anchor="middle">2</text>
  <text class="labelText" x="682" y="340" text-anchor="start">SchemaUtils.create(Tester)</text>

  <path class="call" data-connector="seq-03" d="M 400 408 L 890 408" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <rect class="label labelBlue" x="540" y="376" width="316" height="28" rx="14"/>
  <circle class="numCircle" cx="558" cy="390" r="13" stroke="#3c82b4" stroke-width="1.7"/>
  <text class="num" x="558" y="394" text-anchor="middle">3</text>
  <text class="labelText" x="580" y="394" text-anchor="start">suspendTransaction { insertAndGetId }</text>

  <path class="call" data-connector="seq-04" d="M 890 462 L 1140 462" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="930" y="430" width="170" height="28" rx="14"/>
  <circle class="numCircle" cx="948" cy="444" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="948" y="448" text-anchor="middle">4</text>
  <text class="labelText" x="970" y="448" text-anchor="start">INSERT default</text>

  <path class="call" data-connector="seq-05" d="M 400 516 L 890 516" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <rect class="label labelBlue" x="555" y="484" width="286" height="28" rx="14"/>
  <circle class="numCircle" cx="573" cy="498" r="13" stroke="#3c82b4" stroke-width="1.7"/>
  <text class="num" x="573" y="502" text-anchor="middle">5</text>
  <text class="labelText" x="595" y="502" text-anchor="start">getTesterById(inserted id)</text>

  <path class="call" data-connector="seq-06" d="M 890 570 L 1140 570" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="928" y="538" width="174" height="28" rx="14"/>
  <circle class="numCircle" cx="946" cy="552" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="946" y="556" text-anchor="middle">6</text>
  <text class="labelText" x="968" y="556" text-anchor="start">SELECT id = ?</text>

  <path class="return" data-connector="seq-07" d="M 1140 624 L 890 624" stroke="#4f8f8b" marker-end="url(#arrow-return)"/>
  <rect class="label labelReturn" x="928" y="592" width="174" height="28" rx="14"/>
  <circle class="numCircle" cx="946" cy="606" r="13" stroke="#4f8f8b" stroke-width="1.7"/>
  <text class="num" x="946" y="610" text-anchor="middle">7</text>
  <text class="labelText" x="968" y="610" text-anchor="start">ResultRow</text>

  <path class="return" data-connector="seq-08" d="M 890 672 L 400 672" stroke="#4f8f8b" marker-end="url(#arrow-return)"/>
  <rect class="label labelReturn" x="535" y="640" width="318" height="28" rx="14"/>
  <circle class="numCircle" cx="553" cy="654" r="13" stroke="#4f8f8b" stroke-width="1.7"/>
  <text class="num" x="553" y="658" text-anchor="middle">8</text>
  <text class="labelText" x="575" y="658" text-anchor="start">assert id.value == inserted id</text>

  <path class="call" data-connector="seq-09" d="M 400 720 L 650 720" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="430" y="688" width="190" height="28" rx="14"/>
  <circle class="numCircle" cx="448" cy="702" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="448" y="706" text-anchor="middle">9</text>
  <text class="labelText" x="470" y="706" text-anchor="start">withContext(single)</text>

  <path class="call" data-connector="seq-10" d="M 650 768 L 890 768" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <rect class="label labelBlue" x="680" y="736" width="180" height="28" rx="14"/>
  <circle class="numCircle" cx="698" cy="750" r="13" stroke="#3c82b4" stroke-width="1.7"/>
  <text class="num" x="698" y="754" text-anchor="middle">10</text>
  <text class="labelText" x="724" y="754" text-anchor="start">nested suspend tx</text>

  <path class="call" data-connector="seq-11" d="M 890 822 L 1140 822" stroke="#b78632" marker-end="url(#arrow-amber)"/>
  <rect class="label labelAmber" x="928" y="790" width="184" height="28" rx="14"/>
  <circle class="numCircle" cx="946" cy="804" r="13" stroke="#b78632" stroke-width="1.7"/>
  <text class="num" x="946" y="808" text-anchor="middle">11</text>
  <text class="labelText" x="972" y="808" text-anchor="start">SELECT id = 1</text>

  <path class="call" data-connector="seq-12" d="M 400 858 L 1140 858" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <rect class="label labelGreen" x="655" y="826" width="230" height="28" rx="14"/>
  <circle class="numCircle" cx="673" cy="840" r="13" stroke="#5f8848" stroke-width="1.7"/>
  <text class="num" x="673" y="844" text-anchor="middle">12</text>
  <text class="labelText" x="699" y="844" text-anchor="start">SchemaUtils.drop(Tester)</text>

  <rect x="82" y="902" width="1156" height="34" rx="10" class="noteBox"/>
  <text x="660" y="924" class="note" text-anchor="middle">suspendTransaction is used only inside coroutine-controlled scope; dispatcher changes do not leave the Exposed R2DBC path.</text>
</svg>
