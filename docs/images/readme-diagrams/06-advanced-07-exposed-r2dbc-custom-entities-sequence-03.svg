<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1680" viewBox="0 0 2200 1680" role="img" aria-label="Advanced 07 Exposed R2DBC Custom Entities sequence diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8891f" stroke="#b8891f" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9b95" stroke="#2f9b95" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ad5f82" stroke="#ad5f82" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f4f7fa}
      .frame{fill:#fffefb;stroke:#3f5560;stroke-width:5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:64px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#536476;font-weight:700}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:29px;fill:#1e293b}
      .role{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:20px;fill:#536476;font-weight:700}
      .labelText,.detail{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#4d5d6e;font-weight:700}
      .num{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#263746;font-weight:800}
      .header{fill:#ffffff;stroke:#5d6f78;stroke-width:3;filter:url(#shadow)}
      .lifeline{stroke:#9fb0bd;stroke-width:2.4;stroke-dasharray:10 12}
      .activation{opacity:.72;stroke-width:2.2}
      .label{fill:#fff;stroke:#d9e3ec;stroke-width:2.4}
      .badgeBlue{fill:#eef5fa;stroke:#4f86c6;stroke-width:2.5}
      .badgeGreen{fill:#f1f6ec;stroke:#6f8f52;stroke-width:2.5}
      .badgeAmber{fill:#fff8e6;stroke:#b8891f;stroke-width:2.5}
      .badgeTeal{fill:#eef7f6;stroke:#2f9b95;stroke-width:2.5}
      .badgeRed{fill:#f8edf3;stroke:#ad5f82;stroke-width:2.5}
      .callBlue{fill:none;stroke:#4f86c6;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-blue)}
      .callGreen{fill:none;stroke:#6f8f52;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-green)}
      .callAmber{fill:none;stroke:#b8891f;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-amber)}
      .callTeal{fill:none;stroke:#2f9b95;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-teal)}
      .callRed{fill:none;stroke:#ad5f82;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-red)}
      .seqReturn{fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 9}
      .returnBlue{stroke:#4f86c6;marker-end:url(#seqArrow-blue)}
      .returnGreen{stroke:#6f8f52;marker-end:url(#seqArrow-green)}
      .returnAmber{stroke:#b8891f;marker-end:url(#seqArrow-amber)}
      .returnTeal{stroke:#2f9b95;marker-end:url(#seqArrow-teal)}
      .alt{fill:none;stroke:#8ca2b4;stroke-width:3.2;stroke-dasharray:12 10}
      .branchLabel{fill:#fff;stroke:#d9e3ec;stroke-width:2.4}
      .footer{fill:#fff;stroke:#d9e3ec;stroke-width:2.2}
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1680"/>
  <rect class="frame" x="36" y="34" width="2128" height="1604" rx="34"/>
  <text class="title" x="92" y="126">Custom Entity ID Allocation Sequence</text>
  <text class="subtitle" x="96" y="176">Parameterized tests choose a strategy table, let the table base generate IDs, then assert inserted row counts.</text>

  <g data-participant="Parameterized Test" data-card="Parameterized Test" data-x="61" data-y="260" data-width="300" data-height="94">
    <rect class="header card actor" x="61" y="260" width="300" height="94" rx="20"/>
    <text class="participant" x="211" y="310" text-anchor="middle">Parameterized Test</text>
    <text class="role" x="211" y="337" text-anchor="middle">runTest / runSuspendIO</text>
    <line class="lifeline" x1="211" y1="354" x2="211" y2="1510"/>
  </g>
  <g data-participant="TestDB Matrix" data-card="TestDB Matrix" data-x="401" data-y="260" data-width="300" data-height="94">
    <rect class="header card actor" x="401" y="260" width="300" height="94" rx="20"/>
    <text class="participant" x="551" y="310" text-anchor="middle">TestDB Matrix</text>
    <text class="role" x="551" y="337" text-anchor="middle">50 / 500 records</text>
    <line class="lifeline" x1="551" y1="354" x2="551" y2="1510"/>
  </g>
  <g data-participant="Strategy T1" data-card="Strategy T1" data-x="741" data-y="260" data-width="300" data-height="94">
    <rect class="header card actor" x="741" y="260" width="300" height="94" rx="20"/>
    <text class="participant" x="891" y="310" text-anchor="middle">Strategy T1</text>
    <text class="role" x="891" y="337" text-anchor="middle">Snowflake / KSUID / UUID</text>
    <line class="lifeline" x1="891" y1="354" x2="891" y2="1510"/>
  </g>
  <g data-participant="ID Generator" data-card="ID Generator" data-x="1081" data-y="260" data-width="300" data-height="94">
    <rect class="header card actor" x="1081" y="260" width="300" height="94" rx="20"/>
    <text class="participant" x="1231" y="310" text-anchor="middle">ID Generator</text>
    <text class="role" x="1231" y="337" text-anchor="middle">clientDefault</text>
    <line class="lifeline" x1="1231" y1="354" x2="1231" y2="1510"/>
  </g>
  <g data-participant="R2DBC Database" data-card="R2DBC Database" data-x="1421" data-y="260" data-width="300" data-height="94">
    <rect class="header card actor" x="1421" y="260" width="300" height="94" rx="20"/>
    <text class="participant" x="1571" y="310" text-anchor="middle">R2DBC Database</text>
    <text class="role" x="1571" y="337" text-anchor="middle">strategy table</text>
    <line class="lifeline" x1="1571" y1="354" x2="1571" y2="1510"/>
  </g>
  <g data-participant="Assertions" data-card="Assertions" data-x="1761" data-y="260" data-width="300" data-height="94">
    <rect class="header card actor" x="1761" y="260" width="300" height="94" rx="20"/>
    <text class="participant" x="1911" y="310" text-anchor="middle">Assertions</text>
    <text class="role" x="1911" y="337" text-anchor="middle">count equality</text>
    <line class="lifeline" x1="1911" y1="354" x2="1911" y2="1510"/>
  </g>

  <rect class="activation" x="203" y="430" width="16" height="1060" rx="7" fill="#e5f3fb" stroke="#b9d7eb"/>
  <rect class="activation" x="545" y="438" width="16" height="170" rx="7" fill="#dff5ed" stroke="#98d2b8"/>
  <rect class="activation" x="883" y="664" width="16" height="598" rx="7" fill="#e5f3fb" stroke="#b9d7eb"/>
  <rect class="activation" x="1223" y="890" width="16" height="170" rx="7" fill="#fff0cb" stroke="#e2c36d"/>
  <rect class="activation" x="1563" y="1126" width="16" height="260" rx="7" fill="#edf7e7" stroke="#b8d69b"/>

  <path class="callBlue" data-connector="seq-1" d="M 211 452 L 551 452"/>
  <rect class="label" x="170" y="382" width="448" height="52" rx="20"/>
  <circle class="badgeBlue" cx="214" cy="408" r="32"/>
  <text class="num" x="214" y="417" text-anchor="middle">1</text>
  <text class="labelText" x="284" y="417">getTestDBAndEntityCount()</text>

  <path class="seqReturn returnGreen" data-connector="seq-2" d="M 551 582 L 211 582"/>
  <rect class="label" x="176" y="512" width="416" height="52" rx="20"/>
  <circle class="badgeGreen" cx="220" cy="538" r="32"/>
  <text class="num" x="220" y="547" text-anchor="middle">2</text>
  <text class="labelText" x="292" y="547">TestDB + recordCount</text>

  <path class="callBlue" data-connector="seq-3" d="M 211 712 L 891 712"/>
  <rect class="label" x="326" y="642" width="452" height="52" rx="20"/>
  <circle class="badgeBlue" cx="370" cy="668" r="32"/>
  <text class="num" x="370" y="677" text-anchor="middle">3</text>
  <text class="labelText" x="442" y="677">withTables(testDB, T1)</text>

  <rect class="alt" x="720" y="764" width="910" height="480" rx="28"/>
  <rect class="branchLabel" x="856" y="726" width="640" height="46" rx="18"/>
  <text class="detail" x="1176" y="757" text-anchor="middle">branch: single, batch, coroutine chunks, insertIgnore flow</text>

  <path class="callBlue" data-connector="seq-4" d="M 211 846 L 891 846"/>
  <rect class="label" x="340" y="776" width="472" height="52" rx="20"/>
  <circle class="badgeBlue" cx="384" cy="802" r="32"/>
  <text class="num" x="384" y="811" text-anchor="middle">4</text>
  <text class="labelText" x="456" y="811">insert or batchInsert records</text>

  <path class="callAmber" data-connector="seq-5" d="M 891 982 L 1231 982"/>
  <rect class="label" x="810" y="912" width="462" height="52" rx="20"/>
  <circle class="badgeAmber" cx="854" cy="938" r="32"/>
  <text class="num" x="854" y="947" text-anchor="middle">5</text>
  <text class="labelText" x="926" y="947">clientDefault generates id</text>

  <path class="seqReturn returnAmber" data-connector="seq-6" d="M 1231 1098 L 891 1098"/>
  <rect class="label" x="810" y="1028" width="500" height="52" rx="20"/>
  <circle class="badgeAmber" cx="854" cy="1054" r="32"/>
  <text class="num" x="854" y="1063" text-anchor="middle">6</text>
  <text class="labelText" x="926" y="1063">Long, String, or UUID value</text>

  <path class="callGreen" data-connector="seq-7" d="M 891 1214 L 1571 1214"/>
  <rect class="label" x="1032" y="1144" width="498" height="52" rx="20"/>
  <circle class="badgeGreen" cx="1076" cy="1170" r="32"/>
  <text class="num" x="1076" y="1179" text-anchor="middle">7</text>
  <text class="labelText" x="1148" y="1179">INSERT(id, name, age)</text>

  <path class="callBlue" data-connector="seq-8" d="M 211 1332 L 1571 1332"/>
  <rect class="label" x="724" y="1262" width="354" height="52" rx="20"/>
  <circle class="badgeBlue" cx="768" cy="1288" r="32"/>
  <text class="num" x="768" y="1297" text-anchor="middle">8</text>
  <text class="labelText" x="840" y="1297">selectAll().count()</text>

  <path class="seqReturn returnTeal" data-connector="seq-9" d="M 1571 1438 L 1911 1438"/>
  <rect class="label" x="1512" y="1368" width="380" height="52" rx="20"/>
  <circle class="badgeTeal" cx="1556" cy="1394" r="32"/>
  <text class="num" x="1556" y="1403" text-anchor="middle">9</text>
  <text class="labelText" x="1628" y="1403">row count result</text>

  <path class="callRed" data-connector="seq-10" d="M 211 1510 L 1911 1510"/>
  <rect class="label" x="1128" y="1440" width="542" height="52" rx="20"/>
  <circle class="badgeRed" cx="1172" cy="1466" r="32"/>
  <text class="num" x="1172" y="1475" text-anchor="middle">10</text>
  <text class="labelText" x="1250" y="1475">shouldBeEqualTo(recordCount)</text>

  <rect class="footer" x="216" y="1570" width="1768" height="50" rx="18"/>
  <text class="detail" x="1100" y="1603" text-anchor="middle">Reader contract: custom entity tables hide id allocation while tests verify insert, batch, coroutine, and insertIgnore paths.</text>
</svg>
