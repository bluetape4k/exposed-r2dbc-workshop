<rect x="744.3333333333334" y="638" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="762.3333333333334" y="665" text-anchor="start">4. INSERT json_text</text>
<path class="line" d="M494.6666666666667 696 L1204 696"/>
<rect x="744.3333333333334" y="748" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="762.3333333333334" y="775" text-anchor="start">5. json_text</text>
<path class="dashed" d="M1204 806 L494.6666666666667 806"/>
<rect x="456.5" y="858" width="431" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="474.5" y="885" text-anchor="start">6. JSON.parseObject(json, DataHolder::class.java)</text>
<path class="line" d="M494.6666666666667 916 L849.3333333333334 916"/>
<rect x="567" y="968" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="585" y="995" text-anchor="start">7. DataHolder object</text>
<path class="dashed" d="M849.3333333333334 1026 L494.6666666666667 1026"/>
<rect x="212.33333333333337" y="1078" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="1105" text-anchor="start">8. DataHolder object</text>
<path class="dashed" d="M494.6666666666667 1136 L140 1136"/>
<rect x="149.83333333333337" y="1188" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="167.83333333333337" y="1215" text-anchor="start">9. fastjsonColumn.extract(.user.name)</text>
<path class="line" d="M140 1246 L494.6666666666667 1246"/>
<rect x="645.8333333333334" y="1298" width="407" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="663.8333333333334" y="1325" text-anchor="start">10. JSON_EXTRACT(fastjson_column, $.user.name)</text>
<path class="line" d="M494.6666666666667 1356 L1204 1356"/>
<rect x="567" y="1408" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="585" y="1435" text-anchor="start">11. Admin</text>
<path class="dashed" d="M1204 1466 L140 1466"/>
</svg>
