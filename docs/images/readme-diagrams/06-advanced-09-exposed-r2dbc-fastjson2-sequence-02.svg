<text class="smallLabel" x="494.6666666666667" y="209" text-anchor="middle">FastjsonColumn</text>
<line class="lifeline" x1="494.6666666666667" y1="252" x2="494.6666666666667" y2="1528" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
