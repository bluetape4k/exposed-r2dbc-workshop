      .subtitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#536476;font-weight:700}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:29px;fill:#1e293b}
      .role{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:20px;fill:#536476;font-weight:700}
