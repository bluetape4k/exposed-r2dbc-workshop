<rect x="60" y="286" width="657" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="78" y="313" text-anchor="start">1. insert { it[fastjsonColumn] = DataHolder(user=User(Admin,null), logins=10)</text>
<text class="strong" x="78" y="335" text-anchor="start">}</text>
<path class="line" d="M140 366 L494.6666666666667 366"/>
<rect x="525" y="418" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="543" y="445" text-anchor="start">2. JSON.toJSONString(dataHolder)</text>
<path class="line" d="M494.6666666666667 476 L849.3333333333334 476"/>
<rect x="436" y="528" width="472" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="454" y="555" text-anchor="start">3. {user:{name:Admin,team:null},logins:10,active:true}</text>
