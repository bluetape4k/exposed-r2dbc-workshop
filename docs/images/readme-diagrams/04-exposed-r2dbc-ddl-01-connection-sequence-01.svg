<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap');
      @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
      .canvas{fill:#F6F8FB;}
      .frame{fill:#FFFDF9;stroke:#3f535c;stroke-width:3.2;}
      .title{font-family:'Architects Daughter','Comic Mono',monospace;font-size:44px;fill:#1f2937;}
      .subtitle,.note{font-family:'Comic Mono','Architects Daughter',monospace;font-size:17px;fill:#435363;font-weight:700;}
      .header{fill:#FFFFFF;stroke:#587080;stroke-width:2.4;}
      .participant{font-family:'Architects Daughter','Comic Mono',monospace;font-size:24px;fill:#23323f;}
      .role{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;fill:#64748b;font-weight:700;}
      .lifeline{stroke:#9db1bf;stroke-width:2.4;stroke-dasharray:8 10;stroke-linecap:butt;}
      .activation{fill:#F4FAF6;stroke:#77a984;stroke-width:2;}
      .activationBlue{fill:#EEF6FF;stroke:#7eb2d5;}
      .activationAmber{fill:#FFF7E6;stroke:#bd8b3b;}
      .activationTeal{fill:#EFFAF9;stroke:#5fa8a2;}
      .call{fill:none;stroke:#3f86bd;stroke-width:3;marker-end:url(#seqArrowBlue);}
      .state{fill:none;stroke:#6f8f52;stroke-width:3;marker-end:url(#seqArrowGreen);}
      .sql{fill:none;stroke:#b68432;stroke-width:3;marker-end:url(#seqArrowAmber);}
      .return{fill:none;stroke:#2f9b95;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#seqArrowTeal);}
      .wait{fill:none;stroke:#c16a6a;stroke-width:3;marker-end:url(#seqArrowRed);}
      .pill{fill:#FFFFFF;stroke-width:1.8;}
      .pillBlue{stroke:#9ec5e8;}
      .pillGreen{stroke:#a9c58f;}
      .pillAmber{stroke:#d4b06d;}
      .pillTeal{stroke:#9cccca;}
      .pillRed{stroke:#d9a0a0;}
      .badgeCircle{fill:#FFFDF9;stroke-width:1.8;}
      .badge{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;font-weight:800;dominant-baseline:middle;text-anchor:middle;}
      .msg{font-family:'Comic Mono','Architects Daughter',monospace;font-size:15px;font-weight:800;dominant-baseline:middle;}
      .blueText{fill:#276b9d;stroke:none;}
      .greenText{fill:#587a3d;stroke:none;}
      .amberText{fill:#8a6128;stroke:none;}
      .tealText{fill:#277f7a;stroke:none;}
      .redText{fill:#a95656;stroke:none;}
      .badgeCircle.blueText{fill:#FFFDF9;stroke:#9ec5e8;}
      .badgeCircle.greenText{fill:#FFFDF9;stroke:#a9c58f;}
      .badgeCircle.amberText{fill:#FFFDF9;stroke:#d4b06d;}
      .badgeCircle.tealText{fill:#FFFDF9;stroke:#9cccca;}
      .badgeCircle.redText{fill:#FFFDF9;stroke:#d9a0a0;}
      .branch{fill:none;stroke:#7892a0;stroke-width:2.8;stroke-dasharray:8 8;}
      .branchLabel{fill:#FFFDF9;stroke:#d4b06d;stroke-width:1.8;}
      .branchText{font-family:'Comic Mono','Architects Daughter',monospace;font-size:15px;fill:#7c5a2b;font-weight:800;dominant-baseline:middle;}
      .noteBox{fill:#FFFFFF;stroke:#d7e2ec;stroke-width:1.8;}
    </style>
    <marker id="seqArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f86bd" stroke="#3f86bd" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b68432" stroke="#b68432" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9b95" stroke="#2f9b95" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c16a6a" stroke="#c16a6a" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1240"/>
  <rect class="frame" x="26" y="26" width="1548" height="1188" rx="26"/>

  <text class="title" x="70" y="88">R2DBC Connection and Pool Execution Flow</text>
  <text class="subtitle" x="72" y="122">Connection URLs create Exposed R2dbcDatabase instances; pooled suspendTransaction calls wait and reuse returned connections.</text>

  <g transform="translate(112,162)">
    <rect class="header" x="0" y="0" width="238" height="76" rx="10"/>
    <text class="participant" x="119" y="35" text-anchor="middle">JUnit coroutine</text>
    <text class="role" x="119" y="57" text-anchor="middle">runSuspendIO / runTest</text>
  </g>
  <g transform="translate(408,162)">
    <rect class="header" x="0" y="0" width="244" height="76" rx="10"/>
    <text class="participant" x="122" y="35" text-anchor="middle">R2dbcDatabase</text>
    <text class="role" x="122" y="57" text-anchor="middle">connect(url)</text>
  </g>
  <g transform="translate(706,162)">
    <rect class="header" x="0" y="0" width="272" height="76" rx="10"/>
    <text class="participant" x="136" y="35" text-anchor="middle">suspendTransaction</text>
    <text class="role" x="136" y="57" text-anchor="middle">db-bound block</text>
  </g>
  <g transform="translate(1058,162)">
    <rect class="header" x="0" y="0" width="232" height="76" rx="10"/>
    <text class="participant" x="116" y="35" text-anchor="middle">ConnectionPool</text>
    <text class="role" x="116" y="57" text-anchor="middle">r2dbc:pool URL</text>
  </g>
  <g transform="translate(1342,162)">
    <rect class="header" x="0" y="0" width="172" height="76" rx="10"/>
    <text class="participant" x="86" y="35" text-anchor="middle">H2 database</text>
    <text class="role" x="86" y="57" text-anchor="middle">tables + rows</text>
  </g>

  <path class="lifeline" d="M 231 238 V 1128"/>
  <path class="lifeline" d="M 530 238 V 1128"/>
  <path class="lifeline" d="M 842 238 V 1128"/>
  <path class="lifeline" d="M 1174 238 V 1128"/>
  <path class="lifeline" d="M 1428 238 V 1128"/>

  <rect class="activation activationBlue" x="222" y="296" width="18" height="784" rx="5"/>
  <rect class="activation activation" x="521" y="334" width="18" height="148" rx="5"/>
  <rect class="activation activationTeal" x="833" y="430" width="18" height="590" rx="5"/>
  <rect class="activation activationAmber" x="1165" y="382" width="18" height="582" rx="5"/>
  <rect class="activation activationAmber" x="1419" y="910" width="18" height="134" rx="5"/>

  <g>
    <rect class="pill pillBlue" x="128" y="266" width="356" height="32" rx="16"/>
    <circle class="badgeCircle blueText" cx="153" cy="282" r="13"/>
    <text class="badge blueText" x="153" y="282">1</text>
    <text class="msg blueText" x="190" y="282">R2dbcDatabase.connect(pool URL)</text>
    <path class="call" d="M 231 318 H 530"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="606" y="346" width="354" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="631" cy="362" r="13"/>
    <text class="badge greenText" x="631" y="362">2</text>
    <text class="msg greenText" x="668" y="362">create pooled ConnectionFactory</text>
    <path class="state" d="M 530 398 H 1174"/>
  </g>

  <g>
    <rect class="pill pillTeal" x="250" y="458" width="304" height="32" rx="16"/>
    <circle class="badgeCircle tealText" cx="275" cy="474" r="13"/>
    <text class="badge tealText" x="275" y="474">3</text>
    <text class="msg tealText" x="312" y="474">R2dbcDatabase instance</text>
    <path class="return" d="M 530 512 H 231"/>
  </g>

  <g>
    <rect class="pill pillBlue" x="346" y="548" width="352" height="32" rx="16"/>
    <circle class="badgeCircle blueText" cx="371" cy="564" r="13"/>
    <text class="badge blueText" x="371" y="564">4</text>
    <text class="msg blueText" x="408" y="564">suspendTransaction(db = h2PoolDB1)</text>
    <path class="call" d="M 231 600 H 842"/>
  </g>

  <rect class="branch" x="690" y="622" width="790" height="432" rx="18"/>
  <rect class="branchLabel" x="718" y="607" width="388" height="30" rx="15"/>
  <text class="branchText" x="738" y="622">loop concurrent jobs exceed maxSize=10</text>

  <g>
    <rect class="pill pillAmber" x="888" y="654" width="250" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="913" cy="670" r="13"/>
    <text class="badge amberText" x="913" y="670">5</text>
    <text class="msg amberText" x="950" y="670">acquire connection</text>
    <path class="sql" d="M 842 706 H 1174"/>
  </g>

  <g>
    <rect class="pill pillRed" x="926" y="726" width="318" height="32" rx="16"/>
    <circle class="badgeCircle redText" cx="951" cy="742" r="13"/>
    <text class="badge redText" x="951" y="742">6</text>
    <text class="msg redText" x="988" y="742">wait while pool is exhausted</text>
    <path class="wait" d="M 842 778 H 1174"/>
  </g>

  <g>
    <rect class="pill pillTeal" x="858" y="798" width="300" height="32" rx="16"/>
    <circle class="badgeCircle tealText" cx="883" cy="814" r="13"/>
    <text class="badge tealText" x="883" y="814">7</text>
    <text class="msg tealText" x="920" y="814">reuse returned connection</text>
    <path class="return" d="M 1174 850 H 842"/>
  </g>

  <g>
    <rect class="pill pillAmber" x="980" y="894" width="360" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="1005" cy="910" r="13"/>
    <text class="badge amberText" x="1005" y="910">8</text>
    <text class="msg amberText" x="1042" y="910">insertAndGetId / selectAll count</text>
    <path class="sql" d="M 842 952 H 1428"/>
  </g>

  <g>
    <rect class="pill pillTeal" x="982" y="986" width="330" height="32" rx="16"/>
    <circle class="badgeCircle tealText" cx="1007" cy="1002" r="13"/>
    <text class="badge tealText" x="1007" y="1002">9</text>
    <text class="msg tealText" x="1044" y="1002">row count equals launched jobs</text>
    <path class="return" d="M 1428 1042 H 842"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="804" y="1066" width="370" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="829" cy="1082" r="13"/>
    <text class="badge greenText" x="829" y="1082">10</text>
    <text class="msg greenText" x="868" y="1082">SchemaUtils.drop and release pool slot</text>
    <path class="state" d="M 842 1116 H 1174"/>
  </g>

  <g>
    <rect class="pill pillBlue" x="106" y="1110" width="284" height="32" rx="16"/>
    <circle class="badgeCircle blueText" cx="131" cy="1126" r="13"/>
    <text class="badge blueText" x="131" y="1126">11</text>
    <text class="msg blueText" x="170" y="1126">all suspend jobs complete</text>
    <path class="return" d="M 842 1160 H 231"/>
  </g>

  <rect class="noteBox" x="84" y="1174" width="1432" height="30" rx="10"/>
  <text class="note" x="800" y="1194" text-anchor="middle">Pool URLs own connection reuse; every suspendTransaction stays bound to the selected R2dbcDatabase instance.</text>
</svg>
