<svg xmlns="http://www.w3.org/2000/svg" width="1532" height="1476" viewBox="0 0 1532 1476" role="img" aria-label="Execution Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1532" height="1476"/>
<rect class="frame" x="32" y="28" width="1468" height="1420" rx="28"/>
<text class="title" x="66" y="82">Execution Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="1.5" y="166" width="277" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="418.83333333333326" y="166" width="277" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="557.3333333333333" y="209" text-anchor="middle">ConnectionFactory</text>
<line class="lifeline" x1="557.3333333333333" y1="252" x2="557.3333333333333" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="836.1666666666666" y="166" width="277" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="974.6666666666666" y="209" text-anchor="middle">Database (Exposed)</text>
<line class="lifeline" x1="974.6666666666666" y1="252" x2="974.6666666666666" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1253.5" y="166" width="277" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1392" y="209" text-anchor="middle">ConnectionPool</text>
<line class="lifeline" x1="1392" y1="252" x2="1392" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="205.66666666666663" y="286" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="223.66666666666663" y="313" text-anchor="start">1. ConnectionFactories.get(url)</text>
<path class="line" d="M140 344 L557.3333333333333 344"/>
<rect x="859.6666666666666" y="396" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="877.6666666666666" y="423" text-anchor="start">2. Create ConnectionPool</text>
<path class="dashed" d="M557.3333333333333 454 L1392 454"/>
<rect x="365.83333333333326" y="506" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="383.83333333333326" y="533" text-anchor="start">3. R2dbcDatabase.connect(connectionFactory)</text>
<path class="line" d="M140 564 L974.6666666666666 564"/>
<rect x="438.33333333333326" y="616" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="456.33333333333326" y="643" text-anchor="start">4. R2dbcDatabase instance</text>
<path class="dashed" d="M974.6666666666666 674 L140 674"/>
<rect x="438.33333333333326" y="726" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="456.33333333333326" y="753" text-anchor="start">5. suspendTransaction { }</text>
<path class="line" d="M140 784 L974.6666666666666 784"/>
<rect x="1078.3333333333333" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1096.3333333333333" y="863" text-anchor="start">6. acquire connection</text>
<path class="line" d="M974.6666666666666 894 L1392 894"/>
<rect x="1078.3333333333333" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1096.3333333333333" y="973" text-anchor="start">7. R2DBC Connection</text>
<path class="dashed" d="M1392 1004 L974.6666666666666 1004"/>
<rect x="803.1666666666666" y="1056" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="821.1666666666666" y="1083" text-anchor="start">8. Execute SQL (SELECT / INSERT / UPDATE / DELETE)</text>
<path class="line" d="M974.6666666666666 1114 C1038.6666666666665 1114 1038.6666666666665 1148 974.6666666666666 1148"/>
<rect x="1078.3333333333333" y="1186" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1096.3333333333333" y="1213" text-anchor="start">9. release connection</text>
<path class="line" d="M974.6666666666666 1244 L1392 1244"/>
<rect x="452.33333333333326" y="1296" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="470.33333333333326" y="1323" text-anchor="start">10. Return result</text>
<path class="dashed" d="M974.6666666666666 1354 L140 1354"/>
</svg>
