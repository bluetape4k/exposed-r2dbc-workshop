<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" width="1440" height="940" role="img" aria-label="Exposed R2DBC connection management class map">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:20px;fill:#1e293b}
      .connector{fill:none;stroke:#64748b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .use{fill:none;stroke:#64748b;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .dep{fill:none;stroke-width:2.2;stroke-dasharray:8 7;stroke-linecap:butt;stroke-linejoin:round}
      .inherit{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .hollow{fill:#fffdf9;stroke:#64748b;stroke-width:2.5}
      .labelPill{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.2}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
  </defs>

  <rect width="1440" height="940" class="canvas"/>
  <rect x="22" y="22" width="1396" height="896" rx="18" class="frame"/>

  <text x="58" y="70" class="title" text-anchor="start">Connection Management Class Map</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">Repository-backed view of connection tests, table fixtures, metadata access, pooled URLs, and multi-database transactions.</text>

  <rect x="50" y="130" width="1340" height="206" rx="16" class="lane"/>
  <text x="76" y="160" class="laneTitle" text-anchor="start">TEST CLASSES</text>

  <rect x="50" y="366" width="1340" height="226" rx="16" class="lane"/>
  <text x="76" y="396" class="laneTitle" text-anchor="start">TABLE FIXTURES</text>

  <rect x="50" y="622" width="1340" height="188" rx="16" class="lane"/>
  <text x="76" y="652" class="laneTitle" text-anchor="start">R2DBC APIs AND CONNECTION MODES</text>

  <g data-card="AbstractR2dbcExposedTest" data-x="92" data-y="190" data-width="270" data-height="100">
    <rect x="92" y="190" width="270" height="100" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M92,232 L92,204 Q92,190 106,190 L348,190 Q362,190 362,204 L362,232 Z" fill="#eef5fa"/>
    <text x="227" y="208" class="tiny" text-anchor="middle">&lt;&lt;base test&gt;&gt;</text>
    <text x="227" y="227" class="cardTitle" text-anchor="middle">AbstractR2dbcExposedTest</text>
    <text x="112" y="258" class="detail" text-anchor="start">withDb / withTables</text>
    <text x="112" y="276" class="detail" text-anchor="start">multi dialect fixtures</text>
  </g>

  <g data-card="Ex01_Connection" data-x="430" data-y="190" data-width="250" data-height="100">
    <rect x="430" y="190" width="250" height="100" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M430,232 L430,204 Q430,190 444,190 L666,190 Q680,190 680,204 L680,232 Z" fill="#f1f6ec"/>
    <text x="555" y="208" class="tiny" text-anchor="middle">&lt;&lt;metadata tests&gt;&gt;</text>
    <text x="555" y="227" class="cardTitle" text-anchor="middle">Ex01_Connection</text>
    <text x="450" y="258" class="detail" text-anchor="start">columns(People)</text>
    <text x="450" y="276" class="detail" text-anchor="start">tableConstraints(child)</text>
  </g>

  <g data-card="Ex01_H2_ConnectionPool" data-x="754" data-y="190" data-width="270" data-height="100">
    <rect x="754" y="190" width="270" height="100" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M754,232 L754,204 Q754,190 768,190 L1010,190 Q1024,190 1024,204 L1024,232 Z" fill="#f5eee4"/>
    <text x="889" y="208" class="tiny" text-anchor="middle">&lt;&lt;pool tests&gt;&gt;</text>
    <text x="889" y="227" class="cardTitle" text-anchor="middle">Ex01_H2_ConnectionPool</text>
    <text x="774" y="258" class="detail" text-anchor="start">maxSize=10 pool URL</text>
    <text x="774" y="276" class="detail" text-anchor="start">concurrent inserts</text>
  </g>

  <g data-card="Ex02_H2_MultiDatabase" data-x="1092" data-y="190" data-width="250" data-height="100">
    <rect x="1092" y="190" width="250" height="100" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1092,232 L1092,204 Q1092,190 1106,190 L1328,190 Q1342,190 1342,204 L1342,232 Z" fill="#f5eef2"/>
    <text x="1217" y="208" class="tiny" text-anchor="middle">&lt;&lt;multi-db tests&gt;&gt;</text>
    <text x="1217" y="227" class="cardTitle" text-anchor="middle">Ex02_H2_MultiDatabase</text>
    <text x="1112" y="258" class="detail" text-anchor="start">db1 / db2 handles</text>
    <text x="1112" y="276" class="detail" text-anchor="start">explicit db routing</text>
  </g>

  <g data-card="People" data-x="132" data-y="438" data-width="240" data-height="112">
    <rect x="132" y="438" width="240" height="112" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M132,480 L132,452 Q132,438 146,438 L358,438 Q372,438 372,452 L372,480 Z" fill="#eef5fa"/>
    <text x="252" y="456" class="tiny" text-anchor="middle">&lt;&lt;LongIdTable&gt;&gt;</text>
    <text x="252" y="475" class="cardTitle" text-anchor="middle">People</text>
    <text x="152" y="506" class="detail" text-anchor="start">firstname nullable</text>
    <text x="152" y="524" class="detail" text-anchor="start">lastname default Doe</text>
  </g>

  <g data-card="parent / child" data-x="438" data-y="438" data-width="270" data-height="112">
    <rect x="438" y="438" width="270" height="112" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M438,480 L438,452 Q438,438 452,438 L694,438 Q708,438 708,452 L708,480 Z" fill="#f1f6ec"/>
    <text x="573" y="456" class="tiny" text-anchor="middle">&lt;&lt;LongIdTable pair&gt;&gt;</text>
    <text x="573" y="475" class="cardTitle" text-anchor="middle">parent / child</text>
    <text x="458" y="506" class="detail" text-anchor="start">parent.scale unique</text>
    <text x="458" y="524" class="detail" text-anchor="start">child.parent =&gt; FK</text>
  </g>

  <g data-card="TestTable" data-x="774" data-y="438" data-width="250" data-height="112">
    <rect x="774" y="438" width="250" height="112" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M774,480 L774,452 Q774,438 788,438 L1010,438 Q1024,438 1024,452 L1024,480 Z" fill="#f5eee4"/>
    <text x="899" y="456" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable&gt;&gt;</text>
    <text x="899" y="475" class="cardTitle" text-anchor="middle">TestTable</text>
    <text x="794" y="506" class="detail" text-anchor="start">HIKARI_TESTER</text>
    <text x="794" y="524" class="detail" text-anchor="start">test_value varchar</text>
  </g>

  <g data-card="CountryTable / Cities" data-x="1104" data-y="438" data-width="238" data-height="112">
    <rect x="1104" y="438" width="238" height="112" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" class="card"/>
    <path class="header" d="M1104,480 L1104,452 Q1104,438 1118,438 L1328,438 Q1342,438 1342,452 L1342,480 Z" fill="#edf2f7"/>
    <text x="1223" y="456" class="tiny" text-anchor="middle">&lt;&lt;multi-db fixtures&gt;&gt;</text>
    <text x="1223" y="475" class="cardTitle" text-anchor="middle">Country / Cities</text>
    <text x="1124" y="506" class="detail" text-anchor="start">same schema per db</text>
    <text x="1124" y="524" class="detail" text-anchor="start">db1 rows != db2 rows</text>
  </g>

  <g data-card="connection metadata" data-x="132" data-y="690" data-width="270" data-height="82">
    <rect x="132" y="690" width="270" height="82" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M132,728 L132,704 Q132,690 146,690 L388,690 Q402,690 402,704 L402,728 Z" fill="#eef5fa"/>
    <text x="267" y="714" class="cardTitle" text-anchor="middle">connection().metadata</text>
    <text x="152" y="752" class="detail" text-anchor="start">columns + constraints</text>
  </g>

  <g data-card="R2dbcDatabase.connect" data-x="498" data-y="690" data-width="280" data-height="82">
    <rect x="498" y="690" width="280" height="82" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M498,728 L498,704 Q498,690 512,690 L764,690 Q778,690 778,704 L778,728 Z" fill="#f1f6ec"/>
    <text x="638" y="714" class="cardTitle" text-anchor="middle">R2dbcDatabase.connect</text>
    <text x="518" y="752" class="detail" text-anchor="start">URL + optional config</text>
  </g>

  <g data-card="pool URL" data-x="864" data-y="690" data-width="220" data-height="82">
    <rect x="864" y="690" width="220" height="82" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M864,728 L864,704 Q864,690 878,690 L1070,690 Q1084,690 1084,704 L1084,728 Z" fill="#f5eee4"/>
    <text x="974" y="714" class="cardTitle" text-anchor="middle">r2dbc:pool:h2</text>
    <text x="884" y="752" class="detail" text-anchor="start">maxSize=10 reuse</text>
  </g>

  <g data-card="suspendTransaction" data-x="1160" data-y="690" data-width="210" data-height="82">
    <rect x="1160" y="690" width="210" height="82" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1160,728 L1160,704 Q1160,690 1174,690 L1356,690 Q1370,690 1370,704 L1370,728 Z" fill="#f5eef2"/>
    <text x="1265" y="714" class="cardTitle" text-anchor="middle">suspendTransaction</text>
    <text x="1180" y="752" class="detail" text-anchor="start">db-bound coroutine</text>
  </g>

  <path class="inherit" data-connector="connector-inherit-ex01" d="M 430 240 L 378 240"/>
  <path class="hollow" d="M 362 240 L 382 228 L 382 252 Z"/>

  <path class="dep" data-connector="dependency-ex01-people" d="M 520 290 V 348 Q 520 362 506 362 H 266 Q 252 362 252 376 V 424" stroke="#4f86c6"/>
  <polygon points="252,438 244,424 260,424" fill="#4f86c6" stroke="#4f86c6" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" data-connector="dependency-ex01-parent-child" d="M 573 290 V 424" stroke="#6f8f52"/>
  <polygon points="573,438 565,424 581,424" fill="#6f8f52" stroke="#6f8f52" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" data-connector="dependency-pool-testtable" d="M 899 290 V 424" stroke="#a66a3f"/>
  <polygon points="899,438 891,424 907,424" fill="#a66a3f" stroke="#a66a3f" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" data-connector="dependency-multidb-fixtures" d="M 1217 290 V 424" stroke="#a85f7f"/>
  <polygon points="1217,438 1209,424 1225,424" fill="#a85f7f" stroke="#a85f7f" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="use" data-connector="flow-connect-pool-url" d="M 778 731 H 850"/>
  <polygon points="864,731 850,723 850,739" fill="#64748b" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use" data-connector="flow-pool-to-transaction" d="M 1084 731 H 1146"/>
  <polygon points="1160,731 1146,723 1146,739" fill="#64748b" stroke="#64748b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="dep" data-connector="dependency-metadata-api" d="M 132 494 H 88 Q 74 494 74 508 V 731 Q 74 745 88 745 H 118" stroke="#4f86c6"/>
  <polygon points="132,745 118,737 118,753" fill="#4f86c6" stroke="#4f86c6" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" data-connector="dependency-multidb-suspend" d="M 1223 550 V 620 Q 1223 634 1237 634 H 1251 Q 1265 634 1265 648 V 676" stroke="#a85f7f"/>
  <polygon points="1265,690 1257,676 1273,676" fill="#a85f7f" stroke="#a85f7f" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect x="92" y="842" width="1256" height="30" rx="10" class="noteBox"/>
  <text x="720" y="862" class="note" text-anchor="middle">Solid arrows show runtime pool/transaction flow; dashed arrows show source dependencies with direct solid heads for PNG safety.</text>
</svg>
