<path class="line" d="M160.0 1328.0 L415.0 1328.0"/>
<rect class="note" x="193.9" y="1296.0" width="187.2" height="28" rx="9"/>
<text class="strong" x="287.5" y="1316.0" text-anchor="middle">15. suspendTransaction { }</text>
<path class="line" d="M415.0 1402.0 L670.0 1402.0"/>
<rect class="note" x="421.0" y="1370.0" width="243.0" height="28" rx="9"/>
<text class="strong" x="542.5" y="1390.0" text-anchor="middle">16. SchemaUtils.drop(Orders, Users)</text>
<path class="line" d="M670.0 1476.0 L925.0 1476.0"/>
<rect class="note" x="717.5" y="1444.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="797.5" y="1464.0" text-anchor="middle">17. DROP TABLE orders</text>
<path class="line" d="M670.0 1550.0 L925.0 1550.0"/>
<rect class="note" x="717.5" y="1518.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="797.5" y="1538.0" text-anchor="middle">18. DROP TABLE users</text>
<path class="dashed" d="M925.0 1624.0 L670.0 1624.0"/>
<rect class="note" x="717.5" y="1592.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="797.5" y="1612.0" text-anchor="middle">19. done</text>
</svg>
