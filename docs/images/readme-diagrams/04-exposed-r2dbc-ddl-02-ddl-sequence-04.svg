<path class="dashed" d="M925.0 588.0 L670.0 588.0"/>
<rect class="note" x="717.5" y="556.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="797.5" y="576.0" text-anchor="middle">5. done</text>
<path class="dashed" d="M670.0 662.0 L415.0 662.0"/>
<rect class="note" x="462.5" y="630.0" width="160.0" height="28" rx="9"/>
