<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="1754" viewBox="0 0 1085 1754" role="img" aria-label="Schema Migration Flow">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
<marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
<style>.canvas{fill:#F7F9FC}.frame{fill:#fff;stroke:#D8E0EA;stroke-width:1.5}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#102033}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}.smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}.strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}.card{stroke-width:2;filter:url(#shadow)}.line{stroke:#5D6B7A;stroke-width:2.2;fill:none;marker-end:url(#openArrow)}.dashed{stroke:#5D6B7A;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}.lifeline{stroke:#B7C2D1;stroke-width:1.8;stroke-dasharray:8 9}.note{fill:#fff;opacity:.97}</style>
</defs>
<rect class="canvas" width="1085" height="1754"/>
<rect class="frame" x="24" y="24" width="1037" height="1698" rx="22"/>
<text class="title" x="58" y="76">Schema Migration Flow</text>
<text class="subtitle" x="62" y="106">Compact sequence flow with reduced outer and inner whitespace</text>
<rect class="card" x="50.0" y="156" width="220" height="66" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="160.0" y="196" text-anchor="middle">Application</text>
<line class="lifeline" x1="160.0" y1="250" x2="160.0" y2="1692"/>
<rect class="card" x="305.0" y="156" width="220" height="66" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="415.0" y="196" text-anchor="middle">suspendTransaction</text>
<line class="lifeline" x1="415.0" y1="250" x2="415.0" y2="1692"/>
<rect class="card" x="560.0" y="156" width="220" height="66" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="670.0" y="196" text-anchor="middle">SchemaUtils</text>
<line class="lifeline" x1="670.0" y1="250" x2="670.0" y2="1692"/>
<rect class="card" x="815.0" y="156" width="220" height="66" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="925.0" y="196" text-anchor="middle">Database</text>
<line class="lifeline" x1="925.0" y1="250" x2="925.0" y2="1692"/>
<path class="line" d="M160.0 292.0 L415.0 292.0"/>
<rect class="note" x="197.0" y="260.0" width="181.0" height="28" rx="9"/>
<text class="strong" x="287.5" y="280.0" text-anchor="middle">1. suspendTransaction { }</text>
<path class="line" d="M415.0 366.0 L670.0 366.0"/>
<rect class="note" x="417.9" y="334.0" width="249.2" height="28" rx="9"/>
<text class="strong" x="542.5" y="354.0" text-anchor="middle">2. SchemaUtils.create(Users, Orders)</text>
<path class="line" d="M670.0 440.0 L925.0 440.0"/>
<rect class="note" x="657.4" y="408.0" width="280.2" height="28" rx="9"/>
<text class="strong" x="797.5" y="428.0" text-anchor="middle">3. CREATE TABLE IF NOT EXISTS users (...)</text>
<path class="line" d="M670.0 514.0 L925.0 514.0"/>
<rect class="note" x="654.3" y="482.0" width="286.4" height="28" rx="9"/>
