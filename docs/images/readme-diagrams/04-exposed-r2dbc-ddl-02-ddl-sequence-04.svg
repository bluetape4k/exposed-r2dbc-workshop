<path class="line" d="M160.0 736.0 L415.0 736.0"/>
<rect class="note" x="197.0" y="704.0" width="181.0" height="28" rx="9"/>
<text class="strong" x="287.5" y="724.0" text-anchor="middle">7. suspendTransaction { }</text>
<path class="line" d="M415.0 810.0 L670.0 810.0"/>
<rect class="note" x="421.0" y="778.0" width="243.0" height="28" rx="9"/>
<text class="strong" x="542.5" y="798.0" text-anchor="middle">8. SchemaUtils.createMissing(Users)</text>
