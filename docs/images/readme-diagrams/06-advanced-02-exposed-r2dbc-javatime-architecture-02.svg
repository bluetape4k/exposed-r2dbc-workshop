  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">datetime LocalDateTime</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">H2-only high precision</text>
</g>
<g transform="translate(1050,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">datetime LocalDateTime</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">Watch for microsecond</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">truncation</text>
</g>
<g transform="translate(549,668)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">DB column definition</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">complete</text>
