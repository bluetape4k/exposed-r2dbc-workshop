<text class="small" x="689" y="212" text-anchor="middle">Yes</text>
<text class="small" x="856" y="212" text-anchor="middle">No</text>
<text class="small" x="522" y="295" text-anchor="middle">PostgreSQL / MySQ.</text>
<text class="small" x="689" y="295" text-anchor="middle">MariaDB / MySQL V5</text>
<text class="small" x="1023" y="295" text-anchor="middle">Date only</text>
