  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">time LocalTime</text>
</g>
<g transform="translate(48,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Nanosecond precision</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">needed?</text>
</g>
<g transform="translate(382,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">timestamp Instant</text>
</g>
