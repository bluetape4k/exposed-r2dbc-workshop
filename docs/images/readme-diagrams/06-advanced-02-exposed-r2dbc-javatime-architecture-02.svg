<g transform="translate(48,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Decide data</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">representation</text>
</g>
<g transform="translate(382,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Is timezone information</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">needed?</text>
</g>
<g transform="translate(716,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">Does DB support</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">timestampWithTimeZone?</text>
</g>
<g transform="translate(1050,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">What kind of date?</text>
</g>
<g transform="translate(48,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">timestampWithTimeZone</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">OffsetDateTime</text>
</g>
<g transform="translate(382,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Store ZoneId separately</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">in VARCHAR timestamp -</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">Instant</text>
</g>
