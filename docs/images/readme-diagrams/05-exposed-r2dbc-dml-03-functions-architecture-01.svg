<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-label="Exposed R2DBC SQL function category architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:19px;fill:#1e293b}
      .connector{fill:none;stroke:#64748b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#solidArrow)}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect width="1440" height="960" class="canvas"/>
  <rect x="22" y="22" width="1396" height="916" rx="18" class="frame"/>

  <text x="58" y="70" class="title" text-anchor="start">SQL Function Category Architecture</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">The 03-functions module maps six test files to Exposed SQL expressions, evaluation targets, and result assertions.</text>

  <rect x="50" y="130" width="1340" height="236" rx="16" class="lane"/>
  <text x="76" y="160" class="laneTitle" text-anchor="start">TEST FILE RESPONSIBILITIES</text>

  <rect x="50" y="396" width="1340" height="236" rx="16" class="lane"/>
  <text x="76" y="426" class="laneTitle" text-anchor="start">EXPOSED FUNCTION DSL FAMILIES</text>

  <rect x="50" y="662" width="1340" height="168" rx="16" class="lane"/>
  <text x="76" y="692" class="laneTitle" text-anchor="start">EVALUATION TARGETS AND ASSERTIONS</text>

  <g data-card="Evaluation Base" data-x="92" data-y="204" data-width="292" data-height="112">
    <rect x="92" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M92,246 L92,218 Q92,204 106,204 L370,204 Q384,204 384,218 L384,246 Z" fill="#eef5fa"/>
    <text x="238" y="222" class="tiny" text-anchor="middle">&lt;&lt;Ex00_FunctionBase&gt;&gt;</text>
    <text x="238" y="241" class="cardTitle" text-anchor="middle">Evaluation Base</text>
    <text x="112" y="272" class="detail" text-anchor="start">shouldExpressionEqualTo</text>
    <text x="112" y="290" class="detail" text-anchor="start">Table.Dual.select(this)</text>
    <text x="112" y="308" class="detail" text-anchor="start">shared multi-DB base</text>
  </g>

  <g data-card="General Functions" data-x="416" data-y="204" data-width="292" data-height="112">
    <rect x="416" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M416,246 L416,218 Q416,204 430,204 L694,204 Q708,204 708,218 L708,246 Z" fill="#f1f6ec"/>
    <text x="562" y="222" class="tiny" text-anchor="middle">&lt;&lt;Ex01_Functions&gt;&gt;</text>
    <text x="562" y="241" class="cardTitle" text-anchor="middle">General Functions</text>
    <text x="436" y="272" class="detail" text-anchor="start">string + bitwise</text>
    <text x="436" y="290" class="detail" text-anchor="start">case / coalesce</text>
    <text x="436" y="308" class="detail" text-anchor="start">custom function/operator</text>
  </g>

  <g data-card="Numeric Functions" data-x="740" data-y="204" data-width="292" data-height="112">
    <rect x="740" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M740,246 L740,218 Q740,204 754,204 L1018,204 Q1032,204 1032,218 L1032,246 Z" fill="#f5eee4"/>
    <text x="886" y="222" class="tiny" text-anchor="middle">&lt;&lt;Ex02 + Ex04&gt;&gt;</text>
    <text x="886" y="241" class="cardTitle" text-anchor="middle">Numeric Functions</text>
    <text x="760" y="272" class="detail" text-anchor="start">abs / ceil / round</text>
    <text x="760" y="290" class="detail" text-anchor="start">sqrt / exp / power</text>
    <text x="760" y="308" class="detail" text-anchor="start">sin / cos / radians</text>
  </g>

  <g data-card="Analytical Functions" data-x="1064" data-y="204" data-width="292" data-height="112">
    <rect x="1064" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1064,246 L1064,218 Q1064,204 1078,204 L1342,204 Q1356,204 1356,218 L1356,246 Z" fill="#f5eef2"/>
    <text x="1210" y="222" class="tiny" text-anchor="middle">&lt;&lt;Ex03 + Ex05&gt;&gt;</text>
    <text x="1210" y="241" class="cardTitle" text-anchor="middle">Analytics</text>
    <text x="1084" y="272" class="detail" text-anchor="start">stdDev / var family</text>
    <text x="1084" y="290" class="detail" text-anchor="start">rowNumber / rank</text>
    <text x="1084" y="308" class="detail" text-anchor="start">lead / lag / frames</text>
  </g>

  <g data-card="Single Expression Probe" data-x="92" data-y="470" data-width="292" data-height="112">
    <rect x="92" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M92,512 L92,484 Q92,470 106,470 L370,470 Q384,470 384,484 L384,512 Z" fill="#eef5fa"/>
    <text x="238" y="488" class="tiny" text-anchor="middle">&lt;&lt;helper path&gt;&gt;</text>
    <text x="238" y="507" class="cardTitle" text-anchor="middle">Single Expression Probe</text>
    <text x="112" y="538" class="detail" text-anchor="start">SqlFunction&lt;T&gt;</text>
    <text x="112" y="556" class="detail" text-anchor="start">DUAL row evaluation</text>
    <text x="112" y="574" class="detail" text-anchor="start">expected scalar value</text>
  </g>

  <g data-card="Text and Conditional DSL" data-x="416" data-y="470" data-width="292" data-height="112">
    <rect x="416" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M416,512 L416,484 Q416,470 430,470 L694,470 Q708,470 708,484 L708,512 Z" fill="#f1f6ec"/>
    <text x="562" y="488" class="tiny" text-anchor="middle">&lt;&lt;column expressions&gt;&gt;</text>
    <text x="562" y="507" class="cardTitle" text-anchor="middle">Text + Conditional DSL</text>
    <text x="436" y="538" class="detail" text-anchor="start">upper / lower / concat</text>
    <text x="436" y="556" class="detail" text-anchor="start">substring / regexp</text>
    <text x="436" y="574" class="detail" text-anchor="start">case / coalesce</text>
  </g>

  <g data-card="Math and Trig DSL" data-x="740" data-y="470" data-width="292" data-height="112">
    <rect x="740" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M740,512 L740,484 Q740,470 754,470 L1018,470 Q1032,470 1032,484 L1032,512 Z" fill="#f5eee4"/>
    <text x="886" y="488" class="tiny" text-anchor="middle">&lt;&lt;numeric expressions&gt;&gt;</text>
    <text x="886" y="507" class="cardTitle" text-anchor="middle">Math + Trig DSL</text>
    <text x="760" y="538" class="detail" text-anchor="start">BigDecimal comparisons</text>
    <text x="760" y="556" class="detail" text-anchor="start">literal and column args</text>
    <text x="760" y="574" class="detail" text-anchor="start">dialect precision checks</text>
  </g>

  <g data-card="Window DSL" data-x="1064" data-y="470" data-width="292" data-height="112">
    <rect x="1064" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1064,512 L1064,484 Q1064,470 1078,470 L1342,470 Q1356,470 1356,484 L1356,512 Z" fill="#f5eef2"/>
    <text x="1210" y="488" class="tiny" text-anchor="middle">&lt;&lt;OVER clauses&gt;&gt;</text>
    <text x="1210" y="507" class="cardTitle" text-anchor="middle">Window DSL</text>
    <text x="1084" y="538" class="detail" text-anchor="start">partitionBy / orderBy</text>
    <text x="1084" y="556" class="detail" text-anchor="start">ROWS / RANGE frames</text>
    <text x="1084" y="574" class="detail" text-anchor="start">aggregate over windows</text>
  </g>

  <g data-card="Table.Dual" data-x="126" data-y="724" data-width="250" data-height="82">
    <rect x="126" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M126,756 L126,738 Q126,724 140,724 L362,724 Q376,724 376,738 L376,756 Z" fill="#eef7f6"/>
    <text x="251" y="746" class="cardTitle" text-anchor="middle">Table.Dual</text>
    <text x="146" y="776" class="detail" text-anchor="start">scalar function result</text>
    <text x="146" y="794" class="detail" text-anchor="start">no fixture table needed</text>
  </g>

  <g data-card="DMLTestData" data-x="442" data-y="724" data-width="250" data-height="82">
    <rect x="442" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M442,756 L442,738 Q442,724 456,724 L678,724 Q692,724 692,738 L692,756 Z" fill="#f1f6ec"/>
    <text x="567" y="746" class="cardTitle" text-anchor="middle">DMLTestData</text>
    <text x="462" y="776" class="detail" text-anchor="start">Cities, Users</text>
    <text x="462" y="794" class="detail" text-anchor="start">UserData joins</text>
  </g>

  <g data-card="Literal Arguments" data-x="758" data-y="724" data-width="250" data-height="82">
    <rect x="758" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M758,756 L758,738 Q758,724 772,724 L994,724 Q1008,724 1008,738 L1008,756 Z" fill="#f5eee4"/>
    <text x="883" y="746" class="cardTitle" text-anchor="middle">Literal Arguments</text>
    <text x="778" y="776" class="detail" text-anchor="start">int / decimal literals</text>
    <text x="778" y="794" class="detail" text-anchor="start">dialect rounded values</text>
  </g>

  <g data-card="Sales Windows" data-x="1074" data-y="724" data-width="250" data-height="82">
    <rect x="1074" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1074,756 L1074,738 Q1074,724 1088,724 L1310,724 Q1324,724 1324,738 L1324,756 Z" fill="#f5eef2"/>
    <text x="1199" y="746" class="cardTitle" text-anchor="middle">Sales Windows</text>
    <text x="1094" y="776" class="detail" text-anchor="start">year / product groups</text>
    <text x="1094" y="794" class="detail" text-anchor="start">amount order + frames</text>
  </g>

  <path class="connector" data-connector="base-probe" d="M 238 316 L 238 470"/>
  <path class="connector" data-connector="general-dsl" d="M 562 316 L 562 470"/>
  <path class="connector" data-connector="numeric-dsl" d="M 886 316 L 886 470"/>
  <path class="connector" data-connector="analytics-dsl" d="M 1210 316 L 1210 470"/>

  <path class="connector" data-connector="probe-dual" d="M 238 582 L 238 724"/>
  <path class="connector" data-connector="text-data" d="M 562 582 L 562 724"/>
  <path class="connector" data-connector="math-literals" d="M 886 582 L 886 724"/>
  <path class="connector" data-connector="window-sales" d="M 1210 582 L 1210 724"/>

  <rect x="96" y="874" width="1248" height="30" rx="10" class="noteBox"/>
  <text x="720" y="894" class="note" text-anchor="middle">Function tests either evaluate scalar expressions through Table.Dual or run column/window expressions against repository-backed DML fixtures.</text>
</svg>
