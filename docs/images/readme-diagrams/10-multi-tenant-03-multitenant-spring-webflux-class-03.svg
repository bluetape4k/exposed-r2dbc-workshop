<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-label="Spring WebFlux tenant-aware class map">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f5f8fb}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:2}
      .lane{fill:#f8fafc;stroke:#dbe6ef;stroke-width:1.6}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;letter-spacing:.08em;fill:#91a6b7}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:46px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#526276;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#64748b;font-weight:700}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#1e293b}
      .card{filter:url(#softShadow)}
      .header{opacity:.97}
      .connector{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke-dasharray:11 9}
      .blue{stroke:#3c82b4}.green{stroke:#5f8848}.gold{stroke:#b78632}.teal{stroke:#4f8f8b}.red{stroke:#b76b6b}.slate{stroke:#607386}
      .blueFill{fill:#eef5fa}.greenFill{fill:#f1f6ec}.goldFill{fill:#f7f0e2}.tealFill{fill:#eef7f6}.redFill{fill:#f8eeee}.slateFill{fill:#eef2f6}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1040" class="canvas"/>
  <rect x="28" y="28" width="1544" height="984" rx="24" class="frame"/>

  <text x="78" y="94" class="title">Spring WebFlux Tenant-Aware Class Map</text>
  <text x="78" y="132" class="subtitle">Concrete classes for tenant validation, ReactorContext propagation, Exposed R2DBC repositories, and schema tables.</text>

  <rect x="58" y="166" width="1484" height="184" rx="20" class="lane"/>
  <text x="86" y="206" class="laneTitle">FRAMEWORK CONTRACTS</text>
  <rect x="58" y="382" width="1484" height="236" rx="20" class="lane"/>
  <text x="86" y="422" class="laneTitle">WORKSHOP IMPLEMENTATIONS</text>
  <rect x="58" y="650" width="1484" height="210" rx="20" class="lane"/>
  <text x="86" y="690" class="laneTitle">TENANT HELPERS AND DOMAIN DATA</text>
  <rect x="58" y="892" width="1484" height="80" rx="20" class="lane"/>
  <text x="86" y="932" class="laneTitle">READER CONTRACT</text>

  <g data-card="WebFilter" data-x="115" data-y="236" data-width="250" data-height="82">
    <rect x="115" y="236" width="250" height="82" rx="14" fill="#fff" stroke="#607386" stroke-width="3" class="card"/>
    <path class="header slateFill" d="M115,274 L115,250 Q115,236 129,236 L351,236 Q365,236 365,250 L365,274 Z"/>
    <text x="240" y="258" class="tiny" text-anchor="middle">&lt;&lt;Spring contract&gt;&gt;</text>
    <text x="240" y="287" class="cardTitle" text-anchor="middle">WebFilter</text>
  </g>

  <g data-card="CoroutineContext.Element" data-x="455" data-y="236" data-width="300" data-height="82">
    <rect x="455" y="236" width="300" height="82" rx="14" fill="#fff" stroke="#607386" stroke-width="3" class="card"/>
    <path class="header slateFill" d="M455,274 L455,250 Q455,236 469,236 L741,236 Q755,236 755,250 L755,274 Z"/>
    <text x="605" y="258" class="tiny" text-anchor="middle">&lt;&lt;Kotlin contract&gt;&gt;</text>
    <text x="605" y="287" class="cardTitle" text-anchor="middle">CoroutineContext.Element</text>
  </g>

  <g data-card="R2dbcRepository" data-x="880" data-y="236" data-width="300" data-height="82">
    <rect x="880" y="236" width="300" height="82" rx="14" fill="#fff" stroke="#607386" stroke-width="3" class="card"/>
    <path class="header slateFill" d="M880,274 L880,250 Q880,236 894,236 L1166,236 Q1180,236 1180,250 L1180,274 Z"/>
    <text x="1030" y="258" class="tiny" text-anchor="middle">&lt;&lt;bluetape4k&gt;&gt;</text>
    <text x="1030" y="287" class="cardTitle" text-anchor="middle">R2dbcRepository&lt;K,E&gt;</text>
  </g>

  <g data-card="Exposed Tables" data-x="1265" data-y="236" data-width="240" data-height="82">
    <rect x="1265" y="236" width="240" height="82" rx="14" fill="#fff" stroke="#607386" stroke-width="3" class="card"/>
    <path class="header slateFill" d="M1265,274 L1265,250 Q1265,236 1279,236 L1491,236 Q1505,236 1505,250 L1505,274 Z"/>
    <text x="1385" y="258" class="tiny" text-anchor="middle">&lt;&lt;Exposed&gt;&gt;</text>
    <text x="1385" y="287" class="cardTitle" text-anchor="middle">LongIdTable / Table</text>
  </g>

  <g data-card="TenantFilter" data-x="115" data-y="454" data-width="250" data-height="116">
    <rect x="115" y="454" width="250" height="116" rx="14" fill="#fff" stroke="#5f8848" stroke-width="3" class="card"/>
    <path class="header greenFill" d="M115,499 L115,468 Q115,454 129,454 L351,454 Q365,454 365,468 L365,499 Z"/>
    <text x="240" y="476" class="tiny" text-anchor="middle">&lt;&lt;component&gt;&gt;</text>
    <text x="240" y="498" class="cardTitle" text-anchor="middle">TenantFilter</text>
    <text x="137" y="528" class="detail">filter(exchange, chain)</text>
    <text x="137" y="552" class="detail">X-TENANT-ID -> TenantId</text>
  </g>

  <g data-card="TenantId" data-x="470" data-y="454" data-width="270" data-height="116">
    <rect x="470" y="454" width="270" height="116" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="3" class="card"/>
    <path class="header tealFill" d="M470,499 L470,468 Q470,454 484,454 L726,454 Q740,454 740,468 L740,499 Z"/>
    <text x="605" y="476" class="tiny" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
    <text x="605" y="498" class="cardTitle" text-anchor="middle">TenantId</text>
    <text x="492" y="528" class="detail">value: Tenants.Tenant</text>
    <text x="492" y="552" class="detail">TENANT_ID_KEY</text>
  </g>

  <g data-card="ActorController" data-x="790" data-y="454" data-width="270" data-height="116">
    <rect x="790" y="454" width="270" height="116" rx="14" fill="#fff" stroke="#3c82b4" stroke-width="3" class="card"/>
    <path class="header blueFill" d="M790,499 L790,468 Q790,454 804,454 L1046,454 Q1060,454 1060,468 L1060,499 Z"/>
    <text x="925" y="476" class="tiny" text-anchor="middle">&lt;&lt;REST controller&gt;&gt;</text>
    <text x="925" y="498" class="cardTitle" text-anchor="middle">ActorController</text>
    <text x="812" y="528" class="detail">getAllActors()</text>
    <text x="812" y="552" class="detail">findById(id)</text>
  </g>

  <g data-card="ActorR2dbcRepository" data-x="1090" data-y="454" data-width="240" data-height="116">
    <rect x="1090" y="454" width="240" height="116" rx="14" fill="#fff" stroke="#3c82b4" stroke-width="3" class="card"/>
    <path class="header blueFill" d="M1090,499 L1090,468 Q1090,454 1104,454 L1316,454 Q1330,454 1330,468 L1330,499 Z"/>
    <text x="1210" y="476" class="tiny" text-anchor="middle">&lt;&lt;repository&gt;&gt;</text>
    <text x="1210" y="498" class="cardTitle" text-anchor="middle">ActorR2dbcRepo</text>
    <text x="1110" y="528" class="detail">table = ActorTable</text>
    <text x="1110" y="552" class="detail">search/save</text>
  </g>

  <g data-card="MovieR2dbcRepository" data-x="1350" data-y="454" data-width="190" data-height="116">
    <rect x="1350" y="454" width="190" height="116" rx="14" fill="#fff" stroke="#3c82b4" stroke-width="3" class="card"/>
    <path class="header blueFill" d="M1350,499 L1350,468 Q1350,454 1364,454 L1526,454 Q1540,454 1540,468 L1540,499 Z"/>
    <text x="1445" y="476" class="tiny" text-anchor="middle">&lt;&lt;repository&gt;&gt;</text>
    <text x="1445" y="498" class="cardTitle" text-anchor="middle">MovieRepo</text>
    <text x="1368" y="528" class="detail">join queries</text>
    <text x="1368" y="552" class="detail">buffered Flow</text>
  </g>

  <g data-card="Tenants" data-x="115" data-y="724" data-width="270" data-height="96">
    <rect x="115" y="724" width="270" height="96" rx="14" fill="#fff" stroke="#5f8848" stroke-width="3" class="card"/>
    <path class="header greenFill" d="M115,766 L115,738 Q115,724 129,724 L371,724 Q385,724 385,738 L385,766 Z"/>
    <text x="250" y="746" class="tiny" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
    <text x="250" y="768" class="cardTitle" text-anchor="middle">Tenants</text>
    <text x="137" y="798" class="detail">KOREAN, ENGLISH</text>
  </g>

  <g data-card="Tenant transaction helpers" data-x="455" data-y="724" data-width="360" data-height="96">
    <rect x="455" y="724" width="360" height="96" rx="14" fill="#fff" stroke="#b78632" stroke-width="3" class="card"/>
    <path class="header goldFill" d="M455,766 L455,738 Q455,724 469,724 L801,724 Q815,724 815,738 L815,766 Z"/>
    <text x="635" y="746" class="tiny" text-anchor="middle">&lt;&lt;tenant utilities&gt;&gt;</text>
    <text x="635" y="768" class="cardTitle" text-anchor="middle">currentReactorTenant + tx</text>
    <text x="477" y="798" class="detail">suspendTransactionWithTenant</text>
  </g>

  <g data-card="DTO records" data-x="860" data-y="724" data-width="360" data-height="96">
    <rect x="860" y="724" width="360" height="96" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="3" class="card"/>
    <path class="header tealFill" d="M860,766 L860,738 Q860,724 874,724 L1206,724 Q1220,724 1220,738 L1220,766 Z"/>
    <text x="1040" y="746" class="tiny" text-anchor="middle">&lt;&lt;Serializable DTO&gt;&gt;</text>
    <text x="1040" y="768" class="cardTitle" text-anchor="middle">DTO Records</text>
    <text x="884" y="798" class="detail">ActorRecord / MovieRecord</text>
  </g>

  <g data-card="MovieSchema" data-x="1235" data-y="724" data-width="270" data-height="96">
    <rect x="1235" y="724" width="270" height="96" rx="14" fill="#fff" stroke="#b78632" stroke-width="3" class="card"/>
    <path class="header goldFill" d="M1235,766 L1235,738 Q1235,724 1249,724 L1491,724 Q1505,724 1505,738 L1505,766 Z"/>
    <text x="1370" y="746" class="tiny" text-anchor="middle">&lt;&lt;Exposed schema&gt;&gt;</text>
    <text x="1370" y="768" class="cardTitle" text-anchor="middle">MovieSchema</text>
    <text x="1257" y="798" class="detail">Movie / Actor / join</text>
  </g>

  <path class="connector slate" data-connector="tenant-filter-implements" d="M240 454 L240 318"/>
  <polygon points="240,318 228,338 252,338" fill="#fff" stroke="#607386" stroke-width="3.6" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector slate" data-connector="tenant-id-implements" d="M605 454 L605 318"/>
  <polygon points="605,318 593,338 617,338" fill="#fff" stroke="#607386" stroke-width="3.6" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector slate" data-connector="actor-repo-extends" d="M1210 454 L1210 382 Q1210 366 1194 366 L1046 366 Q1030 366 1030 350 L1030 318"/>
  <polygon points="1030,318 1018,338 1042,338" fill="#fff" stroke="#607386" stroke-width="3.6" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector slate" data-connector="movie-repo-extends" d="M1445 454 L1445 376 Q1445 360 1429 360 L1076 360 Q1060 360 1060 344 L1060 318"/>
  <polygon points="1060,318 1048,338 1072,338" fill="#fff" stroke="#607386" stroke-width="3.6" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector blue dash" data-connector="controller-uses-repo" d="M1060 512 L1090 512"/>
  <polyline points="1090,512 1074,503 1074,521" fill="none" stroke="#3c82b4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector gold dash" data-connector="controller-uses-tx" d="M925 570 L925 632 Q925 648 909 648 L651 648 Q635 648 635 664 L635 724"/>
  <polyline points="635,724 626,708 644,708" fill="none" stroke="#b78632" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector teal dash" data-connector="tx-reads-tenant-id" d="M635 724 L635 670 Q635 654 619 654 Q605 654 605 638 L605 570"/>
  <polyline points="605,570 596,586 614,586" fill="none" stroke="#4f8f8b" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector green dash" data-connector="tx-uses-tenants" d="M455 772 L385 772"/>
  <polyline points="385,772 401,763 401,781" fill="none" stroke="#5f8848" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector blue dash" data-connector="repos-map-dto" d="M1210 570 L1210 632 Q1210 648 1194 648 L1056 648 Q1040 648 1040 664 L1040 724"/>
  <polyline points="1040,724 1031,708 1049,708" fill="none" stroke="#3c82b4" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector gold dash" data-connector="repos-use-schema" d="M1445 570 L1445 632 Q1445 648 1429 648 L1386 648 Q1370 648 1370 664 L1370 724"/>
  <polyline points="1370,724 1361,708 1379,708" fill="none" stroke="#b78632" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>

  <path class="connector slate" data-connector="schema-extends-table" d="M1370 724 L1370 660 Q1370 644 1386 644 L1542 644 Q1558 644 1558 628 L1558 293 Q1558 277 1542 277 L1505 277"/>
  <polygon points="1505,277 1525,265 1525,289" fill="#fff" stroke="#607386" stroke-width="3.6" stroke-linejoin="round" stroke-dasharray="none"/>

  <rect x="500" y="922" width="870" height="34" rx="11" class="noteBox"/>
  <text x="935" y="946" class="note" text-anchor="middle">Hollow triangles show contracts; dashed arrows show source-level dependency.</text>
</svg>
