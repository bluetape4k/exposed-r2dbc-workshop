<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" role="img" aria-label="Spring suspended cache class diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="inherit-head" viewBox="0 0 18 16" refX="18" refY="8" markerWidth="18" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 18 8 L 0 0 L 0 16 Z" fill="#fff" stroke="#64748b" stroke-width="2.4" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#536476;font-weight:700}
      .small{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:12px;fill:#64748b;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1e293b}
      .inherit{fill:none;stroke:#64748b;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .use{fill:none;stroke:#64748b;stroke-width:2.4;stroke-dasharray:7 6;stroke-linecap:butt;stroke-linejoin:round}
      .head{fill:none;stroke:#64748b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;style:stroke-dasharray:none!important}
      .labelPill{fill:#fff;stroke:#d7e2ec;stroke-width:1.2}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.4}
    </style>
  </defs>

  <rect width="1400" height="940" class="canvas"/>
  <rect x="24" y="24" width="1352" height="892" rx="18" class="frame"/>

  <text x="62" y="72" class="title">Spring Suspended Cache Class Structure</text>
  <text x="62" y="101" class="subtitle">Concrete UML: cached repository decorates the default repository and delegates cache work to LettuceSuspendedCacheManager.</text>

  <rect x="52" y="130" width="1296" height="186" rx="16" class="lane"/>
  <text x="78" y="160" class="laneTitle">REPOSITORY CONTRACT</text>

  <rect x="52" y="344" width="1296" height="300" rx="16" class="lane"/>
  <text x="78" y="374" class="laneTitle">IMPLEMENTATIONS</text>

  <rect x="52" y="672" width="1296" height="148" rx="16" class="lane"/>
  <text x="78" y="702" class="laneTitle">COLLABORATORS</text>

  <rect x="52" y="844" width="1296" height="48" rx="16" class="lane"/>

  <g data-card="CountryR2dbcRepository" data-x="510" data-y="180" data-width="380" data-height="112">
    <rect x="510" y="180" width="380" height="112" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M510,224 L510,194 Q510,180 524,180 L876,180 Q890,180 890,194 L890,224 Z" fill="#eef5fa"/>
    <text x="700" y="199" class="tiny" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text x="700" y="219" class="cardTitle" text-anchor="middle">CountryR2dbcRepository</text>
    <text x="540" y="250" class="detail">+ findByCode(code): CountryRecord?</text>
    <text x="540" y="272" class="detail">+ update(record): Int; evictCacheAll()</text>
  </g>

  <g data-card="DefaultCountryR2dbcRepository" data-x="142" data-y="426" data-width="344" data-height="124">
    <rect x="142" y="426" width="344" height="124" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M142,470 L142,440 Q142,426 156,426 L472,426 Q486,426 486,440 L486,470 Z" fill="#f5eee4"/>
    <text x="314" y="445" class="tiny" text-anchor="middle">&lt;&lt;implementation&gt;&gt;</text>
    <text x="314" y="465" class="cardTitle" text-anchor="middle">DefaultCountryR2dbcRepository</text>
    <text x="170" y="496" class="detail">selectAll().where(code eq ...)</text>
    <text x="170" y="518" class="detail">update by CountryRecord.code</text>
  </g>

  <g data-card="CachedCountryR2dbcRepository" data-x="914" data-y="426" data-width="344" data-height="124">
    <rect x="914" y="426" width="344" height="124" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M914,470 L914,440 Q914,426 928,426 L1244,426 Q1258,426 1258,440 L1258,470 Z" fill="#f1f6ec"/>
    <text x="1086" y="445" class="tiny" text-anchor="middle">&lt;&lt;decorator&gt;&gt;</text>
    <text x="1086" y="465" class="cardTitle" text-anchor="middle">CachedCountryR2dbcRepository</text>
    <text x="942" y="496" class="detail">delegate: CountryR2dbcRepository</text>
    <text x="942" y="518" class="detail">lazy cache by CACHE_NAME</text>
  </g>

  <g data-card="LettuceSuspendedCacheManager" data-x="544" data-y="702" data-width="312" data-height="108">
    <rect x="544" y="702" width="312" height="108" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M544,746 L544,716 Q544,702 558,702 L842,702 Q856,702 856,716 L856,746 Z" fill="#eef7f6"/>
    <text x="700" y="721" class="tiny" text-anchor="middle">&lt;&lt;manager&gt;&gt;</text>
    <text x="700" y="741" class="cardTitle" text-anchor="middle">LettuceSuspendedCacheManager</text>
    <text x="568" y="772" class="detail">getOrCreate(name, ttl, codec)</text>
    <text x="568" y="794" class="small">owns Redis connections and cache map</text>
  </g>

  <g data-card="CountryTable" data-x="142" data-y="712" data-width="344" data-height="88">
    <rect x="142" y="712" width="344" height="88" rx="14" fill="#fff" stroke="#8a6f55" stroke-width="2" class="card"/>
    <path class="header" d="M142,754 L142,726 Q142,712 156,712 L472,712 Q486,712 486,726 L486,754 Z" fill="#f3eee8"/>
    <text x="314" y="730" class="tiny" text-anchor="middle">&lt;&lt;IntIdTable&gt;&gt;</text>
    <text x="314" y="749" class="cardTitle" text-anchor="middle">CountryTable</text>
    <text x="170" y="778" class="detail">countries(code unique, name, description)</text>
  </g>

  <g data-card="LettuceSuspendedCache" data-x="914" data-y="702" data-width="344" data-height="108">
    <rect x="914" y="702" width="344" height="108" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M914,746 L914,716 Q914,702 928,702 L1244,702 Q1258,702 1258,716 L1258,746 Z" fill="#eef7f6"/>
    <text x="1086" y="721" class="tiny" text-anchor="middle">&lt;&lt;generic cache&gt;&gt;</text>
    <text x="1086" y="741" class="cardTitle" text-anchor="middle">LettuceSuspendedCache&lt;K,V&gt;</text>
    <text x="942" y="772" class="detail">get / put / evict / clear</text>
    <text x="942" y="794" class="small">commands + keyCommands + ttlSeconds</text>
  </g>

  <path class="inherit" data-connector="default-implements" d="M314 426 L314 334 Q314 318 330 318 L682 318 Q700 318 700 300 L700 292" marker-end="url(#inherit-head)"/>
  <path class="inherit" data-connector="cached-implements" d="M1086 426 L1086 334 Q1086 318 1070 318 L718 318 Q700 318 700 300 L700 292" marker-end="url(#inherit-head)"/>

  <path class="use" data-connector="delegate-use" d="M914 488 L500 488"/>
  <polyline class="head" points="500,481 486,488 500,495"/>
  <rect x="616" y="456" width="168" height="24" rx="12" class="labelPill"/>
  <text x="700" y="473" class="tiny" text-anchor="middle">delegate.findByCode</text>

  <path class="use" data-connector="manager-use" d="M1086 550 L1086 636 Q1086 652 1070 652 L716 652 Q700 652 700 668 L700 688"/>
  <polyline class="head" points="693,688 700,702 707,688"/>
  <rect x="842" y="620" width="96" height="24" rx="12" class="labelPill"/>
  <text x="890" y="637" class="tiny" text-anchor="middle">manager</text>

  <path class="use" data-connector="manager-creates-cache" d="M856 756 L900 756"/>
  <polyline class="head" points="900,749 914,756 900,763"/>

  <path class="use" data-connector="default-table-use" d="M314 550 L314 698"/>
  <polyline class="head" points="307,698 314,712 321,698"/>
  <rect x="256" y="614" width="116" height="24" rx="12" class="labelPill"/>
  <text x="314" y="631" class="tiny" text-anchor="middle">Exposed DSL</text>

  <rect x="110" y="854" width="1180" height="28" rx="10" class="noteBox"/>
  <text x="700" y="873" class="note" text-anchor="middle">Solid hollow triangles show interface implementation; dashed open arrows show use/dependency with direct solid arrowheads.</text>
</svg>
