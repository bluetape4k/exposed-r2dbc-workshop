<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1037" viewBox="0 0 1754 1037" role="img" aria-label="Cache Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1037"/>
<rect class="frame" x="32" y="28" width="1690" height="981" rx="28"/>
<text class="title" x="66" y="82">Cache Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1082 180 L1082 102 L262 102 L262 292"/>
<path class="line" d="M672 563 L672 496 L1082 496 L1082 413"/>
<path class="line" d="M672 563 L672 488 L1082 488 L1082 754"/>
<path class="implLine" d="M672 563 L672 355"/>
<path class="implLine" d="M1082 563 L1082 472 L672 472 L672 355"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">LettuceSuspendedCache</text>

</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">CountryR2dbcRepository</text>
  <text class="mono" x="18" y="108">+findByCode(code) CountryRecord?</text>
<text class="mono" x="18" y="129">+update(record) Int</text>
<text class="mono" x="18" y="150">+evictCacheAll()</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="233" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Lettuce Suspended Cache</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Manager</text>
  <text class="mono" x="18" y="124">-redisClient RedisClient</text>
<text class="mono" x="18" y="145">-ttlSeconds Long</text>
<text class="mono" x="18" y="166">-codec LettuceBinaryCodec</text>
<text class="mono" x="18" y="187">+getOrCreate(name, ttlSeconds)</text>
<text class="mono" x="18" y="208">LettuceSuspendedCache</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">LettuceSuspendedCacheK</text>

</g>
<g transform="translate(502,563)">
  <rect class="card" x="0" y="0" width="340" height="254" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Cached Country R2dbc</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Repository</text>
  <text class="mono" x="18" y="124">-delegate CountryR2dbcRepository</text>
<text class="mono" x="18" y="145">-cacheManager LettuceSuspendedCacheManager</text>
<text class="mono" x="18" y="166">-cache LettuceSuspendedCache</text>
<text class="mono" x="18" y="187">+findByCode(code) CountryRecord?</text>
<text class="mono" x="18" y="208">+update(record) Int</text>
<text class="mono" x="18" y="229">+evictCacheAll()</text>
</g>
<g transform="translate(912,563)">
  <rect class="card" x="0" y="0" width="340" height="191" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Default Country R2dbc</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Repository</text>
  <text class="mono" x="18" y="124">+findByCode(code) CountryRecord?</text>
<text class="mono" x="18" y="145">+update(record) Int</text>
<text class="mono" x="18" y="166">+evictCacheAll()</text>
</g>
</svg>
