<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Tenant Read/Write Registry">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#5D6B7A"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}
    .line{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .plain{stroke:#758297;stroke-width:2.0;fill:none}.dash{stroke:#758297;stroke-width:2.0;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1100" height="560"/>
<rect class="frame" x="32" y="28" width="1036" height="504" rx="28"/>
<text class="title" x="66" y="82">Tenant Read/Write Registry</text>
<text class="subtitle" x="70" y="118">Each tenant can register separate read-write and read-only connection factories</text>
<g transform="translate(90,235)">
  <rect class="card" x="0" y="0" width="270" height="96" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="135" y="42.5" text-anchor="middle">ConnectionFactoryRegistry</text>
<text class="smallLabel" x="135" y="67.5" text-anchor="middle">lookup by tenant:mode</text>
</g><g transform="translate(520,150)">
  <rect class="card" x="0" y="0" width="300" height="74" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="150" y="31.5" text-anchor="middle">default:rw</text>
<text class="smallLabel" x="150" y="56.5" text-anchor="middle">default tenant read + write</text>
</g><g transform="translate(520,245)">
  <rect class="card" x="0" y="0" width="300" height="74" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="150" y="31.5" text-anchor="middle">default:ro</text>
<text class="smallLabel" x="150" y="56.5" text-anchor="middle">default tenant read only</text>
</g><g transform="translate(520,340)">
  <rect class="card" x="0" y="0" width="300" height="74" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="150" y="31.5" text-anchor="middle">acme:rw</text>
<text class="smallLabel" x="150" y="56.5" text-anchor="middle">acme tenant read + write</text>
</g><g transform="translate(520,435)">
  <rect class="card" x="0" y="0" width="300" height="74" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="150" y="31.5" text-anchor="middle">acme:ro</text>
<text class="smallLabel" x="150" y="56.5" text-anchor="middle">acme tenant read only</text>
</g><path class="line" d="M360 283 L520 187"/><path class="line" d="M360 283 L520 282"/><path class="line" d="M360 283 L520 377"/><path class="line" d="M360 283 L520 472"/><text class="small" x="550" y="514" text-anchor="middle">When an ro URL is omitted, the rw URL is reused for read-only traffic.</text></svg>
