<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <rect width="1400" height="760" fill="#f7fafc"/>
  <text x="80" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Ktor R2DBC Routing Datasource</text>
  <text x="80" y="112" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Call-scoped routing state selects one physical R2DBC target explicitly.</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#111827">
    <rect x="80" y="170" width="260" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="110" y="212" font-weight="700">HTTP Request</text>
    <text x="110" y="240" fill="#374151">X-Tenant-Id, X-Read-Only</text>
    <rect x="420" y="170" width="300" height="96" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="450" y="212" font-weight="700">RoutingRequestPlugin</text>
    <text x="450" y="240" fill="#374151">validates and stores attributes</text>
    <rect x="800" y="170" width="300" height="96" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="830" y="212" font-weight="700">RoutingMarkerRoutes</text>
    <text x="830" y="240" fill="#374151">passes RoutingRequest value</text>
    <rect x="420" y="350" width="300" height="96" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="450" y="392" font-weight="700">RoutingMarkerRepository</text>
    <text x="450" y="420" fill="#374151">selects registry.database(route)</text>
    <rect x="800" y="350" width="300" height="96" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="830" y="392" font-weight="700">RoutingDatabaseRegistry</text>
    <text x="830" y="420" fill="#374151">key to R2dbcDatabase</text>
  </g>
  <g stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M340 218 L420 218"/>
    <path d="M720 218 L800 218"/>
    <path d="M950 266 L950 350"/>
    <path d="M800 398 L720 398"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#111827">
    <rect x="160" y="560" width="230" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="190" y="594" font-weight="700">default:rw</text>
    <text x="190" y="620" fill="#475569">marker default-rw</text>
    <rect x="430" y="560" width="230" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="460" y="594" font-weight="700">default:ro</text>
    <text x="460" y="620" fill="#475569">marker default-ro</text>
    <rect x="700" y="560" width="230" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="730" y="594" font-weight="700">acme:rw</text>
    <text x="730" y="620" fill="#475569">marker acme-rw</text>
    <rect x="970" y="560" width="230" height="74" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1000" y="594" font-weight="700">acme:ro</text>
    <text x="1000" y="620" fill="#475569">marker acme-ro</text>
  </g>
  <path d="M950 446 L950 510 L275 510 L275 560" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M950 510 L545 510 L545 560" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M950 510 L815 510 L815 560" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M950 510 L1085 560" stroke="#4b5563" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>
</svg>
