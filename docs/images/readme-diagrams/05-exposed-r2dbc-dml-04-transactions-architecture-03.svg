<path class="line" d="M338 386 C338 303 372 303 372 220" data-connector="line"/>
<path class="line" d="M338 386 C338 386 38 386 38 386" data-connector="line"/>
<path class="line" d="M372 220 C372 303 338 303 338 386" data-connector="line"/>
<path class="line" d="M672 220 C672 220 372 220 372 220" data-connector="line"/>
<path class="line" d="M338 220 C338 220 372 220 372 220" data-connector="line"/>
<g transform="translate(48,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">IDLE</text>
</g>
<g transform="translate(382,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">ACTIVE</text>
</g>
<g transform="translate(716,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">SELECT/INSERT/UPDATE</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">/DELETE</text>
</g>
<g transform="translate(48,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">SAVEPOINT</text>
</g>
<g transform="translate(382,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">COMMITTED</text>
</g>
<g transform="translate(716,336)">
