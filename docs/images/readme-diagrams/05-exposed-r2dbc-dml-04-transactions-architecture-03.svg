<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" width="1320" height="860" role="img" aria-label="Transaction state diagram for Exposed R2DBC DML transaction tests">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12" />
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14">
      <path d="M 0 1 L 14 7 L 0 13 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14">
      <path d="M 0 1 L 14 7 L 0 13 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <marker id="arrow-brown" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14">
      <path d="M 0 1 L 14 7 L 0 13 Z" fill="#a66a3f" stroke="#a66a3f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14">
      <path d="M 0 1 L 14 7 L 0 13 Z" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <marker id="arrow-rose" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14">
      <path d="M 0 1 L 14 7 L 0 13 Z" fill="#a85f7f" stroke="#a85f7f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:30px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
      .connector{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1320" height="860" class="canvas" />
  <rect x="22" y="22" width="1276" height="816" rx="18" class="frame" />
  <text x="58" y="68" class="title" text-anchor="start">Transaction State Diagram</text>
  <text x="58" y="96" class="subtitle" text-anchor="start">Concrete state map for isolation, exec, timeout, savepoint rollback, and final assertions.</text>

  <rect x="48" y="128" width="1224" height="154" rx="16" class="lane" />
  <text x="72" y="158" class="laneTitle" text-anchor="start">TRANSACTION ENTRY</text>
  <rect x="48" y="306" width="1224" height="242" rx="16" class="lane" />
  <text x="72" y="336" class="laneTitle" text-anchor="start">ACTIVE STATES</text>
  <rect x="48" y="572" width="1224" height="172" rx="16" class="lane" />
  <text x="72" y="602" class="laneTitle" text-anchor="start">TERMINAL OUTCOMES</text>

  <g data-card="Test Scope" data-x="94" data-y="180" data-width="250" data-height="82">
    <rect x="94" y="180" width="250" height="82" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card" />
    <path class="header" d="M94,220 L94,194 Q94,180 108,180 L330,180 Q344,180 344,194 L344,220 Z" fill="#eef5fa" />
    <text x="219" y="198" class="tiny" text-anchor="middle">&lt;&lt;entry&gt;&gt;</text>
    <text x="219" y="217" class="cardTitle" text-anchor="middle">Test Scope</text>
    <text x="112" y="242" class="detail" text-anchor="start">withDb / withTables</text>
  </g>
  <g data-card="Transaction Config" data-x="404" data-y="180" data-width="250" data-height="82">
    <rect x="404" y="180" width="250" height="82" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card" />
    <path class="header" d="M404,220 L404,194 Q404,180 418,180 L640,180 Q654,180 654,194 L654,220 Z" fill="#f1f6ec" />
    <text x="529" y="198" class="tiny" text-anchor="middle">&lt;&lt;config&gt;&gt;</text>
    <text x="529" y="217" class="cardTitle" text-anchor="middle">Transaction Config</text>
    <text x="422" y="242" class="detail" text-anchor="start">isolation / timeout</text>
  </g>
  <g data-card="Coroutine Transaction" data-x="714" data-y="180" data-width="250" data-height="82">
    <rect x="714" y="180" width="250" height="82" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card" />
    <path class="header" d="M714,220 L714,194 Q714,180 728,180 L950,180 Q964,180 964,194 L964,220 Z" fill="#eef7f6" />
    <text x="839" y="198" class="tiny" text-anchor="middle">&lt;&lt;boundary&gt;&gt;</text>
    <text x="839" y="217" class="cardTitle" text-anchor="middle">Coroutine Transaction</text>
    <text x="732" y="242" class="detail" text-anchor="start">suspendTransaction</text>
  </g>
  <g data-card="Top-Level Override" data-x="1004" data-y="180" data-width="220" data-height="82">
    <rect x="1004" y="180" width="220" height="82" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card" />
    <path class="header" d="M1004,220 L1004,194 Q1004,180 1018,180 L1210,180 Q1224,180 1224,194 L1224,220 Z" fill="#f5eee4" />
    <text x="1114" y="198" class="tiny" text-anchor="middle">&lt;&lt;variant&gt;&gt;</text>
    <text x="1114" y="217" class="cardTitle" text-anchor="middle">Top-Level Override</text>
    <text x="1022" y="242" class="detail" text-anchor="start">inTopLevelSuspendTx</text>
  </g>

  <g data-card="Active Transaction" data-x="94" data-y="374" data-width="230" data-height="96">
    <rect x="94" y="374" width="230" height="96" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card" />
    <path class="header" d="M94,416 L94,388 Q94,374 108,374 L310,374 Q324,374 324,388 L324,416 Z" fill="#eef7f6" />
    <text x="209" y="392" class="tiny" text-anchor="middle">&lt;&lt;state&gt;&gt;</text>
    <text x="209" y="411" class="cardTitle" text-anchor="middle">Active Transaction</text>
    <text x="112" y="436" class="detail" text-anchor="start">maxAttempts / db</text>
    <text x="112" y="455" class="detail" text-anchor="start">current transaction</text>
  </g>
  <g data-card="Exec Statement" data-x="384" data-y="374" data-width="230" data-height="96">
    <rect x="384" y="374" width="230" height="96" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card" />
    <path class="header" d="M384,416 L384,388 Q384,374 398,374 L600,374 Q614,374 614,388 L614,416 Z" fill="#eef5fa" />
    <text x="499" y="392" class="tiny" text-anchor="middle">&lt;&lt;operation&gt;&gt;</text>
    <text x="499" y="411" class="cardTitle" text-anchor="middle">Exec Statement</text>
    <text x="402" y="436" class="detail" text-anchor="start">exec(stmt, args)</text>
    <text x="402" y="455" class="detail" text-anchor="start">StatementType</text>
  </g>
  <g data-card="Parameter Binding" data-x="674" data-y="374" data-width="230" data-height="96">
    <rect x="674" y="374" width="230" height="96" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card" />
    <path class="header" d="M674,416 L674,388 Q674,374 688,374 L890,374 Q904,374 904,388 L904,416 Z" fill="#f5eee4" />
    <text x="789" y="392" class="tiny" text-anchor="middle">&lt;&lt;binding&gt;&gt;</text>
    <text x="789" y="411" class="cardTitle" text-anchor="middle">Parameter Binding</text>
    <text x="692" y="436" class="detail" text-anchor="start">ColumnType + value</text>
    <text x="692" y="455" class="detail" text-anchor="start">safe placeholders</text>
  </g>
  <g data-card="Savepoint State" data-x="964" data-y="374" data-width="230" data-height="96">
    <rect x="964" y="374" width="230" height="96" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card" />
    <path class="header" d="M964,416 L964,388 Q964,374 978,374 L1180,374 Q1194,374 1194,388 L1194,416 Z" fill="#f5eef2" />
    <text x="1079" y="392" class="tiny" text-anchor="middle">&lt;&lt;state&gt;&gt;</text>
    <text x="1079" y="411" class="cardTitle" text-anchor="middle">Savepoint State</text>
    <text x="982" y="436" class="detail" text-anchor="start">set / rollback</text>
    <text x="982" y="455" class="detail" text-anchor="start">releaseSavepoint</text>
  </g>

  <g data-card="Commit Path" data-x="94" data-y="632" data-width="230" data-height="86">
    <rect x="94" y="632" width="230" height="86" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card" />
    <path class="header" d="M94,672 L94,646 Q94,632 108,632 L310,632 Q324,632 324,646 L324,672 Z" fill="#f1f6ec" />
    <text x="209" y="650" class="tiny" text-anchor="middle">&lt;&lt;outcome&gt;&gt;</text>
    <text x="209" y="669" class="cardTitle" text-anchor="middle">Commit Path</text>
    <text x="112" y="694" class="detail" text-anchor="start">changes persist</text>
  </g>
  <g data-card="Timeout Error" data-x="384" data-y="632" data-width="230" data-height="86">
    <rect x="384" y="632" width="230" height="86" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card" />
    <path class="header" d="M384,672 L384,646 Q384,632 398,632 L600,632 Q614,632 614,646 L614,672 Z" fill="#f5eef2" />
    <text x="499" y="650" class="tiny" text-anchor="middle">&lt;&lt;error&gt;&gt;</text>
    <text x="499" y="669" class="cardTitle" text-anchor="middle">Timeout Error</text>
    <text x="402" y="694" class="detail" text-anchor="start">ExposedR2dbcException</text>
  </g>
  <g data-card="Inner Rollback" data-x="674" data-y="632" data-width="230" data-height="86">
    <rect x="674" y="632" width="230" height="86" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card" />
    <path class="header" d="M674,672 L674,646 Q674,632 688,632 L890,632 Q904,632 904,646 L904,672 Z" fill="#f5eee4" />
    <text x="789" y="650" class="tiny" text-anchor="middle">&lt;&lt;outcome&gt;&gt;</text>
    <text x="789" y="669" class="cardTitle" text-anchor="middle">Inner Rollback</text>
    <text x="692" y="694" class="detail" text-anchor="start">outer tx survives</text>
  </g>
  <g data-card="Assertion Result" data-x="964" data-y="632" data-width="230" data-height="86">
    <rect x="964" y="632" width="230" height="86" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card" />
    <path class="header" d="M964,672 L964,646 Q964,632 978,632 L1180,632 Q1194,632 1194,646 L1194,672 Z" fill="#eef5fa" />
    <text x="1079" y="650" class="tiny" text-anchor="middle">&lt;&lt;assert&gt;&gt;</text>
    <text x="1079" y="669" class="cardTitle" text-anchor="middle">Assertion Result</text>
    <text x="982" y="694" class="detail" text-anchor="start">city1 / counts / null</text>
  </g>

  <path class="connector" data-connector="entry-config" d="M344 221 L404 221" stroke="#6f8f52" marker-end="url(#arrow-green)" />
  <path class="connector" data-connector="config-transaction" d="M654 221 L714 221" stroke="#4f8f8b" marker-end="url(#arrow-teal)" />
  <path class="connector" data-connector="transaction-top-level" d="M964 221 L1004 221" stroke="#a66a3f" marker-end="url(#arrow-brown)" />
  <path class="connector" data-connector="transaction-active" d="M839 262 L839 284 Q839 300 823 300 L225 300 Q209 300 209 316 L209 374" stroke="#4f8f8b" marker-end="url(#arrow-teal)" />
  <path class="connector" data-connector="active-exec" d="M324 422 L384 422" stroke="#4f86c6" marker-end="url(#arrow-blue)" />
  <path class="connector" data-connector="exec-bind" d="M614 422 L674 422" stroke="#a66a3f" marker-end="url(#arrow-brown)" />
  <path class="connector" data-connector="bind-savepoint" d="M904 422 L964 422" stroke="#a85f7f" marker-end="url(#arrow-rose)" />
  <path class="connector" data-connector="active-commit" d="M209 470 L209 632" stroke="#6f8f52" marker-end="url(#arrow-green)" />
  <path class="connector" data-connector="exec-timeout" d="M499 470 L499 632" stroke="#a85f7f" marker-end="url(#arrow-rose)" />
  <path class="connector" data-connector="savepoint-rollback" d="M1079 470 L1079 538 Q1079 554 1063 554 L805 554 Q789 554 789 570 L789 632" stroke="#a66a3f" marker-end="url(#arrow-brown)" />
  <path class="connector" data-connector="rollback-assert" d="M904 675 L964 675" stroke="#4f86c6" marker-end="url(#arrow-blue)" />
  <path class="connector" data-connector="commit-assert" d="M209 718 L209 738 Q209 754 225 754 L1063 754 Q1079 754 1079 738 L1079 718" stroke="#4f86c6" marker-end="url(#arrow-blue)" />

  <rect x="86" y="776" width="1148" height="30" rx="10" class="noteBox" />
  <text x="660" y="796" class="note" text-anchor="middle">State transitions are sourced from the six transaction tests: isolation overrides, exec binding, timeout errors, savepoint rollback, and final assertions.</text>
</svg>
