<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1060" viewBox="0 0 1900 1060" role="img" aria-label="Ktor R2DBC cache strategy architecture">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#25384d" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .lane{fill:#f8fbfd;stroke:#dce8f2;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#192538;font-weight:400}
      .subtitle,.detail,.foot{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:17px;font-weight:700;fill:#556678}
      .laneTitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:.08em;fill:#91a5b7}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#192538;font-weight:400}
      .smallTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;fill:#192538;font-weight:400}
      .mono{font-family:"Comic Mono","SFMono-Regular",ui-monospace,monospace;font-size:15px;font-weight:700;fill:#506176}
      .tiny{font-family:"Comic Mono","SFMono-Regular",ui-monospace,monospace;font-size:13px;font-weight:700;fill:#627287}
      .card{filter:url(#softShadow);stroke-width:2.4}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .blue{stroke:#3f83b8}
      .green{stroke:#6f8f52}
      .amber{stroke:#a36f3e}
      .teal{stroke:#4f8f8b}
      .rose{stroke:#a85f7f}
      .brown{stroke:#8a6f55}
      .note{fill:#f7fffe;stroke:#9fd0cb;stroke-width:2}

    .syntax-keyword{fill:#7E22CE}.syntax-type{fill:#0F766E}.syntax-function{fill:#1D4ED8}.syntax-string{fill:#B45309}.syntax-number{fill:#C2410C}.syntax-comment{fill:#64748B}.syntax-operator{fill:#BE123C}</style>
  </defs>

  <rect class="canvas" width="1900" height="1060"/>
  <rect class="frame" x="30" y="30" width="1840" height="1000" rx="24"/>
  <text class="title" x="72" y="92">Ktor R2DBC Cache Strategy</text>
  <text class="subtitle" x="76" y="126">Ktor routes expose cache-aside reads, write-refresh, explicit invalidation, and local stats over Exposed R2DBC plus Redisson RMap.</text>

  <rect class="lane" x="60" y="155" width="1780" height="220" rx="18"/>
  <text class="laneTitle" x="86" y="190">HTTP CONTRACTS</text>

  <g data-card="Read routes" data-x="100" data-y="230" data-width="490" data-height="100">
    <rect class="card" x="100" y="230" width="490" height="100" rx="15" fill="#ffffff" stroke="#5d7486"/>
    <text class="smallTitle" x="345" y="264" text-anchor="middle">Read routes</text>
    <text class="mono" x="132" y="294">GET /users -> DB-direct list</text>
    <text class="mono" x="132" y="318">GET /users/{id} -> HIT / MISS / NOT_FOUND</text>
  </g>

  <g data-card="Write routes" data-x="705" data-y="230" data-width="450" data-height="100">
    <rect class="card" x="705" y="230" width="450" height="100" rx="15" fill="#f8fcf7" stroke="#6f8f52"/>
    <text class="smallTitle" x="930" y="264" text-anchor="middle">Write routes</text>
    <text class="mono" x="737" y="294">POST /users -> create + cache refresh</text>
    <text class="mono" x="737" y="318">PUT /users/{id} -> update + cache refresh</text>
  </g>

  <g data-card="Invalidation and stats" data-x="1270" data-y="230" data-width="480" data-height="100">
    <rect class="card" x="1270" y="230" width="480" height="100" rx="15" fill="#fff9ef" stroke="#a36f3e"/>
    <text class="smallTitle" x="1510" y="264" text-anchor="middle">Invalidation and stats</text>
    <text class="mono" x="1302" y="294">DELETE key/all -> cache only</text>
    <text class="mono" x="1302" y="318">GET /cache/stats -> local counters</text>
  </g>

  <rect class="lane" x="60" y="405" width="1780" height="360" rx="18"/>
  <text class="laneTitle" x="86" y="440">KTOR MODULE AND CACHE-ASIDE REPOSITORY</text>

  <g data-card="Ktor module" data-x="100" data-y="505" data-width="300" data-height="150">
    <rect class="card" x="100" y="505" width="300" height="150" rx="16" fill="#f7fcff" stroke="#3f83b8"/>
    <path class="header" d="M100,557 L100,521 Q100,505 116,505 L384,505 Q400,505 400,521 L400,557 Z" fill="#eef5fa"/>
    <text class="cardTitle" x="250" y="539" text-anchor="middle">Ktor module</text>
    <text class="mono" x="132" y="594">install JSON + errors</text>
    <text class="mono" x="132" y="622">seed startup data</text>
  </g>

  <g data-card="UserRoutes" data-x="500" data-y="505" data-width="300" data-height="150">
    <rect class="card" x="500" y="505" width="300" height="150" rx="16" fill="#ffffff" stroke="#5d7486"/>
    <path class="header" d="M500,557 L500,521 Q500,505 516,505 L784,505 Q800,505 800,521 L800,557 Z" fill="#f4f8fb"/>
    <text class="cardTitle" x="650" y="539" text-anchor="middle">UserRoutes</text>
    <text class="mono" x="532" y="594">call repository</text>
    <text class="mono" x="532" y="622">shape HTTP response</text>
  </g>

  <g data-card="UserCacheRepository" data-x="900" data-y="505" data-width="360" data-height="190">
    <rect class="card" x="900" y="505" width="360" height="190" rx="16" fill="#fff9ef" stroke="#a36f3e"/>
    <path class="header" d="M900,557 L900,521 Q900,505 916,505 L1244,505 Q1260,505 1260,521 L1260,557 Z" fill="#f5eee4"/>
    <text class="cardTitle" x="1080" y="539" text-anchor="middle">UserCacheRepository</text>
    <text class="mono" x="932" y="594" data-code-snippet="kotlin"><tspan class="syntax-function">findCached</tspan>()<tspan class="syntax-operator">:</tspan> cache <tspan class="syntax-operator">-&gt;</tspan> <tspan class="syntax-type">DB</tspan> <tspan class="syntax-operator">-&gt;</tspan> cache</text>
    <text class="mono" x="932" y="622" data-code-snippet="kotlin">create<tspan class="syntax-operator">/</tspan><tspan class="syntax-keyword">update</tspan>()<tspan class="syntax-operator">:</tspan> <tspan class="syntax-type">DB</tspan> <tspan class="syntax-operator">-&gt;</tspan> cache</text>
    <text class="mono" x="932" y="650" data-code-snippet="kotlin">invalidate<tspan class="syntax-operator">/</tspan><tspan class="syntax-function">clear</tspan>()<tspan class="syntax-operator">:</tspan> cache only</text>
  </g>

  <g data-card="CacheObservation" data-x="1380" data-y="520" data-width="340" data-height="140">
    <rect class="card" x="1380" y="520" width="340" height="140" rx="16" fill="#fff7f7" stroke="#a85f7f"/>
    <path class="header" d="M1380,572 L1380,536 Q1380,520 1396,520 L1704,520 Q1720,520 1720,536 L1720,572 Z" fill="#f5eef2"/>
    <text class="cardTitle" x="1550" y="554" text-anchor="middle">CacheObservation</text>
    <text class="mono" x="1412" y="610">hit / miss / notFound</text>
    <text class="mono" x="1412" y="638">written / invalidated</text>
  </g>

  <path class="connector blue" d="M400 580 H500" data-connector="module-routes"/>
  <polygon points="500,580 488,573 488,587" fill="#3f83b8" stroke="#3f83b8" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector amber" d="M800 580 H900" data-connector="route-repository"/>
  <polygon points="900,580 888,573 888,587" fill="#a36f3e" stroke="#a36f3e" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector rose" d="M1260 590 H1380" data-connector="repository-observation"/>
  <polygon points="1380,590 1368,583 1368,597" fill="#a85f7f" stroke="#a85f7f" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="lane" x="60" y="795" width="1780" height="150" rx="18"/>
  <text class="laneTitle" x="86" y="830">OWNED RESOURCES</text>

  <g data-card="Redisson RMap" data-x="620" data-y="860" data-width="390" data-height="58">
    <rect class="card" x="620" y="860" width="390" height="58" rx="14" fill="#f7fffe" stroke="#4f8f8b"/>
    <text class="mono" x="815" y="895" text-anchor="middle">Redisson RMap exposed:ktor:r2dbc:users</text>
  </g>
  <g data-card="Exposed R2DBC H2" data-x="1120" data-y="860" data-width="390" data-height="58">
    <rect class="card" x="1120" y="860" width="390" height="58" rx="14" fill="#ffffff" stroke="#5d7486"/>
    <text class="mono" x="1315" y="895" text-anchor="middle">Exposed R2DBC H2 pool UserTable</text>
  </g>

  <path class="connector teal" d="M1000 695 V860" data-connector="repository-cache"/>
  <polygon points="1000,860 993,848 1007,848" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector brown" d="M1160 695 V860" data-connector="repository-db"/>
  <polygon points="1160,860 1153,848 1167,848" fill="#8a6f55" stroke="#8a6f55" stroke-width="2.6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="note" x="120" y="990" width="1660" height="34" rx="12"/>
  <text class="foot" x="950" y="1013" text-anchor="middle">Ktor keeps cache-aside behavior explicit: reads may use Redis, writes refresh cache, and invalidation is caller-visible.</text>
</svg>
