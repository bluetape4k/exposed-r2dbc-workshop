<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 820" width="1320" height="820" role="img" aria-label="Virtual Thread Scope Management architecture diagram">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#3c82b4" stroke="#3c82b4" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#5f8848" stroke="#5f8848" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#a66a3f" stroke="#a66a3f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.2}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:16px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:17px;fill:#1e293b}
      .connector{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.2}
      .legendBox{fill:#fff;stroke:#d7e2ec;stroke-width:1.1}
    </style>
  </defs>

  <rect width="1320" height="820" class="canvas"/>
  <rect x="22" y="22" width="1276" height="776" rx="18" class="frame"/>
  <text x="58" y="70" class="title" text-anchor="start">Virtual Thread Scope Management</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">Concrete path for CoroutineScope(Dispatchers.newVT()), launch, top-level transactions, and joinAll verification.</text>

  <rect x="48" y="130" width="1224" height="150" rx="16" class="lane"/>
  <text x="72" y="160" class="laneTitle" text-anchor="start">TEST SETUP SCOPE</text>

  <g data-card="runSuspendVT" data-x="96" data-y="190" data-width="200" data-height="72">
    <rect x="96" y="190" width="200" height="72" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M96,228 L96,204 Q96,190 110,190 L282,190 Q296,190 296,204 L296,228 Z" fill="#eef5fa"/>
    <text x="196" y="207" class="tiny" text-anchor="middle">&lt;&lt;JUnit 5&gt;&gt;</text>
    <text x="196" y="225" class="cardTitle" text-anchor="middle">runSuspendVT</text>
    <text x="114" y="248" class="detail" text-anchor="start">virtual-thread runner</text>
  </g>

  <g data-card="withTables" data-x="372" data-y="190" data-width="200" data-height="72">
    <rect x="372" y="190" width="200" height="72" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M372,228 L372,204 Q372,190 386,190 L558,190 Q572,190 572,204 L572,228 Z" fill="#f1f6ec"/>
    <text x="472" y="207" class="tiny" text-anchor="middle">&lt;&lt;schema&gt;&gt;</text>
    <text x="472" y="225" class="cardTitle" text-anchor="middle">withTables</text>
    <text x="390" y="248" class="detail" text-anchor="start">VTester table</text>
  </g>

  <g data-card="recordCount" data-x="648" data-y="190" data-width="200" data-height="72">
    <rect x="648" y="190" width="200" height="72" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M648,228 L648,204 Q648,190 662,190 L834,190 Q848,190 848,204 L848,228 Z" fill="#f5eee4"/>
    <text x="748" y="207" class="tiny" text-anchor="middle">&lt;&lt;fan-out&gt;&gt;</text>
    <text x="748" y="225" class="cardTitle" text-anchor="middle">recordCount = 10</text>
    <text x="666" y="248" class="detail" text-anchor="start">parallel inserts</text>
  </g>

  <path class="connector" data-connector="setup-with-tables" d="M 296 226 L 372 226" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="setup-count" d="M 572 226 L 648 226" stroke="#3c82b4" marker-end="url(#arrow-blue)"/>

  <rect x="48" y="310" width="1224" height="198" rx="16" class="lane"/>
  <text x="72" y="340" class="laneTitle" text-anchor="start">VIRTUAL THREAD PARALLEL WORK</text>

  <g data-card="CoroutineScope" data-x="82" data-y="386" data-width="190" data-height="78">
    <rect x="82" y="386" width="190" height="78" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M82,426 L82,400 Q82,386 96,386 L258,386 Q272,386 272,400 L272,426 Z" fill="#eef5fa"/>
    <text x="177" y="404" class="tiny" text-anchor="middle">&lt;&lt;scope&gt;&gt;</text>
    <text x="177" y="423" class="cardTitle" text-anchor="middle">CoroutineScope</text>
    <text x="100" y="447" class="detail" text-anchor="start">Dispatchers.newVT()</text>
  </g>

  <g data-card="launch jobs" data-x="318" data-y="386" data-width="190" data-height="78">
    <rect x="318" y="386" width="190" height="78" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M318,426 L318,400 Q318,386 332,386 L494,386 Q508,386 508,400 L508,426 Z" fill="#eef7f6"/>
    <text x="413" y="404" class="tiny" text-anchor="middle">&lt;&lt;parallel&gt;&gt;</text>
    <text x="413" y="423" class="cardTitle" text-anchor="middle">launch jobs</text>
    <text x="336" y="447" class="detail" text-anchor="start">one index per VT</text>
  </g>

  <g data-card="top-level tx" data-x="554" data-y="386" data-width="190" data-height="78">
    <rect x="554" y="386" width="190" height="78" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M554,426 L554,400 Q554,386 568,386 L730,386 Q744,386 744,400 L744,426 Z" fill="#f1f6ec"/>
    <text x="649" y="404" class="tiny" text-anchor="middle">&lt;&lt;new tx&gt;&gt;</text>
    <text x="649" y="423" class="cardTitle" text-anchor="middle">top-level tx</text>
    <text x="572" y="447" class="detail" text-anchor="start">db + isolation</text>
  </g>

  <g data-card="maxAttempts" data-x="790" data-y="386" data-width="190" data-height="78">
    <rect x="790" y="386" width="190" height="78" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M790,426 L790,400 Q790,386 804,386 L966,386 Q980,386 980,400 L980,426 Z" fill="#f5eee4"/>
    <text x="885" y="404" class="tiny" text-anchor="middle">&lt;&lt;retry&gt;&gt;</text>
    <text x="885" y="423" class="cardTitle" text-anchor="middle">maxAttempts = 5</text>
    <text x="808" y="447" class="detail" text-anchor="start">conflict tolerance</text>
  </g>

  <g data-card="insert result" data-x="1026" data-y="386" data-width="190" data-height="78">
    <rect x="1026" y="386" width="190" height="78" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1026,426 L1026,400 Q1026,386 1040,386 L1202,386 Q1216,386 1216,400 L1216,426 Z" fill="#f5eef2"/>
    <text x="1121" y="404" class="tiny" text-anchor="middle">&lt;&lt;DML&gt;&gt;</text>
    <text x="1121" y="423" class="cardTitle" text-anchor="middle">VTester.insert</text>
    <text x="1044" y="447" class="detail" text-anchor="start">results.add(index)</text>
  </g>

  <path class="connector" data-connector="vt-scope-launch" d="M 272 425 L 318 425" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="vt-launch-tx" d="M 508 425 L 554 425" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="vt-tx-retry" d="M 744 425 L 790 425" stroke="#5f8848" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="vt-retry-insert" d="M 980 425 L 1026 425" stroke="#5f8848" marker-end="url(#arrow-green)"/>

  <rect x="48" y="538" width="1224" height="146" rx="16" class="lane"/>
  <text x="72" y="568" class="laneTitle" text-anchor="start">JOIN AND VERIFY</text>

  <g data-card="thread-safe list" data-x="144" data-y="600" data-width="220" data-height="60">
    <rect x="144" y="600" width="220" height="60" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <text x="254" y="625" class="tiny" text-anchor="middle">&lt;&lt;shared result&gt;&gt;</text>
    <text x="254" y="646" class="cardTitle" text-anchor="middle">CopyOnWriteArrayList</text>
  </g>

  <g data-card="joinAll" data-x="458" data-y="600" data-width="190" data-height="60">
    <rect x="458" y="600" width="190" height="60" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <text x="553" y="625" class="tiny" text-anchor="middle">&lt;&lt;join&gt;&gt;</text>
    <text x="553" y="646" class="cardTitle" text-anchor="middle">joinAll()</text>
  </g>

  <g data-card="assert results" data-x="742" data-y="600" data-width="210" data-height="60">
    <rect x="742" y="600" width="210" height="60" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <text x="847" y="625" class="tiny" text-anchor="middle">&lt;&lt;assert&gt;&gt;</text>
    <text x="847" y="646" class="cardTitle" text-anchor="middle">sorted == 1..10</text>
  </g>

  <g data-card="DB count" data-x="1046" data-y="600" data-width="170" data-height="60">
    <rect x="1046" y="600" width="170" height="60" rx="14" fill="#fff" stroke="#8a6f55" stroke-width="2" class="card"/>
    <text x="1131" y="625" class="tiny" text-anchor="middle">&lt;&lt;query&gt;&gt;</text>
    <text x="1131" y="646" class="cardTitle" text-anchor="middle">count = 10</text>
  </g>

  <path class="connector" data-connector="verify-results" d="M 364 630 L 458 630" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="verify-join" d="M 648 630 L 742 630" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="verify-count" d="M 952 630 L 1046 630" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>

  <rect x="82" y="728" width="1156" height="34" rx="10" class="noteBox"/>
  <text x="660" y="750" class="note" text-anchor="middle">Virtual-thread fan-out is local to the test scope; each launch opens an independent top-level transaction before joinAll verifies results.</text>
</svg>
