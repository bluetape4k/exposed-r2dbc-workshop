<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap');
      @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
      .canvas{fill:#F6F8FB;}
      .frame{fill:#FFFDF9;stroke:#d7e2ec;stroke-width:2;}
      .title{font-family:'Architects Daughter','Comic Mono',monospace;font-size:38px;fill:#1f2937;}
      .subtitle,.note{font-family:'Comic Mono','Architects Daughter',monospace;font-size:16px;fill:#526173;font-weight:700;}
      .lane{fill:#F7FAFD;stroke:#d7e2ec;stroke-width:1.6;}
      .laneTitle{font-family:'Architects Daughter','Comic Mono',monospace;font-size:20px;letter-spacing:3px;fill:#9aaec0;}
      .card{fill:#FFFFFF;stroke-width:2.2;}
      .blue{stroke:#4f86c6;fill:#EEF6FF;}
      .green{stroke:#6f8f52;fill:#F1F8EC;}
      .amber{stroke:#a66a3f;fill:#FFF6EA;}
      .teal{stroke:#4f9d96;fill:#ECFAF8;}
      .rose{stroke:#b05d83;fill:#FDF0F6;}
      .slate{stroke:#64748b;fill:#F8FAFC;}
      .band{fill:#ffffff;opacity:.76;}
      .kind{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;font-weight:800;fill:#64748b;}
      .name{font-family:'Architects Daughter','Comic Mono',monospace;font-size:24px;fill:#263241;}
      .member{font-family:'Comic Mono','Architects Daughter',monospace;font-size:15px;font-weight:800;fill:#526173;}
      .edge{fill:none;stroke:#5f7180;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
      .inherit{stroke:#5f7180;}
      .use{stroke:#5f7180;stroke-width:2.7;stroke-dasharray:8 7;stroke-linecap:butt;}
      .head{fill:none;stroke:#5f7180;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;}
      .tri{fill:#FFFDF9;stroke:#5f7180;stroke-width:3;stroke-dasharray:none;}
      .label{fill:#FFFFFF;stroke:#d7e2ec;stroke-width:1.3;}
      .labelText{font-family:'Comic Mono','Architects Daughter',monospace;font-size:13px;font-weight:800;fill:#526173;}
      .noteBox{fill:#ECFFF4;stroke:#65df93;stroke-width:1.6;}
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1120"/>
  <rect class="frame" x="28" y="28" width="1444" height="1064" rx="24"/>
  <text class="title" x="66" y="86">Exposed R2DBC DDL Class Relationships</text>
  <text class="subtitle" x="68" y="124">Repository-backed UML view for table inheritance, schema object ownership, and DDL helper dependencies.</text>

  <rect class="lane" x="58" y="166" width="1384" height="368" rx="18"/>
  <text class="laneTitle" x="86" y="210">TABLE INHERITANCE AND MEMBERS</text>
  <rect class="lane" x="58" y="568" width="1384" height="380" rx="18"/>
  <text class="laneTitle" x="86" y="612">DDL EXAMPLE TYPES AND HELPERS</text>
  <rect class="lane" x="58" y="972" width="1384" height="108" rx="18"/>
  <text class="laneTitle" x="86" y="1016">READER CONTRACT</text>

  <g data-card="column" data-x="118" data-y="254" data-width="250" data-height="104">
    <rect class="card slate" x="118" y="254" width="250" height="104" rx="12"/>
    <rect class="band" x="120" y="306" width="246" height="1"/>
    <text class="kind" x="243" y="280" text-anchor="middle">&lt;&lt;schema member&gt;&gt;</text>
    <text class="name" x="243" y="309" text-anchor="middle">Column&lt;T&gt;</text>
    <text class="member" x="146" y="338">varchar, integer, reference</text>
  </g>

  <g data-card="table" data-x="610" data-y="226" data-width="280" data-height="106">
    <rect class="card blue" x="610" y="226" width="280" height="106" rx="12"/>
    <rect class="band" x="612" y="278" width="276" height="1"/>
    <text class="kind" x="750" y="252" text-anchor="middle">&lt;&lt;base&gt;&gt;</text>
    <text class="name" x="750" y="281" text-anchor="middle">Table</text>
    <text class="member" x="638" y="310">+columns: List&lt;Column&gt;</text>
  </g>

  <g data-card="primary-key" data-x="1132" data-y="254" data-width="250" data-height="104">
    <rect class="card slate" x="1132" y="254" width="250" height="104" rx="12"/>
    <rect class="band" x="1134" y="306" width="246" height="1"/>
    <text class="kind" x="1257" y="280" text-anchor="middle">&lt;&lt;constraint&gt;&gt;</text>
    <text class="name" x="1257" y="309" text-anchor="middle">PrimaryKey</text>
    <text class="member" x="1160" y="338">single / composite key</text>
  </g>

  <g data-card="idtable" data-x="610" data-y="396" data-width="280" data-height="106">
    <rect class="card green" x="610" y="396" width="280" height="106" rx="12"/>
    <rect class="band" x="612" y="448" width="276" height="1"/>
    <text class="kind" x="750" y="422" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text class="name" x="750" y="451" text-anchor="middle">IdTable&lt;T&gt;</text>
    <text class="member" x="638" y="480">+id: Column&lt;EntityID&lt;T&gt;&gt;</text>
  </g>

  <g data-card="intidtable" data-x="128" data-y="690" data-width="244" data-height="104">
    <rect class="card amber" x="128" y="690" width="244" height="104" rx="12"/>
    <rect class="band" x="130" y="742" width="240" height="1"/>
    <text class="kind" x="250" y="716" text-anchor="middle">&lt;&lt;concrete&gt;&gt;</text>
    <text class="name" x="250" y="745" text-anchor="middle">IntIdTable</text>
    <text class="member" x="156" y="774">Orders, Products</text>
  </g>

  <g data-card="longidtable" data-x="456" data-y="690" data-width="244" data-height="104">
    <rect class="card teal" x="456" y="690" width="244" height="104" rx="12"/>
    <rect class="band" x="458" y="742" width="240" height="1"/>
    <text class="kind" x="578" y="716" text-anchor="middle">&lt;&lt;concrete&gt;&gt;</text>
    <text class="name" x="578" y="745" text-anchor="middle">LongIdTable</text>
    <text class="member" x="484" y="774">parent / child</text>
  </g>

  <g data-card="custom-table" data-x="784" data-y="690" data-width="244" data-height="104">
    <rect class="card rose" x="784" y="690" width="244" height="104" rx="12"/>
    <rect class="band" x="786" y="742" width="240" height="1"/>
    <text class="kind" x="906" y="716" text-anchor="middle">&lt;&lt;object : Table&gt;&gt;</text>
    <text class="name" x="906" y="745" text-anchor="middle">testerV1 / V2</text>
    <text class="member" x="812" y="774">same table, new shape</text>
  </g>

  <g data-card="sequence" data-x="1112" data-y="690" data-width="244" data-height="104">
    <rect class="card slate" x="1112" y="690" width="244" height="104" rx="12"/>
    <rect class="band" x="1114" y="742" width="240" height="1"/>
    <text class="kind" x="1234" y="716" text-anchor="middle">&lt;&lt;database object&gt;&gt;</text>
    <text class="name" x="1234" y="745" text-anchor="middle">Sequence</text>
    <text class="member" x="1140" y="774">nextIntVal(), cache</text>
  </g>

  <g data-card="schema-utils" data-x="292" data-y="840" data-width="276" data-height="104">
    <rect class="card blue" x="292" y="840" width="276" height="104" rx="12"/>
    <rect class="band" x="294" y="892" width="272" height="1"/>
    <text class="kind" x="430" y="866" text-anchor="middle">&lt;&lt;R2DBC helper&gt;&gt;</text>
    <text class="name" x="430" y="895" text-anchor="middle">SchemaUtils</text>
    <text class="member" x="320" y="924">create, drop, createMissing</text>
  </g>

  <g data-card="migration-utils" data-x="932" data-y="840" data-width="276" data-height="104">
    <rect class="card rose" x="932" y="840" width="276" height="104" rx="12"/>
    <rect class="band" x="934" y="892" width="272" height="1"/>
    <text class="kind" x="1070" y="866" text-anchor="middle">&lt;&lt;migration helper&gt;&gt;</text>
    <text class="name" x="1070" y="895" text-anchor="middle">MigrationUtils</text>
    <text class="member" x="960" y="924">statementsRequired...</text>
  </g>

  <path class="edge inherit" d="M 750 396 V 350"/>
  <polygon class="tri" points="750,334 741,350 759,350" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="edge inherit" d="M 250 690 V 650 Q 250 640 260 640 H 706 Q 716 640 716 630 V 520"/>
  <polygon class="tri" points="716,504 707,520 725,520" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge inherit" d="M 578 690 V 650 Q 578 640 588 640 H 784 Q 794 640 794 630 V 520"/>
  <polygon class="tri" points="794,504 785,520 803,520" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge inherit" d="M 906 690 V 650 Q 906 640 916 640 H 960 Q 970 640 970 630 V 326 Q 970 306 950 306 H 908"/>
  <polygon class="tri" points="890,306 908,298 908,314" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="edge use" d="M 610 286 H 382"/>
  <polyline class="head" points="382,279 368,286 382,293" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="label" x="420" y="254" width="92" height="24" rx="12"/>
  <text class="labelText" x="466" y="270" text-anchor="middle">owns</text>

  <path class="edge use" d="M 890 286 H 1118"/>
  <polyline class="head" points="1118,279 1132,286 1118,293" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="label" x="982" y="254" width="104" height="24" rx="12"/>
  <text class="labelText" x="1034" y="270" text-anchor="middle">declares</text>

  <path class="edge use" d="M 568 892 H 918"/>
  <polyline class="head" points="918,885 932,892 918,899" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="label" x="708" y="860" width="100" height="24" rx="12"/>
  <text class="labelText" x="758" y="876" text-anchor="middle">diff path</text>

  <path class="edge use" d="M 980 840 V 808"/>
  <polyline class="head" points="973,808 980,794 987,808" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="label" x="1000" y="804" width="110" height="24" rx="12"/>
  <text class="labelText" x="1055" y="820" text-anchor="middle">compares</text>

  <rect class="noteBox" x="92" y="1032" width="1316" height="32" rx="12"/>
  <text class="note" x="750" y="1053" text-anchor="middle">Hollow triangles show inheritance; dashed open arrows show dependency/use with solid direct arrowheads.</text>
</svg>
