<svg xmlns="http://www.w3.org/2000/svg" width="998" height="1412" viewBox="0 0 998 1412" role="img" aria-label="Structure Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="998" height="1412"/>
<rect class="frame" x="32" y="28" width="934" height="1356" rx="28"/>
<text class="title" x="66" y="82">Structure Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="dashed" d="M724 418 L724 112 L274 112 L274 180"/>
<path class="inheritLine" d="M499 565 L499 502 L274 502 L274 439"/>
<path class="inheritLine" d="M499 1083 L499 698"/>
<path class="inheritLine" d="M724 824 L724 745 L499 745 L499 698"/>
<path class="inheritLine" d="M274 824 L274 737 L499 737 L499 698"/>
<g transform="translate(84,180)">
  <rect class="card" x="0" y="0" width="380" height="259" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="190" y="61" text-anchor="middle">Table</text>
  <text class="mono" x="18" y="108">+tableName: String</text>
<text class="mono" x="18" y="129">+columns: List~Column~</text>
<text class="mono" x="18" y="150">+primaryKey: PrimaryKey?</text>
<text class="mono" x="18" y="171">+indices: List~Index~</text>
<text class="mono" x="18" y="192">+foreignKey(vararg columns)</text>
<text class="mono" x="18" y="213">+index(customIndexName, isUnique, vararg</text>
<text class="mono" x="18" y="234">columns)</text>
</g>
<g transform="translate(534,180)">
  <rect class="card" x="0" y="0" width="380" height="238" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">SchemaUtils</text>
  <text class="mono" x="18" y="108">+create(vararg tables)</text>
<text class="mono" x="18" y="129">+drop(vararg tables)</text>
<text class="mono" x="18" y="150">+createMissing(vararg tables)</text>
<text class="mono" x="18" y="171">+addMissingColumnsStatements(vararg tables)</text>
<text class="mono" x="18" y="192">+addMissingColumns(vararg tables)</text>
<text class="mono" x="18" y="213">+createSequence(vararg seq)</text>
</g>
<g transform="translate(309,565)">
  <rect class="card" x="0" y="0" width="380" height="133" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
  <text class="small" x="190" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="190" y="61" text-anchor="middle">IdTableT</text>
  <text class="mono" x="18" y="108">+id: Column~EntityID~T~~</text>
</g>
<g transform="translate(84,824)">
  <rect class="card" x="0" y="0" width="380" height="133" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">IntIdTable</text>
  <text class="mono" x="18" y="108">+id: Column~EntityID~Int~~</text>
</g>
<g transform="translate(534,824)">
  <rect class="card" x="0" y="0" width="380" height="133" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">LongIdTable</text>
  <text class="mono" x="18" y="108">+id: Column~EntityID~Long~~</text>
</g>
<g transform="translate(309,1083)">
  <rect class="card" x="0" y="0" width="380" height="133" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#8A72D6"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="61" text-anchor="middle">UUIDTable</text>
  <text class="mono" x="18" y="108">+id: Column~EntityID~UUID~~</text>
</g>
</svg>
