<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-label="Exposed R2DBC JSON architecture diagram">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7fb5" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#4f8f8b" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#6f8f52" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#a66a3f"/>
    </marker>
    <marker id="arrow-rose" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#a85f7f"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:2}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.6}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;letter-spacing:0;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#1e293b}
      .card{filter:url(#softShadow)}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .foot{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="960" class="canvas"/>
  <rect x="28" y="28" width="1544" height="904" rx="20" class="frame"/>
  <text x="72" y="88" class="title">Exposed R2DBC JSON and JSONB Query Architecture</text>
  <text x="72" y="122" class="subtitle">Concrete map for @Serializable payloads, json/jsonb columns, R2DBC tests, and dialect-specific JSON operators.</text>

  <rect x="64" y="160" width="1472" height="188" rx="18" class="lane"/>
  <text x="92" y="195" class="laneTitle">SERIALIZABLE DOMAIN MODEL</text>

  <g data-card="User" data-x="108" data-y="222" data-width="235" data-height="96">
    <rect x="108" y="222" width="235" height="96" rx="13" fill="#fff" stroke="#3f7fb5" stroke-width="2.4" class="card"/>
    <path class="header" d="M108,262 L108,235 Q108,222 121,222 L330,222 Q343,222 343,235 L343,262 Z" fill="#eef5fa"/>
    <text x="225.5" y="243" class="tiny" text-anchor="middle">@Serializable</text>
    <text x="225.5" y="267" class="cardTitle" text-anchor="middle">User</text>
    <text x="132" y="292" class="detail">name, team</text>
  </g>

  <g data-card="DataHolder" data-x="440" data-y="222" data-width="270" data-height="96">
    <rect x="440" y="222" width="270" height="96" rx="13" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M440,262 L440,235 Q440,222 453,222 L697,222 Q710,222 710,235 L710,262 Z" fill="#eef7f6"/>
    <text x="575" y="243" class="tiny" text-anchor="middle">@Serializable</text>
    <text x="575" y="267" class="cardTitle" text-anchor="middle">DataHolder</text>
    <text x="464" y="292" class="detail">user, logins, active, team</text>
  </g>

  <g data-card="UserGroup" data-x="807" data-y="222" data-width="250" data-height="96">
    <rect x="807" y="222" width="250" height="96" rx="13" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M807,262 L807,235 Q807,222 820,222 L1044,222 Q1057,222 1057,235 L1057,262 Z" fill="#f1f6ec"/>
    <text x="932" y="243" class="tiny" text-anchor="middle">@Serializable</text>
    <text x="932" y="267" class="cardTitle" text-anchor="middle">UserGroup</text>
    <text x="831" y="292" class="detail">users: List&lt;User&gt;</text>
  </g>

  <g data-card="Json.Default mapper" data-x="1154" data-y="222" data-width="290" data-height="96">
    <rect x="1154" y="222" width="290" height="96" rx="13" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1154,262 L1154,235 Q1154,222 1167,222 L1431,222 Q1444,222 1444,235 L1444,262 Z" fill="#f5eee4"/>
    <text x="1299" y="243" class="tiny" text-anchor="middle">kotlinx.serialization</text>
    <text x="1299" y="267" class="cardTitle" text-anchor="middle">Json.Default mapper</text>
    <text x="1178" y="292" class="detail">encodes typed payloads</text>
  </g>

  <path data-connector="domain-user-dataholder" class="connector" d="M 343 270 L 430 270" stroke="#3f7fb5" marker-end="url(#arrow-blue)"/>
  <path data-connector="domain-dataholder-mapper" class="connector" d="M 710 270 L 797 270" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>
  <path data-connector="domain-group-mapper" class="connector" d="M 1057 270 L 1144 270" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <rect x="64" y="378" width="1472" height="206" rx="18" class="lane"/>
  <text x="92" y="413" class="laneTitle">EXPOSED COLUMN DEFINITIONS AND FIXTURES</text>

  <g data-card="JsonTable" data-x="108" data-y="450" data-width="270" data-height="100">
    <rect x="108" y="450" width="270" height="100" rx="13" fill="#fff" stroke="#3f7fb5" stroke-width="2.4" class="card"/>
    <path class="header" d="M108,491 L108,463 Q108,450 121,450 L365,450 Q378,450 378,463 L378,491 Z" fill="#eef5fa"/>
    <text x="243" y="472" class="tiny" text-anchor="middle">j_table</text>
    <text x="243" y="497" class="cardTitle" text-anchor="middle">JsonTable</text>
    <text x="132" y="523" class="detail">json&lt;DataHolder&gt;</text>
  </g>

  <g data-card="JsonBTable" data-x="462" data-y="450" data-width="270" data-height="100">
    <rect x="462" y="450" width="270" height="100" rx="13" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M462,491 L462,463 Q462,450 475,450 L719,450 Q732,450 732,463 L732,491 Z" fill="#eef7f6"/>
    <text x="597" y="472" class="tiny" text-anchor="middle">j_b_table</text>
    <text x="597" y="497" class="cardTitle" text-anchor="middle">JsonBTable</text>
    <text x="486" y="523" class="detail">jsonb&lt;DataHolder&gt;</text>
  </g>

  <g data-card="Array tables" data-x="816" data-y="450" data-width="280" data-height="100">
    <rect x="816" y="450" width="280" height="100" rx="13" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M816,491 L816,463 Q816,450 829,450 L1083,450 Q1096,450 1096,463 L1096,491 Z" fill="#f1f6ec"/>
    <text x="956" y="472" class="tiny" text-anchor="middle">j_arrays / j_b_arrays</text>
    <text x="956" y="497" class="cardTitle" text-anchor="middle">Array tables</text>
    <text x="840" y="523" class="detail">UserGroup + IntArray</text>
  </g>

  <g data-card="R2dbcExposedJsonTest" data-x="1180" data-y="450" data-width="300" data-height="100">
    <rect x="1180" y="450" width="300" height="100" rx="13" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1180,491 L1180,463 Q1180,450 1193,450 L1467,450 Q1480,450 1480,463 L1480,491 Z" fill="#f5eee4"/>
    <text x="1330" y="472" class="tiny" text-anchor="middle">withTables fixture</text>
    <text x="1330" y="497" class="cardTitle" text-anchor="middle">R2DBC JSON test base</text>
    <text x="1204" y="523" class="detail">seeds JSON / JSONB rows</text>
  </g>

  <path data-connector="column-json-jsonb" class="connector" d="M 378 500 L 452 500" stroke="#3f7fb5" marker-end="url(#arrow-blue)"/>
  <path data-connector="column-jsonb-array" class="connector" d="M 732 500 L 806 500" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>
  <path data-connector="column-array-fixture" class="connector" d="M 1096 500 L 1170 500" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <rect x="64" y="614" width="1472" height="220" rx="18" class="lane"/>
  <text x="92" y="649" class="laneTitle">R2DBC QUERY CONTRACT</text>

  <g data-card="Ex01 JSON column" data-x="108" data-y="690" data-width="292" data-height="112">
    <rect x="108" y="690" width="292" height="112" rx="13" fill="#fff" stroke="#3f7fb5" stroke-width="2.4" class="card"/>
    <path class="header" d="M108,733 L108,703 Q108,690 121,690 L387,690 Q400,690 400,703 L400,733 Z" fill="#eef5fa"/>
    <text x="254" y="713" class="tiny" text-anchor="middle">Ex01_JsonColumn</text>
    <text x="254" y="740" class="cardTitle" text-anchor="middle">JSON column flow</text>
    <text x="132" y="768" class="detail">insert, update, select</text>
    <text x="132" y="790" class="detail">extract / contains / exists</text>
  </g>

  <g data-card="Ex02 JSONB column" data-x="472" data-y="690" data-width="300" data-height="112">
    <rect x="472" y="690" width="300" height="112" rx="13" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M472,733 L472,703 Q472,690 485,690 L759,690 Q772,690 772,703 L772,733 Z" fill="#eef7f6"/>
    <text x="622" y="713" class="tiny" text-anchor="middle">Ex02_JsonBColumn</text>
    <text x="622" y="740" class="cardTitle" text-anchor="middle">JSONB column flow</text>
    <text x="496" y="768" class="detail">arrays, defaults, nullable</text>
    <text x="496" y="790" class="detail">upsert + transformer checks</text>
  </g>

  <g data-card="JSON operators" data-x="844" data-y="690" data-width="285" data-height="112">
    <rect x="844" y="690" width="285" height="112" rx="13" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M844,733 L844,703 Q844,690 857,690 L1116,690 Q1129,690 1129,703 L1129,733 Z" fill="#f1f6ec"/>
    <text x="986.5" y="713" class="tiny" text-anchor="middle">exposed-json DSL</text>
    <text x="986.5" y="740" class="cardTitle" text-anchor="middle">Query operators</text>
    <text x="868" y="768" class="detail">extract&lt;T&gt; path reads</text>
    <text x="868" y="790" class="detail">contains + exists filters</text>
  </g>

  <g data-card="Dialect behavior" data-x="1201" data-y="690" data-width="292" data-height="112">
    <rect x="1201" y="690" width="292" height="112" rx="13" fill="#fff" stroke="#a85f7f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1201,733 L1201,703 Q1201,690 1214,690 L1480,690 Q1493,690 1493,703 L1493,733 Z" fill="#f5eef2"/>
    <text x="1347" y="713" class="tiny" text-anchor="middle">PostgreSQL / MySQL / H2</text>
    <text x="1347" y="740" class="cardTitle" text-anchor="middle">Dialect behavior</text>
    <text x="1225" y="768" class="detail">JSONB native on Postgres</text>
    <text x="1225" y="790" class="detail">H2 skips JSON operators</text>
  </g>

  <path data-connector="query-json-jsonb" class="connector" d="M 400 746 L 462 746" stroke="#3f7fb5" marker-end="url(#arrow-blue)"/>
  <path data-connector="query-jsonb-operators" class="connector" d="M 772 746 L 834 746" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>
  <path data-connector="query-operators-dialect" class="connector" d="M 1129 746 L 1191 746" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <rect x="108" y="862" width="1385" height="36" rx="11" class="foot"/>
  <text x="800.5" y="886" class="note" text-anchor="middle">Reader contract: JSON payloads stay typed in Kotlin; SQL rendering and operator support are verified per dialect by R2DBC tests.</text>
</svg>
