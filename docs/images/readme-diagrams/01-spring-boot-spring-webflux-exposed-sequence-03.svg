<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-label="Spring WebFlux Exposed R2DBC request sequence">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap');
      @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
      .canvas{fill:#F6F8FB;}
      .frame{fill:#FFFDF9;stroke:#3f535c;stroke-width:3.2;}
      .title{font-family:'Architects Daughter','Comic Mono',monospace;font-size:44px;fill:#1f2937;}
      .subtitle,.note{font-family:'Comic Mono','Architects Daughter',monospace;font-size:17px;fill:#435363;font-weight:700;}
      .header{fill:#FFFFFF;stroke:#587080;stroke-width:2.4;}
      .participant{font-family:'Architects Daughter','Comic Mono',monospace;font-size:23px;fill:#23323f;}
      .role{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;fill:#64748b;font-weight:700;}
      .lifeline{stroke:#9db1bf;stroke-width:2.4;stroke-dasharray:8 10;stroke-linecap:butt;}
      .activation{fill:#F4FAF6;stroke:#77a984;stroke-width:2;}
      .activationBlue{fill:#EEF6FF;stroke:#7eb2d5;}
      .activationAmber{fill:#FFF7E6;stroke:#bd8b3b;}
      .activationTeal{fill:#EFFAF9;stroke:#5fa8a2;}
      .activationPurple{fill:#F6F0FF;stroke:#9d7bc3;}
      .call{fill:none;stroke:#3f86bd;stroke-width:3;marker-end:url(#seqArrowBlue);}
      .state{fill:none;stroke:#6f8f52;stroke-width:3;marker-end:url(#seqArrowGreen);}
      .sql{fill:none;stroke:#b68432;stroke-width:3;marker-end:url(#seqArrowAmber);}
      .return{fill:none;stroke:#2f9b95;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#seqArrowTeal);}
      .work{fill:none;stroke:#805aa8;stroke-width:3;marker-end:url(#seqArrowPurple);}
      .pill{fill:#FFFFFF;stroke-width:1.8;}
      .pillBlue{stroke:#9ec5e8;}
      .pillGreen{stroke:#a9c58f;}
      .pillAmber{stroke:#d4b06d;}
      .pillTeal{stroke:#9cccca;}
      .pillPurple{stroke:#c5b0dd;}
      .badgeCircle{fill:#FFFDF9;stroke-width:1.8;}
      .badge{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;font-weight:800;dominant-baseline:middle;text-anchor:middle;}
      .msg{font-family:'Comic Mono','Architects Daughter',monospace;font-size:15px;font-weight:800;dominant-baseline:middle;}
      .blueText{fill:#276b9d;stroke:none;}
      .greenText{fill:#587a3d;stroke:none;}
      .amberText{fill:#8a6128;stroke:none;}
      .tealText{fill:#277f7a;stroke:none;}
      .purpleText{fill:#694989;stroke:none;}
      .badgeCircle.blueText{fill:#FFFDF9;stroke:#9ec5e8;}
      .badgeCircle.greenText{fill:#FFFDF9;stroke:#a9c58f;}
      .badgeCircle.amberText{fill:#FFFDF9;stroke:#d4b06d;}
      .badgeCircle.tealText{fill:#FFFDF9;stroke:#9cccca;}
      .badgeCircle.purpleText{fill:#FFFDF9;stroke:#c5b0dd;}
      .branch{fill:none;stroke:#7892a0;stroke-width:2.8;stroke-dasharray:8 8;}
      .branchLabel{fill:#FFFDF9;stroke:#d4b06d;stroke-width:1.8;}
      .branchText{font-family:'Comic Mono','Architects Daughter',monospace;font-size:15px;fill:#7c5a2b;font-weight:800;dominant-baseline:middle;}
      .noteBox{fill:#FFFFFF;stroke:#d7e2ec;stroke-width:1.8;}
    </style>
    <marker id="seqArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f86bd" stroke="#3f86bd" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b68432" stroke="#b68432" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9b95" stroke="#2f9b95" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#805aa8" stroke="#805aa8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1240"/>
  <rect class="frame" x="26" y="26" width="1548" height="1188" rx="26"/>

  <text class="title" x="70" y="88">Spring WebFlux Exposed R2DBC Request Flow</text>
  <text class="subtitle" x="72" y="122">Suspend WebFlux handlers execute Exposed R2DBC repository queries inside suspendTransaction and map rows to DTO records.</text>

  <g transform="translate(76,162)">
    <rect class="header" x="0" y="0" width="188" height="76" rx="10"/>
    <text class="participant" x="94" y="35" text-anchor="middle">HTTP Client</text>
    <text class="role" x="94" y="57" text-anchor="middle">JSON request</text>
  </g>
  <g transform="translate(324,162)">
    <rect class="header" x="0" y="0" width="218" height="76" rx="10"/>
    <text class="participant" x="109" y="35" text-anchor="middle">WebFlux API</text>
    <text class="role" x="109" y="57" text-anchor="middle">Movie / Actor controllers</text>
  </g>
  <g transform="translate(594,162)">
    <rect class="header" x="0" y="0" width="246" height="76" rx="10"/>
    <text class="participant" x="123" y="35" text-anchor="middle">suspendTransaction</text>
    <text class="role" x="123" y="57" text-anchor="middle">R2dbc transaction</text>
  </g>
  <g transform="translate(902,162)">
    <rect class="header" x="0" y="0" width="214" height="76" rx="10"/>
    <text class="participant" x="107" y="35" text-anchor="middle">Repository</text>
    <text class="role" x="107" y="57" text-anchor="middle">CRUD + query search</text>
  </g>
  <g transform="translate(1182,162)">
    <rect class="header" x="0" y="0" width="194" height="76" rx="10"/>
    <text class="participant" x="97" y="35" text-anchor="middle">Exposed DSL</text>
    <text class="role" x="97" y="57" text-anchor="middle">select / insert / join</text>
  </g>
  <g transform="translate(1420,162)">
    <rect class="header" x="0" y="0" width="144" height="76" rx="10"/>
    <text class="participant" x="72" y="35" text-anchor="middle">R2DBC DB</text>
    <text class="role" x="72" y="57" text-anchor="middle">ConnectionPool</text>
  </g>

  <path class="lifeline" d="M 170 238 V 1104"/>
  <path class="lifeline" d="M 433 238 V 1104"/>
  <path class="lifeline" d="M 717 238 V 1104"/>
  <path class="lifeline" d="M 1009 238 V 1104"/>
  <path class="lifeline" d="M 1279 238 V 1104"/>
  <path class="lifeline" d="M 1492 238 V 1104"/>

  <rect class="activation activationBlue" x="161" y="286" width="18" height="748" rx="5"/>
  <rect class="activation activationTeal" x="424" y="324" width="18" height="810" rx="5"/>
  <rect class="activation activationPurple" x="708" y="404" width="18" height="650" rx="5"/>
  <rect class="activation activation" x="1000" y="486" width="18" height="502" rx="5"/>
  <rect class="activation activationAmber" x="1270" y="568" width="18" height="426" rx="5"/>
  <rect class="activation activationAmber" x="1483" y="650" width="18" height="104" rx="5"/>

  <g>
    <rect class="pill pillBlue" x="92" y="254" width="372" height="32" rx="16"/>
    <circle class="badgeCircle blueText" cx="117" cy="270" r="13"/>
    <text class="badge blueText" x="117" y="270">1</text>
    <text class="msg blueText" x="154" y="270">HTTP request to /movies or /actors</text>
    <path class="call" d="M 170 292 H 433"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="392" y="334" width="392" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="417" cy="350" r="13"/>
    <text class="badge greenText" x="417" y="350">2</text>
    <text class="msg greenText" x="454" y="350">enter suspendTransaction(database)</text>
    <path class="state" d="M 433 372 H 717"/>
  </g>

  <g>
    <rect class="pill pillPurple" x="646" y="414" width="410" height="32" rx="16"/>
    <circle class="badgeCircle purpleText" cx="671" cy="430" r="13"/>
    <text class="badge purpleText" x="671" y="430">3</text>
    <text class="msg purpleText" x="708" y="430">call MovieRepository / ActorRepository</text>
    <path class="work" d="M 717 452 H 1009"/>
  </g>

  <g>
    <rect class="pill pillAmber" x="944" y="494" width="382" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="969" cy="510" r="13"/>
    <text class="badge amberText" x="969" y="510">4</text>
    <text class="msg amberText" x="1006" y="510">build Exposed DSL query expression</text>
    <path class="sql" d="M 1009 532 H 1279"/>
  </g>

  <g>
    <rect class="pill pillAmber" x="1210" y="574" width="324" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="1235" cy="590" r="13"/>
    <text class="badge amberText" x="1235" y="590">5</text>
    <text class="msg amberText" x="1272" y="590">execute over R2DBC connection</text>
    <path class="sql" d="M 1279 612 H 1492"/>
  </g>

  <g>
    <rect class="pill pillTeal" x="1136" y="654" width="286" height="32" rx="16"/>
    <circle class="badgeCircle tealText" cx="1161" cy="670" r="13"/>
    <text class="badge tealText" x="1161" y="670">6</text>
    <text class="msg tealText" x="1198" y="670">ResultRow stream returns</text>
    <path class="return" d="M 1492 692 H 1279"/>
  </g>

  <g>
    <rect class="pill pillTeal" x="878" y="734" width="360" height="32" rx="16"/>
    <circle class="badgeCircle tealText" cx="903" cy="750" r="13"/>
    <text class="badge tealText" x="903" y="750">7</text>
    <text class="msg tealText" x="940" y="750">map ResultRow to DTO records</text>
    <path class="return" d="M 1279 772 H 1009"/>
  </g>

  <rect class="branch" x="850" y="818" width="614" height="170" rx="18"/>
  <rect class="branchLabel" x="878" y="803" width="372" height="30" rx="15"/>
  <text class="branchText" x="898" y="818">optional /movie-actors grouped view</text>

  <g>
    <rect class="pill pillAmber" x="976" y="846" width="410" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="1001" cy="862" r="13"/>
    <text class="badge amberText" x="1001" y="862">8</text>
    <text class="msg amberText" x="1038" y="862">join movies through actors_in_movies</text>
    <path class="sql" d="M 1009 884 H 1279"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="842" y="926" width="392" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="867" cy="942" r="13"/>
    <text class="badge greenText" x="867" y="942">9</text>
    <text class="msg greenText" x="904" y="942">bufferUntilChanged groups actors per movie</text>
    <path class="state" d="M 1279 964 H 1009"/>
  </g>

  <g>
    <rect class="pill pillTeal" x="398" y="1006" width="366" height="32" rx="16"/>
    <circle class="badgeCircle tealText" cx="423" cy="1022" r="13"/>
    <text class="badge tealText" x="423" y="1022">10</text>
    <text class="msg tealText" x="462" y="1022">transaction returns DTO / Flow result</text>
    <path class="return" d="M 717 1044 H 433"/>
  </g>

  <g>
    <rect class="pill pillBlue" x="98" y="1086" width="302" height="32" rx="16"/>
    <circle class="badgeCircle blueText" cx="123" cy="1102" r="13"/>
    <text class="badge blueText" x="123" y="1102">11</text>
    <text class="msg blueText" x="162" y="1102">serialize JSON response</text>
    <path class="call" d="M 433 1124 H 170"/>
  </g>

  <rect class="noteBox" x="84" y="1172" width="1432" height="30" rx="10"/>
  <text class="note" x="800" y="1192" text-anchor="middle">Controller methods are suspend handlers; repository queries run inside Exposed R2DBC suspendTransaction using the configured R2dbcDatabase.</text>
</svg>
