<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1146" viewBox="0 0 1344 1146" role="img" aria-label="Spring WebFlux + Exposed R2DBC Integration Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1344" height="1146"/>
<rect class="frame" x="32" y="28" width="1280" height="1090" rx="28"/>
<text class="title" x="66" y="82">Spring WebFlux + Exposed R2DBC Integration Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="25" y="166" width="230" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">HTTP Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="379.6666666666667" y="166" width="230" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="494.6666666666667" y="209" text-anchor="middle">RestController</text>
<line class="lifeline" x1="494.6666666666667" y1="252" x2="494.6666666666667" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="734.3333333333334" y="166" width="230" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="849.3333333333334" y="209" text-anchor="middle">Repository</text>
<line class="lifeline" x1="849.3333333333334" y1="252" x2="849.3333333333334" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1089" y="166" width="230" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1204" y="209" text-anchor="middle">R2dbcDatabase</text>
<line class="lifeline" x1="1204" y1="252" x2="1204" y2="1086" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="182.33333333333337" y="286" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="200.33333333333337" y="313" text-anchor="start">1. HTTP request (suspend fun)</text>
<path class="line" d="M140 344 L494.6666666666667 344"/>
<rect x="423.66666666666674" y="396" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="441.66666666666674" y="423" text-anchor="start">2. suspendTransaction { }</text>
<path class="line" d="M494.6666666666667 454 C558.6666666666667 454 558.6666666666667 488 494.6666666666667 488"/>
<rect x="549" y="526" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="567" y="553" text-anchor="start">3. repository.findById(id)</text>
<path class="line" d="M494.6666666666667 584 L849.3333333333334 584"/>
<rect x="859.1666666666667" y="636" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="877.1666666666667" y="663" text-anchor="start">4. Exposed DSL (selectAll/insert/...)</text>
<path class="line" d="M849.3333333333334 694 L1204 694"/>
<rect x="921.6666666666667" y="746" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="939.6666666666667" y="773" text-anchor="start">5. ResultRow / Flow</text>
<path class="dashed" d="M1204 804 L849.3333333333334 804"/>
<rect x="567" y="856" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="585" y="883" text-anchor="start">6. DTO (MovieRecord)</text>
<path class="dashed" d="M849.3333333333334 914 L494.6666666666667 914"/>
<rect x="212.33333333333337" y="966" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="993" text-anchor="start">7. JSON response</text>
<path class="dashed" d="M494.6666666666667 1024 L140 1024"/>
</svg>
