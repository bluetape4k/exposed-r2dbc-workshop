<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="866" viewBox="0 0 1085 866" role="img" aria-label="Spring WebFlux + Exposed R2DBC Integration Flow">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
<marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
<style>.canvas{fill:#F7F9FC}.frame{fill:#fff;stroke:#D8E0EA;stroke-width:1.5}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#102033}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}.smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}.strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}.card{stroke-width:2;filter:url(#shadow)}.line{stroke:#5D6B7A;stroke-width:2.2;fill:none;marker-end:url(#openArrow)}.dashed{stroke:#5D6B7A;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}.lifeline{stroke:#B7C2D1;stroke-width:1.8;stroke-dasharray:8 9}.note{fill:#fff;opacity:.97}</style>
</defs>
<rect class="canvas" width="1085" height="866"/>
<rect class="frame" x="24" y="24" width="1037" height="810" rx="22"/>
<text class="title" x="58" y="76">Spring WebFlux + Exposed R2DBC Integration Flow</text>
<text class="subtitle" x="62" y="106">Compact sequence flow with reduced outer and inner whitespace</text>
<rect class="card" x="50.0" y="156" width="220" height="66" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="160.0" y="196" text-anchor="middle">HTTP Client</text>
<line class="lifeline" x1="160.0" y1="250" x2="160.0" y2="804"/>
<rect class="card" x="305.0" y="156" width="220" height="66" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="415.0" y="196" text-anchor="middle">RestController</text>
<line class="lifeline" x1="415.0" y1="250" x2="415.0" y2="804"/>
<rect class="card" x="560.0" y="156" width="220" height="66" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="670.0" y="196" text-anchor="middle">Repository</text>
<line class="lifeline" x1="670.0" y1="250" x2="670.0" y2="804"/>
<rect class="card" x="815.0" y="156" width="220" height="66" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="925.0" y="196" text-anchor="middle">R2dbcDatabase</text>
<line class="lifeline" x1="925.0" y1="250" x2="925.0" y2="804"/>
<path class="line" d="M160.0 292.0 L415.0 292.0"/>
<rect class="note" x="184.6" y="260.0" width="205.8" height="28" rx="9"/>
<text class="strong" x="287.5" y="280.0" text-anchor="middle">1. HTTP request (suspend fun)</text>
<path class="line" d="M415.0 366.0 C477.0 366.0 477.0 396.0 415.0 396.0"/>
<rect class="note" x="485.0" y="356.0" width="181.0" height="28" rx="9"/>
<text class="strong" x="485.0" y="376.0" text-anchor="start">2. suspendTransaction { }</text>
<path class="line" d="M415.0 440.0 L670.0 440.0"/>
<rect class="note" x="448.9" y="408.0" width="187.2" height="28" rx="9"/>
<text class="strong" x="542.5" y="428.0" text-anchor="middle">3. repository.findById(id)</text>
<path class="line" d="M670.0 514.0 L925.0 514.0"/>
<rect class="note" x="669.8" y="482.0" width="255.4" height="28" rx="9"/>
<text class="strong" x="797.5" y="502.0" text-anchor="middle">4. Exposed DSL (selectAll/insert/...)</text>
<path class="dashed" d="M925.0 588.0 L670.0 588.0"/>
<rect class="note" x="717.5" y="556.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="797.5" y="576.0" text-anchor="middle">5. ResultRow / Flow</text>
<path class="dashed" d="M670.0 662.0 L415.0 662.0"/>
<rect class="note" x="462.5" y="630.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="542.5" y="650.0" text-anchor="middle">6. DTO (MovieRecord)</text>
<path class="dashed" d="M415.0 736.0 L160.0 736.0"/>
<rect class="note" x="207.5" y="704.0" width="160.0" height="28" rx="9"/>
<text class="strong" x="287.5" y="724.0" text-anchor="middle">7. JSON response</text>
</svg>
