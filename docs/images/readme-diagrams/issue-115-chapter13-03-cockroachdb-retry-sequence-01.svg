</style></defs><rect class="canvas" width="1540" height="1230"/><rect class="frame" x="28" y="26" width="1484" height="1178" rx="26"/><text class="title" x="770" y="82" text-anchor="middle">CockroachDB Retry Boundary Flow</text><text class="subtitle" x="770" y="116" text-anchor="middle">SQLSTATE 40001 reruns the whole reservation transaction; non-retryable failures stop immediately.</text><g id="participant-0"><rect class="header" x="55" y="160" width="210" height="74" rx="10"/><text class="participant" x="160" y="191" text-anchor="middle">Test</text><text class="role" x="160" y="214" text-anchor="middle">runTest</text><line class="lifeline" x1="160" y1="234" x2="160" y2="1018"/></g><g id="participant-1"><rect class="header" x="345" y="160" width="210" height="74" rx="10"/><text class="participant" x="450" y="191" text-anchor="middle">Retry Policy</text><text class="role" x="450" y="214" text-anchor="middle">maxAttempts=3</text><line class="lifeline" x1="450" y1="234" x2="450" y2="1018"/></g><g id="participant-2"><rect class="header" x="665" y="160" width="210" height="74" rx="10"/><text class="participant" x="770" y="191" text-anchor="middle">R2DBC Tx</text><text class="role" x="770" y="214" text-anchor="middle">withDb</text><line class="lifeline" x1="770" y1="234" x2="770" y2="1018"/></g><g id="participant-3"><rect class="header" x="985" y="160" width="210" height="74" rx="10"/><text class="participant" x="1090" y="191" text-anchor="middle">Items</text><text class="role" x="1090" y="214" text-anchor="middle">quantity/version</text><line class="lifeline" x1="1090" y1="234" x2="1090" y2="1018"/></g><g id="participant-4"><rect class="header" x="1285" y="160" width="210" height="74" rx="10"/><text class="participant" x="1390" y="191" text-anchor="middle">Ledger</text><text class="role" x="1390" y="214" text-anchor="middle">reservation log</text><line class="lifeline" x1="1390" y1="234" x2="1390" y2="1018"/></g><rect class="activation" x="153" y="320" width="14" height="620" rx="6"/><rect class="activation" x="443" y="348" width="14" height="560" rx="6"/><rect class="activation" x="763" y="376" width="14" height="560" rx="6"/><rect class="activation" x="1083" y="404" width="14" height="560" rx="6"/><rect class="activation" x="1383" y="432" width="14" height="560" rx="6"/><rect class="alt" x="64" y="410" width="1412" height="665" rx="16"/><rect class="pill skipLabel" x="94" y="392" width="300" height="34" rx="17"/><text class="note" x="118" y="414">alt retryable 40001</text><line class="branchDivider" x1="64" y1="930" x2="1476" y2="930"/><rect class="pill skipLabel" x="94" y="912" width="300" height="34" rx="17"/><text class="note" x="118" y="934">else non-retryable SQLSTATE</text><g id="m1"><rect class="pill stateLabel" x="310.4" y="258" width="279.2" height="34" rx="17"/><circle cx="334.4" cy="275" r="13" class="stateBadge"/><text x="334.4" y="280" text-anchor="middle" class="badgeText stateText">1</text><text class="msg stateText" x="358.4" y="280">seed item sku=retry qty=10</text><path class="state" d="M 160 300 H 770" stroke="#6E8F4F" marker-end="url(#arrowState)"/></g><g id="m2"><rect class="pill callLabel" x="173.2" y="346" width="293.6" height="34" rx="17"/><circle cx="197.2" cy="363" r="13" class="callBadge"/><text x="197.2" y="368" text-anchor="middle" class="badgeText callText">2</text><text class="msg callText" x="221.2" y="368">reserveWithRetry(sku, qty=4)</text><path class="call" d="M 160 388 H 450" stroke="#4F83BF" marker-end="url(#arrowCall)"/></g><g id="m3"><rect class="pill returnLabel" x="162.4" y="434" width="315.2" height="34" rx="17"/><circle cx="186.4" cy="451" r="13" class="returnBadge"/><text x="186.4" y="456" text-anchor="middle" class="badgeText returnText">3</text><text class="msg returnText" x="210.4" y="456">attempt 1 throws SQLSTATE 40001</text><path class="ret" d="M 450 476 H 160" stroke="#2E8F89" marker-end="url(#arrowReturn)"/></g><g id="m4"><rect class="pill slotLabel" x="452.4" y="522" width="315.2" height="34" rx="17"/><circle cx="476.4" cy="539" r="13" class="slotBadge"/><text x="476.4" y="544" text-anchor="middle" class="badgeText slotText">4</text><text class="msg slotText" x="500.4" y="544">attempt 2 opens new transaction</text><path class="slot" d="M 450 564 H 770" stroke="#C08A50" marker-end="url(#arrowRetry)"/></g><g id="m5"><rect class="pill callLabel" x="815.0" y="610" width="230.0" height="34" rx="17"/><circle cx="839.0" cy="627" r="13" class="callBadge"/><text x="839.0" y="632" text-anchor="middle" class="badgeText callText">5</text><text class="msg callText" x="863.0" y="632">select current item</text><path class="call" d="M 770 652 H 1090" stroke="#4F83BF" marker-end="url(#arrowCall)"/></g><g id="m6"><rect class="pill stateLabel" x="783.2" y="698" width="293.6" height="34" rx="17"/><circle cx="807.2" cy="715" r="13" class="stateBadge"/><text x="807.2" y="720" text-anchor="middle" class="badgeText stateText">6</text><text class="msg stateText" x="831.2" y="720">update quantity=6, version=1</text><path class="state" d="M 770 740 H 1090" stroke="#6E8F4F" marker-end="url(#arrowState)"/></g><g id="m7"><rect class="pill stateLabel" x="975.0" y="786" width="230.0" height="34" rx="17"/><circle cx="999.0" cy="803" r="13" class="stateBadge"/><text x="999.0" y="808" text-anchor="middle" class="badgeText stateText">7</text><text class="msg stateText" x="1023.0" y="808">insert ledger row</text><path class="state" d="M 770 828 H 1390" stroke="#6E8F4F" marker-end="url(#arrowState)"/></g><g id="m8"><rect class="pill returnLabel" x="495.0" y="874" width="230.0" height="34" rx="17"/><circle cx="519.0" cy="891" r="13" class="returnBadge"/><text x="519.0" y="896" text-anchor="middle" class="badgeText returnText">8</text><text class="msg returnText" x="543.0" y="896">InventorySnapshot</text><path class="ret" d="M 770 916 H 450" stroke="#2E8F89" marker-end="url(#arrowReturn)"/></g><g id="m9"><rect class="pill returnLabel" x="151.6" y="962" width="336.8" height="34" rx="17"/><circle cx="175.6" cy="979" r="13" class="returnBadge"/><text x="175.6" y="984" text-anchor="middle" class="badgeText returnText">9</text><text class="msg returnText" x="199.6" y="984">attempts=2; exactly one ledger row</text><path class="ret" d="M 450 1004 H 160" stroke="#2E8F89" marker-end="url(#arrowReturn)"/></g><rect x="86" y="1092" width="1368" height="58" rx="12" fill="#ffffff" stroke="#d7e0e4" stroke-width="1.8"/><text class="note" x="112" y="1126">The retry wraps the full transaction; a synthetic SQLSTATE drives the default H2 test.</text><text class="footer" x="770" y="1172" text-anchor="middle">exposed-r2dbc-workshop / Chapter 13 example README</text></svg>
