    <rect class="label pill" x="174" y="366" width="350" height="36" rx="18"/>
    <circle cx="201" cy="384" r="19" fill="#eef5fa" stroke="#4f86c6" stroke-width="2"/>
    <text class="num" x="201" y="390" text-anchor="middle">2</text>
    <text class="labelText" x="349" y="390" text-anchor="middle">now() from Clock.System</text>
    <path class="call callBlue" data-connector="now-call" d="M165 414 L425 414"/>
  </g>

