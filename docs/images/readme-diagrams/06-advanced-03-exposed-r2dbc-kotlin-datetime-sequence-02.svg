    <circle cx="637" cy="1042" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2"/>
    <text class="num" x="637" y="1048" text-anchor="middle">10</text>
    <text class="labelText" x="878" y="1048" text-anchor="middle">CurrentDateTime + date/time/timestamp literals</text>
    <path class="call callAmber" data-connector="defaults-literals" d="M165 1072 L990 1072"/>
    <rect class="label pill" x="1010" y="1102" width="520" height="36" rx="18"/>
    <circle cx="1037" cy="1120" r="19" fill="#f5eef2" stroke="#a85f7f" stroke-width="2"/>
    <text class="num" x="1037" y="1126" text-anchor="middle">11</text>
