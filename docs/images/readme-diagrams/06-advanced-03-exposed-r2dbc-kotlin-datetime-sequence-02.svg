    <rect class="label pill" x="102" y="286" width="386" height="36" rx="18"/>
    <circle cx="129" cy="304" r="19" fill="#eef5fa" stroke="#4f86c6" stroke-width="2"/>
    <text class="num" x="129" y="310" text-anchor="middle">1</text>
    <text class="labelText" x="300" y="310" text-anchor="middle">withTables(testDB, CitiesTime)</text>
    <path class="call callBlue" data-connector="with-tables" d="M165 334 L705 334"/>
  </g>

