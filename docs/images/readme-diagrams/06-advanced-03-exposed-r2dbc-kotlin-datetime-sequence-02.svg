<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1280" width="1700" height="1280" role="img" aria-label="Kotlinx DateTime insert select defaults and literals sequence">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a95" stroke="#2f9a95" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b58122" stroke="#b58122" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-rose" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a85f7f" stroke="#a85f7f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f7f9f4}
      .frame{fill:#fffefb;stroke:#3d515c;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:48px;fill:#1e293b}
      .subtitle,.role,.labelText,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#536476;font-weight:700}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#1e293b}
      .num{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#334155;font-weight:800}
      .card{fill:#fffefb;stroke:#60747f;stroke-width:2.4;filter:url(#softShadow)}
      .lifeline{stroke:#9fb1bc;stroke-width:2;stroke-dasharray:8 9}
      .activation{fill:#e6f7f5;stroke:#a7d9d3;stroke-width:2;opacity:.78}
      .activationAmber{fill:#fff2d8;stroke:#e3c483;stroke-width:2;opacity:.78}
      .label{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
      .call{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
      .callBlue{stroke:#4f86c6;marker-end:url(#arrow-blue)}
      .callTeal{stroke:#2f9a95;marker-end:url(#arrow-teal)}
      .callGreen{stroke:#6f8f52;marker-end:url(#arrow-green)}
      .callAmber{stroke:#b58122;marker-end:url(#arrow-amber)}
      .callRose{stroke:#a85f7f;marker-end:url(#arrow-rose)}
      .retBlue{stroke:#4f86c6;marker-end:url(#arrow-blue)}
      .retTeal{stroke:#2f9a95;marker-end:url(#arrow-teal)}
      .retAmber{stroke:#b58122;marker-end:url(#arrow-amber)}
      .branch{fill:none;stroke:#8aa0ad;stroke-width:2.4;stroke-dasharray:9 8}
      .branchLabel{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
      .footer{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
