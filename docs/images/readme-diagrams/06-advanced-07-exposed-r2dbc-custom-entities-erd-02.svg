  <rect class="card" x="0" y="0" width="320" height="193" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#DC6B82"/>
  <text class="label" x="160" y="44" text-anchor="middle">t_timebased_uuid</text>
  <text class="mono" x="18" y="104">UUID id PK UUIDv1 (RFC 4122)</text>
<text class="mono" x="18" y="131">VARCHAR name 255</text>
<text class="mono" x="18" y="158">INT age</text>
</g>
<g transform="translate(918,467)">
  <rect class="card" x="0" y="0" width="320" height="193" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#45A7A1"/>
  <text class="label" x="160" y="32" text-anchor="middle">t_timebased_uuid_b</text>
<text class="label" x="160" y="56" text-anchor="middle">ase62</text>
  <text class="mono" x="18" y="104">VARCHAR id PK UUIDv1+Base62 (22 c.</text>
<text class="mono" x="18" y="131">VARCHAR name 255</text>
<text class="mono" x="18" y="158">INT age</text>
</g>
</svg>
