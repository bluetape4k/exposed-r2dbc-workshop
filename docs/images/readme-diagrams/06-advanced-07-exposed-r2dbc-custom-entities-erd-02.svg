  <line class="compartment" x1="0" y1="74" x2="320" y2="74" stroke="#D6A441"/>
  <text class="label" x="160" y="44" text-anchor="middle">t_snowflake</text>
  <text class="mono" x="18" y="104">BIGINT id PK Snowflake ID (auto-g.</text>
<text class="mono" x="18" y="131">VARCHAR name 255</text>
<text class="mono" x="18" y="158">INT age</text>
</g>
