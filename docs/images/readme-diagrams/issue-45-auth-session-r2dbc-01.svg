<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-label="Chapter 12 authentication and session metadata architecture">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#25384d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a36f3e" stroke="#a36f3e" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .lane{stroke-width:1.8}
      .laneSpring{fill:#f5f9ff;stroke:#bdd7ee}
      .laneKtor{fill:#f7fbf2;stroke:#c9dfbb}
      .laneData{fill:#fbf7f0;stroke:#dfc39d}
      .card{filter:url(#softShadow);stroke-width:2.6}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:52px;fill:#192538;font-weight:400}
      .subtitle,.laneTitle,.body,.foot{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-weight:700;fill:#556678}
      .subtitle{font-size:20px}
      .laneTitle{font-size:16px;letter-spacing:.07em;fill:#8aa0b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:26px;fill:#192538;font-weight:400}
      .body{font-size:16px}
      .small{font-size:14px}
      .foot{font-size:15px}
      .connector{fill:none;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
      .blue{stroke:#4f86c6;marker-end:url(#arrowBlue)}
      .green{stroke:#6f8f52;marker-end:url(#arrowGreen)}
      .amber{stroke:#a36f3e;marker-end:url(#arrowAmber)}
      .h2Icon path{fill:#09476B}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1160"/>
  <rect class="frame" x="32" y="32" width="1736" height="1096" rx="26"/>

  <text class="title" x="86" y="112">Authentication And Session Metadata</text>
  <text class="subtitle" x="90" y="154">Both stacks store BCrypt account hashes and SHA-256 session token hashes; Ktor additionally carries the raw token in a signed cookie.</text>

  <rect class="lane laneSpring" x="70" y="205" width="795" height="575" rx="18"/>
  <text class="laneTitle" x="96" y="239">SPRING BASIC AUTH BOUNDARY</text>

  <rect class="lane laneKtor" x="935" y="205" width="795" height="575" rx="18"/>
  <text class="laneTitle" x="961" y="239">KTOR SIGNED COOKIE SESSION BOUNDARY</text>

  <rect class="lane laneData" x="70" y="810" width="1660" height="255" rx="18"/>
  <text class="laneTitle" x="96" y="844">R2DBC TABLE CONTRACT</text>

  <g data-card="Spring http basic">
    <rect class="card" x="115" y="285" width="320" height="120" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <text class="cardTitle" x="275" y="326" text-anchor="middle">HTTP Basic Filter</text>
    <text class="body" x="275" y="357" text-anchor="middle">WebFlux Security</text>
    <text class="body small" x="275" y="381" text-anchor="middle">profile/admin/sessions authenticated</text>
  </g>

  <g data-card="Spring user details service">
    <rect class="card" x="115" y="490" width="320" height="120" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <text class="cardTitle" x="275" y="531" text-anchor="middle">UserDetails Service</text>
    <text class="body" x="275" y="562" text-anchor="middle">ReactiveUserDetailsService</text>
    <text class="body small" x="275" y="586" text-anchor="middle">loads account rows by username</text>
  </g>

  <g data-card="Spring session metadata">
    <rect class="card" x="505" y="490" width="320" height="120" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <text class="cardTitle" x="665" y="531" text-anchor="middle">Session Metadata API</text>
    <text class="body" x="665" y="562" text-anchor="middle">POST /production/sessions</text>
    <text class="body small" x="665" y="586" text-anchor="middle">raw token returned only at creation</text>
  </g>

  <g data-card="Ktor basic login">
    <rect class="card" x="980" y="285" width="320" height="120" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <text class="cardTitle" x="1140" y="326" text-anchor="middle">Basic Login Route</text>
    <text class="body" x="1140" y="357" text-anchor="middle">auth-basic principal</text>
    <text class="body small" x="1140" y="381" text-anchor="middle">creates session after BCrypt match</text>
  </g>

  <g data-card="Ktor signed cookie">
    <rect class="card" x="980" y="490" width="320" height="120" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <text class="cardTitle" x="1140" y="531" text-anchor="middle">Signed Cookie</text>
    <text class="body" x="1140" y="562" text-anchor="middle">production_session</text>
    <text class="body small" x="1140" y="586" text-anchor="middle">HttpOnly, SameSite=Lax, raw token only</text>
  </g>

  <g data-card="Ktor auth session">
    <rect class="card" x="1370" y="490" width="320" height="120" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <text class="cardTitle" x="1530" y="531" text-anchor="middle">Session Guard</text>
    <text class="body" x="1530" y="562" text-anchor="middle">auth-session lookup</text>
    <text class="body small" x="1530" y="586" text-anchor="middle">findSessionByToken + permission check</text>
  </g>

  <g data-card="Accounts table">
    <rect class="card" x="165" y="885" width="420" height="125" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <g class="h2Icon" data-bluetape4k-icon="database/h2.svg" transform="translate(195 917) scale(1.45)">
      <path d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
    </g>
    <text class="cardTitle" x="415" y="925" text-anchor="middle">Accounts Table</text>
    <text class="body small" x="415" y="955" text-anchor="middle">password_hash uses BCrypt</text>
    <text class="body small" x="415" y="979" text-anchor="middle">public registration clamps USER + work:create</text>
  </g>

  <g data-card="Sessions table">
    <rect class="card" x="690" y="885" width="420" height="125" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <g class="h2Icon" data-bluetape4k-icon="database/h2.svg" transform="translate(720 917) scale(1.45)">
      <path d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
    </g>
    <text class="cardTitle" x="940" y="925" text-anchor="middle">Sessions Table</text>
    <text class="body small" x="940" y="955" text-anchor="middle">token_hash stores SHA-256 only</text>
    <text class="body small" x="940" y="979" text-anchor="middle">issued and expiry timestamps gate lookup</text>
  </g>

  <g data-card="Admin seed">
    <rect class="card" x="1215" y="885" width="420" height="125" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <text class="cardTitle" x="1425" y="925" text-anchor="middle">Seeded Access Boundary</text>
    <text class="body small" x="1425" y="955" text-anchor="middle">alice gets USER + work:create</text>
    <text class="body small" x="1425" y="979" text-anchor="middle">admin carries USER, ADMIN + outbound:create</text>
  </g>

  <path class="connector blue" data-connector="spring-basic-user-details" d="M 275 405 L 275 485"/>
  <path class="connector amber" data-connector="spring-user-details-accounts" d="M 275 610 L 275 880"/>
  <path class="connector blue" data-connector="spring-session-metadata" d="M 435 550 L 500 550"/>
  <path class="connector amber" data-connector="spring-session-table" d="M 665 610 L 665 710 Q 665 726 681 726 L 884 726 Q 900 726 900 742 L 900 880"/>

  <path class="connector green" data-connector="ktor-basic-cookie" d="M 1140 405 L 1140 485"/>
  <path class="connector green" data-connector="ktor-cookie-session-guard" d="M 1300 550 L 1365 550"/>
  <path class="connector amber" data-connector="ktor-session-table" d="M 1530 610 L 1530 710 Q 1530 726 1514 726 L 916 726 Q 900 726 900 742 L 900 880"/>

  <rect x="165" y="1028" width="1470" height="38" rx="12" fill="#ecfdf5" stroke="#86cfa0" stroke-width="1.8"/>
  <text class="foot" x="900" y="1053" text-anchor="middle">Spring keeps Basic auth as the transport; Ktor stores only a signed cookie token client-side and resolves permission from hashed session rows.</text>
</svg>
