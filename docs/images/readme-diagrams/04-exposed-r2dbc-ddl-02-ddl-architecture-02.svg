<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap');
      @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
      .canvas{fill:#F6F8FB;}
      .frame{fill:#FFFDF9;stroke:#d7e2ec;stroke-width:2;}
      .title{font-family:'Architects Daughter','Comic Mono',monospace;font-size:39px;fill:#1f2937;}
      .subtitle,.note{font-family:'Comic Mono','Architects Daughter',monospace;font-size:16px;fill:#526173;font-weight:700;}
      .lane{fill:#F7FAFD;stroke:#d7e2ec;stroke-width:1.6;}
      .laneTitle{font-family:'Architects Daughter','Comic Mono',monospace;font-size:20px;letter-spacing:3px;fill:#9aaec0;}
      .card{fill:#FFFFFF;stroke-width:2.2;}
      .blue{stroke:#4f86c6;fill:#EEF6FF;}
      .green{stroke:#6f8f52;fill:#F1F8EC;}
      .amber{stroke:#a66a3f;fill:#FFF6EA;}
      .teal{stroke:#4f9d96;fill:#ECFAF8;}
      .rose{stroke:#b05d83;fill:#FDF0F6;}
      .cardBand{fill:#ffffff;opacity:.72;}
      .kind{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;font-weight:800;fill:#64748b;}
      .cardTitle{font-family:'Architects Daughter','Comic Mono',monospace;font-size:25px;fill:#263241;}
      .detail{font-family:'Comic Mono','Architects Daughter',monospace;font-size:16px;font-weight:800;fill:#526173;}
      .edge{fill:none;stroke:#5f7180;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
      .edgeBlue{stroke:#3f86bd;}
      .edgeGreen{stroke:#6f8f52;}
      .edgeAmber{stroke:#a66a3f;}
      .edgeTeal{stroke:#4f9d96;}
      .edgeRose{stroke:#b05d83;}
      .headBlue{fill:#3f86bd;stroke:#3f86bd;stroke-width:2;stroke-dasharray:none;style:stroke-dasharray:none!important;}
      .headGreen{fill:#6f8f52;stroke:#6f8f52;stroke-width:2;stroke-dasharray:none;style:stroke-dasharray:none!important;}
      .headAmber{fill:#a66a3f;stroke:#a66a3f;stroke-width:2;stroke-dasharray:none;style:stroke-dasharray:none!important;}
      .headRose{fill:#b05d83;stroke:#b05d83;stroke-width:2;stroke-dasharray:none;style:stroke-dasharray:none!important;}
      .label{fill:#FFFFFF;stroke:#d7e2ec;stroke-width:1.4;}
      .labelText{font-family:'Comic Mono','Architects Daughter',monospace;font-size:13px;font-weight:800;fill:#536473;}
      .noteBox{fill:#ECFFF4;stroke:#65df93;stroke-width:1.6;}
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1120"/>
  <rect class="frame" x="28" y="28" width="1544" height="1064" rx="24"/>
  <text class="title" x="70" y="86">Exposed R2DBC DDL Architecture</text>
  <text class="subtitle" x="72" y="124">Static responsibility map for SchemaUtils, MigrationUtils, and source-defined schema objects.</text>

  <rect class="lane" x="58" y="166" width="1484" height="246" rx="18"/>
  <text class="laneTitle" x="86" y="210">WORKSHOP DDL DECLARATIONS</text>
  <rect class="lane" x="58" y="446" width="1484" height="248" rx="18"/>
  <text class="laneTitle" x="86" y="490">EXPOSED R2DBC DDL API</text>
  <rect class="lane" x="58" y="728" width="1484" height="236" rx="18"/>
  <text class="laneTitle" x="86" y="772">DATABASE SCHEMA EFFECTS</text>

  <g data-card="table-dsl" data-x="126" data-y="248" data-width="250" data-height="116">
    <rect class="card blue" x="126" y="248" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="128" y="304" width="246" height="1"/>
    <text class="kind" x="251" y="274" text-anchor="middle">&lt;&lt;Table DSL&gt;&gt;</text>
    <text class="cardTitle" x="251" y="304" text-anchor="middle">Table / IdTable</text>
    <text class="detail" x="151" y="336">IntIdTable, IdTable</text>
  </g>
  <g data-card="column-constraints" data-x="470" data-y="248" data-width="250" data-height="116">
    <rect class="card green" x="470" y="248" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="472" y="304" width="246" height="1"/>
    <text class="kind" x="595" y="274" text-anchor="middle">&lt;&lt;columns&gt;&gt;</text>
    <text class="cardTitle" x="595" y="304" text-anchor="middle">Constraints</text>
    <text class="detail" x="495" y="336">PK, FK, unique, check</text>
  </g>
  <g data-card="index-sequence" data-x="814" data-y="248" data-width="250" data-height="116">
    <rect class="card amber" x="814" y="248" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="816" y="304" width="246" height="1"/>
    <text class="kind" x="939" y="274" text-anchor="middle">&lt;&lt;database objects&gt;&gt;</text>
    <text class="cardTitle" x="939" y="304" text-anchor="middle">Index / Sequence</text>
    <text class="detail" x="839" y="336">index(), nextIntVal()</text>
  </g>
  <g data-card="migration-models" data-x="1158" data-y="248" data-width="250" data-height="116">
    <rect class="card rose" x="1158" y="248" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="1160" y="304" width="246" height="1"/>
    <text class="kind" x="1283" y="274" text-anchor="middle">&lt;&lt;migration input&gt;&gt;</text>
    <text class="cardTitle" x="1283" y="304" text-anchor="middle">V1 / V2 mapping</text>
    <text class="detail" x="1183" y="336">same table, new shape</text>
  </g>

  <g data-card="schema-utils" data-x="126" data-y="528" data-width="250" data-height="116">
    <rect class="card blue" x="126" y="528" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="128" y="584" width="246" height="1"/>
    <text class="kind" x="251" y="554" text-anchor="middle">&lt;&lt;SchemaUtils&gt;&gt;</text>
    <text class="cardTitle" x="251" y="584" text-anchor="middle">create / drop</text>
    <text class="detail" x="151" y="616">tables and sequences</text>
  </g>
  <g data-card="create-missing" data-x="470" data-y="528" data-width="250" data-height="116">
    <rect class="card green" x="470" y="528" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="472" y="584" width="246" height="1"/>
    <text class="kind" x="595" y="554" text-anchor="middle">&lt;&lt;SchemaUtils&gt;&gt;</text>
    <text class="cardTitle" x="595" y="584" text-anchor="middle">createMissing...</text>
    <text class="detail" x="495" y="616">missing tables/columns</text>
  </g>
  <g data-card="migration-utils" data-x="814" data-y="528" data-width="250" data-height="116">
    <rect class="card amber" x="814" y="528" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="816" y="584" width="246" height="1"/>
    <text class="kind" x="939" y="554" text-anchor="middle">&lt;&lt;MigrationUtils&gt;&gt;</text>
    <text class="cardTitle" x="939" y="584" text-anchor="middle">statementsRequired</text>
    <text class="detail" x="839" y="616">diff current vs target</text>
  </g>
  <g data-card="exec-batch" data-x="1158" data-y="528" data-width="250" data-height="116">
    <rect class="card rose" x="1158" y="528" width="250" height="116" rx="12"/>
    <rect class="cardBand" x="1160" y="584" width="246" height="1"/>
    <text class="kind" x="1283" y="554" text-anchor="middle">&lt;&lt;transaction&gt;&gt;</text>
    <text class="cardTitle" x="1283" y="584" text-anchor="middle">execInBatch</text>
    <text class="detail" x="1183" y="616">apply DDL, commit</text>
  </g>

  <g data-card="tables-effect" data-x="126" data-y="808" data-width="250" data-height="106">
    <rect class="card blue" x="126" y="808" width="250" height="106" rx="12"/>
    <text class="kind" x="251" y="834" text-anchor="middle">&lt;&lt;schema&gt;&gt;</text>
    <text class="cardTitle" x="251" y="864" text-anchor="middle">Tables + PK/FK</text>
    <text class="detail" x="151" y="896">Book, Person, Child</text>
  </g>
  <g data-card="columns-effect" data-x="470" data-y="808" data-width="250" data-height="106">
    <rect class="card green" x="470" y="808" width="250" height="106" rx="12"/>
    <text class="kind" x="595" y="834" text-anchor="middle">&lt;&lt;schema&gt;&gt;</text>
    <text class="cardTitle" x="595" y="864" text-anchor="middle">Columns + unique</text>
    <text class="detail" x="495" y="896">nullable, defaults</text>
  </g>
  <g data-card="indexes-effect" data-x="814" data-y="808" data-width="250" data-height="106">
    <rect class="card amber" x="814" y="808" width="250" height="106" rx="12"/>
    <text class="kind" x="939" y="834" text-anchor="middle">&lt;&lt;schema&gt;&gt;</text>
    <text class="cardTitle" x="939" y="864" text-anchor="middle">Indexes + sequences</text>
    <text class="detail" x="839" y="896">unique, partial, nextVal</text>
  </g>
  <g data-card="dialect-effect" data-x="1158" data-y="808" data-width="250" data-height="106">
    <rect class="card rose" x="1158" y="808" width="250" height="106" rx="12"/>
    <text class="kind" x="1283" y="834" text-anchor="middle">&lt;&lt;SQL verification&gt;&gt;</text>
    <text class="cardTitle" x="1283" y="864" text-anchor="middle">Dialect DDL</text>
    <text class="detail" x="1183" y="896">H2, Postgres, MySQL</text>
  </g>

  <path class="edge edgeBlue" d="M 251 364 V 502"/>
  <polygon class="headBlue" points="251,518 243,502 259,502" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge edgeGreen" d="M 595 364 V 502"/>
  <polygon class="headGreen" points="595,518 587,502 603,502" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge edgeAmber" d="M 939 364 V 502"/>
  <polygon class="headAmber" points="939,518 931,502 947,502" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge edgeRose" d="M 1283 364 V 502"/>
  <polygon class="headRose" points="1283,518 1275,502 1291,502" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge edgeAmber" d="M 1064 586 H 1132"/>
  <polygon class="headAmber" points="1148,586 1132,578 1132,594" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <rect class="label" x="1068" y="550" width="80" height="24" rx="12"/>
  <text class="labelText" x="1108" y="566" text-anchor="middle">batch</text>

  <path class="edge edgeBlue" d="M 251 644 V 782"/>
  <polygon class="headBlue" points="251,798 243,782 259,782" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge edgeGreen" d="M 595 644 V 782"/>
  <polygon class="headGreen" points="595,798 587,782 603,782" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge edgeAmber" d="M 939 644 V 782"/>
  <polygon class="headAmber" points="939,798 931,782 947,782" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge edgeRose" d="M 1283 644 V 782"/>
  <polygon class="headRose" points="1283,798 1275,782 1291,782" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="noteBox" x="96" y="1010" width="1408" height="34" rx="12"/>
  <text class="note" x="800" y="1032" text-anchor="middle">Solid arrows show source-code responsibility handoffs from table declarations to R2DBC DDL APIs and persisted schema effects.</text>
</svg>
