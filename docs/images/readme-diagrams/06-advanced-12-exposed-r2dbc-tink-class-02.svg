<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1480" viewBox="0 0 2200 1480" role="img" aria-label="Advanced 12 Exposed R2DBC Tink class diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.11"/>
    </filter>
    <style>
      .canvas{fill:#f4f7fa}
      .frame{fill:#fffefb;stroke:#b8ccdf;stroke-width:5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:3}
      .laneWarm{fill:#fffaf0;stroke:#dccb9e;stroke-width:3}
      .laneGreen{fill:#f2f8f2;stroke:#c5dab6;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:64px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#536476;font-weight:700}
      .laneTitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;letter-spacing:.06em;fill:#8ca2b4;font-weight:800}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .cardSub{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:22px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:19px;fill:#64748b;font-weight:800}
      .card{filter:url(#shadow)}
      .cardWhite{fill:#ffffff}
      .blue{stroke:#4f86c6}
      .green{stroke:#6f8f52}
      .amber{stroke:#b8891f}
      .teal{stroke:#4f8f8b}
      .red{stroke:#ad5f82}
      .brown{stroke:#8a6f55}
      .connector{fill:none}
      .inherit{fill:none;stroke:#64748b;stroke-width:5;stroke-linecap:butt;stroke-linejoin:round}
      .use{fill:none;stroke-width:4.2;stroke-dasharray:12 10;stroke-linecap:butt;stroke-linejoin:round}
      .head{stroke-dasharray:none;stroke-linecap:round;stroke-linejoin:round}
      .footer{fill:#ffffff;stroke:#d9e3ec;stroke-width:2.4}
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1480"/>
  <rect class="frame" x="36" y="34" width="2128" height="1412" rx="38"/>
  <text class="title" x="1100" y="126" text-anchor="middle">Tink Encrypted Column Class Map</text>
  <text class="subtitle" x="1100" y="176" text-anchor="middle">TinkColumnTypeTest defines anonymous IntIdTable fixtures and verifies AEAD, DAEAD, null, length, and algorithm behavior.</text>

  <rect class="lane" x="92" y="234" width="2016" height="254" rx="30"/>
  <text class="laneTitle" x="132" y="282">BASE CONTRACTS AND TINK API</text>
  <rect class="laneWarm" x="92" y="530" width="2016" height="430" rx="30"/>
  <text class="laneTitle" x="132" y="578">TEST FIXTURES</text>
  <rect class="laneGreen" x="92" y="1002" width="2016" height="260" rx="30"/>
  <text class="laneTitle" x="132" y="1050">ASSERTED BEHAVIOR</text>

  <g data-card="AbstractR2dbcExposedTest" data-x="142" data-y="304" data-width="430" data-height="142">
    <rect class="card cardWhite blue" x="142" y="304" width="430" height="142" rx="22" stroke-width="4"/>
    <text class="tiny" x="357" y="338" text-anchor="middle">&lt;&lt;base test&gt;&gt;</text>
    <text class="cardTitle" x="357" y="378" text-anchor="middle">AbstractR2dbc</text>
    <text class="cardTitle" x="357" y="412" text-anchor="middle">ExposedTest</text>
    <text class="cardSub" x="357" y="438" text-anchor="middle">enabled dialects + R2DBC setup</text>
  </g>
  <g data-card="IntIdTable" data-x="652" data-y="322" data-width="400" data-height="112">
    <rect class="card cardWhite green" x="652" y="322" width="400" height="112" rx="22" stroke-width="4"/>
    <text class="tiny" x="852" y="354" text-anchor="middle">&lt;&lt;Exposed base&gt;&gt;</text>
    <text class="cardTitle" x="852" y="396" text-anchor="middle">IntIdTable</text>
    <text class="cardSub" x="852" y="424" text-anchor="middle">id primary key fixtures</text>
  </g>
  <g data-card="Tink column extensions" data-x="1132" data-y="306" data-width="430" data-height="144">
    <rect class="card cardWhite amber" x="1132" y="306" width="430" height="144" rx="22" stroke-width="4"/>
    <text class="tiny" x="1347" y="340" text-anchor="middle">&lt;&lt;extension package&gt;&gt;</text>
    <text class="cardTitle" x="1347" y="380" text-anchor="middle">tinkAead* / tinkDaead*</text>
    <text class="cardSub" x="1347" y="412" text-anchor="middle">VarChar, Binary, Blob columns</text>
    <text class="cardSub" x="1347" y="440" text-anchor="middle">transparent encode/decode</text>
  </g>
  <g data-card="Tink algorithm enums" data-x="1642" data-y="306" data-width="430" data-height="144">
    <rect class="card cardWhite red" x="1642" y="306" width="430" height="144" rx="22" stroke-width="4"/>
    <text class="tiny" x="1857" y="340" text-anchor="middle">&lt;&lt;Google Tink&gt;&gt;</text>
    <text class="cardTitle" x="1857" y="380" text-anchor="middle">TinkAeads / TinkDaeads</text>
    <text class="cardSub" x="1857" y="412" text-anchor="middle">AES256_GCM, AES128_GCM</text>
    <text class="cardSub" x="1857" y="440" text-anchor="middle">CHACHA20, AES256_SIV</text>
  </g>

  <g data-card="TinkColumnTypeTest" data-x="142" data-y="642" data-width="430" data-height="148">
    <rect class="card cardWhite blue" x="142" y="642" width="430" height="148" rx="22" stroke-width="4"/>
    <text class="tiny" x="357" y="676" text-anchor="middle">&lt;&lt;test class&gt;&gt;</text>
    <text class="cardTitle" x="357" y="720" text-anchor="middle">TinkColumnTypeTest</text>
    <text class="cardSub" x="357" y="752" text-anchor="middle">runSuspendIO parameterized tests</text>
  </g>
  <g data-card="Anonymous table fixtures" data-x="652" data-y="642" data-width="400" data-height="148">
    <rect class="card cardWhite green" x="652" y="642" width="400" height="148" rx="22" stroke-width="4"/>
    <text class="tiny" x="852" y="676" text-anchor="middle">&lt;&lt;anonymous objects&gt;&gt;</text>
    <text class="cardTitle" x="852" y="720" text-anchor="middle">IntIdTable Fixtures</text>
    <text class="cardSub" x="852" y="752" text-anchor="middle">aead, daead, nullable, algo</text>
  </g>
  <g data-card="AEAD columns" data-x="1132" data-y="642" data-width="430" data-height="148">
    <rect class="card cardWhite amber" x="1132" y="642" width="430" height="148" rx="22" stroke-width="4"/>
    <text class="tiny" x="1347" y="676" text-anchor="middle">&lt;&lt;non-deterministic&gt;&gt;</text>
    <text class="cardTitle" x="1347" y="720" text-anchor="middle">AEAD Columns</text>
    <text class="cardSub" x="1347" y="752" text-anchor="middle">secret, data, blob values</text>
  </g>
  <g data-card="DAEAD columns" data-x="1642" data-y="642" data-width="430" data-height="148">
    <rect class="card cardWhite red" x="1642" y="642" width="430" height="148" rx="22" stroke-width="4"/>
    <text class="tiny" x="1857" y="676" text-anchor="middle">&lt;&lt;deterministic&gt;&gt;</text>
    <text class="cardTitle" x="1857" y="720" text-anchor="middle">DAEAD Columns</text>
    <text class="cardSub" x="1857" y="752" text-anchor="middle">email, fingerprint, blob</text>
  </g>
  <g data-card="shared test harness" data-x="652" data-y="820" data-width="400" data-height="126">
    <rect class="cardWhite teal" x="652" y="820" width="400" height="126" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="852" y="860" text-anchor="middle">withTables</text>
    <text class="cardSub" x="852" y="894" text-anchor="middle">create/drop test table</text>
    <text class="cardSub" x="852" y="926" text-anchor="middle">transaction test scope</text>
  </g>

  <g data-card="guard assertions" data-x="142" data-y="1094" data-width="430" data-height="112">
    <rect class="card cardWhite green" x="142" y="1094" width="430" height="112" rx="22" stroke-width="4"/>
    <text class="tiny" x="357" y="1126" text-anchor="middle">&lt;&lt;guard checks&gt;&gt;</text>
    <text class="cardTitle" x="357" y="1168" text-anchor="middle">nulls + algorithms</text>
    <text class="cardSub" x="357" y="1196" text-anchor="middle">nullable columns and AEAD variants</text>
  </g>
  <g data-card="AEAD CRUD assertions" data-x="1132" data-y="1094" data-width="430" data-height="112">
    <rect class="card cardWhite amber" x="1132" y="1094" width="430" height="112" rx="22" stroke-width="4"/>
    <text class="tiny" x="1347" y="1126" text-anchor="middle">&lt;&lt;AEAD checks&gt;&gt;</text>
    <text class="cardTitle" x="1347" y="1168" text-anchor="middle">CRUD + decrypt</text>
    <text class="cardSub" x="1347" y="1196" text-anchor="middle">CRUD returns plaintext</text>
  </g>
  <g data-card="DAEAD search assertions" data-x="1642" data-y="1094" data-width="430" data-height="112">
    <rect class="card cardWhite red" x="1642" y="1094" width="430" height="112" rx="22" stroke-width="4"/>
    <text class="tiny" x="1857" y="1126" text-anchor="middle">&lt;&lt;DAEAD checks&gt;&gt;</text>
    <text class="cardTitle" x="1857" y="1168" text-anchor="middle">WHERE equality</text>
    <text class="cardSub" x="1857" y="1196" text-anchor="middle">same plaintext, same ciphertext</text>
  </g>

  <path class="inherit connector" data-connector="test-extends-base"  d="M 357 642 L 357 462"/>
  <polygon class="head"  points="357,446 348,462 366,462" fill="#ffffff" stroke="#64748b" stroke-width="5" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="inherit connector" data-connector="fixtures-extend-table"  d="M 852 642 L 852 450"/>
  <polygon class="head"  points="852,434 843,450 861,450" fill="#ffffff" stroke="#64748b" stroke-width="5" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="use connector blue" data-connector="test-uses-fixtures"  d="M 572 716 L 638 716"/>
  <polyline class="head"  points="638,709 652,716 638,723" fill="none" stroke="#4f86c6" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use connector green" data-connector="fixtures-use-aead"  d="M 1052 716 L 1118 716"/>
  <polyline class="head"  points="1118,709 1132,716 1118,723" fill="none" stroke="#6f8f52" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use connector amber" data-connector="aead-and-daead-columns"  d="M 1562 716 L 1628 716"/>
  <polyline class="head"  points="1628,709 1642,716 1628,723" fill="none" stroke="#b8891f" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use connector amber" data-connector="columns-use-extensions"  d="M 1347 642 L 1347 464"/>
  <polyline class="head"  points="1340,464 1347,450 1354,464" fill="none" stroke="#b8891f" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use connector red" data-connector="extensions-use-tink-algorithms"  d="M 1562 378 L 1628 378"/>
  <polyline class="head"  points="1628,371 1642,378 1628,385" fill="none" stroke="#ad5f82" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="use connector green" data-connector="test-to-guards"  d="M 357 790 L 357 1080"/>
  <polyline class="head"  points="350,1080 357,1094 364,1080" fill="none" stroke="#6f8f52" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use connector amber" data-connector="aead-to-crud"  d="M 1347 790 L 1347 1080"/>
  <polyline class="head"  points="1340,1080 1347,1094 1354,1080" fill="none" stroke="#b8891f" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="use connector red" data-connector="daead-to-search"  d="M 1857 790 L 1857 1080"/>
  <polyline class="head"  points="1850,1080 1857,1094 1864,1080" fill="none" stroke="#ad5f82" stroke-width="4.2" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="footer" x="216" y="1310" width="1768" height="76" rx="18"/>
  <text class="note" x="1100" y="1340" text-anchor="middle">Legend: hollow triangles = inheritance; dashed arrows = use/dependency.</text>
  <text class="note" x="1100" y="1374" text-anchor="middle">Reader contract: AEAD is transparent storage; DAEAD additionally supports equality predicates.</text>
</svg>
