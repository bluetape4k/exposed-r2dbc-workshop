<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-label="Flow collection patterns for Exposed R2DBC coroutines">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#334155" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:2}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.7}
      .laneA{fill:#f5f9fd}
      .laneB{fill:#f7fbf5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:43px;fill:#1e293b}
      .subtitle,.detail,.note,.legendText{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:18px;fill:#536476;font-weight:700}
      .small{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:15px;fill:#64748b;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:25px;fill:#1e293b}
      .card{filter:url(#softShadow)}
      .header{opacity:.96}
      .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.6}
    </style>
  </defs>

  <rect width="1600" height="1080" class="canvas"/>
  <rect x="28" y="28" width="1544" height="1024" rx="22" class="frame"/>

  <text x="72" y="86" class="title">Flow Collection Patterns</text>
  <text x="72" y="121" class="subtitle">Repository-backed map from Ex02_CoroutinesFlow: collect ordered Flow results and verify parallel top-level inserts.</text>

  <rect x="60" y="150" width="1480" height="285" rx="18" class="lane laneA"/>
  <text x="88" y="188" class="laneTitle">ORDERED FLOW COLLECTION</text>

  <rect x="60" y="470" width="1480" height="315" rx="18" class="lane laneB"/>
  <text x="88" y="508" class="laneTitle">PARALLEL INSERT THEN FLOW VERIFICATION</text>

  <rect x="60" y="817" width="1480" height="108" rx="18" class="lane"/>
  <text x="88" y="856" class="laneTitle">READER CONTRACT</text>

  <g data-card="withTables fixture" data-x="92" data-y="245" data-width="240" data-height="122">
    <rect x="92" y="245" width="240" height="122" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.4" class="card"/>
    <path class="header" d="M92,293 L92,259 Q92,245 106,245 L318,245 Q332,245 332,259 L332,293 Z" fill="#eef5fa"/>
    <text x="212" y="269" class="tiny" text-anchor="middle">&lt;&lt;test fixture&gt;&gt;</text>
    <text x="212" y="299" class="cardTitle" text-anchor="middle">withTables()</text>
    <text x="116" y="331" class="small">create tester table</text>
    <text x="116" y="355" class="small">multi-DB parameter</text>
  </g>

  <g data-card="seed rows" data-x="380" data-y="245" data-width="240" data-height="122">
    <rect x="380" y="245" width="240" height="122" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M380,293 L380,259 Q380,245 394,245 L606,245 Q620,245 620,259 L620,293 Z" fill="#eef6e9"/>
    <text x="500" y="269" class="tiny" text-anchor="middle">&lt;&lt;seed&gt;&gt;</text>
    <text x="500" y="299" class="cardTitle" text-anchor="middle">insert 1..5</text>
    <text x="404" y="331" class="small">tester.insert</text>
    <text x="404" y="355" class="small">seq uniqueIndex</text>
  </g>

  <g data-card="ordered select" data-x="668" data-y="245" data-width="240" data-height="122">
    <rect x="668" y="245" width="240" height="122" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M668,293 L668,259 Q668,245 682,245 L894,245 Q908,245 908,259 L908,293 Z" fill="#f5eee4"/>
    <text x="788" y="269" class="tiny" text-anchor="middle">&lt;&lt;R2DBC DSL&gt;&gt;</text>
    <text x="788" y="299" class="cardTitle" text-anchor="middle">selectAll()</text>
    <text x="692" y="331" class="small">orderBy(seq)</text>
    <text x="692" y="355" class="small">returns Flow&lt;ResultRow&gt;</text>
  </g>

  <g data-card="flow map" data-x="956" data-y="245" data-width="240" data-height="122">
    <rect x="956" y="245" width="240" height="122" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M956,293 L956,259 Q956,245 970,245 L1182,245 Q1196,245 1196,259 L1196,293 Z" fill="#eef7f6"/>
    <text x="1076" y="269" class="tiny" text-anchor="middle">&lt;&lt;Flow op&gt;&gt;</text>
    <text x="1076" y="299" class="cardTitle" text-anchor="middle">map row seq</text>
    <text x="980" y="331" class="small">row[seq]</text>
    <text x="980" y="355" class="small">Flow.map keeps order</text>
  </g>

  <g data-card="collect assert" data-x="1244" data-y="245" data-width="250" data-height="122">
    <rect x="1244" y="245" width="250" height="122" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1244,293 L1244,259 Q1244,245 1258,245 L1480,245 Q1494,245 1494,259 L1494,293 Z" fill="#f5eef2"/>
    <text x="1369" y="269" class="tiny" text-anchor="middle">&lt;&lt;terminal op&gt;&gt;</text>
    <text x="1369" y="299" class="cardTitle" text-anchor="middle">toList()</text>
    <text x="1268" y="331" class="small">listOf(1,2,3,4,5)</text>
    <text x="1268" y="355" class="small">or empty list</text>
  </g>

  <path class="flow" data-connector="ordered-fixture-to-seed" d="M 332 306 L 380 306" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
  <path class="flow" data-connector="ordered-seed-to-select" d="M 620 306 L 668 306" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
  <path class="flow" data-connector="ordered-select-to-map" d="M 908 306 L 956 306" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
  <path class="flow" data-connector="ordered-map-to-list" d="M 1196 306 L 1244 306" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>

  <g data-card="expected values" data-x="92" data-y="562" data-width="240" data-height="122">
    <rect x="92" y="562" width="240" height="122" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2.4" class="card"/>
    <path class="header" d="M92,610 L92,576 Q92,562 106,562 L318,562 Q332,562 332,576 L332,610 Z" fill="#eef5fa"/>
    <text x="212" y="586" class="tiny" text-anchor="middle">&lt;&lt;input&gt;&gt;</text>
    <text x="212" y="616" class="cardTitle" text-anchor="middle">expected 1..8</text>
    <text x="116" y="648" class="small">map each value</text>
    <text x="116" y="672" class="small">independent insert job</text>
  </g>

  <g data-card="io async" data-x="380" data-y="562" data-width="240" data-height="122">
    <rect x="380" y="562" width="240" height="122" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M380,610 L380,576 Q380,562 394,562 L606,562 Q620,562 620,576 L620,610 Z" fill="#eef6e9"/>
    <text x="500" y="586" class="tiny" text-anchor="middle">&lt;&lt;CoroutineScope&gt;&gt;</text>
    <text x="500" y="616" class="cardTitle" text-anchor="middle">IO async jobs</text>
    <text x="404" y="648" class="small">CoroutineScope(IO)</text>
    <text x="404" y="672" class="small">one Deferred per value</text>
  </g>

  <g data-card="top level transaction" data-x="668" data-y="562" data-width="240" data-height="122">
    <rect x="668" y="562" width="240" height="122" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M668,610 L668,576 Q668,562 682,562 L894,562 Q908,562 908,576 L908,610 Z" fill="#f5eee4"/>
    <text x="788" y="586" class="tiny" text-anchor="middle">&lt;&lt;transaction&gt;&gt;</text>
    <text x="788" y="616" class="cardTitle" text-anchor="middle">top-level tx</text>
    <text x="692" y="648" class="small">db + isolation level</text>
    <text x="692" y="672" class="small">maxAttempts = 5</text>
  </g>

  <g data-card="parallel insert" data-x="956" data-y="562" data-width="240" data-height="122">
    <rect x="956" y="562" width="240" height="122" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M956,610 L956,576 Q956,562 970,562 L1182,562 Q1196,562 1196,576 L1196,610 Z" fill="#eef7f6"/>
    <text x="1076" y="586" class="tiny" text-anchor="middle">&lt;&lt;write&gt;&gt;</text>
    <text x="1076" y="616" class="cardTitle" text-anchor="middle">insert seq</text>
    <text x="980" y="648" class="small">tester.insert</text>
    <text x="980" y="672" class="small">parallel connections</text>
  </g>

  <g data-card="await and verify" data-x="1244" data-y="562" data-width="250" data-height="122">
    <rect x="1244" y="562" width="250" height="122" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1244,610 L1244,576 Q1244,562 1258,562 L1480,562 Q1494,562 1494,576 L1494,610 Z" fill="#f5eef2"/>
    <text x="1369" y="586" class="tiny" text-anchor="middle">&lt;&lt;verify&gt;&gt;</text>
    <text x="1369" y="616" class="cardTitle" text-anchor="middle">awaitAll + Flow</text>
    <text x="1268" y="648" class="small">selectAll orderBy seq</text>
    <text x="1268" y="672" class="small">assert expected</text>
  </g>

  <path class="flow" data-connector="parallel-input-to-async" d="M 332 623 L 380 623" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
  <path class="flow" data-connector="parallel-async-to-tx" d="M 620 623 L 668 623" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
  <path class="flow" data-connector="parallel-tx-to-insert" d="M 908 623 L 956 623" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
  <path class="flow" data-connector="parallel-insert-to-verify" d="M 1196 623 L 1244 623" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <g data-card="reader contract" data-x="105" data-y="872" data-width="1390" data-height="38">
    <rect x="105" y="872" width="1390" height="38" rx="12" class="noteBox"/>
    <text x="800" y="897" class="note" text-anchor="middle">Flow is collected inside the R2DBC transaction context; parallel work uses independent top-level transactions before ordered verification.</text>
  </g>

  <g transform="translate(120 948)">
    <path class="flow" d="M 0 14 L 58 14" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
    <text x="78" y="20" class="legendText">ordered Flow collection</text>
    <path class="flow" d="M 390 14 L 448 14" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
    <text x="468" y="20" class="legendText">parallel top-level transaction jobs</text>
  </g>
</svg>
