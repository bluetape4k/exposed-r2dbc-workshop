<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1360" viewBox="0 0 2200 1360" role="img" aria-label="Advanced 07 Exposed R2DBC Custom Entities architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.11"/>
    </filter>
    <style>
      .canvas{fill:#f4f7fa}
      .frame{fill:#fffefb;stroke:#b8ccdf;stroke-width:5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:3}
      .laneWarm{fill:#fffaf0;stroke:#dccb9e;stroke-width:3}
      .laneGreen{fill:#f2f8f2;stroke:#c5dab6;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:64px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#536476;font-weight:700}
      .laneTitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;letter-spacing:.06em;fill:#8ca2b4;font-weight:800}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .cardSub{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:22px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:19px;fill:#64748b;font-weight:800}
      .card{filter:url(#shadow)}
      .cardWhite{fill:#ffffff}
      .blue{stroke:#4f86c6}
      .green{stroke:#6f8f52}
      .amber{stroke:#b8891f}
      .teal{stroke:#4f8f8b}
      .red{stroke:#ad5f82}
      .brown{stroke:#8a6f55}
      .blueFill{fill:#eef5fa}
      .greenFill{fill:#f1f6ec}
      .amberFill{fill:#fff8e6}
      .tealFill{fill:#eef7f6}
      .redFill{fill:#f8edf3}
      .brownFill{fill:#f3eee8}
      .connector{fill:none;stroke-width:5;stroke-linecap:butt;stroke-linejoin:round}
      .head{stroke-dasharray:none;style:stroke-dasharray:none!important}
      .footer{fill:#ffffff;stroke:#d9e3ec;stroke-width:2.4}
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1360"/>
  <rect class="frame" x="36" y="34" width="2128" height="1292" rx="38"/>
  <text class="title" x="1100" y="126" text-anchor="middle">Custom Entity ID Strategy Map</text>
  <text class="subtitle" x="1100" y="176" text-anchor="middle">Choose a reusable table base by storage type, sort precision, and URL-safety; tests assert the same insert contract.</text>

  <rect class="lane" x="92" y="238" width="580" height="790" rx="30"/>
  <text class="laneTitle" x="132" y="286">SELECTION PRESSURE</text>
  <rect class="laneWarm" x="810" y="238" width="580" height="790" rx="30"/>
  <text class="laneTitle" x="850" y="286">REUSABLE BASE TABLE</text>
  <rect class="laneGreen" x="1528" y="238" width="580" height="790" rx="30"/>
  <text class="laneTitle" x="1568" y="286">PERSISTED PRIMARY KEY</text>

  <g data-card="High Throughput Numeric" data-x="150" data-y="334" data-width="420" data-height="116">
    <rect class="card cardWhite blue" x="150" y="334" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="360" y="382" text-anchor="middle">High Throughput Numeric</text>
    <text class="cardSub" x="360" y="418" text-anchor="middle">64-bit, millis ordered</text>
  </g>
  <g data-card="Sortable String ID" data-x="150" data-y="506" data-width="420" data-height="116">
    <rect class="card cardWhite green" x="150" y="506" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="360" y="554" text-anchor="middle">Sortable String ID</text>
    <text class="cardSub" x="360" y="590" text-anchor="middle">KSUID seconds or millis</text>
  </g>
  <g data-card="Standard UUID Contract" data-x="150" data-y="678" data-width="420" data-height="116">
    <rect class="card cardWhite teal" x="150" y="678" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="360" y="726" text-anchor="middle">Standard UUID Contract</text>
    <text class="cardSub" x="360" y="762" text-anchor="middle">UUIDv1, RFC 4122</text>
  </g>
  <g data-card="Compact URL Safe UUID" data-x="150" data-y="850" data-width="420" data-height="116">
    <rect class="card cardWhite red" x="150" y="850" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="360" y="898" text-anchor="middle">Compact URL-Safe UUID</text>
    <text class="cardSub" x="360" y="934" text-anchor="middle">22-char Base62 UUIDv1</text>
  </g>

  <g data-card="SnowflakeIdTable" data-x="888" data-y="334" data-width="424" data-height="116">
    <rect class="card cardWhite blue" x="888" y="334" width="424" height="116" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="366" text-anchor="middle">&lt;&lt;IdTable base&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="406" text-anchor="middle">SnowflakeIdTable</text>
    <text class="cardSub" x="1100" y="436" text-anchor="middle">clientDefault Snowflake Long</text>
  </g>
  <g data-card="Ksuid Table Family" data-x="888" data-y="506" data-width="424" data-height="116">
    <rect class="card cardWhite green" x="888" y="506" width="424" height="116" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="538" text-anchor="middle">&lt;&lt;IdTable base&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="578" text-anchor="middle">KsuidTable Family</text>
    <text class="cardSub" x="1100" y="608" text-anchor="middle">KsuidTable / KsuidMillisTable</text>
  </g>
  <g data-card="TimebasedUUIDTable" data-x="888" data-y="678" data-width="424" data-height="116">
    <rect class="card cardWhite teal" x="888" y="678" width="424" height="116" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="710" text-anchor="middle">&lt;&lt;IdTable base&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="750" text-anchor="middle">TimebasedUUIDTable</text>
    <text class="cardSub" x="1100" y="780" text-anchor="middle">clientDefault UUIDv1</text>
  </g>
  <g data-card="TimebasedUUIDBase62Table" data-x="888" data-y="850" data-width="424" data-height="116">
    <rect class="card cardWhite red" x="888" y="850" width="424" height="116" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="882" text-anchor="middle">&lt;&lt;IdTable base&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="922" text-anchor="middle">TimebasedUUIDBase62</text>
    <text class="cardSub" x="1100" y="952" text-anchor="middle">Base62 UUIDv1 string</text>
  </g>

  <g data-card="BIGINT Primary Key" data-x="1612" data-y="334" data-width="420" data-height="116">
    <rect class="card cardWhite blue" x="1612" y="334" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="1822" y="382" text-anchor="middle">BIGINT PRIMARY KEY</text>
    <text class="cardSub" x="1822" y="418" text-anchor="middle">t_snowflake.id</text>
  </g>
  <g data-card="VARCHAR27 Primary Key" data-x="1612" data-y="506" data-width="420" data-height="116">
    <rect class="card cardWhite green" x="1612" y="506" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="1822" y="554" text-anchor="middle">VARCHAR(27) PK</text>
    <text class="cardSub" x="1822" y="590" text-anchor="middle">t_ksuid / t_ksuid_millis</text>
  </g>
  <g data-card="UUID Primary Key" data-x="1612" data-y="678" data-width="420" data-height="116">
    <rect class="card cardWhite teal" x="1612" y="678" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="1822" y="726" text-anchor="middle">UUID PRIMARY KEY</text>
    <text class="cardSub" x="1822" y="762" text-anchor="middle">t_timebased_uuid.id</text>
  </g>
  <g data-card="VARCHAR22 Primary Key" data-x="1612" data-y="850" data-width="420" data-height="116">
    <rect class="card cardWhite red" x="1612" y="850" width="420" height="116" rx="22" stroke-width="4"/>
    <text class="cardTitle" x="1822" y="898" text-anchor="middle">VARCHAR(22) PK</text>
    <text class="cardSub" x="1822" y="934" text-anchor="middle">t_timebased_uuid_base62</text>
  </g>

  <path class="connector blue" data-connector="numeric-to-snowflake"  d="M 570 392 L 874 392"/>
  <polygon class="head"  points="888,392 874,385 874,399" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector blue" data-connector="snowflake-to-bigint"  d="M 1312 392 L 1598 392"/>
  <polygon class="head"  points="1612,392 1598,385 1598,399" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector green" data-connector="string-to-ksuid"  d="M 570 564 L 874 564"/>
  <polygon class="head"  points="888,564 874,557 874,571" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector green" data-connector="ksuid-to-varchar27"  d="M 1312 564 L 1598 564"/>
  <polygon class="head"  points="1612,564 1598,557 1598,571" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector teal" data-connector="uuid-to-timebased"  d="M 570 736 L 874 736"/>
  <polygon class="head"  points="888,736 874,729 874,743" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector teal" data-connector="timebased-to-uuid"  d="M 1312 736 L 1598 736"/>
  <polygon class="head"  points="1612,736 1598,729 1598,743" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector red" data-connector="compact-to-base62"  d="M 570 908 L 874 908"/>
  <polygon class="head"  points="888,908 874,901 874,915" fill="#ad5f82" stroke="#ad5f82" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector red" data-connector="base62-to-varchar22"  d="M 1312 908 L 1598 908"/>
  <polygon class="head"  points="1612,908 1598,901 1598,915" fill="#ad5f82" stroke="#ad5f82" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="lane" x="186" y="1082" width="1828" height="140" rx="30"/>
  <text class="laneTitle" x="226" y="1130">SHARED TEST CONTRACT</text>
  <g data-card="Parameterized Test Matrix" data-x="350" data-y="1148" data-width="370" data-height="56">
    <rect class="cardWhite amber" x="350" y="1148" width="370" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="535" y="1185" text-anchor="middle">TestDB x 50 / 500 records</text>
  </g>
  <g data-card="Mutation Paths" data-x="852" data-y="1148" data-width="496" data-height="56">
    <rect class="cardWhite brown" x="852" y="1148" width="496" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="1100" y="1185" text-anchor="middle">insert, batchInsert, coroutine chunks</text>
  </g>
  <g data-card="Count Assertion" data-x="1480" data-y="1148" data-width="370" data-height="56">
    <rect class="cardWhite amber" x="1480" y="1148" width="370" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="1665" y="1185" text-anchor="middle">selectAll().count() matches</text>
  </g>
  <rect class="footer" x="216" y="1258" width="1768" height="48" rx="18"/>
  <text class="note" x="1100" y="1290" text-anchor="middle">Reader contract: inherit the base table to pick ID storage and generator; table rows keep the same name/age payload and test assertions.</text>
</svg>
