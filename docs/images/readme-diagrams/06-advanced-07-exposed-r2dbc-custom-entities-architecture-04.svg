<path class="line" d="M672 386 C672 386 706 386 706 386" data-connector="line"/>
<path class="line" d="M338 386 C338 386 372 386 372 386" data-connector="line"/>
<path class="line" d="M372 220 C372 303 338 303 338 386" data-connector="line"/>
<path class="line" d="M672 220 C672 220 706 220 706 220" data-connector="line"/>
<path class="line" d="M338 220 C338 220 372 220 372 220" data-connector="line"/>
<g transform="translate(48,170)">
