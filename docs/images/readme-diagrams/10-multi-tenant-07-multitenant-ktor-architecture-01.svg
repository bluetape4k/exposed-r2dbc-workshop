<path class="connector" data-connector="repository-response" d="M1088 569 L1148 569" stroke="#a66a3f"/><polygon points="1148,569 1134,562 1134,576" fill="#a66a3f"/>
<path class="connector" data-connector="database-pool" d="M378 813 L438 813" stroke="#8a6f55"/><polygon points="438,813 424,806 424,820" fill="#8a6f55"/>
<path class="connector" data-connector="pool-korean-schema" d="M724 795 L790 795" stroke="#6f8f52"/><polygon points="790,795 776,788 776,802" fill="#6f8f52"/>
<path class="connector" data-connector="pool-english-schema" d="M724 852 L790 852" stroke="#4f8f8b"/><polygon points="790,852 776,845 776,859" fill="#4f8f8b"/>
<path class="connector" data-connector="initializer-schemas" d="M1120 852 L1050 852" stroke="#a85f7f"/><polygon points="1050,852 1064,845 1064,859" fill="#a85f7f"/>

<g>
  <rect x="1200" y="158" width="218" height="70" rx="12" class="legend"/>
  <line x1="1218" y1="178" x2="1260" y2="178" stroke="#4f86c6" stroke-width="3.2" stroke-linecap="round"/><polygon points="1260,178 1246,171 1246,185" fill="#4f86c6"/>
  <text x="1272" y="183" class="tiny">request / route</text>
  <line x1="1218" y1="198" x2="1260" y2="198" stroke="#6f8f52" stroke-width="3.2" stroke-linecap="round"/><polygon points="1260,198 1246,191 1246,205" fill="#6f8f52"/>
  <text x="1272" y="203" class="tiny">schema selection</text>
  <line x1="1218" y1="218" x2="1260" y2="218" stroke="#b85f64" stroke-width="3.2" stroke-linecap="round"/><polygon points="1260,218 1246,211 1246,225" fill="#b85f64"/>
  <text x="1272" y="223" class="tiny">invalid tenant</text>
</g>
<rect x="360" y="940" width="880" height="28" rx="10" class="noteBox"/>
<text x="800" y="960" class="note" text-anchor="middle">Ktor uses call-scoped attributes for tenant routing; no ThreadLocal or ReactorContext participates.</text>
</svg>
