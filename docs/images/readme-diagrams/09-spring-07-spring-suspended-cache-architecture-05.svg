<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="SCAN-Based Cache Eviction">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12.5px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}
    .line{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    .plain{stroke:#758297;stroke-width:2.0;fill:none}.dash{stroke:#758297;stroke-width:2.0;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="canvas" width="1100" height="560"/>
<rect class="frame" x="32" y="28" width="1036" height="504" rx="28"/>
<text class="title" x="66" y="82">SCAN-Based Cache Eviction</text>
<text class="subtitle" x="70" y="118">Cursor based scan deletes Redis keys without blocking the event loop</text>
<g transform="translate(80,230)">
  <rect class="card" x="0" y="0" width="250" height="96" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="125" y="30" text-anchor="middle">Start cursor</text>
<text class="smallLabel" x="125" y="55" text-anchor="middle">MATCH caches:country:*</text>
<text class="smallLabel" x="125" y="80" text-anchor="middle">COUNT 100</text>
</g><g transform="translate(405,230)">
  <rect class="card" x="0" y="0" width="250" height="96" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="125" y="30" text-anchor="middle">Fetch key batch</text>
<text class="smallLabel" x="125" y="55" text-anchor="middle">KeyScanArgs</text>
<text class="smallLabel" x="125" y="80" text-anchor="middle">up to 100 keys</text>
</g><g transform="translate(730,230)">
  <rect class="card" x="0" y="0" width="250" height="96" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="125" y="30" text-anchor="middle">UNLINK keys</text>
<text class="smallLabel" x="125" y="55" text-anchor="middle">async memory release</text>
<text class="smallLabel" x="125" y="80" text-anchor="middle">safer than DEL</text>
</g><g transform="translate(405,400)">
  <rect class="card" x="0" y="0" width="250" height="82" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="125" y="35.5" text-anchor="middle">cursor.isFinished?</text>
<text class="smallLabel" x="125" y="60.5" text-anchor="middle">repeat until true</text>
</g><path class="line" d="M330 278 L405 278" data-connector="line"/><path class="line" d="M655 278 L730 278" data-connector="line"/><path class="line" d="M855 326 C855 355 530 355 530 400" data-connector="line"/>
<text class="small" x="692.5" y="347" text-anchor="middle">next cursor</text><path class="line" d="M405 441 C405 375.5 205 375.5 205 326" data-connector="line"/>
<text class="small" x="305" y="367.5" text-anchor="middle">not finished</text><text class="small" x="550" y="506" text-anchor="middle">KEYS is avoided because it can block Redis on large datasets.</text></svg>
