<text x="64" y="76" class="title" text-anchor="start">Spring WebFlux + Exposed R2DBC Repository</text>
<text x="64" y="104" class="subtitle" text-anchor="start">REST controllers keep coroutine DB access inside suspendTransaction; repositories map Exposed Flow rows to DTO responses.</text>
