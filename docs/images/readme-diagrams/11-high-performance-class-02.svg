<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="963" viewBox="0 0 1366 963" role="img" aria-label="Cache Layer Structure (Class Diagram)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
  <marker id="inheritArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inheritArrow)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1366" height="963"/>
<rect class="frame" x="32" y="28" width="1302" height="907" rx="28"/>
<text class="title" x="66" y="82">Cache Layer Structure (Class Diagram)</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M683 505 L683 414 L893 414 L893 334" data-connector="line"/>
<path class="line" d="M683 722 L683 446 L1103 446 L1103 505" data-connector="line"/>
<path class="line" d="M683 722 L683 438 L263 438 L263 505" data-connector="line"/>
<path class="implLine" d="M683 505 L683 430 L473 430 L473 355"/>
<path class="implLine" d="M1103 505 L1103 422 L473 422 L473 355"/>
<path class="implLine" d="M263 505 L263 414 L473 414 L473 355"/>
<g transform="translate(298,180)">
  <rect class="card" x="0" y="0" width="350" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="61" text-anchor="middle">CacheStrategy</text>
  <text class="mono" x="18" y="108">+get(key: K) V</text>
<text class="mono" x="18" y="129">+put(key: K, value: V)</text>
<text class="mono" x="18" y="150">+evict(key: K)</text>
</g>
<g transform="translate(718,180)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
  <text class="small" x="175" y="26" text-anchor="middle">«R2DBC Exposed»</text>
  <text class="label" x="175" y="61" text-anchor="middle">DatabaseSource</text>
  <text class="mono" x="18" y="108">+findById(id: K) V</text>
<text class="mono" x="18" y="129">+save(value: V)</text>
</g>
<g transform="translate(88,505)">
  <rect class="card" x="0" y="0" width="350" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle">«Caffeine In-Memory»</text>
  <text class="label" x="175" y="61" text-anchor="middle">L1Cache</text>
  <text class="mono" x="18" y="108">-caffeineCache Cache~K, V~</text>
<text class="mono" x="18" y="129">+get(key: K) V</text>
<text class="mono" x="18" y="150">+put(key: K, value: V)</text>
<text class="mono" x="18" y="171">+evict(key: K)</text>
<text class="mono" x="18" y="192">+maximumSize: Long</text>
<text class="mono" x="18" y="213">+expireAfterWrite: Duration</text>
</g>
<g transform="translate(508,505)">
  <rect class="card" x="0" y="0" width="350" height="217" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#DC6B82"/>
  <text class="small" x="175" y="26" text-anchor="middle"></text>
  <text class="label" x="175" y="61" text-anchor="middle">TwoLevelCacheStrategy</text>
  <text class="mono" x="18" y="108">-l1: L1Cache</text>
<text class="mono" x="18" y="129">-l2: L2Cache</text>
<text class="mono" x="18" y="150">+get(key: K) V</text>
<text class="mono" x="18" y="171">+put(key: K, value: V)</text>
<text class="mono" x="18" y="192">+evict(key: K)</text>
</g>
<g transform="translate(928,505)">
  <rect class="card" x="0" y="0" width="350" height="217" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#45A7A1"/>
  <text class="small" x="175" y="26" text-anchor="middle">«Redis Lettuce Corouti.»</text>
  <text class="label" x="175" y="61" text-anchor="middle">L2Cache</text>
  <text class="mono" x="18" y="108">-redisClient RedisClient</text>
<text class="mono" x="18" y="129">+get(key: K) V</text>
<text class="mono" x="18" y="150">+put(key: K, value: V)</text>
<text class="mono" x="18" y="171">+evict(key: K)</text>
<text class="mono" x="18" y="192">+ttl: Duration</text>
</g>
</svg>
