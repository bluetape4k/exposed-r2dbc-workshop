<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" width="1320" height="860" role="img" aria-label="Chapter 11 cache layer class diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.11"/>
    </filter>
    <style>
      .canvas{fill:#f5f8fb}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fbfd;stroke:#d9e5ee;stroke-width:1.3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1f2a37}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#526477;font-weight:700}
      .small{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#65768a;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ba1b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:18px;fill:#1f2a37}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .inherit{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .use{fill:none;stroke-width:2.4;stroke-dasharray:8 7;stroke-linecap:butt;stroke-linejoin:round}
      .foot{fill:#ecfdf5;stroke:#86efac;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1320" height="860" class="canvas"/>
  <rect x="24" y="24" width="1272" height="812" rx="20" class="frame"/>
  <text x="64" y="73" class="title">Chapter 11 Cache Layer Class Map</text>
  <text x="64" y="103" class="subtitle">Spring WebFlux cache repositories share the R2DBC Redisson base and expose separate read/write/read-only/write-behind contracts.</text>

  <rect x="54" y="130" width="1212" height="170" rx="18" class="lane"/>
  <text x="78" y="160" class="laneTitle">ABSTRACTION AND CONFIG CHOICE</text>
  <rect x="54" y="328" width="1212" height="210" rx="18" class="lane"/>
  <text x="78" y="358" class="laneTitle">CACHE REPOSITORY IMPLEMENTATIONS</text>
  <rect x="54" y="566" width="1212" height="150" rx="18" class="lane"/>
  <text x="78" y="596" class="laneTitle">HTTP CONTROLLERS USE REPOSITORIES</text>
  <rect x="80" y="762" width="1160" height="34" rx="11" class="foot"/>
  <text x="660" y="784" class="note" text-anchor="middle">Hollow triangles show inheritance; dashed dependency arrows have solid direct heads and represent controller injection/use.</text>

  <g data-card="AbstractR2dbcRedissonRepository" data-x="390" data-y="182" data-width="360" data-height="92">
    <rect x="390" y="182" width="360" height="92" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2.2" class="card"/>
    <path class="header" d="M390,226 L390,196 Q390,182 404,182 L736,182 Q750,182 750,196 L750,226 Z" fill="#f8fafc"/>
    <text x="570" y="202" class="small" text-anchor="middle">bluetape4k-exposed base</text>
    <text x="570" y="223" class="cardTitle" text-anchor="middle">AbstractR2dbcRedissonRepository</text>
    <text x="414" y="252" class="detail">suspend get / put / getAll / invalidate / clear</text>
  </g>
  <g data-card="RedissonCacheConfig" data-x="830" data-y="182" data-width="330" data-height="92">
    <rect x="830" y="182" width="330" height="92" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2.2" class="card"/>
    <path class="header" d="M830,226 L830,196 Q830,182 844,182 L1146,182 Q1160,182 1160,196 L1160,226 Z" fill="#f5eee4"/>
    <text x="995" y="202" class="small" text-anchor="middle">cache behavior enum</text>
    <text x="995" y="223" class="cardTitle" text-anchor="middle">RedissonCacheConfig</text>
    <text x="854" y="247" class="detail">read/write-through + read-only</text>
    <text x="854" y="269" class="detail">write-behind variants</text>
  </g>

  <g data-card="UserCacheRepository" data-x="82" data-y="400" data-width="330" data-height="104">
    <rect x="82" y="400" width="330" height="104" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2.2" class="card"/>
    <path class="header" d="M82,444 L82,414 Q82,400 96,400 L398,400 Q412,400 412,414 L412,444 Z" fill="#eef5fa"/>
    <text x="247" y="420" class="small" text-anchor="middle">UserCacheRepository&lt;Long, UserRecord&gt;</text>
    <text x="247" y="441" class="cardTitle" text-anchor="middle">Read/Write + Near Cache</text>
    <text x="106" y="470" class="detail">READ_WRITE_THROUGH_WITH_NEAR_CACHE</text>
    <text x="106" y="492" class="detail">deleteFromDBOnInvalidate = false</text>
  </g>
  <g data-card="UserCredentialsCacheRepository" data-x="495" data-y="400" data-width="330" data-height="104">
    <rect x="495" y="400" width="330" height="104" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2.2" class="card"/>
    <path class="header" d="M495,444 L495,414 Q495,400 509,400 L811,400 Q825,400 825,414 L825,444 Z" fill="#eef7f6"/>
    <text x="660" y="420" class="small" text-anchor="middle">UserCredentialsRepo&lt;String, Credentials&gt;</text>
    <text x="660" y="441" class="cardTitle" text-anchor="middle">Read-Only Cache</text>
    <text x="519" y="470" class="detail">READ_ONLY_WITH_NEAR_CACHE</text>
    <text x="519" y="492" class="detail">insert/update no-op by design</text>
  </g>
  <g data-card="UserEventCacheRepository" data-x="908" data-y="400" data-width="330" data-height="104">
    <rect x="908" y="400" width="330" height="104" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2.2" class="card"/>
    <path class="header" d="M908,444 L908,414 Q908,400 922,400 L1224,400 Q1238,400 1238,414 L1238,444 Z" fill="#f1f6ec"/>
    <text x="1073" y="420" class="small" text-anchor="middle">UserEventCacheRepository&lt;Long, UserEventRecord&gt;</text>
    <text x="1073" y="441" class="cardTitle" text-anchor="middle">Write-Behind Cache</text>
    <text x="932" y="470" class="detail">WRITE_BEHIND_WITH_NEAR_CACHE</text>
    <text x="932" y="492" class="detail">put / putAll queue event writes</text>
  </g>

  <path data-connector="user-repo-inherits" class="inherit connector" d="M247 400 L247 338 Q247 322 263 322 L532 322 Q548 322 548 306 L548 274"/>
  <polygon points="548,274 539,290 557,290" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="credentials-repo-inherits" class="inherit connector" d="M660 400 L660 338 Q660 322 644 322 L586 322 Q570 322 570 306 L570 274"/>
  <polygon points="570,274 561,290 579,290" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="event-repo-inherits" class="inherit connector" d="M1073 400 L1073 338 Q1073 322 1057 322 L608 322 Q592 322 592 306 L592 274"/>
  <polygon points="592,274 583,290 601,290" fill="#ffffff" stroke="#64748b" stroke-width="2.5" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <g data-card="UserController" data-x="116" data-y="622" data-width="260" data-height="62">
    <rect x="116" y="622" width="260" height="62" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2.0" class="card"/>
    <text x="246" y="648" class="cardTitle" text-anchor="middle">UserController</text>
    <text x="246" y="671" class="detail" text-anchor="middle">GET / POST / invalidate</text>
  </g>
  <g data-card="UserCredentialsController" data-x="530" data-y="622" data-width="260" data-height="62">
    <rect x="530" y="622" width="260" height="62" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2.0" class="card"/>
    <text x="660" y="648" class="cardTitle" text-anchor="middle">CredentialsController</text>
    <text x="660" y="671" class="detail" text-anchor="middle">read-only lookups</text>
  </g>
  <g data-card="UserEventController" data-x="944" data-y="622" data-width="260" data-height="62">
    <rect x="944" y="622" width="260" height="62" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2.0" class="card"/>
    <text x="1074" y="648" class="cardTitle" text-anchor="middle">UserEventController</text>
    <text x="1074" y="671" class="detail" text-anchor="middle">single + bulk event writes</text>
  </g>

  <path data-connector="user-controller-uses" class="use connector" d="M246 622 L246 504" stroke="#4f86c6"/>
  <polygon points="246,504 238,518 254,518" fill="#4f86c6" stroke="#4f86c6" stroke-width="2.4" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="credentials-controller-uses" class="use connector" d="M660 622 L660 504" stroke="#4f8f8b"/>
  <polygon points="660,504 652,518 668,518" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="2.4" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path data-connector="event-controller-uses" class="use connector" d="M1074 622 L1074 504" stroke="#6f8f52"/>
  <polygon points="1074,504 1066,518 1082,518" fill="#6f8f52" stroke="#6f8f52" stroke-width="2.4" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</svg>
