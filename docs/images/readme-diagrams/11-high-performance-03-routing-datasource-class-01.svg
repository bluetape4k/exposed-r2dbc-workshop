<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100" role="img" aria-label="Routing datasource class diagram">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#25384d" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .lane{fill:#f9fbfd;stroke:#dbe7f0;stroke-width:1.8}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;fill:#192538;font-weight:400}
      .subtitle,.detail,.foot{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:700;fill:#556678}
      .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#66788c}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:18px;letter-spacing:0.08em;fill:#8ba4b8;font-weight:400}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;fill:#192538;font-weight:400}
      .stereo{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:700;fill:#66788c}
      .card{filter:url(#softShadow);stroke-width:2.4}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .use{stroke-dasharray:8 7;stroke-linecap:butt}
      .head{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}
      .hollow{fill:#fffefa;stroke-width:2.8;stroke-linejoin:round;stroke-dasharray:none}
      .blue{stroke:#4f86c6}
      .green{stroke:#6f8f52}
      .amber{stroke:#a36f3e}
      .teal{stroke:#4f8f8b}
      .rose{stroke:#a85f7f}
      .slate{stroke:#64748b}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1100"/>
  <rect class="frame" x="30" y="30" width="1640" height="1040" rx="24"/>
  <text class="title" x="72" y="94">Routing DataSource Class Structure</text>
  <text class="subtitle" x="76" y="128">WebFlux context hints feed resolver and registry contracts; the primary ConnectionFactory delegates to a tenant/read-write target.</text>

  <rect class="lane" x="60" y="160" width="1580" height="220" rx="18"/>
  <text class="laneTitle" x="92" y="194">SPRING WEBFLUX ENTRYPOINTS AND BEANS</text>
  <rect class="lane" x="60" y="410" width="1580" height="230" rx="18"/>
  <text class="laneTitle" x="92" y="444">CONTRACTS / EXTERNAL TYPES</text>
  <rect class="lane" x="60" y="670" width="1580" height="250" rx="18"/>
  <text class="laneTitle" x="92" y="704">IMPLEMENTATIONS / DOMAIN ACCESS</text>

  <g data-card="TenantRoutingWebFilter" data-x="80" data-y="230" data-width="260" data-height="118">
    <rect class="card" x="80" y="230" width="260" height="118" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <path class="header" d="M80,276 L80,244 Q80,230 94,230 L326,230 Q340,230 340,244 L340,276 Z" fill="#f2f8ed"/>
    <text class="stereo" x="210" y="254" text-anchor="middle">&lt;&lt;WebFilter&gt;&gt;</text>
    <text class="cardTitle" x="210" y="278" text-anchor="middle">TenantRoutingWebFilter</text>
    <text class="detail" x="104" y="310">extracts tenant + readOnly</text>
    <text class="small" x="104" y="332">writes Reactor Context</text>
  </g>

  <g data-card="RoutingMarkerController" data-x="400" data-y="230" data-width="260" data-height="118">
    <rect class="card" x="400" y="230" width="260" height="118" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <path class="header" d="M400,292 L400,244 Q400,230 414,230 L646,230 Q660,230 660,244 L660,292 Z" fill="#eef6fc"/>
    <text class="stereo" x="530" y="254" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
    <text class="cardTitle" x="530" y="278" text-anchor="middle">RoutingMarker</text>
    <text class="cardTitle" x="530" y="300" text-anchor="middle">Controller</text>
    <text class="detail" x="424" y="324">GET / PATCH marker</text>
  </g>

  <g data-card="RoutingTransactionalExecutor" data-x="720" data-y="230" data-width="260" data-height="118">
    <rect class="card" x="720" y="230" width="260" height="118" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <path class="header" d="M720,292 L720,244 Q720,230 734,230 L966,230 Q980,230 980,244 L980,292 Z" fill="#f2f8ed"/>
    <text class="stereo" x="850" y="254" text-anchor="middle">&lt;&lt;Component&gt;&gt;</text>
    <text class="cardTitle" x="850" y="278" text-anchor="middle">RoutingTransactional</text>
    <text class="cardTitle" x="850" y="300" text-anchor="middle">Executor</text>
    <text class="detail" x="744" y="324">readWrite / readOnly</text>
  </g>

  <g data-card="RoutingMarkerRepository" data-x="1040" data-y="230" data-width="260" data-height="118">
    <rect class="card" x="1040" y="230" width="260" height="118" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <path class="header" d="M1040,292 L1040,244 Q1040,230 1054,230 L1286,230 Q1300,230 1300,244 L1300,292 Z" fill="#eef8f7"/>
    <text class="stereo" x="1170" y="254" text-anchor="middle">&lt;&lt;Repository&gt;&gt;</text>
    <text class="cardTitle" x="1170" y="278" text-anchor="middle">RoutingMarker</text>
    <text class="cardTitle" x="1170" y="300" text-anchor="middle">Repository</text>
    <text class="detail" x="1064" y="324">suspendTransaction(db)</text>
  </g>

  <g data-card="RoutingR2dbcConfig" data-x="1360" data-y="230" data-width="260" data-height="118">
    <rect class="card" x="1360" y="230" width="260" height="118" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <path class="header" d="M1360,276 L1360,244 Q1360,230 1374,230 L1606,230 Q1620,230 1620,244 L1620,276 Z" fill="#fff5e8"/>
    <text class="stereo" x="1490" y="254" text-anchor="middle">&lt;&lt;Configuration&gt;&gt;</text>
    <text class="cardTitle" x="1490" y="278" text-anchor="middle">RoutingR2dbcConfig</text>
    <text class="detail" x="1384" y="310">registers tenant factories</text>
    <text class="small" x="1384" y="332">@Primary routing factory</text>
  </g>

  <g data-card="RoutingContextKeys" data-x="80" data-y="470" data-width="260" data-height="118">
    <rect class="card" x="80" y="470" width="260" height="118" rx="14" fill="#ffffff" stroke="#a85f7f"/>
    <path class="header" d="M80,516 L80,484 Q80,470 94,470 L326,470 Q340,470 340,484 L340,516 Z" fill="#f8eef4"/>
    <text class="stereo" x="210" y="494" text-anchor="middle">&lt;&lt;context keys&gt;&gt;</text>
    <text class="cardTitle" x="210" y="518" text-anchor="middle">RoutingContextKeys</text>
    <text class="detail" x="104" y="550">TENANT</text>
    <text class="small" x="104" y="572">READ_ONLY</text>
  </g>

  <g data-card="RoutingKeyResolver" data-x="400" data-y="470" data-width="260" data-height="118">
    <rect class="card" x="400" y="470" width="260" height="118" rx="14" fill="#ffffff" stroke="#64748b"/>
    <path class="header" d="M400,516 L400,484 Q400,470 414,470 L646,470 Q660,470 660,484 L660,516 Z" fill="#f8fafc"/>
    <text class="stereo" x="530" y="494" text-anchor="middle">&lt;&lt;fun interface&gt;&gt;</text>
    <text class="cardTitle" x="530" y="518" text-anchor="middle">RoutingKeyResolver</text>
    <text class="detail" x="424" y="550">currentLookupKey(context)</text>
    <text class="small" x="424" y="572">returns tenant:rw|ro</text>
  </g>

  <g data-card="ConnectionFactoryRegistry" data-x="720" data-y="470" data-width="260" data-height="118">
    <rect class="card" x="720" y="470" width="260" height="118" rx="14" fill="#ffffff" stroke="#64748b"/>
    <path class="header" d="M720,536 L720,484 Q720,470 734,470 L966,470 Q980,470 980,484 L980,536 Z" fill="#f8fafc"/>
    <text class="stereo" x="850" y="494" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="cardTitle" x="850" y="518" text-anchor="middle">ConnectionFactory</text>
    <text class="cardTitle" x="850" y="540" text-anchor="middle">Registry</text>
    <text class="detail" x="744" y="562">register / get / keys</text>
    <text class="small" x="744" y="580">key -> ConnectionFactory</text>
  </g>

  <g data-card="R2dbcDatabase" data-x="1040" data-y="470" data-width="260" data-height="118">
    <rect class="card" x="1040" y="470" width="260" height="118" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <path class="header" d="M1040,516 L1040,484 Q1040,470 1054,470 L1286,470 Q1300,470 1300,484 L1300,516 Z" fill="#eef8f7"/>
    <text class="stereo" x="1170" y="494" text-anchor="middle">&lt;&lt;Exposed R2DBC&gt;&gt;</text>
    <text class="cardTitle" x="1170" y="518" text-anchor="middle">R2dbcDatabase</text>
    <text class="detail" x="1064" y="550">uses routing factory</text>
    <text class="small" x="1064" y="572">dispatcher = Dispatchers.IO</text>
  </g>

  <g data-card="ConnectionFactory" data-x="1360" data-y="470" data-width="260" data-height="118">
    <rect class="card" x="1360" y="470" width="260" height="118" rx="14" fill="#ffffff" stroke="#64748b"/>
    <path class="header" d="M1360,516 L1360,484 Q1360,470 1374,470 L1606,470 Q1620,470 1620,484 L1620,516 Z" fill="#f8fafc"/>
    <text class="stereo" x="1490" y="494" text-anchor="middle">&lt;&lt;R2DBC SPI&gt;&gt;</text>
    <text class="cardTitle" x="1490" y="518" text-anchor="middle">ConnectionFactory</text>
    <text class="detail" x="1384" y="550">create()</text>
    <text class="small" x="1384" y="572">getMetadata()</text>
  </g>

  <g data-card="ContextAwareRoutingKeyResolver" data-x="400" data-y="750" data-width="260" data-height="128">
    <rect class="card" x="400" y="750" width="260" height="128" rx="14" fill="#ffffff" stroke="#a85f7f"/>
    <path class="header" d="M400,812 L400,764 Q400,750 414,750 L646,750 Q660,750 660,764 L660,812 Z" fill="#f8eef4"/>
    <text class="stereo" x="530" y="774" text-anchor="middle">&lt;&lt;resolver impl&gt;&gt;</text>
    <text class="cardTitle" x="530" y="798" text-anchor="middle">ContextAwareRouting</text>
    <text class="cardTitle" x="530" y="820" text-anchor="middle">KeyResolver</text>
    <text class="detail" x="424" y="850">reads TENANT / READ_ONLY</text>
    <text class="small" x="424" y="872">defaultTenant fallback</text>
  </g>

  <g data-card="InMemoryConnectionFactoryRegistry" data-x="720" data-y="750" data-width="260" data-height="128">
    <rect class="card" x="720" y="750" width="260" height="128" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <path class="header" d="M720,812 L720,764 Q720,750 734,750 L966,750 Q980,750 980,764 L980,812 Z" fill="#eef8f7"/>
    <text class="stereo" x="850" y="774" text-anchor="middle">&lt;&lt;registry impl&gt;&gt;</text>
    <text class="cardTitle" x="850" y="798" text-anchor="middle">InMemoryConnection</text>
    <text class="cardTitle" x="850" y="820" text-anchor="middle">FactoryRegistry</text>
    <text class="detail" x="744" y="850">ConcurrentHashMap</text>
    <text class="small" x="744" y="872">thread-safe key store</text>
  </g>

  <g data-card="DynamicRoutingConnectionFactory" data-x="1360" data-y="750" data-width="260" data-height="128">
    <rect class="card" x="1360" y="750" width="260" height="128" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <path class="header" d="M1360,812 L1360,764 Q1360,750 1374,750 L1606,750 Q1620,750 1620,764 L1620,812 Z" fill="#fff5e8"/>
    <text class="stereo" x="1490" y="774" text-anchor="middle">&lt;&lt;primary router&gt;&gt;</text>
    <text class="cardTitle" x="1490" y="798" text-anchor="middle">DynamicRouting</text>
    <text class="cardTitle" x="1490" y="820" text-anchor="middle">ConnectionFactory</text>
    <text class="detail" x="1384" y="850">keyResolver + registry</text>
    <text class="small" x="1384" y="872">registry.get(key).create()</text>
  </g>

  <g id="connectors">
    <path class="connector green use" data-connector="filter-context" d="M210 348 L210 458"/>
    <polygon points="210,470 203,458 217,458" fill="#6f8f52" stroke="#6f8f52" stroke-width="2.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

    <path class="connector blue use" data-connector="controller-tx" d="M660 289 L708 289"/>
    <polygon points="720,289 708,282 708,296" fill="#4f86c6" stroke="#4f86c6" stroke-width="2.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <path class="connector teal use" data-connector="tx-repository" d="M980 289 L1028 289"/>
    <polygon points="1040,289 1028,282 1028,296" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="2.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

    <path class="connector teal use" data-connector="repository-database" d="M1170 348 L1170 458"/>
    <polygon points="1170,470 1163,458 1177,458" fill="#4f8f8b" stroke="#4f8f8b" stroke-width="2.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

    <path class="connector amber use" data-connector="config-dynamic" d="M1620 289 L1640 289 Q1660 289 1660 309 L1660 814 Q1660 834 1640 834 L1632 834"/>
    <polygon points="1620,834 1632,827 1632,841" fill="#a36f3e" stroke="#a36f3e" stroke-width="2.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

    <path class="connector slate" data-connector="resolver-generalization" d="M530 750 L530 588"/>
    <polygon class="hollow slate" points="530,588 520,606 540,606"/>
    <path class="connector slate" data-connector="registry-generalization" d="M850 750 L850 588"/>
    <polygon class="hollow slate" points="850,588 840,606 860,606"/>
    <path class="connector slate" data-connector="factory-generalization" d="M1490 750 L1490 588"/>
    <polygon class="hollow slate" points="1490,588 1480,606 1500,606"/>

    <path class="connector rose use" data-connector="resolver-reads-context" d="M400 814 L330 814 Q310 814 310 794 L310 620 Q310 600 290 600 L222 600"/>
    <polygon points="222,588 215,600 229,600" fill="#a85f7f" stroke="#a85f7f" stroke-width="2.8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  </g>

  <rect x="110" y="1008" width="1480" height="38" rx="12" fill="#fbfdff" stroke="#d7e3ed" stroke-width="2"/>
  <text class="foot" x="850" y="1033" text-anchor="middle">Hollow triangles show interface implementation; dashed arrows show use/create dependencies. Dynamic router fields name resolver and registry dependencies.</text>
</svg>
