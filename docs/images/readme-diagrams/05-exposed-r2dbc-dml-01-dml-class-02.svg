<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1517" viewBox="0 0 1366 1517" role="img" aria-label="DSL API Structure (Class Diagram)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#5D6B7A"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1366" height="1517"/>
<rect class="frame" x="32" y="28" width="1302" height="1461" rx="28"/>
<text class="title" x="66" y="82">DSL API Structure (Class Diagram)</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M263 887 L263 1128 L6 1128 L6 92 L683 92 L683 418"/>
<path class="line" d="M263 544 L263 497 L683 497 L683 418"/>
<path class="line" d="M683 1167 L683 1112 L1340 1112 L1340 832 L1103 832 L1103 761"/>
<path class="line" d="M683 544 L683 418"/>
<path class="line" d="M1103 887 L1103 816 L1320 816 L1320 473 L683 473 L683 418"/>
<path class="line" d="M1103 544 L1103 465 L683 465 L683 418"/>
<path class="line" d="M683 887 L683 800 L66 800 L66 457 L683 457 L683 418"/>
<g transform="translate(508,180)">
  <rect class="card" x="0" y="0" width="350" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">Query</text>
  <text class="mono" x="18" y="108">+where(op: Op)</text>
<text class="mono" x="18" y="129">+andWhere(op: Op)</text>
<text class="mono" x="18" y="150">+orderBy(col, order)</text>
<text class="mono" x="18" y="171">+limit(n)</text>
<text class="mono" x="18" y="192">+offset(n)</text>
<text class="mono" x="18" y="213">+groupBy(cols)</text>
</g>
<g transform="translate(88,544)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">SetOperationDSL</text>
  <text class="mono" x="18" y="108">+union(other)</text>
<text class="mono" x="18" y="129">+unionAll(other)</text>
<text class="mono" x="18" y="150">+intersect(other)</text>
<text class="mono" x="18" y="171">+except(other)</text>
</g>
<g transform="translate(508,544)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">DeleteDSL</text>
  <text class="mono" x="18" y="108">+deleteWhere(op)</text>
<text class="mono" x="18" y="129">+deleteAll()</text>
<text class="mono" x="18" y="150">+deleteIgnoreWhere(op)</text>
<text class="mono" x="18" y="171">+deleteReturning(cols, op)</text>
</g>
<g transform="translate(928,544)">
  <rect class="card" x="0" y="0" width="350" height="217" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#DC6B82"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">InsertDSL</text>
  <text class="mono" x="18" y="108">+insert(body)</text>
<text class="mono" x="18" y="129">+insertIgnore(body)</text>
<text class="mono" x="18" y="150">+insertAndGetId(body)</text>
<text class="mono" x="18" y="171">+batchInsert(data, body)</text>
<text class="mono" x="18" y="192">+insertSelect(query)</text>
</g>
<g transform="translate(88,887)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#45A7A1"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">CTEDSL</text>
  <text class="mono" x="18" y="108">+withCte(name, query)</text>
<text class="mono" x="18" y="129">+withRecursive(name, base, recursive)</text>
</g>
<g transform="translate(508,887)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#8A72D6"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">SelectDSL</text>
  <text class="mono" x="18" y="108">+selectAll()</text>
<text class="mono" x="18" y="129">+select(cols)</text>
</g>
<g transform="translate(928,887)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#B88A44"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">UpdateDSL</text>
  <text class="mono" x="18" y="108">+update(where, body)</text>
<text class="mono" x="18" y="129">+updateReturning(cols, where, body)</text>
</g>
<g transform="translate(508,1167)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#8BA84D"/>
  <text class="small" x="175" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="175" y="61" text-anchor="middle">UpsertDSL</text>
  <text class="mono" x="18" y="108">+upsert(body)</text>
<text class="mono" x="18" y="129">+batchUpsert(data, onUpdate, body)</text>
</g>
</svg>
