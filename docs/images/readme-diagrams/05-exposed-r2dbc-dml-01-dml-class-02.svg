<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="958" viewBox="0 0 1754 958" role="img" aria-label="DSL API Structure (Class Diagram)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="958"/>
<rect class="frame" x="32" y="28" width="1690" height="902" rx="28"/>
<text class="title" x="66" y="82">DSL API Structure (Class Diagram)</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M262 172 C262 300 1492 300 1492 428"/>
<path class="line" d="M672 538 C672 483 1492 483 1492 428"/>
<path class="line" d="M1492 538 C1492 471 1082 471 1082 404"/>
<path class="line" d="M672 172 C672 300 1492 300 1492 428"/>
<path class="line" d="M1082 538 C1082 483 1492 483 1492 428"/>
<path class="line" d="M1082 172 C1082 300 1492 300 1492 428"/>
<path class="line" d="M262 538 C262 483 1492 483 1492 428"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">CTEDSL</text>
  <text class="mono" x="18" y="108">+withCte(name, query)</text>
<text class="mono" x="18" y="132">+withRecursive(name, base, recursive)</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">DeleteDSL</text>
  <text class="mono" x="18" y="108">+deleteWhere(op)</text>
<text class="mono" x="18" y="132">+deleteAll()</text>
<text class="mono" x="18" y="156">+deleteIgnoreWhere(op)</text>
<text class="mono" x="18" y="180">+deleteReturning(cols, op)</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="216" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">InsertDSL</text>
  <text class="mono" x="18" y="108">+insert(body)</text>
<text class="mono" x="18" y="132">+insertIgnore(body)</text>
<text class="mono" x="18" y="156">+insertAndGetId(body)</text>
<text class="mono" x="18" y="180">+batchInsert(data, body)</text>
<text class="mono" x="18" y="204">+insertSelect(query)</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">Query</text>
  <text class="mono" x="18" y="108">+where(op: Op)</text>
<text class="mono" x="18" y="132">+andWhere(op: Op)</text>
<text class="mono" x="18" y="156">+orderBy(col, order)</text>
<text class="mono" x="18" y="180">+limit(n)</text>
<text class="mono" x="18" y="204">+offset(n)</text>
<text class="mono" x="18" y="228">+groupBy(cols)</text>
</g>
<g transform="translate(92,546)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">SelectDSL</text>
  <text class="mono" x="18" y="108">+selectAll()</text>
<text class="mono" x="18" y="132">+select(cols)</text>
</g>
<g transform="translate(502,546)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">SetOperationDSL</text>
  <text class="mono" x="18" y="108">+union(other)</text>
<text class="mono" x="18" y="132">+unionAll(other)</text>
<text class="mono" x="18" y="156">+intersect(other)</text>
<text class="mono" x="18" y="180">+except(other)</text>
</g>
<g transform="translate(912,546)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">UpdateDSL</text>
  <text class="mono" x="18" y="108">+update(where, body)</text>
<text class="mono" x="18" y="132">+updateReturning(cols, where, body)</text>
</g>
<g transform="translate(1322,546)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle">«DSL»</text>
  <text class="label" x="170" y="57" text-anchor="middle">UpsertDSL</text>
  <text class="mono" x="18" y="108">+upsert(body)</text>
<text class="mono" x="18" y="132">+batchUpsert(data, onUpdate, body)</text>
</g>
<rect x="819" y="468" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="877" y="486" text-anchor="middle">produces</text>
<rect x="1229" y="285" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="1287" y="303" text-anchor="middle">insertSelect</text>
<rect x="1229" y="468" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="1287" y="486" text-anchor="middle">updateReturning</text>
<rect x="1024" y="285" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="1082" y="303" text-anchor="middle">deleteReturning</text>
<rect x="1024" y="468" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="1082" y="486" text-anchor="middle">wraps</text>
<rect x="819" y="285" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="877" y="303" text-anchor="middle">produces</text>
</svg>
