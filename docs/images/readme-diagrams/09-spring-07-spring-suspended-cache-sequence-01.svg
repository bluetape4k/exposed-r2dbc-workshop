<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1014" viewBox="0 0 1470 1014" role="img" aria-label="Execution Flow">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
<marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
<style>.canvas{fill:#F7F9FC}.frame{fill:#fff;stroke:#D8E0EA;stroke-width:1.5}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#102033}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}.smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}.strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}.card{stroke-width:2;filter:url(#shadow)}.line{stroke:#5D6B7A;stroke-width:2.2;fill:none;marker-end:url(#openArrow)}.dashed{stroke:#5D6B7A;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}.lifeline{stroke:#B7C2D1;stroke-width:1.8;stroke-dasharray:8 9}.note{fill:#fff;opacity:.97}</style>
</defs>
<rect class="canvas" width="1470" height="1014"/>
<rect class="frame" x="24" y="24" width="1422" height="958" rx="22"/>
<text class="title" x="58" y="76">Execution Flow</text>
<text class="subtitle" x="62" y="106">Compact sequence flow with reduced outer and inner whitespace</text>
<rect class="card" x="50.0" y="156" width="220" height="66" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel participant" x="160.0" y="196" text-anchor="middle">Controller/Service</text>
<line class="lifeline" x1="160.0" y1="250" x2="160.0" y2="952"/>
<rect class="card" x="280.0" y="156" width="220" height="66" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel participant" x="390.0" y="196" text-anchor="middle">Lettuce Suspended</text>
<line class="lifeline" x1="390.0" y1="250" x2="390.0" y2="952"/>
<rect class="card" x="510.0" y="156" width="220" height="66" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel participant" x="620.0" y="196" text-anchor="middle">Cache (Redis)</text>
<line class="lifeline" x1="620.0" y1="250" x2="620.0" y2="952"/>
<rect class="card" x="740.0" y="156" width="220" height="66" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel participant" x="850.0" y="196" text-anchor="middle">Default Country</text>
<line class="lifeline" x1="850.0" y1="250" x2="850.0" y2="952"/>
<rect class="card" x="970.0" y="156" width="220" height="66" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel participant" x="1080.0" y="196" text-anchor="middle">R2dbc Repository</text>
<line class="lifeline" x1="1080.0" y1="250" x2="1080.0" y2="952"/>
<rect class="card" x="1200.0" y="156" width="220" height="66" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel participant" x="1310.0" y="196" text-anchor="middle">R2DBC Database</text>
<line class="lifeline" x1="1310.0" y1="250" x2="1310.0" y2="952"/>
<path class="line" d="M160.0 292.0 L390.0 292.0" data-connector="line"/>
<rect class="note label" x="195.0" y="260.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="275.0" y="280.0" text-anchor="middle">1. cache.get(code)</text>
<path class="dashed" d="M390.0 366.0 L160.0 366.0" data-connector="dashed"/>
<rect class="note label" x="190.7" y="334.0" width="168.6" height="28" rx="9"/>
<text class="strong labelText" x="275.0" y="354.0" text-anchor="middle">3. return cached result</text>
<path class="dashed" d="M390.0 440.0 L160.0 440.0" data-connector="dashed"/>
<rect class="note label" x="195.0" y="408.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="275.0" y="428.0" text-anchor="middle">5. null</text>
<path class="line" d="M160.0 514.0 L850.0 514.0" data-connector="line"/>
<rect class="note label" x="374.2" y="482.0" width="261.6" height="28" rx="9"/>
<text class="strong labelText" x="505.0" y="502.0" text-anchor="middle">6. delegate.findByCode(code) (suspend)</text>
<path class="line" d="M850.0 588.0 L1310.0 588.0" data-connector="line"/>
<rect class="note label" x="967.8" y="556.0" width="224.4" height="28" rx="9"/>
<text class="strong labelText" x="1080.0" y="576.0" text-anchor="middle">7. suspendTransaction { SELECT }</text>
<path class="dashed" d="M1310.0 662.0 L850.0 662.0" data-connector="dashed"/>
<rect class="note label" x="1000.0" y="630.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="1080.0" y="650.0" text-anchor="middle">8. ResultRow</text>
<path class="dashed" d="M850.0 736.0 L160.0 736.0" data-connector="dashed"/>
<rect class="note label" x="425.0" y="704.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="505.0" y="724.0" text-anchor="middle">9. CountryRecord</text>
<path class="line" d="M160.0 810.0 L390.0 810.0" data-connector="line"/>
<rect class="note label" x="147.3" y="778.0" width="255.4" height="28" rx="9"/>
<text class="strong labelText" x="275.0" y="798.0" text-anchor="middle">10. cache.put(code, result) (TTL 60s)</text>
<path class="dashed" d="M390.0 884.0 L160.0 884.0" data-connector="dashed"/>
<rect class="note label" x="159.7" y="852.0" width="230.6" height="28" rx="9"/>
<text class="strong labelText" x="275.0" y="872.0" text-anchor="middle">11. return freshly fetched result</text>
<rect class="activation" x="154.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="384.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="614.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>

<!-- audit badge labels: visible sequence numbering and message pill samples -->
<g aria-label="sequence message labels">
<rect x="58" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="76" y="140" class="num" text-anchor="middle">1</text>
<rect x="102" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="120" y="140" class="num" text-anchor="middle">2</text>
</g>
</svg>
