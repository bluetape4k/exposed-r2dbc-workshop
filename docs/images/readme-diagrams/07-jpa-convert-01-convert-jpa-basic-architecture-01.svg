<svg xmlns="http://www.w3.org/2000/svg" width="890" height="878" viewBox="0 0 890 878" role="img" aria-label="JPA → Exposed R2DBC Migration Path">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>


  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none}
  </style>
</defs>
<rect class="canvas" width="890" height="878"/>
<rect class="frame" x="32" y="28" width="826" height="822" rx="28"/>
<text class="title" x="66" y="82">JPA → Exposed R2DBC Migratio.</text>
<text class="subtitle" x="70" y="118">Grouped architecture from the original Mermaid source</text>
<g transform="translate(60,160)">
  <rect x="0" y="0" width="350" height="648" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">JPA (Before)</text>
</g>
<g transform="translate(105,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">@Entity</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">@Table</text>
</g>
<g transform="translate(105,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">JpaRepository~T,ID~</text>
</g>
<g transform="translate(105,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">JPQL / @Query</text>
</g>
<g transform="translate(105,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">@Transactional</text>
</g>
<g transform="translate(480,160)">
  <rect x="0" y="0" width="350" height="648" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">Exposed R2DBC (After)</text>
</g>
<g transform="translate(525,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">object MyTable :</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">IntIdTable(...)</text>
</g>
<g transform="translate(525,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">Table.selectAll()</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">.where { ... }</text>
</g>
<g transform="translate(525,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">Table.insert { }</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">Table.update { }</text>
</g>
<g transform="translate(525,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">suspendTransaction {</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">}</text>
</g>
</svg>
