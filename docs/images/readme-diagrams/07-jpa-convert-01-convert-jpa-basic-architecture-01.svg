<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-label="JPA to Exposed R2DBC migration architecture map">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap');
      @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
      .canvas{fill:#F6F8FB;}
      .frame{fill:#FFFDF9;stroke:#d7e2ec;stroke-width:2;}
      .title{font-family:'Architects Daughter','Comic Mono',monospace;font-size:42px;fill:#1f2937;}
      .subtitle,.note{font-family:'Comic Mono','Architects Daughter',monospace;font-size:16px;fill:#526173;font-weight:700;}
      .lane{fill:#F7FAFD;stroke:#d7e2ec;stroke-width:1.6;}
      .laneTitle{font-family:'Architects Daughter','Comic Mono',monospace;font-size:20px;letter-spacing:3px;fill:#9aaec0;}
      .laneLabelBg{fill:#F7FAFD;}
      .card{fill:#FFFFFF;stroke-width:2.2;}
      .blue{stroke:#4f86c6;fill:#EEF6FF;}
      .green{stroke:#6f8f52;fill:#F1F8EC;}
      .amber{stroke:#a66a3f;fill:#FFF6EA;}
      .teal{stroke:#4f9d96;fill:#ECFAF8;}
      .rose{stroke:#b05d83;fill:#FDF0F6;}
      .slate{stroke:#64748b;fill:#F8FAFC;}
      .band{fill:#ffffff;opacity:.72;}
      .kind{font-family:'Comic Mono','Architects Daughter',monospace;font-size:13px;font-weight:800;fill:#64748b;}
      .name{font-family:'Architects Daughter','Comic Mono',monospace;font-size:23px;fill:#263241;}
      .member{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;font-weight:800;fill:#526173;}
      .edge{fill:none;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;}
      .label{fill:#FFFFFF;stroke:#d7e2ec;stroke-width:1.3;}
      .labelText{font-family:'Comic Mono','Architects Daughter',monospace;font-size:12px;font-weight:800;fill:#526173;}
      .noteBox{fill:#ECFFF4;stroke:#65df93;stroke-width:1.6;}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a66a3f" stroke="#a66a3f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f9d96" stroke="#4f9d96" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b05d83" stroke="#b05d83" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect class="canvas" width="1600" height="1040"/>
  <rect class="frame" x="28" y="28" width="1544" height="984" rx="24"/>
  <text class="title" x="66" y="86">JPA to Exposed R2DBC Migration Map</text>
  <text class="subtitle" x="68" y="124">Repository-backed map from JPA annotations and EntityManager habits to Exposed R2DBC tables, DAO delegates, custom columns, and coroutine tests.</text>

  <rect class="lane" x="58" y="166" width="1484" height="202" rx="18"/>
  <text class="laneTitle" x="86" y="210">JPA PATTERNS BEING REPLACED</text>
  <rect class="lane" x="58" y="402" width="1484" height="218" rx="18"/>
  <text class="laneTitle" x="86" y="446">EXPOSED R2DBC TARGET PATTERNS</text>
  <rect class="lane" x="58" y="654" width="1484" height="222" rx="18"/>
  <text class="laneTitle" x="86" y="698">SOURCE EXAMPLES THAT PROVE THE MAPPING</text>
  <rect class="lane" x="58" y="908" width="1484" height="80" rx="18"/>
  <text class="laneTitle" x="86" y="942">READER CONTRACT</text>

  <g data-card="jpa-entity" data-x="94" data-y="238" data-width="250" data-height="98">
    <rect class="card blue" x="94" y="238" width="250" height="98" rx="12"/>
    <rect class="band" x="96" y="286" width="246" height="1"/>
    <text class="kind" x="219" y="263" text-anchor="middle">&lt;&lt;JPA entity&gt;&gt;</text>
    <text class="name" x="219" y="291" text-anchor="middle">@Entity + @Id</text>
    <text class="member" x="122" y="318">class identity + lifecycle</text>
  </g>
  <g data-card="jpa-column" data-x="386" data-y="238" data-width="250" data-height="98">
    <rect class="card green" x="386" y="238" width="250" height="98" rx="12"/>
    <rect class="band" x="388" y="286" width="246" height="1"/>
    <text class="kind" x="511" y="263" text-anchor="middle">&lt;&lt;JPA column&gt;&gt;</text>
    <text class="name" x="511" y="291" text-anchor="middle">@Column / @Enum</text>
    <text class="member" x="414" y="318">nullable, unique, status</text>
  </g>
  <g data-card="jpa-relations" data-x="678" data-y="238" data-width="250" data-height="98">
    <rect class="card amber" x="678" y="238" width="250" height="98" rx="12"/>
    <rect class="band" x="680" y="286" width="246" height="1"/>
    <text class="kind" x="803" y="263" text-anchor="middle">&lt;&lt;JPA relationships&gt;&gt;</text>
    <text class="name" x="803" y="291" text-anchor="middle">1:1 / 1:N / N:M</text>
    <text class="member" x="706" y="318">mappedBy + join table</text>
  </g>
  <g data-card="jpa-convert" data-x="970" data-y="238" data-width="250" data-height="98">
    <rect class="card teal" x="970" y="238" width="250" height="98" rx="12"/>
    <rect class="band" x="972" y="286" width="246" height="1"/>
    <text class="kind" x="1095" y="263" text-anchor="middle">&lt;&lt;JPA converter&gt;&gt;</text>
    <text class="name" x="1095" y="291" text-anchor="middle">@Convert</text>
    <text class="member" x="998" y="318">AttributeConverter</text>
  </g>
  <g data-card="jpa-access" data-x="1262" data-y="238" data-width="250" data-height="98">
    <rect class="card rose" x="1262" y="238" width="250" height="98" rx="12"/>
    <rect class="band" x="1264" y="286" width="246" height="1"/>
    <text class="kind" x="1387" y="263" text-anchor="middle">&lt;&lt;JPA access&gt;&gt;</text>
    <text class="name" x="1387" y="291" text-anchor="middle">EntityManager</text>
    <text class="member" x="1290" y="318">persist, find, criteria</text>
  </g>

  <g data-card="exposed-table-dao" data-x="94" data-y="470" data-width="250" data-height="112">
    <rect class="card blue" x="94" y="470" width="250" height="112" rx="12"/>
    <rect class="band" x="96" y="522" width="246" height="1"/>
    <text class="kind" x="219" y="496" text-anchor="middle">&lt;&lt;table + DAO&gt;&gt;</text>
    <text class="name" x="219" y="525" text-anchor="middle">LongIdTable</text>
    <text class="member" x="122" y="554">LongEntity + EntityClass</text>
  </g>
  <g data-card="exposed-columns" data-x="386" data-y="470" data-width="250" data-height="112">
    <rect class="card green" x="386" y="470" width="250" height="112" rx="12"/>
    <rect class="band" x="388" y="522" width="246" height="1"/>
    <text class="kind" x="511" y="496" text-anchor="middle">&lt;&lt;column DSL&gt;&gt;</text>
    <text class="name" x="511" y="525" text-anchor="middle">varchar / text</text>
    <text class="member" x="414" y="554">nullable, uniqueIndex, enum</text>
  </g>
  <g data-card="exposed-relations" data-x="678" data-y="470" data-width="250" data-height="112">
    <rect class="card amber" x="678" y="470" width="250" height="112" rx="12"/>
    <rect class="band" x="680" y="522" width="246" height="1"/>
    <text class="kind" x="803" y="496" text-anchor="middle">&lt;&lt;DAO delegates&gt;&gt;</text>
    <text class="name" x="803" y="525" text-anchor="middle">reference()</text>
    <text class="member" x="706" y="554">backReferencedOn, via</text>
  </g>
  <g data-card="exposed-transform" data-x="970" data-y="470" data-width="250" data-height="112">
    <rect class="card teal" x="970" y="470" width="250" height="112" rx="12"/>
    <rect class="band" x="972" y="522" width="246" height="1"/>
    <text class="kind" x="1095" y="496" text-anchor="middle">&lt;&lt;custom type&gt;&gt;</text>
    <text class="name" x="1095" y="525" text-anchor="middle">ColumnWithTransform</text>
    <text class="member" x="998" y="554">Email / Ssn value classes</text>
  </g>
  <g data-card="exposed-runtime" data-x="1262" data-y="470" data-width="250" data-height="112">
    <rect class="card rose" x="1262" y="470" width="250" height="112" rx="12"/>
    <rect class="band" x="1264" y="522" width="246" height="1"/>
    <text class="kind" x="1387" y="496" text-anchor="middle">&lt;&lt;coroutine runtime&gt;&gt;</text>
    <text class="name" x="1387" y="525" text-anchor="middle">withTables()</text>
    <text class="member" x="1290" y="554">Flow, ResultRow, DTO</text>
  </g>

  <path class="edge" d="M 219 336 V 456" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 511 336 V 456" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 803 336 V 456" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="edge" d="M 1095 336 V 456" stroke="#4f9d96" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1387 336 V 456" stroke="#b05d83" marker-end="url(#arrow-rose)"/>

  <g data-card="simple-source" data-x="94" data-y="722" data-width="250" data-height="108">
    <rect class="card blue" x="94" y="722" width="250" height="108" rx="12"/>
    <rect class="band" x="96" y="774" width="246" height="1"/>
    <text class="kind" x="219" y="748" text-anchor="middle">&lt;&lt;ex01_simple&gt;&gt;</text>
    <text class="name" x="219" y="777" text-anchor="middle">SimpleSchema</text>
    <text class="member" x="122" y="806">SimpleTable + SimpleEntity</text>
  </g>
  <g data-card="task-source" data-x="386" data-y="722" data-width="250" data-height="108">
    <rect class="card green" x="386" y="722" width="250" height="108" rx="12"/>
    <rect class="band" x="388" y="774" width="246" height="1"/>
    <text class="kind" x="511" y="748" text-anchor="middle">&lt;&lt;ex02 task&gt;&gt;</text>
    <text class="name" x="511" y="777" text-anchor="middle">TaskTable.status</text>
    <text class="member" x="414" y="806">enumerationByName()</text>
  </g>
  <g data-card="blog-source" data-x="678" data-y="722" data-width="250" data-height="108">
    <rect class="card amber" x="678" y="722" width="250" height="108" rx="12"/>
    <rect class="band" x="680" y="774" width="246" height="1"/>
    <text class="kind" x="803" y="748" text-anchor="middle">&lt;&lt;ex02 blog&gt;&gt;</text>
    <text class="name" x="803" y="777" text-anchor="middle">BlogSchema</text>
    <text class="member" x="706" y="806">PostDetail, comments, tags</text>
  </g>
  <g data-card="custom-source" data-x="970" data-y="722" data-width="250" data-height="108">
    <rect class="card teal" x="970" y="722" width="250" height="108" rx="12"/>
    <rect class="band" x="972" y="774" width="246" height="1"/>
    <text class="kind" x="1095" y="748" text-anchor="middle">&lt;&lt;ex03 customId&gt;&gt;</text>
    <text class="name" x="1095" y="777" text-anchor="middle">CustomIdTable</text>
    <text class="member" x="998" y="806">email_id PK + ssn unique</text>
  </g>
  <g data-card="test-source" data-x="1262" data-y="722" data-width="250" data-height="108">
    <rect class="card rose" x="1262" y="722" width="250" height="108" rx="12"/>
    <rect class="band" x="1264" y="774" width="246" height="1"/>
    <text class="kind" x="1387" y="748" text-anchor="middle">&lt;&lt;test coverage&gt;&gt;</text>
    <text class="name" x="1387" y="777" text-anchor="middle">Multi-DB tests</text>
    <text class="member" x="1290" y="806">H2, MySQL, PostgreSQL</text>
  </g>

  <path class="edge" d="M 219 582 V 708" stroke="#4f86c6" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 511 582 V 708" stroke="#6f8f52" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M 803 582 V 708" stroke="#a66a3f" marker-end="url(#arrow-amber)"/>
  <path class="edge" d="M 1095 582 V 708" stroke="#4f9d96" marker-end="url(#arrow-teal)"/>
  <path class="edge" d="M 1387 582 V 708" stroke="#b05d83" marker-end="url(#arrow-rose)"/>

  <rect class="label" x="666" y="622" width="274" height="28" rx="14"/>
  <text class="labelText" x="803" y="640" text-anchor="middle">relationship examples also feed the ERD</text>

  <rect class="laneLabelBg" x="78" y="190" width="470" height="28" rx="8"/>
  <text class="laneTitle" x="86" y="210">JPA PATTERNS BEING REPLACED</text>
  <rect class="laneLabelBg" x="78" y="426" width="570" height="28" rx="8"/>
  <text class="laneTitle" x="86" y="446">EXPOSED R2DBC TARGET PATTERNS</text>
  <rect class="laneLabelBg" x="78" y="678" width="680" height="28" rx="8"/>
  <text class="laneTitle" x="86" y="698">SOURCE EXAMPLES THAT PROVE THE MAPPING</text>
  <rect class="laneLabelBg" x="78" y="922" width="270" height="28" rx="8"/>
  <text class="laneTitle" x="86" y="942">READER CONTRACT</text>

  <rect class="noteBox" x="94" y="956" width="1418" height="32" rx="12"/>
  <text class="note" x="803" y="977" text-anchor="middle">The module is test-only: each mapping is exercised through withTables()/withDb(), R2DBC DSL calls, Flow collection, and source-defined schemas.</text>
</svg>
