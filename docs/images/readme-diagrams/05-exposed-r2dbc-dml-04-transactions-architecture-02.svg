<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-label="Exposed R2DBC nested transaction and savepoint architecture">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffdf9;stroke:#d7e2ec;stroke-width:1.6}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.3}
      .card{filter:url(#shadow)}
      .header{opacity:.96}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:34px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:13px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:11px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:15px;letter-spacing:.08em;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:19px;fill:#1e293b}
      .connector{fill:none;stroke:#64748b;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#solidArrow)}
      .noteBox{fill:#ecfdf5;stroke:#86efac;stroke-width:1.3}
    </style>
    <marker id="solidArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto" data-role="primary" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect width="1440" height="960" class="canvas"/>
  <rect x="22" y="22" width="1396" height="916" rx="18" class="frame"/>

  <text x="58" y="70" class="title" text-anchor="start">Nested Transaction and Savepoint Architecture</text>
  <text x="58" y="100" class="subtitle" text-anchor="start">The transaction examples compare Exposed nested transactions with explicit R2DBC savepoint helpers.</text>

  <rect x="50" y="130" width="1340" height="236" rx="16" class="lane"/>
  <text x="76" y="160" class="laneTitle" text-anchor="start">SOURCE TEST ENTRYPOINTS</text>

  <rect x="50" y="396" width="1340" height="236" rx="16" class="lane"/>
  <text x="76" y="426" class="laneTitle" text-anchor="start">NESTED CONTROL PRIMITIVES</text>

  <rect x="50" y="662" width="1340" height="168" rx="16" class="lane"/>
  <text x="76" y="692" class="laneTitle" text-anchor="start">RESULT CONTRACTS</text>

  <g data-card="Exposed Nested Test" data-x="92" data-y="204" data-width="292" data-height="112">
    <rect x="92" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M92,246 L92,218 Q92,204 106,204 L370,204 Q384,204 384,218 L384,246 Z" fill="#eef5fa"/>
    <text x="238" y="222" class="tiny" text-anchor="middle">&lt;&lt;Ex05_NestedTransactions&gt;&gt;</text>
    <text x="238" y="241" class="cardTitle" text-anchor="middle">Exposed Nested Test</text>
    <text x="112" y="272" class="detail" text-anchor="start">withTables(Cities)</text>
    <text x="112" y="290" class="detail" text-anchor="start">useNestedTransactions</text>
    <text x="112" y="308" class="detail" text-anchor="start">outer + inner blocks</text>
  </g>

  <g data-card="Coroutine Savepoint Test" data-x="416" data-y="204" data-width="292" data-height="112">
    <rect x="416" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M416,246 L416,218 Q416,204 430,204 L694,204 Q708,204 708,218 L708,246 Z" fill="#f1f6ec"/>
    <text x="562" y="222" class="tiny" text-anchor="middle">&lt;&lt;Coroutines variant&gt;&gt;</text>
    <text x="562" y="241" class="cardTitle" text-anchor="middle">Savepoint Test</text>
    <text x="436" y="272" class="detail" text-anchor="start">runWithSavepoint*</text>
    <text x="436" y="290" class="detail" text-anchor="start">withContext(IO)</text>
    <text x="436" y="308" class="detail" text-anchor="start">nested coroutine work</text>
  </g>

  <g data-card="Transaction Options" data-x="740" data-y="204" data-width="292" data-height="112">
    <rect x="740" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M740,246 L740,218 Q740,204 754,204 L1018,204 Q1032,204 1032,218 L1032,246 Z" fill="#f5eee4"/>
    <text x="886" y="222" class="tiny" text-anchor="middle">&lt;&lt;R2dbcDatabaseConfig&gt;&gt;</text>
    <text x="886" y="241" class="cardTitle" text-anchor="middle">Transaction Options</text>
    <text x="760" y="272" class="detail" text-anchor="start">useNestedTransactions</text>
    <text x="760" y="290" class="detail" text-anchor="start">transactionIsolation</text>
    <text x="760" y="308" class="detail" text-anchor="start">readOnly / db fallback</text>
  </g>

  <g data-card="Cities Fixture" data-x="1064" data-y="204" data-width="292" data-height="112">
    <rect x="1064" y="204" width="292" height="112" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1064,246 L1064,218 Q1064,204 1078,204 L1342,204 Q1356,204 1356,218 L1356,246 Z" fill="#f5eef2"/>
    <text x="1210" y="222" class="tiny" text-anchor="middle">&lt;&lt;DMLTestData.Cities&gt;&gt;</text>
    <text x="1210" y="241" class="cardTitle" text-anchor="middle">Cities Fixture</text>
    <text x="1084" y="272" class="detail" text-anchor="start">city1 outside inner</text>
    <text x="1084" y="290" class="detail" text-anchor="start">city2 inside inner</text>
    <text x="1084" y="308" class="detail" text-anchor="start">count assertion</text>
  </g>

  <g data-card="Outer Transaction" data-x="92" data-y="470" data-width="292" data-height="112">
    <rect x="92" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="2" class="card"/>
    <path class="header" d="M92,512 L92,484 Q92,470 106,470 L370,470 Q384,470 384,484 L384,512 Z" fill="#eef5fa"/>
    <text x="238" y="488" class="tiny" text-anchor="middle">&lt;&lt;outer scope&gt;&gt;</text>
    <text x="238" y="507" class="cardTitle" text-anchor="middle">Outer Transaction</text>
    <text x="112" y="538" class="detail" text-anchor="start">insert city1</text>
    <text x="112" y="556" class="detail" text-anchor="start">survives inner rollback</text>
    <text x="112" y="574" class="detail" text-anchor="start">continues assertions</text>
  </g>

  <g data-card="Savepoint Helper" data-x="416" data-y="470" data-width="292" data-height="112">
    <rect x="416" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M416,512 L416,484 Q416,470 430,470 L694,470 Q708,470 708,484 L708,512 Z" fill="#f1f6ec"/>
    <text x="562" y="488" class="tiny" text-anchor="middle">&lt;&lt;runWithSavepoint&gt;&gt;</text>
    <text x="562" y="507" class="cardTitle" text-anchor="middle">Savepoint Helper</text>
    <text x="436" y="538" class="detail" text-anchor="start">connection.setSavepoint</text>
    <text x="436" y="556" class="detail" text-anchor="start">rollback(savepoint)</text>
    <text x="436" y="574" class="detail" text-anchor="start">releaseSavepoint</text>
  </g>

  <g data-card="Nested Transaction Selector" data-x="740" data-y="470" data-width="292" data-height="112">
    <rect x="740" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M740,512 L740,484 Q740,470 754,470 L1018,470 Q1032,470 1032,484 L1032,512 Z" fill="#f5eee4"/>
    <text x="886" y="488" class="tiny" text-anchor="middle">&lt;&lt;runWithSavepointOrNew&gt;&gt;</text>
    <text x="886" y="507" class="cardTitle" text-anchor="middle">Nested Selector</text>
    <text x="760" y="538" class="detail" text-anchor="start">existing tx: savepoint</text>
    <text x="760" y="556" class="detail" text-anchor="start">no tx: suspendTransaction</text>
    <text x="760" y="574" class="detail" text-anchor="start">optional rollback flag</text>
  </g>

  <g data-card="R2DBC Connection" data-x="1064" data-y="470" data-width="292" data-height="112">
    <rect x="1064" y="470" width="292" height="112" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1064,512 L1064,484 Q1064,470 1078,470 L1342,470 Q1356,470 1356,484 L1356,512 Z" fill="#f5eef2"/>
    <text x="1210" y="488" class="tiny" text-anchor="middle">&lt;&lt;tx.connection()&gt;&gt;</text>
    <text x="1210" y="507" class="cardTitle" text-anchor="middle">R2DBC Connection</text>
    <text x="1084" y="538" class="detail" text-anchor="start">SAVEPOINT API</text>
    <text x="1084" y="556" class="detail" text-anchor="start">rollback to marker</text>
    <text x="1084" y="574" class="detail" text-anchor="start">release after success</text>
  </g>

  <g data-card="Inner Rollback Scope" data-x="126" data-y="724" data-width="250" data-height="82">
    <rect x="126" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#4f8f8b" stroke-width="2" class="card"/>
    <path class="header" d="M126,756 L126,738 Q126,724 140,724 L362,724 Q376,724 376,738 L376,756 Z" fill="#eef7f6"/>
    <text x="251" y="746" class="cardTitle" text-anchor="middle">Inner Rollback</text>
    <text x="146" y="776" class="detail" text-anchor="start">city2 is discarded</text>
    <text x="146" y="794" class="detail" text-anchor="start">outer scope remains</text>
  </g>

  <g data-card="Savepoint Outcome" data-x="442" data-y="724" data-width="250" data-height="82">
    <rect x="442" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#6f8f52" stroke-width="2" class="card"/>
    <path class="header" d="M442,756 L442,738 Q442,724 456,724 L678,724 Q692,724 692,738 L692,756 Z" fill="#f1f6ec"/>
    <text x="567" y="746" class="cardTitle" text-anchor="middle">Savepoint Outcome</text>
    <text x="462" y="776" class="detail" text-anchor="start">rollback returns null</text>
    <text x="462" y="794" class="detail" text-anchor="start">success releases marker</text>
  </g>

  <g data-card="New Transaction Fallback" data-x="758" data-y="724" data-width="250" data-height="82">
    <rect x="758" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#a66a3f" stroke-width="2" class="card"/>
    <path class="header" d="M758,756 L758,738 Q758,724 772,724 L994,724 Q1008,724 1008,738 L1008,756 Z" fill="#f5eee4"/>
    <text x="883" y="746" class="cardTitle" text-anchor="middle">Fallback Transaction</text>
    <text x="778" y="776" class="detail" text-anchor="start">uses isolation/readOnly</text>
    <text x="778" y="794" class="detail" text-anchor="start">rolls back on flag</text>
  </g>

  <g data-card="Final City Count" data-x="1074" data-y="724" data-width="250" data-height="82">
    <rect x="1074" y="724" width="250" height="82" rx="14" fill="#ffffff" stroke="#a85f7f" stroke-width="2" class="card"/>
    <path class="header" d="M1074,756 L1074,738 Q1074,724 1088,724 L1310,724 Q1324,724 1324,738 L1324,756 Z" fill="#f5eef2"/>
    <text x="1199" y="746" class="cardTitle" text-anchor="middle">Final City Count</text>
    <text x="1094" y="776" class="detail" text-anchor="start">cityCounts() == 1</text>
    <text x="1094" y="794" class="detail" text-anchor="start">outer insert persists</text>
  </g>

  <path class="connector" data-connector="exposed-outer" d="M 238 316 L 238 470"/>
  <path class="connector" data-connector="coroutine-savepoint" d="M 562 316 L 562 470"/>
  <path class="connector" data-connector="options-selector" d="M 886 316 L 886 470"/>
  <path class="connector" data-connector="fixture-connection" d="M 1210 316 L 1210 470"/>

  <path class="connector" data-connector="outer-rollback" d="M 238 582 L 238 724"/>
  <path class="connector" data-connector="savepoint-outcome" d="M 562 582 L 562 724"/>
  <path class="connector" data-connector="selector-fallback" d="M 886 582 L 886 724"/>
  <path class="connector" data-connector="connection-final-count" d="M 1210 582 L 1210 724"/>

  <rect x="96" y="874" width="1248" height="30" rx="10" class="noteBox"/>
  <text x="720" y="894" class="note" text-anchor="middle">Nested rollback is local to the inner transaction or savepoint; the reader-visible contract is that the outer city insert survives.</text>
</svg>
