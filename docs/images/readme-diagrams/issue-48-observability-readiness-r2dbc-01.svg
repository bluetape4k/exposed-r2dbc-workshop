<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-label="Chapter 12 observability and readiness">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#25384d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowAmber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a36f3e" stroke="#a36f3e" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fffefa;stroke:#d7e3ed;stroke-width:2}
      .lane{stroke-width:1.8}
      .laneSpring{fill:#f5f9ff;stroke:#bdd7ee}
      .laneKtor{fill:#f7fbf2;stroke:#c9dfbb}
      .laneData{fill:#fbf7f0;stroke:#dfc39d}
      .card{filter:url(#softShadow);stroke-width:2.6}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:52px;fill:#192538;font-weight:400}
      .subtitle,.laneTitle,.body,.foot{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-weight:700;fill:#556678}
      .subtitle{font-size:20px}
      .laneTitle{font-size:16px;letter-spacing:.07em;fill:#8aa0b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:26px;fill:#192538;font-weight:400}
      .body{font-size:16px}
      .small{font-size:14px}
      .foot{font-size:15px}
      .connector{fill:none;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
      .blue{stroke:#4f86c6;marker-end:url(#arrowBlue)}
      .green{stroke:#6f8f52;marker-end:url(#arrowGreen)}
      .amber{stroke:#a36f3e;marker-end:url(#arrowAmber)}
      .h2Icon path{fill:#09476B}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1160"/>
  <rect class="frame" x="32" y="32" width="1736" height="1096" rx="26"/>

  <text class="title" x="86" y="112">Observability And Readiness</text>
  <text class="subtitle" x="90" y="154">Safe X-Request-ID values are echoed into responses and stored with bounded diagnostic operation rows.</text>

  <rect class="lane laneSpring" x="70" y="205" width="795" height="575" rx="18"/>
  <text class="laneTitle" x="96" y="239">SPRING WEBFLUX DIAGNOSTICS PATH</text>

  <rect class="lane laneKtor" x="935" y="205" width="795" height="575" rx="18"/>
  <text class="laneTitle" x="961" y="239">KTOR CALLID DIAGNOSTICS PATH</text>

  <rect class="lane laneData" x="70" y="810" width="1660" height="255" rx="18"/>
  <text class="laneTitle" x="96" y="844">R2DBC DIAGNOSTIC STATE CONTRACT</text>

  <g data-card="Spring request correlation">
    <rect class="card" x="115" y="285" width="320" height="120" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <text class="cardTitle" x="275" y="326" text-anchor="middle">Request Correlation</text>
    <text class="body" x="275" y="357" text-anchor="middle">SpringRequestCorrelationFilter</text>
    <text class="body small" x="275" y="381" text-anchor="middle">safe X-Request-ID or generated UUID</text>
  </g>

  <g data-card="Spring diagnostic operation">
    <rect class="card" x="115" y="500" width="320" height="130" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <text class="cardTitle" x="275" y="542" text-anchor="middle">Diagnostic Operation</text>
    <text class="body" x="275" y="573" text-anchor="middle">GET /diagnostics/operations/{name}</text>
    <text class="body small" x="275" y="599" text-anchor="middle">bounded delay, slow flag at 250ms</text>
  </g>

  <g data-card="Spring readiness endpoint">
    <rect class="card" x="505" y="285" width="320" height="120" rx="14" fill="#ffffff" stroke="#4f86c6"/>
    <text class="cardTitle" x="665" y="326" text-anchor="middle">Readiness Endpoint</text>
    <text class="body" x="665" y="357" text-anchor="middle">GET /production/readiness</text>
    <text class="body small" x="665" y="381" text-anchor="middle">returns requestId with status</text>
  </g>

  <g data-card="Spring database readiness">
    <rect class="card" x="505" y="500" width="320" height="130" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <text class="cardTitle" x="665" y="542" text-anchor="middle">Database Readiness</text>
    <text class="body" x="665" y="573" text-anchor="middle">1 second live ping</text>
    <text class="body small" x="665" y="599" text-anchor="middle">sticky DEGRADED row overrides UP</text>
  </g>

  <g data-card="Ktor request correlation">
    <rect class="card" x="980" y="285" width="320" height="120" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <text class="cardTitle" x="1140" y="326" text-anchor="middle">CallId Boundary</text>
    <text class="body" x="1140" y="357" text-anchor="middle">CallId + CallLogging</text>
    <text class="body small" x="1140" y="381" text-anchor="middle">replyToHeader X-Request-ID</text>
  </g>

  <g data-card="Ktor diagnostic route">
    <rect class="card" x="980" y="500" width="320" height="130" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <text class="cardTitle" x="1140" y="542" text-anchor="middle">Diagnostic Route</text>
    <text class="body" x="1140" y="573" text-anchor="middle">GET /diagnostics/operations/{name}</text>
    <text class="body small" x="1140" y="599" text-anchor="middle">records callId after coroutine delay</text>
  </g>

  <g data-card="Ktor readiness route">
    <rect class="card" x="1370" y="285" width="320" height="120" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <text class="cardTitle" x="1530" y="326" text-anchor="middle">Readiness Route</text>
    <text class="body" x="1530" y="357" text-anchor="middle">GET /production/readiness</text>
    <text class="body small" x="1530" y="381" text-anchor="middle">passes call.callId to repository</text>
  </g>

  <g data-card="Ktor database readiness">
    <rect class="card" x="1370" y="500" width="320" height="130" rx="14" fill="#ffffff" stroke="#6f8f52"/>
    <text class="cardTitle" x="1530" y="542" text-anchor="middle">Database Readiness</text>
    <text class="body" x="1530" y="573" text-anchor="middle">same ping and degraded logic</text>
    <text class="body small" x="1530" y="599" text-anchor="middle">StatusPages include requestId</text>
  </g>

  <g data-card="Spring diagnostic tables">
    <rect class="card" x="145" y="885" width="510" height="125" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <g class="h2Icon" data-bluetape4k-icon="database/h2.svg" transform="translate(181 917) scale(1.45)">
      <path d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
    </g>
    <text class="cardTitle" x="430" y="925" text-anchor="middle">Spring Diagnostic Tables</text>
    <text class="body small" x="430" y="955" text-anchor="middle">spring_prod_diagnostic_operations</text>
    <text class="body small" x="430" y="979" text-anchor="middle">spring_prod_diagnostics tracks database status</text>
  </g>

  <g data-card="Readiness status rule">
    <rect class="card" x="715" y="885" width="370" height="125" rx="14" fill="#ffffff" stroke="#4f8f8b"/>
    <text class="cardTitle" x="900" y="925" text-anchor="middle">Readiness State Rule</text>
    <text class="body small" x="900" y="955" text-anchor="middle">newest 100 operations are returned</text>
    <text class="body small" x="900" y="979" text-anchor="middle">UP only when ping passes and no degraded row exists</text>
  </g>

  <g data-card="Ktor diagnostic tables">
    <rect class="card" x="1145" y="885" width="510" height="125" rx="14" fill="#ffffff" stroke="#a36f3e"/>
    <g class="h2Icon" data-bluetape4k-icon="database/h2.svg" transform="translate(1181 917) scale(1.45)">
      <path d="M17.17 13.27c.14-.015.28-.023.416-.023.7 0 1.228.159 1.599.469.37.314.555.756.555 1.334a2.861 2.861 0 0 1-.43 1.455c-.291.492-.775 1.066-1.46 1.727-.453.446-1.061.976-1.821 1.592a48.02 48.02 0 0 1-2.275 1.742v2.083h9.895V21.24H17.99c.219-.159.59-.435 1.11-.832.519-.4 1.033-.835 1.55-1.311.817-.76 1.425-1.5 1.822-2.215a4.624 4.624 0 0 0 .597-2.268c0-1.213-.416-2.154-1.247-2.815-.828-.662-2.033-.994-3.613-.994-.344 0-.692.015-1.036.049V6.04H13.86v4.701H8.965V6.04H5.65v12.846h3.315v-5.661h4.89v5.661h.039c.31-.242.623-.487.933-.74a28.564 28.564 0 0 0 1.826-1.588 14.854 14.854 0 0 0 .517-.529zM12.011 23.3A11.327 11.327 0 0 1 .7 11.99 11.305 11.305 0 0 1 12.011.699a11.286 11.286 0 0 1 11.29 11.29v.351H24v-.351A11.985 11.985 0 0 0 12.011 0 12.008 12.008 0 0 0 0 11.989 12.026 12.026 0 0 0 12.011 24h.352v-.7z"/>
    </g>
    <text class="cardTitle" x="1430" y="925" text-anchor="middle">Ktor Diagnostic Tables</text>
    <text class="body small" x="1430" y="955" text-anchor="middle">ktor_prod_diagnostic_operations</text>
    <text class="body small" x="1430" y="979" text-anchor="middle">ktor_prod_diagnostics mirrors degraded state</text>
  </g>

  <path class="connector blue" data-connector="spring-request-diagnostic" d="M 275 405 L 275 495"/>
  <path class="connector blue" data-connector="spring-request-readiness" d="M 435 345 L 500 345"/>
  <path class="connector amber" data-connector="spring-diagnostic-table" d="M 275 630 L 275 880"/>
  <path class="connector green" data-connector="spring-readiness-ping" d="M 665 405 L 665 495"/>
  <path class="connector amber" data-connector="spring-ping-table" d="M 665 630 L 665 738 Q 665 754 649 754 L 416 754 Q 400 754 400 770 L 400 880"/>
  <path class="connector blue" data-connector="spring-table-status" d="M 655 947 L 710 947"/>

  <path class="connector green" data-connector="ktor-callid-diagnostic" d="M 1140 405 L 1140 495"/>
  <path class="connector green" data-connector="ktor-callid-readiness" d="M 1300 345 L 1365 345"/>
  <path class="connector amber" data-connector="ktor-diagnostic-table" d="M 1140 630 L 1140 738 Q 1140 754 1156 754 L 1400 754 Q 1416 754 1416 770 L 1416 880"/>
  <path class="connector green" data-connector="ktor-readiness-ping" d="M 1530 405 L 1530 495"/>
  <path class="connector amber" data-connector="ktor-ping-table" d="M 1530 630 L 1530 880"/>
  <path class="connector blue" data-connector="ktor-table-status" d="M 1145 947 L 1090 947"/>

  <rect x="180" y="1028" width="1440" height="38" rx="12" fill="#ecfdf5" stroke="#86cfa0" stroke-width="1.8"/>
  <text class="foot" x="900" y="1053" text-anchor="middle">Both stacks keep synthetic delays outside R2DBC transactions, then persist measured operation rows with the normalized request id.</text>
</svg>
