<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1566" viewBox="0 0 1480 1566" role="img" aria-label="JSON Serialization/Deserialization Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1480" height="1566"/>
<rect class="frame" x="32" y="28" width="1416" height="1510" rx="28"/>
<text class="title" x="66" y="82">JSON Serialization/Deserialization Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="8" y="166" width="264" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1506" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="408" y="166" width="264" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="540" y="209" text-anchor="middle">JsonColumn~T~</text>
<line class="lifeline" x1="540" y1="252" x2="540" y2="1506" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="808" y="166" width="264" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="940" y="209" text-anchor="middle">KotlinxJsonMapper</text>
<line class="lifeline" x1="940" y1="252" x2="940" y2="1506" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1208" y="166" width="264" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1340" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1340" y1="252" x2="1340" y2="1506" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="160.5" y="286" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="178.5" y="313" text-anchor="start">1. insert { it[data] = DataHolder(...) }</text>
<path class="line" d="M140 344 L540 344"/>
<rect x="633" y="396" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="651" y="423" text-anchor="start">2. serialize(value: T)</text>
<path class="line" d="M540 454 L940 454"/>
<rect x="540.5" y="506" width="399" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="558.5" y="533" text-anchor="start">3. JSON string (e.g. {user:{name:Alice},...})</text>
<path class="dashed" d="M940 564 L540 564"/>
<rect x="833" y="616" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="851" y="643" text-anchor="start">4. INSERT {user:{...}}</text>
<path class="line" d="M540 674 L1340 674"/>
<rect x="817" y="726" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="835" y="753" text-anchor="start">5. {user:{name:Alice},...}</text>
<path class="dashed" d="M1340 784 L540 784"/>
<rect x="617" y="836" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="635" y="863" text-anchor="start">6. deserialize(jsonString)</text>
<path class="line" d="M540 894 L940 894"/>
<rect x="564.5" y="946" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="582.5" y="973" text-anchor="start">7. DataHolder(user=User(Alice,...),...)</text>
<path class="dashed" d="M940 1004 L540 1004"/>
<rect x="235" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="253" y="1083" text-anchor="start">8. DataHolder object</text>
<path class="dashed" d="M540 1114 L140 1114"/>
<rect x="164.5" y="1166" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="182.5" y="1193" text-anchor="start">9. data.extract(.active, toScalar=true)</text>
<path class="line" d="M140 1224 L540 1224"/>
<rect x="643.5" y="1276" width="593" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="661.5" y="1303" text-anchor="start">10. JSON_EXTRACT(data, $.active) [MySQL] or data-&gt;active [PostgreSQL]</text>
<path class="line" d="M540 1334 L1340 1334"/>
<rect x="617" y="1386" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="635" y="1413" text-anchor="start">11. extracted scalar value</text>
<path class="dashed" d="M1340 1444 L140 1444"/>
</svg>
