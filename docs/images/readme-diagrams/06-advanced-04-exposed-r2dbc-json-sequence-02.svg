<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1280" width="1700" height="1280" role="img" aria-label="Exposed R2DBC JSON serialization and query sequence">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9a95" stroke="#2f9a95" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b58122" stroke="#b58122" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-rose" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" viewBox="0 0 10 10" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a85f7f" stroke="#a85f7f" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f7f9f4}
      .frame{fill:#fffefb;stroke:#3d515c;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:48px;fill:#1e293b}
      .subtitle,.role,.labelText,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:16px;fill:#536476;font-weight:700}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#1e293b}
      .num{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#334155;font-weight:800}
      .card{fill:#fffefb;stroke:#60747f;stroke-width:2.4;filter:url(#softShadow)}
      .lifeline{stroke:#9fb1bc;stroke-width:2;stroke-dasharray:8 9}
      .activation{fill:#e6f7f5;stroke:#a7d9d3;stroke-width:2;opacity:.78}
      .activationAmber{fill:#fff2d8;stroke:#e3c483;stroke-width:2;opacity:.78}
      .label{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
      .call{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
      .return{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
      .callBlue{stroke:#4f86c6;marker-end:url(#arrow-blue)}
      .callTeal{stroke:#2f9a95;marker-end:url(#arrow-teal)}
      .callGreen{stroke:#6f8f52;marker-end:url(#arrow-green)}
      .callAmber{stroke:#b58122;marker-end:url(#arrow-amber)}
      .callRose{stroke:#a85f7f;marker-end:url(#arrow-rose)}
      .retBlue{stroke:#4f86c6;marker-end:url(#arrow-blue)}
      .retTeal{stroke:#2f9a95;marker-end:url(#arrow-teal)}
      .retAmber{stroke:#b58122;marker-end:url(#arrow-amber)}
      .branch{fill:none;stroke:#8aa0ad;stroke-width:2.4;stroke-dasharray:9 8}
      .branchLabel{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
      .footer{fill:#fffefb;stroke:#d7e2ec;stroke-width:2}
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1280"/>
  <rect class="frame" x="28" y="28" width="1644" height="1224" rx="28"/>
  <text class="title" x="76" y="92">JSON Serialization, Query Operators, and Dialect Checks</text>
  <text class="subtitle" x="82" y="128">Ex01 and Ex02 store @Serializable payloads through json/jsonb columns, then verify extract, contains, exists, and JSONB extras.</text>

  <g data-participant="Workshop Test">
    <rect class="card participant" x="70" y="184" width="190" height="78" rx="16"/>
    <text class="participant" x="165" y="225" text-anchor="middle">Workshop Test</text>
    <text class="role" x="165" y="248" text-anchor="middle">runTest</text>
    <line class="lifeline" x1="165" y1="262" x2="165" y2="1180"/>
  </g>
  <g data-participant="JSON fixtures">
    <rect class="card participant" x="312" y="184" width="236" height="78" rx="16"/>
    <text class="participant" x="430" y="225" text-anchor="middle">JSON fixtures</text>
    <text class="role" x="430" y="248" text-anchor="middle">withJsonTable</text>
    <line class="lifeline" x1="430" y1="262" x2="430" y2="1180"/>
  </g>
  <g data-participant="JSON table DSL">
    <rect class="card participant" x="590" y="184" width="240" height="78" rx="16"/>
    <text class="participant" x="710" y="225" text-anchor="middle">JSON table DSL</text>
    <text class="role" x="710" y="248" text-anchor="middle">json / jsonb</text>
    <line class="lifeline" x1="710" y1="262" x2="710" y2="1180"/>
  </g>
  <g data-participant="Json.Default">
    <rect class="card participant" x="880" y="184" width="220" height="78" rx="16"/>
    <text class="participant" x="990" y="225" text-anchor="middle">Json.Default</text>
    <text class="role" x="990" y="248" text-anchor="middle">serializer</text>
    <line class="lifeline" x1="990" y1="262" x2="990" y2="1180"/>
  </g>
  <g data-participant="R2DBC Database">
    <rect class="card participant" x="1158" y="184" width="224" height="78" rx="16"/>
    <text class="participant" x="1270" y="225" text-anchor="middle">R2DBC Database</text>
    <text class="role" x="1270" y="248" text-anchor="middle">dialect SQL</text>
    <line class="lifeline" x1="1270" y1="262" x2="1270" y2="1180"/>
  </g>
  <g data-participant="Assertions">
    <rect class="card participant" x="1450" y="184" width="180" height="78" rx="16"/>
    <text class="participant" x="1540" y="225" text-anchor="middle">Assertions</text>
    <text class="role" x="1540" y="248" text-anchor="middle">values + caveats</text>
    <line class="lifeline" x1="1540" y1="262" x2="1540" y2="1180"/>
  </g>

  <rect class="activation" x="424" y="318" width="14" height="214" rx="5"/>
  <rect class="activation" x="704" y="384" width="14" height="576" rx="5"/>
  <rect class="activationAmber" x="984" y="466" width="14" height="132" rx="5"/>
  <rect class="activationAmber" x="1264" y="548" width="14" height="516" rx="5"/>
  <rect class="activation" x="1534" y="780" width="14" height="342" rx="5"/>

  <g data-message="1">
    <rect class="label pill" x="98" y="286" width="446" height="36" rx="18"/>
    <circle cx="125" cy="304" r="19" fill="#eef5fa" stroke="#4f86c6" stroke-width="2"/>
    <text class="num" x="125" y="310" text-anchor="middle">1</text>
    <text class="labelText" x="322" y="310" text-anchor="middle">withJsonTable / withJsonBTable(testDB)</text>
    <path class="call callBlue" data-connector="with-json-fixture" d="M165 334 L430 334"/>
  </g>

  <g data-message="2">
    <rect class="label pill" x="300" y="352" width="448" height="36" rx="18"/>
    <circle cx="327" cy="370" r="19" fill="#eef7f6" stroke="#2f9a95" stroke-width="2"/>
    <text class="num" x="327" y="376" text-anchor="middle">2</text>
    <text class="labelText" x="524" y="376" text-anchor="middle">seed DataHolder(User("Admin"), 10, true)</text>
    <path class="call callTeal" data-connector="seed-table-row" d="M430 400 L710 400"/>
  </g>

  <g data-message="3">
    <rect class="label pill" x="620" y="434" width="470" height="36" rx="18"/>
    <circle cx="647" cy="452" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2"/>
    <text class="num" x="647" y="458" text-anchor="middle">3</text>
    <text class="labelText" x="855" y="458" text-anchor="middle">json/jsonb&lt;DataHolder&gt; uses Json.Default</text>
    <path class="call callAmber" data-connector="serialize-call" d="M710 482 L990 482"/>
  </g>

  <g data-message="4">
    <rect class="label pill" x="608" y="516" width="534" height="36" rx="18"/>
    <circle cx="635" cy="534" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2"/>
    <text class="num" x="635" y="540" text-anchor="middle">4</text>
    <text class="labelText" x="875" y="540" text-anchor="middle">serialized JSON payload for j_column / j_b_column</text>
    <path class="return retAmber" data-connector="serialize-return" d="M990 564 L710 564"/>
  </g>

  <g data-message="5">
    <rect class="label pill" x="718" y="598" width="518" height="36" rx="18"/>
    <circle cx="745" cy="616" r="19" fill="#f1f6ec" stroke="#6f8f52" stroke-width="2"/>
    <text class="num" x="745" y="622" text-anchor="middle">5</text>
    <text class="labelText" x="977" y="622" text-anchor="middle">INSERT or UPDATE JSON / JSONB column</text>
    <path class="call callGreen" data-connector="insert-update-json" d="M710 646 L1270 646"/>
  </g>

  <g data-message="6">
    <rect class="label pill" x="690" y="680" width="558" height="36" rx="18"/>
    <circle cx="717" cy="698" r="19" fill="#eef7f6" stroke="#2f9a95" stroke-width="2"/>
    <text class="num" x="717" y="704" text-anchor="middle">6</text>
    <text class="labelText" x="969" y="704" text-anchor="middle">selectAll returns stored JSON document</text>
    <path class="return retTeal" data-connector="stored-json-return" d="M1270 728 L710 728"/>
  </g>

  <g data-message="7">
    <rect class="label pill" x="860" y="762" width="642" height="36" rx="18"/>
    <circle cx="887" cy="780" r="19" fill="#eef7f6" stroke="#2f9a95" stroke-width="2"/>
    <text class="num" x="887" y="786" text-anchor="middle">7</text>
    <text class="labelText" x="1181" y="786" text-anchor="middle">deserialize back to DataHolder and assert equality</text>
    <path class="call callTeal" data-connector="assert-deserialized-value" d="M710 810 L1540 810"/>
  </g>

  <g data-message="8">
    <rect class="label pill" x="598" y="844" width="660" height="36" rx="18"/>
    <circle cx="625" cy="862" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2"/>
    <text class="num" x="625" y="868" text-anchor="middle">8</text>
    <text class="labelText" x="928" y="868" text-anchor="middle">extract&lt;T&gt;, contains(...), exists(path, optional)</text>
    <path class="call callAmber" data-connector="query-operators" d="M165 892 L710 892"/>
  </g>

  <g data-message="9">
    <rect class="label pill" x="792" y="926" width="560" height="36" rx="18"/>
    <circle cx="819" cy="944" r="19" fill="#f1f6ec" stroke="#6f8f52" stroke-width="2"/>
    <text class="num" x="819" y="950" text-anchor="middle">9</text>
    <text class="labelText" x="1072" y="950" text-anchor="middle">dialect SQL: JSON_EXTRACT, @&gt;, JSONB_PATH_EXISTS</text>
    <path class="call callGreen" data-connector="operator-sql" d="M710 974 L1270 974"/>
  </g>

  <g data-message="10">
    <rect class="label pill" x="1022" y="1008" width="532" height="36" rx="18"/>
    <circle cx="1049" cy="1026" r="19" fill="#f5eef2" stroke="#a85f7f" stroke-width="2"/>
    <text class="num" x="1049" y="1032" text-anchor="middle">10</text>
    <text class="labelText" x="1288" y="1032" text-anchor="middle">assert rows or skip unsupported dialect paths</text>
    <path class="call callRose" data-connector="assert-query-result" d="M1270 1056 L1540 1056"/>
  </g>

  <g data-message="11">
    <rect class="branch" x="95" y="1078" width="1510" height="92" rx="18"/>
    <rect class="branchLabel" x="682" y="1058" width="336" height="34" rx="17"/>
    <text class="labelText" x="850" y="1081" text-anchor="middle">JSONB extras branch</text>
    <rect class="label pill" x="438" y="1110" width="706" height="36" rx="18"/>
    <circle cx="465" cy="1128" r="19" fill="#fff2d8" stroke="#b58122" stroke-width="2"/>
    <text class="num" x="465" y="1134" text-anchor="middle">11</text>
    <text class="labelText" x="791" y="1134" text-anchor="middle">Ex02 verifies JSONB-only and PostgreSQL-specific cases</text>
    <path class="call callAmber" data-connector="jsonb-extra-branch" d="M165 1158 L990 1158"/>
  </g>

  <rect class="footer" x="118" y="1204" width="1464" height="34" rx="12"/>
  <text class="note" x="850" y="1227" text-anchor="middle">JSON tests keep Kotlin payloads typed; database-specific JSON behavior is isolated in query operators and dialect assumptions.</text>
</svg>
