<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1680" viewBox="0 0 2200 1680" role="img" aria-label="Advanced 06 Exposed R2DBC Custom Columns sequence diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="seqArrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b8891f" stroke="#b8891f" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9b95" stroke="#2f9b95" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="seqArrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto" data-role="sequence" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ad5f82" stroke="#ad5f82" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#f4f7fa}
      .frame{fill:#fffefb;stroke:#3f5560;stroke-width:5}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:64px;fill:#1e293b}
      .subtitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#536476;font-weight:700}
      .participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:29px;fill:#1e293b}
      .role{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:20px;fill:#536476;font-weight:700}
      .labelText,.detail{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#4d5d6e;font-weight:700}
      .num{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#263746;font-weight:800}
      .header{fill:#ffffff;stroke:#5d6f78;stroke-width:3;filter:url(#shadow)}
      .lifeline{stroke:#9fb0bd;stroke-width:2.4;stroke-dasharray:10 12}
      .activation{opacity:.72;stroke-width:2.2}
      .label{fill:#fff;stroke:#d9e3ec;stroke-width:2.4}
      .badgeBlue{fill:#eef5fa;stroke:#4f86c6;stroke-width:2.5}
      .badgeGreen{fill:#f1f6ec;stroke:#6f8f52;stroke-width:2.5}
      .badgeAmber{fill:#fff8e6;stroke:#b8891f;stroke-width:2.5}
      .badgeTeal{fill:#eef7f6;stroke:#2f9b95;stroke-width:2.5}
      .badgeRed{fill:#f8edf3;stroke:#ad5f82;stroke-width:2.5}
      .callBlue{fill:none;stroke:#4f86c6;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-blue)}
      .callGreen{fill:none;stroke:#6f8f52;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-green)}
      .callAmber{fill:none;stroke:#b8891f;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-amber)}
      .callTeal{fill:none;stroke:#2f9b95;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-teal)}
      .callRed{fill:none;stroke:#ad5f82;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#seqArrow-red)}
      .seqReturn{fill:none;stroke-width:3.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 9}
      .returnBlue{stroke:#4f86c6;marker-end:url(#seqArrow-blue)}
      .returnGreen{stroke:#6f8f52;marker-end:url(#seqArrow-green)}
      .returnAmber{stroke:#b8891f;marker-end:url(#seqArrow-amber)}
      .returnTeal{stroke:#2f9b95;marker-end:url(#seqArrow-teal)}
      .alt{fill:none;stroke:#8ca2b4;stroke-width:3.2;stroke-dasharray:12 10}
      .branchLabel{fill:#fff;stroke:#d9e3ec;stroke-width:2.4}
      .footer{fill:#fff;stroke:#d9e3ec;stroke-width:2.2}
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1680"/>
  <rect class="frame" x="36" y="34" width="2128" height="1604" rx="34"/>
  <text class="title" x="92" y="126">Custom Column Write and Read Sequence</text>
  <text class="subtitle" x="96" y="176">Client defaults are generated before INSERT; custom ColumnTypes transform values on write and restore them on read.</text>

  <g data-participant="Workshop Test" data-card="Workshop Test" data-x="86" data-y="260" data-width="250" data-height="94">
    <rect class="header card actor" x="86" y="260" width="250" height="94" rx="20"/>
    <text class="participant" x="211" y="310" text-anchor="middle">Workshop Test</text>
    <text class="role" x="211" y="337" text-anchor="middle">runTest</text>
    <line class="lifeline" x1="211" y1="354" x2="211" y2="1510"/>
  </g>
  <g data-participant="Fixture Tables" data-card="Fixture Tables" data-x="426" data-y="260" data-width="250" data-height="94">
    <rect class="header card actor" x="426" y="260" width="250" height="94" rx="20"/>
    <text class="participant" x="551" y="310" text-anchor="middle">Fixture Tables</text>
    <text class="role" x="551" y="337" text-anchor="middle">ClientGenerated / T1</text>
    <line class="lifeline" x1="551" y1="354" x2="551" y2="1510"/>
  </g>
  <g data-participant="Column Extensions" data-card="Column Extensions" data-x="766" data-y="260" data-width="250" data-height="94">
    <rect class="header card actor" x="766" y="260" width="250" height="94" rx="20"/>
    <text class="participant" x="891" y="310" text-anchor="middle">Column Extensions</text>
    <text class="role" x="891" y="337" text-anchor="middle">default + ColumnType</text>
    <line class="lifeline" x1="891" y1="354" x2="891" y2="1510"/>
  </g>
  <g data-participant="Transformer" data-card="Transformer" data-x="1106" data-y="260" data-width="250" data-height="94">
    <rect class="header card actor" x="1106" y="260" width="250" height="94" rx="20"/>
    <text class="participant" x="1231" y="310" text-anchor="middle">Transformer</text>
    <text class="role" x="1231" y="337" text-anchor="middle">codecs + serializers</text>
    <line class="lifeline" x1="1231" y1="354" x2="1231" y2="1510"/>
  </g>
  <g data-participant="R2DBC Database" data-card="R2DBC Database" data-x="1446" data-y="260" data-width="250" data-height="94">
    <rect class="header card actor" x="1446" y="260" width="250" height="94" rx="20"/>
    <text class="participant" x="1571" y="310" text-anchor="middle">R2DBC Database</text>
    <text class="role" x="1571" y="337" text-anchor="middle">VARBINARY / BLOB</text>
    <line class="lifeline" x1="1571" y1="354" x2="1571" y2="1510"/>
  </g>
  <g data-participant="Assertions" data-card="Assertions" data-x="1786" data-y="260" data-width="250" data-height="94">
    <rect class="header card actor" x="1786" y="260" width="250" height="94" rx="20"/>
    <text class="participant" x="1911" y="310" text-anchor="middle">Assertions</text>
    <text class="role" x="1911" y="337" text-anchor="middle">unique + restored</text>
    <line class="lifeline" x1="1911" y1="354" x2="1911" y2="1510"/>
  </g>

  <rect class="activation" x="545" y="438" width="16" height="190" rx="7" fill="#dff5ed" stroke="#98d2b8"/>
  <rect class="activation" x="883" y="548" width="16" height="580" rx="7" fill="#e5f3fb" stroke="#b9d7eb"/>
  <rect class="activation" x="1223" y="690" width="16" height="340" rx="7" fill="#fff0cb" stroke="#e2c36d"/>
  <rect class="activation" x="1563" y="820" width="16" height="352" rx="7" fill="#edf7e7" stroke="#b8d69b"/>

  <path class="callBlue" data-connector="seq-1" d="M 211 452 L 551 452"/>
  <rect class="label" x="160" y="382" width="442" height="52" rx="20"/>
  <circle class="badgeBlue" cx="204" cy="408" r="32"/>
  <text class="num" x="204" y="417" text-anchor="middle">1</text>
  <text class="labelText" x="272" y="417">withTables(ClientGenerated, T1)</text>

  <path class="callBlue" data-connector="seq-2" d="M 211 582 L 891 582"/>
  <rect class="label" x="285" y="512" width="532" height="52" rx="20"/>
  <circle class="badgeBlue" cx="329" cy="538" r="32"/>
  <text class="num" x="329" y="547" text-anchor="middle">2</text>
  <text class="labelText" x="400" y="547">insertAndGetId or batchInsert values</text>

  <rect class="alt" x="714" y="638" width="920" height="560" rx="28"/>
  <rect class="branchLabel" x="914" y="600" width="512" height="46" rx="18"/>
  <text class="detail" x="1170" y="631" text-anchor="middle">branch: default or ColumnType transform</text>

  <path class="callAmber" data-connector="seq-3" d="M 891 724 L 1231 724"/>
  <rect class="label" x="812" y="660" width="484" height="52" rx="20"/>
  <circle class="badgeAmber" cx="856" cy="686" r="32"/>
  <text class="num" x="856" y="695" text-anchor="middle">3</text>
  <text class="labelText" x="928" y="695">clientDefault or toDB(raw)</text>

  <path class="seqReturn returnAmber" data-connector="seq-4" d="M 1231 842 L 891 842"/>
  <rect class="label" x="862" y="772" width="400" height="52" rx="20"/>
  <circle class="badgeAmber" cx="906" cy="798" r="32"/>
  <text class="num" x="906" y="807" text-anchor="middle">4</text>
  <text class="labelText" x="978" y="807">generatedId or bytes</text>

  <path class="callGreen" data-connector="seq-5" d="M 891 960 L 1571 960"/>
  <rect class="label" x="1016" y="890" width="508" height="52" rx="20"/>
  <circle class="badgeGreen" cx="1060" cy="916" r="32"/>
  <text class="num" x="1060" y="925" text-anchor="middle">5</text>
  <text class="labelText" x="1132" y="925">INSERT id or stored bytes</text>

  <path class="callBlue" data-connector="seq-6" d="M 211 1078 L 1571 1078"/>
  <rect class="label" x="676" y="1008" width="432" height="52" rx="20"/>
  <circle class="badgeBlue" cx="720" cy="1034" r="32"/>
  <text class="num" x="720" y="1043" text-anchor="middle">6</text>
  <text class="labelText" x="792" y="1043">selectAll().where(id eq ...)</text>

  <path class="seqReturn returnGreen" data-connector="seq-7" d="M 1571 1196 L 891 1196"/>
  <rect class="label" x="1050" y="1126" width="410" height="52" rx="20"/>
  <circle class="badgeGreen" cx="1094" cy="1152" r="32"/>
  <text class="num" x="1094" y="1161" text-anchor="middle">7</text>
  <text class="labelText" x="1166" y="1161">row values from database</text>

  <path class="callAmber" data-connector="seq-8" d="M 891 1306 L 1231 1306"/>
  <rect class="label" x="778" y="1236" width="558" height="52" rx="20"/>
  <circle class="badgeAmber" cx="822" cy="1262" r="32"/>
  <text class="num" x="822" y="1271" text-anchor="middle">8</text>
  <text class="labelText" x="894" y="1271">valueFromDB(bytes)</text>

  <path class="seqReturn returnTeal" data-connector="seq-9" d="M 1231 1416 L 891 1416"/>
  <rect class="label" x="814" y="1346" width="502" height="52" rx="20"/>
  <circle class="badgeTeal" cx="858" cy="1372" r="32"/>
  <text class="num" x="858" y="1381" text-anchor="middle">9</text>
  <text class="labelText" x="930" y="1381">raw ByteArray or object</text>

  <path class="callRed" data-connector="seq-10" d="M 891 1500 L 1911 1500"/>
  <rect class="label" x="1194" y="1430" width="600" height="52" rx="20"/>
  <circle class="badgeRed" cx="1238" cy="1456" r="32"/>
  <text class="num" x="1238" y="1465" text-anchor="middle">10</text>
  <text class="labelText" x="1316" y="1465">assert unique, equality, nulls</text>

  <rect class="footer" x="216" y="1570" width="1768" height="50" rx="18"/>
  <text class="detail" x="1100" y="1603" text-anchor="middle">Reader contract: typed test values stay typed while ColumnTypes handle defaults, bytes, and objects.</text>
</svg>
