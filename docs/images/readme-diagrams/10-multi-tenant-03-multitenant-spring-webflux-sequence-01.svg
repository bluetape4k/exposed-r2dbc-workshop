<svg xmlns="http://www.w3.org/2000/svg" width="1924" height="1696" viewBox="0 0 1924 1696" role="img" aria-label="Multi-tenancy Request Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1924" height="1696"/>
<rect class="frame" x="32" y="28" width="1860" height="1640" rx="28"/>
<text class="title" x="66" y="82">Multi-tenancy Request Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="21" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">HTTP Client</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1636" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="349.8" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="468.8" y="209" text-anchor="middle">TenantWebFilter</text>
<line class="lifeline" x1="468.8" y1="252" x2="468.8" y2="1636" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="678.6" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="797.6" y="209" text-anchor="middle">ReactorContext</text>
<line class="lifeline" x1="797.6" y1="252" x2="797.6" y2="1636" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1007.4000000000001" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1126.4" y="209" text-anchor="middle">ActorController</text>
<line class="lifeline" x1="1126.4" y1="252" x2="1126.4" y2="1636" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1336.2" y="166" width="238" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1455.2" y="209" text-anchor="middle">ActorRepository</text>
<line class="lifeline" x1="1455.2" y1="252" x2="1455.2" y2="1636" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1665" y="166" width="238" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="1784" y="209" text-anchor="middle">R2dbcDatabase</text>
<line class="lifeline" x1="1784" y1="252" x2="1784" y2="1636" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="136.89999999999998" y="286" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="154.89999999999998" y="313" text-anchor="start">1. HTTP request (X-TENANT-ID: korean)</text>
<path class="line" d="M140 344 L468.8 344"/>
<rect x="482.20000000000005" y="396" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="500.20000000000005" y="423" text-anchor="start">2. contextWrite(TenantId(korean))</text>
<path class="line" d="M468.8 454 L797.6 454"/>
<rect x="692.6" y="506" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="710.6" y="533" text-anchor="start">3. forward request</text>
<path class="line" d="M468.8 564 L1126.4 564"/>
<rect x="986.9000000000001" y="616" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1004.9000000000001" y="643" text-anchor="start">4. suspendTransactionWithCurrentTenant { }</text>
<path class="line" d="M1126.4 674 C1190.4 674 1190.4 708 1126.4 708"/>
<rect x="815" y="746" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="833" y="773" text-anchor="start">5. currentReactorTenant() lookup</text>
<path class="line" d="M1126.4 804 L797.6 804"/>
<rect x="857" y="856" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="875" y="883" text-anchor="start">6. Tenant(korean)</text>
<path class="dashed" d="M797.6 914 L1126.4 914"/>
<rect x="1308.2" y="966" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1326.2" y="993" text-anchor="start">7. SchemaUtils.setSchema(korean)</text>
<path class="line" d="M1126.4 1024 L1784 1024"/>
<rect x="1159.8000000000002" y="1076" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1177.8000000000002" y="1103" text-anchor="start">8. actorRepository.findAll()</text>
<path class="line" d="M1126.4 1134 L1455.2 1134"/>
<rect x="1480.6" y="1186" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1498.6" y="1213" text-anchor="start">9. SELECT * FROM korean.actors</text>
<path class="line" d="M1455.2 1244 L1784 1244"/>
<rect x="1514.6" y="1296" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1532.6" y="1323" text-anchor="start">10. Korean actor data</text>
<path class="dashed" d="M1784 1354 L1455.2 1354"/>
<rect x="1185.8000000000002" y="1406" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1203.8000000000002" y="1433" text-anchor="start">11. List~ActorRecord~</text>
<path class="dashed" d="M1455.2 1464 L1126.4 1464"/>
<rect x="490.20000000000005" y="1516" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="508.20000000000005" y="1543" text-anchor="start">12. JSON response (Korean data)</text>
<path class="dashed" d="M1126.4 1574 L140 1574"/>
</svg>
