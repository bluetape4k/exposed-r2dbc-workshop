<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="1236" viewBox="0 0 1470 1236" role="img" aria-label="Multi-tenancy Request Flow">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.10"/></filter>
<marker id="openArrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5D6B7A"/></marker>
<style>.canvas{fill:#F7F9FC}.frame{fill:#fff;stroke:#D8E0EA;stroke-width:1.5}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:39px;font-weight:400;fill:#102033}.subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#536273}.smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}.strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}.card{stroke-width:2;filter:url(#shadow)}.line{stroke:#5D6B7A;stroke-width:2.2;fill:none;marker-end:url(#openArrow)}.dashed{stroke:#5D6B7A;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}.lifeline{stroke:#B7C2D1;stroke-width:1.8;stroke-dasharray:8 9}.note{fill:#fff;opacity:.97}</style>
</defs>
<rect class="canvas" width="1470" height="1236"/>
<rect class="frame" x="24" y="24" width="1422" height="1180" rx="22"/>
<text class="title" x="58" y="76">Multi-tenancy Request Flow</text>
<text class="subtitle" x="62" y="106">Compact sequence flow with reduced outer and inner whitespace</text>
<rect class="card" x="50.0" y="156" width="220" height="66" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel participant" x="160.0" y="196" text-anchor="middle">HTTP Client</text>
<line class="lifeline" x1="160.0" y1="250" x2="160.0" y2="1174"/>
<rect class="card" x="280.0" y="156" width="220" height="66" rx="16" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel participant" x="390.0" y="196" text-anchor="middle">TenantWebFilter</text>
<line class="lifeline" x1="390.0" y1="250" x2="390.0" y2="1174"/>
<rect class="card" x="510.0" y="156" width="220" height="66" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel participant" x="620.0" y="196" text-anchor="middle">ReactorContext</text>
<line class="lifeline" x1="620.0" y1="250" x2="620.0" y2="1174"/>
<rect class="card" x="740.0" y="156" width="220" height="66" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel participant" x="850.0" y="196" text-anchor="middle">ActorController</text>
<line class="lifeline" x1="850.0" y1="250" x2="850.0" y2="1174"/>
<rect class="card" x="970.0" y="156" width="220" height="66" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel participant" x="1080.0" y="196" text-anchor="middle">ActorRepository</text>
<line class="lifeline" x1="1080.0" y1="250" x2="1080.0" y2="1174"/>
<rect class="card" x="1200.0" y="156" width="220" height="66" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel participant" x="1310.0" y="196" text-anchor="middle">R2dbcDatabase</text>
<line class="lifeline" x1="1310.0" y1="250" x2="1310.0" y2="1174"/>
<path class="line" d="M160.0 292.0 L390.0 292.0" data-connector="line"/>
<rect class="note label" x="147.3" y="260.0" width="255.4" height="28" rx="9"/>
<text class="strong labelText" x="275.0" y="280.0" text-anchor="middle">1. HTTP request (X-TENANT-ID: korean)</text>
<path class="line" d="M390.0 366.0 L620.0 366.0" data-connector="line"/>
<rect class="note label" x="389.7" y="334.0" width="230.6" height="28" rx="9"/>
<text class="strong labelText" x="505.0" y="354.0" text-anchor="middle">2. contextWrite(TenantId(korean))</text>
<path class="line" d="M390.0 440.0 L850.0 440.0" data-connector="line"/>
<rect class="note label" x="540.0" y="408.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="620.0" y="428.0" text-anchor="middle">3. forward request</text>
<path class="line" d="M850.0 514.0 C912.0 514.0 912.0 544.0 850.0 544.0" data-connector="line"/>
<rect class="note label" x="920.0" y="504.0" width="286.4" height="28" rx="9"/>
<text class="strong labelText" x="920.0" y="524.0" text-anchor="start">4. suspendTransactionWithCurrentTenant { }</text>
<path class="line" d="M850.0 588.0 L620.0 588.0" data-connector="line"/>
<rect class="note label" x="622.8" y="556.0" width="224.4" height="28" rx="9"/>
<text class="strong labelText" x="735.0" y="576.0" text-anchor="middle">5. currentReactorTenant() lookup</text>
<path class="dashed" d="M620.0 662.0 L850.0 662.0" data-connector="dashed"/>
<rect class="note label" x="655.0" y="630.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="735.0" y="650.0" text-anchor="middle">6. Tenant(korean)</text>
<path class="line" d="M850.0 736.0 L1310.0 736.0" data-connector="line"/>
<rect class="note label" x="967.8" y="704.0" width="224.4" height="28" rx="9"/>
<text class="strong labelText" x="1080.0" y="724.0" text-anchor="middle">7. SchemaUtils.setSchema(korean)</text>
<path class="line" d="M850.0 810.0 L1080.0 810.0" data-connector="line"/>
<rect class="note label" x="865.2" y="778.0" width="199.6" height="28" rx="9"/>
<text class="strong labelText" x="965.0" y="798.0" text-anchor="middle">8. actorRepository.findAll()</text>
<path class="line" d="M1080.0 884.0 L1310.0 884.0" data-connector="line"/>
<rect class="note label" x="1089.0" y="852.0" width="212.0" height="28" rx="9"/>
<text class="strong labelText" x="1195.0" y="872.0" text-anchor="middle">9. SELECT * FROM korean.actors</text>
<path class="dashed" d="M1310.0 958.0 L1080.0 958.0" data-connector="dashed"/>
<rect class="note label" x="1115.0" y="926.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="1195.0" y="946.0" text-anchor="middle">10. Korean actor data</text>
<path class="dashed" d="M1080.0 1032.0 L850.0 1032.0" data-connector="dashed"/>
<rect class="note label" x="885.0" y="1000.0" width="160.0" height="28" rx="9"/>
<text class="strong labelText" x="965.0" y="1020.0" text-anchor="middle">11. List~ActorRecord~</text>
<path class="dashed" d="M850.0 1106.0 L160.0 1106.0" data-connector="dashed"/>
<rect class="note label" x="395.9" y="1074.0" width="218.2" height="28" rx="9"/>
<text class="strong labelText" x="505.0" y="1094.0" text-anchor="middle">12. JSON response (Korean data)</text>
<rect class="activation" x="154.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="384.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>
<rect class="activation" x="614.0" y="274.0" width="12" height="88" rx="4" fill="#E0F2FE" stroke="#bdd4e8" opacity="0.72"/>

<!-- audit badge labels: visible sequence numbering and message pill samples -->
<g aria-label="sequence message labels">
<rect x="58" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="76" y="140" class="num" text-anchor="middle">1</text>
<rect x="102" y="124" width="36" height="22" rx="8" class="label" fill="#fff" stroke="#bfdbfe"/>
<text x="120" y="140" class="num" text-anchor="middle">2</text>
</g>
</svg>
