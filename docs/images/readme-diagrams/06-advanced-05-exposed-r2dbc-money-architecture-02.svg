<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-label="Exposed R2DBC Money architecture diagram">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#3f7fb5"/>
    </marker>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#4f8f8b"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#6f8f52"/>
    </marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path  d="M 0 0 L 14 7 L 0 14 Z" fill="#a66a3f"/>
    </marker>
    <style>
      .canvas{fill:#f6f9fc}
      .frame{fill:#fff;stroke:#d7e2ec;stroke-width:2}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:1.6}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:17px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:14px;fill:#64748b;font-weight:700}
      .laneTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;letter-spacing:0;fill:#8ca2b4}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#1e293b}
      .card{filter:url(#softShadow)}
      .header{opacity:.96}
      .connector{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .foot{fill:#fff;stroke:#d7e2ec;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1600" height="960" class="canvas"/>
  <rect x="28" y="28" width="1544" height="904" rx="20" class="frame"/>
  <text x="72" y="88" class="title">Exposed R2DBC Money Storage and Query Architecture</text>
  <text x="72" y="122" class="subtitle">Concrete map for JavaMoney values, compositeMoney split columns, defaults, manual composites, and R2DBC checks.</text>

  <rect x="64" y="160" width="1472" height="188" rx="18" class="lane"/>
  <text x="92" y="195" class="laneTitle">MONEY DOMAIN MODEL</text>

  <g data-card="Money factory" data-x="108" data-y="222" data-width="270" data-height="96">
    <rect x="108" y="222" width="270" height="96" rx="13" fill="#fff" stroke="#3f7fb5" stroke-width="2.4" class="card"/>
    <path class="header" d="M108,262 L108,235 Q108,222 121,222 L365,222 Q378,222 378,235 L378,262 Z" fill="#eef5fa"/>
    <text x="243" y="243" class="tiny" text-anchor="middle">Moneta + bluetape4k</text>
    <text x="243" y="267" class="cardTitle" text-anchor="middle">Money factory</text>
    <text x="132" y="292" class="detail">Money.of / moneyOf</text>
  </g>

  <g data-card="MonetaryAmount" data-x="472" data-y="222" data-width="300" data-height="96">
    <rect x="472" y="222" width="300" height="96" rx="13" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M472,262 L472,235 Q472,222 485,222 L759,222 Q772,222 772,235 L772,262 Z" fill="#eef7f6"/>
    <text x="622" y="243" class="tiny" text-anchor="middle">JSR-354 value</text>
    <text x="622" y="267" class="cardTitle" text-anchor="middle">MonetaryAmount</text>
    <text x="496" y="292" class="detail">amount + CurrencyUnit</text>
  </g>

  <g data-card="CompositeColumn" data-x="866" data-y="222" data-width="300" data-height="96">
    <rect x="866" y="222" width="300" height="96" rx="13" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M866,262 L866,235 Q866,222 879,222 L1153,222 Q1166,222 1166,235 L1166,262 Z" fill="#f1f6ec"/>
    <text x="1016" y="243" class="tiny" text-anchor="middle">exposed-money</text>
    <text x="1016" y="267" class="cardTitle" text-anchor="middle">compositeMoney</text>
    <text x="890" y="292" class="detail">single logical property</text>
  </g>

  <g data-card="R2DBC DSL" data-x="1260" data-y="222" data-width="235" data-height="96">
    <rect x="1260" y="222" width="235" height="96" rx="13" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1260,262 L1260,235 Q1260,222 1273,222 L1482,222 Q1495,222 1495,235 L1495,262 Z" fill="#f5eee4"/>
    <text x="1377.5" y="243" class="tiny" text-anchor="middle">Exposed R2DBC</text>
    <text x="1377.5" y="267" class="cardTitle" text-anchor="middle">Insert / select</text>
    <text x="1284" y="292" class="detail">typed Money values</text>
  </g>

  <path data-connector="factory-money" class="connector" d="M 378 270 L 462 270" stroke="#3f7fb5" marker-end="url(#arrow-blue)"/>
  <path data-connector="money-composite" class="connector" d="M 772 270 L 856 270" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>
  <path data-connector="composite-r2dbc" class="connector" d="M 1166 270 L 1250 270" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <rect x="64" y="378" width="1472" height="206" rx="18" class="lane"/>
  <text x="92" y="413" class="laneTitle">DATABASE COLUMN SPLIT</text>

  <g data-card="AccountTable" data-x="108" data-y="450" data-width="300" data-height="100">
    <rect x="108" y="450" width="300" height="100" rx="13" fill="#fff" stroke="#3f7fb5" stroke-width="2.4" class="card"/>
    <path class="header" d="M108,491 L108,463 Q108,450 121,450 L395,450 Q408,450 408,463 L408,491 Z" fill="#eef5fa"/>
    <text x="258" y="472" class="tiny" text-anchor="middle">IntIdTable("Accounts")</text>
    <text x="258" y="497" class="cardTitle" text-anchor="middle">AccountTable</text>
    <text x="132" y="523" class="detail">composite_money nullable</text>
  </g>

  <g data-card="Amount column" data-x="492" data-y="450" data-width="290" data-height="100">
    <rect x="492" y="450" width="290" height="100" rx="13" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M492,491 L492,463 Q492,450 505,450 L769,450 Q782,450 782,463 L782,491 Z" fill="#eef7f6"/>
    <text x="637" y="472" class="tiny" text-anchor="middle">amount storage</text>
    <text x="637" y="497" class="cardTitle" text-anchor="middle">DECIMAL(8,5)</text>
    <text x="516" y="523" class="detail">indexed by ix_money_amount</text>
  </g>

  <g data-card="Currency column" data-x="866" data-y="450" data-width="300" data-height="100">
    <rect x="866" y="450" width="300" height="100" rx="13" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M866,491 L866,463 Q866,450 879,450 L1153,450 Q1166,450 1166,463 L1166,491 Z" fill="#f1f6ec"/>
    <text x="1016" y="472" class="tiny" text-anchor="middle">currency storage</text>
    <text x="1016" y="497" class="cardTitle" text-anchor="middle">VARCHAR(3)</text>
    <text x="890" y="523" class="detail">column suffix _C, ISO code</text>
  </g>

  <g data-card="Default table" data-x="1250" data-y="450" data-width="245" data-height="100">
    <rect x="1250" y="450" width="245" height="100" rx="13" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1250,491 L1250,463 Q1250,450 1263,450 L1482,450 Q1495,450 1495,463 L1495,491 Z" fill="#f5eee4"/>
    <text x="1372.5" y="472" class="tiny" text-anchor="middle">Ex01_MoneyDefaults</text>
    <text x="1372.5" y="497" class="cardTitle" text-anchor="middle">DB defaults</text>
    <text x="1274" y="523" class="detail">t1 default, t2 nullable</text>
  </g>

  <path data-connector="account-amount" class="connector" d="M 408 500 L 482 500" stroke="#3f7fb5" marker-end="url(#arrow-blue)"/>
  <path data-connector="amount-currency" class="connector" d="M 782 500 L 856 500" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>
  <path data-connector="currency-default" class="connector" d="M 1166 500 L 1240 500" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <rect x="64" y="614" width="1472" height="220" rx="18" class="lane"/>
  <text x="92" y="649" class="laneTitle">TESTED BEHAVIOR</text>

  <g data-card="Composite insert" data-x="108" data-y="690" data-width="300" data-height="112">
    <rect x="108" y="690" width="300" height="112" rx="13" fill="#fff" stroke="#3f7fb5" stroke-width="2.4" class="card"/>
    <path class="header" d="M108,733 L108,703 Q108,690 121,690 L395,690 Q408,690 408,703 L408,733 Z" fill="#eef5fa"/>
    <text x="258" y="713" class="tiny" text-anchor="middle">Ex02_Money</text>
    <text x="258" y="740" class="cardTitle" text-anchor="middle">Composite insert</text>
    <text x="132" y="768" class="detail">it[composite_money] = Money</text>
    <text x="132" y="790" class="detail">select restores value</text>
  </g>

  <g data-card="Component insert" data-x="482" data-y="690" data-width="310" data-height="112">
    <rect x="482" y="690" width="310" height="112" rx="13" fill="#fff" stroke="#4f8f8b" stroke-width="2.4" class="card"/>
    <path class="header" d="M482,733 L482,703 Q482,690 495,690 L779,690 Q792,690 792,703 L792,733 Z" fill="#eef7f6"/>
    <text x="637" y="713" class="tiny" text-anchor="middle">amount + currency</text>
    <text x="637" y="740" class="cardTitle" text-anchor="middle">Component insert</text>
    <text x="506" y="768" class="detail">set amount and currency</text>
    <text x="506" y="790" class="detail">query each component</text>
  </g>

  <g data-card="Manual composite" data-x="866" data-y="690" data-width="300" data-height="112">
    <rect x="866" y="690" width="300" height="112" rx="13" fill="#fff" stroke="#6f8f52" stroke-width="2.4" class="card"/>
    <path class="header" d="M866,733 L866,703 Q866,690 879,690 L1153,690 Q1166,690 1166,703 L1166,733 Z" fill="#f1f6ec"/>
    <text x="1016" y="713" class="tiny" text-anchor="middle">decimal + currency columns</text>
    <text x="1016" y="740" class="cardTitle" text-anchor="middle">Manual composite</text>
    <text x="890" y="768" class="detail">amount/currency named freely</text>
    <text x="890" y="790" class="detail">nullable composite comparisons</text>
  </g>

  <g data-card="Guards and defaults" data-x="1250" data-y="690" data-width="245" data-height="112">
    <rect x="1250" y="690" width="245" height="112" rx="13" fill="#fff" stroke="#a66a3f" stroke-width="2.4" class="card"/>
    <path class="header" d="M1250,733 L1250,703 Q1250,690 1263,690 L1482,690 Q1495,690 1495,703 L1495,733 Z" fill="#f5eee4"/>
    <text x="1372.5" y="713" class="tiny" text-anchor="middle">validation path</text>
    <text x="1372.5" y="740" class="cardTitle" text-anchor="middle">Guards</text>
    <text x="1274" y="768" class="detail">precision overflow</text>
    <text x="1274" y="790" class="detail">defaults/nulls checked</text>
  </g>

  <path data-connector="test-composite-component" class="connector" d="M 408 746 L 472 746" stroke="#3f7fb5" marker-end="url(#arrow-blue)"/>
  <path data-connector="test-component-manual" class="connector" d="M 792 746 L 856 746" stroke="#4f8f8b" marker-end="url(#arrow-teal)"/>
  <path data-connector="test-manual-guards" class="connector" d="M 1166 746 L 1240 746" stroke="#6f8f52" marker-end="url(#arrow-green)"/>

  <rect x="108" y="862" width="1385" height="36" rx="11" class="foot"/>
  <text x="800.5" y="886" class="note" text-anchor="middle">Reader contract: a MonetaryAmount is one Kotlin value, two database columns, and one R2DBC verification path for full and component access.</text>
</svg>
