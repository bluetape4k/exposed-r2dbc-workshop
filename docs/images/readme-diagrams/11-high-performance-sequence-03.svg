<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="2278" viewBox="0 0 1584 2278" role="img" aria-label="Cache Hit/Miss Processing Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1584" height="2278"/>
<rect class="frame" x="32" y="28" width="1520" height="2222" rx="28"/>
<text class="title" x="66" y="82">Cache Hit/Miss Processing Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-5" y="166" width="290" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2218" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="429.66666666666674" y="166" width="290" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="574.6666666666667" y="209" text-anchor="middle">L1 Cache (Caffeine)</text>
<line class="lifeline" x1="574.6666666666667" y1="252" x2="574.6666666666667" y2="2218" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="864.3333333333334" y="166" width="290" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1009.3333333333334" y="209" text-anchor="middle">L2 Cache (Redis)</text>
<line class="lifeline" x1="1009.3333333333334" y1="252" x2="1009.3333333333334" y2="2218" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1299" y="166" width="290" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1444" y="209" text-anchor="middle">Primary DB (R2DBC)</text>
<line class="lifeline" x1="1444" y1="252" x2="1444" y2="2218" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="252.33333333333337" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="270.33333333333337" y="313" text-anchor="start">1. get(key)</text>
<path class="line" d="M140 344 L574.6666666666667 344"/>
<rect x="70" y="396" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="423" text-anchor="start">ALT: L1 HIT</text>
<rect x="201.83333333333337" y="464" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="219.83333333333337" y="491" text-anchor="start">3. Return cached value (immediate)</text>
<path class="dashed" d="M574.6666666666667 522 L140 522"/>
<rect x="70" y="574" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="601" text-anchor="start">ELSE: L1 MISS</text>
<rect x="252.33333333333337" y="642" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="270.33333333333337" y="669" text-anchor="start">5. null</text>
<path class="dashed" d="M574.6666666666667 700 L140 700"/>
<rect x="469.66666666666674" y="752" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="487.66666666666674" y="779" text-anchor="start">6. get(key)</text>
<path class="line" d="M140 810 L1009.3333333333334 810"/>
<rect x="70" y="862" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="889" text-anchor="start">ALT: L2 HIT</text>
<rect x="467.66666666666674" y="930" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="485.66666666666674" y="957" text-anchor="start">8. Return cached value</text>
<path class="dashed" d="M1009.3333333333334 988 L140 988"/>
<rect x="252.33333333333337" y="1040" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="270.33333333333337" y="1067" text-anchor="start">9. put(key, value)</text>
<path class="line" d="M140 1098 L574.6666666666667 1098"/>
<rect x="70" y="1150" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1177" text-anchor="start">ELSE: L2 MISS</text>
<rect x="469.66666666666674" y="1218" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="487.66666666666674" y="1245" text-anchor="start">11. null</text>
<path class="dashed" d="M1009.3333333333334 1276 L140 1276"/>
<rect x="624.5" y="1328" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="642.5" y="1355" text-anchor="start">12. SELECT (R2DBC suspendTransaction)</text>
<path class="line" d="M140 1386 L1444 1386"/>
<rect x="687" y="1438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="705" y="1465" text-anchor="start">13. Query result</text>
<path class="dashed" d="M1444 1496 L140 1496"/>
<rect x="459.66666666666674" y="1548" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="477.66666666666674" y="1575" text-anchor="start">14. put(key, value, ttl)</text>
<path class="line" d="M140 1606 L1009.3333333333334 1606"/>
<rect x="252.33333333333337" y="1658" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="270.33333333333337" y="1685" text-anchor="start">15. put(key, value)</text>
<path class="line" d="M140 1716 L574.6666666666667 1716"/>
<rect x="661" y="1768" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="679" y="1795" text-anchor="start">16. INSERT / UPDATE / DELETE</text>
<path class="line" d="M140 1826 L1444 1826"/>
<rect x="687" y="1878" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="705" y="1905" text-anchor="start">17. Done</text>
<path class="dashed" d="M1444 1936 L140 1936"/>
<rect x="469.66666666666674" y="1988" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="487.66666666666674" y="2015" text-anchor="start">18. evict(key)</text>
<path class="line" d="M140 2046 L1009.3333333333334 2046"/>
<rect x="252.33333333333337" y="2098" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="270.33333333333337" y="2125" text-anchor="start">19. evict(key)</text>
<path class="line" d="M140 2156 L574.6666666666667 2156"/>
</svg>
