<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-label="Shared withTables schema lifecycle sequence">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Architects+Daughter&amp;display=swap');
      @font-face{font-family:'Comic Mono';src:local('Comic Mono');}
      .canvas{fill:#F6F8FB;}
      .frame{fill:#FFFDF9;stroke:#3f535c;stroke-width:3.2;}
      .title{font-family:'Architects Daughter','Comic Mono',monospace;font-size:44px;fill:#1f2937;}
      .subtitle,.note{font-family:'Comic Mono','Architects Daughter',monospace;font-size:17px;fill:#435363;font-weight:700;}
      .header{fill:#FFFFFF;stroke:#587080;stroke-width:2.4;}
      .participant{font-family:'Architects Daughter','Comic Mono',monospace;font-size:23px;fill:#23323f;}
      .role{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;fill:#64748b;font-weight:700;}
      .lifeline{stroke:#9db1bf;stroke-width:2.4;stroke-dasharray:8 10;stroke-linecap:butt;}
      .activation{fill:#F4FAF6;stroke:#77a984;stroke-width:2;}
      .activationBlue{fill:#EEF6FF;stroke:#7eb2d5;}
      .activationAmber{fill:#FFF7E6;stroke:#bd8b3b;}
      .activationTeal{fill:#EFFAF9;stroke:#5fa8a2;}
      .activationPurple{fill:#F6F0FF;stroke:#9d7bc3;}
      .call{fill:none;stroke:#3f86bd;stroke-width:3;marker-end:url(#seqArrowBlue);}
      .state{fill:none;stroke:#6f8f52;stroke-width:3;marker-end:url(#seqArrowGreen);}
      .sql{fill:none;stroke:#b68432;stroke-width:3;marker-end:url(#seqArrowAmber);}
      .return{fill:none;stroke:#2f9b95;stroke-width:3;stroke-dasharray:8 7;marker-end:url(#seqArrowTeal);}
      .work{fill:none;stroke:#805aa8;stroke-width:3;marker-end:url(#seqArrowPurple);}
      .wait{fill:none;stroke:#c16a6a;stroke-width:3;marker-end:url(#seqArrowRed);}
      .pill{fill:#FFFFFF;stroke-width:1.8;}
      .pillBlue{stroke:#9ec5e8;}
      .pillGreen{stroke:#a9c58f;}
      .pillAmber{stroke:#d4b06d;}
      .pillTeal{stroke:#9cccca;}
      .pillPurple{stroke:#c5b0dd;}
      .pillRed{stroke:#d9a0a0;}
      .badgeCircle{fill:#FFFDF9;stroke-width:1.8;}
      .badge{font-family:'Comic Mono','Architects Daughter',monospace;font-size:14px;font-weight:800;dominant-baseline:middle;text-anchor:middle;}
      .msg{font-family:'Comic Mono','Architects Daughter',monospace;font-size:15px;font-weight:800;dominant-baseline:middle;}
      .blueText{fill:#276b9d;stroke:none;}
      .greenText{fill:#587a3d;stroke:none;}
      .amberText{fill:#8a6128;stroke:none;}
      .tealText{fill:#277f7a;stroke:none;}
      .purpleText{fill:#694989;stroke:none;}
      .redText{fill:#a95656;stroke:none;}
      .badgeCircle.blueText{fill:#FFFDF9;stroke:#9ec5e8;}
      .badgeCircle.greenText{fill:#FFFDF9;stroke:#a9c58f;}
      .badgeCircle.amberText{fill:#FFFDF9;stroke:#d4b06d;}
      .badgeCircle.tealText{fill:#FFFDF9;stroke:#9cccca;}
      .badgeCircle.purpleText{fill:#FFFDF9;stroke:#c5b0dd;}
      .badgeCircle.redText{fill:#FFFDF9;stroke:#d9a0a0;}
      .branch{fill:none;stroke:#7892a0;stroke-width:2.8;stroke-dasharray:8 8;}
      .branchLabel{fill:#FFFDF9;stroke:#d4b06d;stroke-width:1.8;}
      .branchText{font-family:'Comic Mono','Architects Daughter',monospace;font-size:15px;fill:#7c5a2b;font-weight:800;dominant-baseline:middle;}
      .noteBox{fill:#FFFFFF;stroke:#d7e2ec;stroke-width:1.8;}
    </style>
    <marker id="seqArrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f86bd" stroke="#3f86bd" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b68432" stroke="#b68432" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f9b95" stroke="#2f9b95" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#805aa8" stroke="#805aa8" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="seqArrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c16a6a" stroke="#c16a6a" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1600" height="1280"/>
  <rect class="frame" x="26" y="26" width="1548" height="1228" rx="26"/>

  <text class="title" x="70" y="88">Shared Test Schema Lifecycle Flow</text>
  <text class="subtitle" x="72" y="122">withTables wraps withDb, serializes each TestDB, creates tables, commits the test block, and drops tables in finally.</text>

  <g transform="translate(80,162)">
    <rect class="header" x="0" y="0" width="218" height="76" rx="10"/>
    <text class="participant" x="109" y="35" text-anchor="middle">JUnit test</text>
    <text class="role" x="109" y="57" text-anchor="middle">example method</text>
  </g>
  <g transform="translate(344,162)">
    <rect class="header" x="0" y="0" width="228" height="76" rx="10"/>
    <text class="participant" x="114" y="35" text-anchor="middle">withTables</text>
    <text class="role" x="114" y="57" text-anchor="middle">schema lifecycle</text>
  </g>
  <g transform="translate(620,162)">
    <rect class="header" x="0" y="0" width="218" height="76" rx="10"/>
    <text class="participant" x="109" y="35" text-anchor="middle">withDb</text>
    <text class="role" x="109" y="57" text-anchor="middle">semaphore + DB</text>
  </g>
  <g transform="translate(886,162)">
    <rect class="header" x="0" y="0" width="252" height="76" rx="10"/>
    <text class="participant" x="126" y="35" text-anchor="middle">suspendTransaction</text>
    <text class="role" x="126" y="57" text-anchor="middle">R2dbcTransaction</text>
  </g>
  <g transform="translate(1190,162)">
    <rect class="header" x="0" y="0" width="220" height="76" rx="10"/>
    <text class="participant" x="110" y="35" text-anchor="middle">SchemaUtils</text>
    <text class="role" x="110" y="57" text-anchor="middle">create / drop</text>
  </g>
  <g transform="translate(1440,162)">
    <rect class="header" x="0" y="0" width="118" height="76" rx="10"/>
    <text class="participant" x="59" y="35" text-anchor="middle">TestDB</text>
    <text class="role" x="59" y="57" text-anchor="middle">R2DBC</text>
  </g>

  <path class="lifeline" d="M 189 238 V 1110"/>
  <path class="lifeline" d="M 458 238 V 1110"/>
  <path class="lifeline" d="M 729 238 V 1110"/>
  <path class="lifeline" d="M 1012 238 V 1110"/>
  <path class="lifeline" d="M 1300 238 V 1110"/>
  <path class="lifeline" d="M 1499 238 V 1110"/>

  <rect class="activation activationBlue" x="180" y="286" width="18" height="768" rx="5"/>
  <rect class="activation activationTeal" x="449" y="318" width="18" height="680" rx="5"/>
  <rect class="activation activation" x="720" y="398" width="18" height="542" rx="5"/>
  <rect class="activation activationPurple" x="1003" y="500" width="18" height="446" rx="5"/>
  <rect class="activation activationAmber" x="1291" y="582" width="18" height="404" rx="5"/>

  <g>
    <rect class="pill pillBlue" x="110" y="254" width="338" height="32" rx="16"/>
    <circle class="badgeCircle blueText" cx="135" cy="270" r="13"/>
    <text class="badge blueText" x="135" y="270">1</text>
    <text class="msg blueText" x="172" y="270">withTables(testDB, *tables)</text>
    <path class="call" d="M 189 292 H 458"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="484" y="334" width="350" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="509" cy="350" r="13"/>
    <text class="badge greenText" x="509" y="350">2</text>
    <text class="msg greenText" x="546" y="350">delegate to withDb(testDB)</text>
    <path class="state" d="M 458 382 H 729"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="720" y="414" width="372" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="745" cy="430" r="13"/>
    <text class="badge greenText" x="745" y="430">3</text>
    <text class="msg greenText" x="782" y="430">acquire TestDB semaphore</text>
    <path class="state" d="M 729 462 H 1499"/>
  </g>

  <g>
    <rect class="pill pillAmber" x="1116" y="494" width="392" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="1141" cy="510" r="13"/>
    <text class="badge amberText" x="1141" y="510">4</text>
    <text class="msg amberText" x="1178" y="510">connect or reuse registered DB</text>
    <path class="sql" d="M 729 542 H 1499"/>
  </g>

  <g>
    <rect class="pill pillPurple" x="710" y="574" width="398" height="32" rx="16"/>
    <circle class="badgeCircle purpleText" cx="735" cy="590" r="13"/>
    <text class="badge purpleText" x="735" y="590">5</text>
    <text class="msg purpleText" x="772" y="590">open suspendTransaction block</text>
    <path class="work" d="M 729 622 H 1012"/>
  </g>

  <g>
    <rect class="pill pillAmber" x="1044" y="654" width="342" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="1069" cy="670" r="13"/>
    <text class="badge amberText" x="1069" y="670">6</text>
    <text class="msg amberText" x="1106" y="670">drop stale tables if present</text>
    <path class="sql" d="M 1012 702 H 1300"/>
  </g>

  <g>
    <rect class="pill pillAmber" x="1038" y="734" width="352" height="32" rx="16"/>
    <circle class="badgeCircle amberText" cx="1063" cy="750" r="13"/>
    <text class="badge amberText" x="1063" y="750">7</text>
    <text class="msg amberText" x="1100" y="750">SchemaUtils.create(*tables)</text>
    <path class="sql" d="M 1012 782 H 1300"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="880" y="814" width="218" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="905" cy="830" r="13"/>
    <text class="badge greenText" x="905" y="830">8</text>
    <text class="msg greenText" x="942" y="830">commit()</text>
    <path class="state" d="M 1012 862 H 729"/>
  </g>

  <rect class="branch" x="314" y="888" width="1040" height="164" rx="18"/>
  <rect class="branchLabel" x="340" y="873" width="360" height="30" rx="15"/>
  <text class="branchText" x="360" y="888">try statement then finally cleanup</text>

  <g>
    <rect class="pill pillBlue" x="306" y="910" width="350" height="32" rx="16"/>
    <circle class="badgeCircle blueText" cx="331" cy="926" r="13"/>
    <text class="badge blueText" x="331" y="926">9</text>
    <text class="msg blueText" x="368" y="926">execute caller statement</text>
    <path class="call" d="M 1012 960 H 189"/>
  </g>

  <g>
    <rect class="pill pillRed" x="1012" y="982" width="318" height="32" rx="16"/>
    <circle class="badgeCircle redText" cx="1037" cy="998" r="13"/>
    <text class="badge redText" x="1037" y="998">10</text>
    <text class="msg redText" x="1076" y="998">drop tables in finally</text>
    <path class="wait" d="M 1012 1034 H 1300"/>
  </g>

  <g>
    <rect class="pill pillGreen" x="752" y="1058" width="374" height="32" rx="16"/>
    <circle class="badgeCircle greenText" cx="777" cy="1074" r="13"/>
    <text class="badge greenText" x="777" y="1074">11</text>
    <text class="msg greenText" x="816" y="1074">commit cleanup and release semaphore</text>
    <path class="state" d="M 729 1110 H 1499"/>
  </g>

  <g>
    <rect class="pill pillTeal" x="100" y="1098" width="300" height="32" rx="16"/>
    <circle class="badgeCircle tealText" cx="125" cy="1114" r="13"/>
    <text class="badge tealText" x="125" y="1114">12</text>
    <text class="msg tealText" x="164" y="1114">test method resumes</text>
    <path class="return" d="M 458 1148 H 189"/>
  </g>

  <rect class="noteBox" x="84" y="1158" width="1432" height="30" rx="10"/>
  <text class="note" x="800" y="1178" text-anchor="middle">Cleanup failures are suppressed or recovered according to statement cancellation rules before withDb releases the TestDB semaphore.</text>
</svg>
