<rect x="145.83333333333337" y="286" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="163.83333333333337" y="313" text-anchor="start">1. withTables(testDB, MyTable) { ... }</text>
<path class="line" d="M140 344 L494.6666666666667 344"/>
<rect x="452.5" y="396" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
