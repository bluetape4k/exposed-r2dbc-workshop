<path class="line" d="M494.6666666666667 564 L1204 564"/>
<rect x="744.3333333333334" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="762.3333333333334" y="643" text-anchor="start">4. Tables created</text>
<path class="dashed" d="M1204 674 L494.6666666666667 674"/>
<rect x="212.33333333333337" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="753" text-anchor="start">5. Execute block</text>
<path class="line" d="M494.6666666666667 784 L140 784"/>
<rect x="212.33333333333337" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="863" text-anchor="start">6. Block complete</text>
<path class="dashed" d="M140 894 L494.6666666666667 894"/>
<rect x="677.8333333333334" y="946" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="695.8333333333334" y="973" text-anchor="start">7. SchemaUtils.drop(*tables) [finally]</text>
<path class="line" d="M494.6666666666667 1004 L1204 1004"/>
<rect x="744.3333333333334" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="762.3333333333334" y="1083" text-anchor="start">8. Tables dropped</text>
