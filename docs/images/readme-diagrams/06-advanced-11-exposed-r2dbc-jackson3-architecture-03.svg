<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1420" viewBox="0 0 2200 1420" role="img" aria-label="Advanced 11 Exposed R2DBC Jackson3 architecture diagram">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#203040" flood-opacity="0.11"/>
    </filter>
    <style>
      .canvas{fill:#f4f7fa}
      .frame{fill:#fffefb;stroke:#b8ccdf;stroke-width:5}
      .lane{fill:#f8fafc;stroke:#d7e2ec;stroke-width:3}
      .laneWarm{fill:#fffaf0;stroke:#dccb9e;stroke-width:3}
      .laneGreen{fill:#f2f8f2;stroke:#c5dab6;stroke-width:3}
      .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:64px;fill:#1e293b}
      .subtitle,.detail,.note{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;fill:#536476;font-weight:700}
      .laneTitle{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:24px;letter-spacing:.06em;fill:#8ca2b4;font-weight:800}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:32px;fill:#1e293b}
      .cardSub{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:22px;fill:#536476;font-weight:700}
      .tiny{font-family:"Comic Mono","SFMono-Regular",monospace;font-size:19px;fill:#64748b;font-weight:800}
      .card{filter:url(#shadow)}
      .cardWhite{fill:#ffffff}
      .blue{stroke:#4f86c6}
      .green{stroke:#6f8f52}
      .amber{stroke:#b8891f}
      .teal{stroke:#4f8f8b}
      .red{stroke:#ad5f82}
      .brown{stroke:#8a6f55}
      .connector{fill:none;stroke-width:5;stroke-linecap:butt;stroke-linejoin:round}
      .head{stroke-dasharray:none;style:stroke-dasharray:none!important}
      .footer{fill:#ffffff;stroke:#d9e3ec;stroke-width:2.4}
    </style>
  </defs>

  <rect class="canvas" width="2200" height="1420"/>
  <rect class="frame" x="36" y="34" width="2128" height="1352" rx="38"/>
  <text class="title" x="1100" y="126" text-anchor="middle">Jackson 2.x to Jackson 3.x Migration Map</text>
  <text class="subtitle" x="1100" y="176" text-anchor="middle">The workshop keeps the Exposed JSON DSL shape while moving package, mapper, Kotlin module, and platform assumptions to Jackson 3.</text>

  <rect class="lane" x="92" y="238" width="580" height="770" rx="30"/>
  <text class="laneTitle" x="132" y="286">JACKSON 2.x BASELINE</text>
  <rect class="laneWarm" x="810" y="238" width="580" height="770" rx="30"/>
  <text class="laneTitle" x="850" y="286">MIGRATION AXIS</text>
  <rect class="laneGreen" x="1528" y="238" width="580" height="770" rx="30"/>
  <text class="laneTitle" x="1568" y="286">JACKSON 3.x TARGET</text>

  <g data-card="Jackson 2 package" data-x="150" data-y="330" data-width="420" data-height="96">
    <rect class="card cardWhite blue" x="150" y="330" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="360" y="362" text-anchor="middle">&lt;&lt;package&gt;&gt;</text>
    <text class="cardTitle" x="360" y="402" text-anchor="middle">com.fasterxml.jackson</text>
  </g>
  <g data-card="Mapper API" data-x="150" data-y="460" data-width="420" data-height="96">
    <rect class="card cardWhite green" x="150" y="460" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="360" y="492" text-anchor="middle">&lt;&lt;mapper&gt;&gt;</text>
    <text class="cardTitle" x="360" y="532" text-anchor="middle">ObjectMapper</text>
  </g>
  <g data-card="Kotlin Module" data-x="150" data-y="590" data-width="420" data-height="96">
    <rect class="card cardWhite amber" x="150" y="590" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="360" y="622" text-anchor="middle">&lt;&lt;Kotlin binding&gt;&gt;</text>
    <text class="cardTitle" x="360" y="662" text-anchor="middle">KotlinModule</text>
  </g>
  <g data-card="Platform Namespace" data-x="150" data-y="720" data-width="420" data-height="96">
    <rect class="card cardWhite teal" x="150" y="720" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="360" y="752" text-anchor="middle">&lt;&lt;platform&gt;&gt;</text>
    <text class="cardTitle" x="360" y="792" text-anchor="middle">javax.* era</text>
  </g>
  <g data-card="Exposed Package" data-x="150" data-y="850" data-width="420" data-height="96">
    <rect class="card cardWhite red" x="150" y="850" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="360" y="882" text-anchor="middle">&lt;&lt;column extensions&gt;&gt;</text>
    <text class="cardTitle" x="360" y="922" text-anchor="middle">core.jackson.*</text>
  </g>

  <g data-card="Package Imports" data-x="888" data-y="330" data-width="424" data-height="96">
    <rect class="card cardWhite blue" x="888" y="330" width="424" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="362" text-anchor="middle">&lt;&lt;source import shift&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="402" text-anchor="middle">package imports</text>
  </g>
  <g data-card="Entry Point" data-x="888" data-y="460" data-width="424" data-height="96">
    <rect class="card cardWhite green" x="888" y="460" width="424" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="492" text-anchor="middle">&lt;&lt;mapper entry&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="532" text-anchor="middle">entry point changes</text>
  </g>
  <g data-card="Kotlin Binding" data-x="888" data-y="590" data-width="424" data-height="96">
    <rect class="card cardWhite amber" x="888" y="590" width="424" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="622" text-anchor="middle">&lt;&lt;module version&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="662" text-anchor="middle">Kotlin data classes</text>
  </g>
  <g data-card="Jakarta Alignment" data-x="888" data-y="720" data-width="424" data-height="96">
    <rect class="card cardWhite teal" x="888" y="720" width="424" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="752" text-anchor="middle">&lt;&lt;runtime platform&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="792" text-anchor="middle">Spring Boot 3+</text>
  </g>
  <g data-card="Exposed Facade" data-x="888" data-y="850" data-width="424" data-height="96">
    <rect class="card cardWhite red" x="888" y="850" width="424" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1100" y="882" text-anchor="middle">&lt;&lt;workshop API&gt;&gt;</text>
    <text class="cardTitle" x="1100" y="922" text-anchor="middle">same DSL shape</text>
  </g>

  <g data-card="Jackson 3 package" data-x="1612" data-y="330" data-width="420" data-height="96">
    <rect class="card cardWhite blue" x="1612" y="330" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1822" y="362" text-anchor="middle">&lt;&lt;package&gt;&gt;</text>
    <text class="cardTitle" x="1822" y="402" text-anchor="middle">tools.jackson</text>
  </g>
  <g data-card="JsonMapper" data-x="1612" data-y="460" data-width="420" data-height="96">
    <rect class="card cardWhite green" x="1612" y="460" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1822" y="492" text-anchor="middle">&lt;&lt;mapper&gt;&gt;</text>
    <text class="cardTitle" x="1822" y="532" text-anchor="middle">JsonMapper</text>
  </g>
  <g data-card="KotlinModule3" data-x="1612" data-y="590" data-width="420" data-height="96">
    <rect class="card cardWhite amber" x="1612" y="590" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1822" y="622" text-anchor="middle">&lt;&lt;Kotlin binding&gt;&gt;</text>
    <text class="cardTitle" x="1822" y="662" text-anchor="middle">KotlinModule3</text>
  </g>
  <g data-card="Jakarta Namespace" data-x="1612" data-y="720" data-width="420" data-height="96">
    <rect class="card cardWhite teal" x="1612" y="720" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1822" y="752" text-anchor="middle">&lt;&lt;platform&gt;&gt;</text>
    <text class="cardTitle" x="1822" y="792" text-anchor="middle">jakarta.* era</text>
  </g>
  <g data-card="Jackson3 Package" data-x="1612" data-y="850" data-width="420" data-height="96">
    <rect class="card cardWhite red" x="1612" y="850" width="420" height="96" rx="22" stroke-width="4"/>
    <text class="tiny" x="1822" y="882" text-anchor="middle">&lt;&lt;column extensions&gt;&gt;</text>
    <text class="cardTitle" x="1822" y="922" text-anchor="middle">core.jackson3.*</text>
  </g>

  <path class="connector blue" data-connector="package-to-axis"  d="M 570 378 L 874 378"/>
  <polygon class="head"  points="888,378 874,371 874,385" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector blue" data-connector="axis-to-package3"  d="M 1312 378 L 1598 378"/>
  <polygon class="head"  points="1612,378 1598,371 1598,385" fill="#4f86c6" stroke="#4f86c6" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector green" data-connector="mapper-to-axis"  d="M 570 508 L 874 508"/>
  <polygon class="head"  points="888,508 874,501 874,515" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector green" data-connector="axis-to-jsonmapper"  d="M 1312 508 L 1598 508"/>
  <polygon class="head"  points="1612,508 1598,501 1598,515" fill="#6f8f52" stroke="#6f8f52" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector amber" data-connector="module-to-axis"  d="M 570 638 L 874 638"/>
  <polygon class="head"  points="888,638 874,631 874,645" fill="#b8891f" stroke="#b8891f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector amber" data-connector="axis-to-module3"  d="M 1312 638 L 1598 638"/>
  <polygon class="head"  points="1612,638 1598,631 1598,645" fill="#b8891f" stroke="#b8891f" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector teal" data-connector="javax-to-axis"  d="M 570 768 L 874 768"/>
  <polygon class="head"  points="888,768 874,761 874,775" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector teal" data-connector="axis-to-jakarta"  d="M 1312 768 L 1598 768"/>
  <polygon class="head"  points="1612,768 1598,761 1598,775" fill="#4f8f8b" stroke="#4f8f8b" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="connector red" data-connector="exposed-to-axis"  d="M 570 898 L 874 898"/>
  <polygon class="head"  points="888,898 874,891 874,905" fill="#ad5f82" stroke="#ad5f82" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector red" data-connector="axis-to-exposed3"  d="M 1312 898 L 1598 898"/>
  <polygon class="head"  points="1612,898 1598,891 1598,905" fill="#ad5f82" stroke="#ad5f82" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <rect class="lane" x="186" y="1072" width="1828" height="162" rx="30"/>
  <text class="laneTitle" x="226" y="1120">UNCHANGED WORKSHOP CONTRACT</text>
  <g data-card="Column Names" data-x="320" data-y="1144" data-width="430" data-height="56">
    <rect class="cardWhite blue" x="320" y="1144" width="430" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="535" y="1181" text-anchor="middle">jackson() / jacksonb()</text>
  </g>
  <g data-card="Schema Helpers" data-x="885" data-y="1144" data-width="430" data-height="56">
    <rect class="cardWhite brown" x="885" y="1144" width="430" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="1100" y="1181" text-anchor="middle">withJackson*Table helpers</text>
  </g>
  <g data-card="Query Functions" data-x="1450" data-y="1144" data-width="430" data-height="56">
    <rect class="cardWhite green" x="1450" y="1144" width="430" height="56" rx="18" stroke-width="3"/>
    <text class="cardSub" x="1665" y="1181" text-anchor="middle">extract / contains / exists</text>
  </g>

  <rect class="footer" x="216" y="1286" width="1768" height="48" rx="18"/>
  <text class="note" x="1100" y="1318" text-anchor="middle">Reader contract: the migration changes Jackson packages and mapper stack, not the Exposed R2DBC JSON/JSONB usage pattern.</text>
</svg>
