  <rect width="1320" height="860" class="canvas" />
  <rect x="22" y="22" width="1276" height="816" rx="18" class="frame" />
  <text x="58" y="68" class="title" text-anchor="start">Crypt Test Class Structure</text>
  <text x="58" y="96" class="subtitle" text-anchor="start">Concrete view of Ex01_EncryptedColumn: encryptors, local tables, column helpers, and test assertions.</text>

  <rect x="48" y="126" width="1224" height="174" rx="16" class="lane" />
  <text x="72" y="156" class="laneTitle" text-anchor="start">TEST CLASS CONTRACT</text>
  <rect x="48" y="324" width="1224" height="238" rx="16" class="lane" />
  <text x="72" y="354" class="laneTitle" text-anchor="start">LOCAL TABLES AND COLUMN HELPERS</text>
  <rect x="48" y="586" width="1224" height="170" rx="16" class="lane" />
  <text x="72" y="616" class="laneTitle" text-anchor="start">ASSERTED BEHAVIOR</text>

  <g data-card="AbstractR2dbcExposedTest" data-x="120" data-y="188" data-width="320" data-height="82">
    <rect x="120" y="188" width="320" height="82" rx="14" fill="#fff" stroke="#64748b" stroke-width="2" class="card" />
    <path class="header" d="M120,228 L120,202 Q120,188 134,188 L426,188 Q440,188 440,202 L440,228 Z" fill="#f8fafc" />
    <text x="280" y="206" class="tiny" text-anchor="middle">&lt;&lt;base test&gt;&gt;</text>
    <text x="280" y="225" class="cardTitle" text-anchor="middle">AbstractR2dbcExposedTest</text>
    <text x="140" y="250" class="detail" text-anchor="start">ENABLE_DIALECTS_METHOD</text>
  </g>
  <g data-card="Ex01 EncryptedColumn" data-x="520" data-y="188" data-width="320" data-height="82">
    <rect x="520" y="188" width="320" height="82" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card" />
    <path class="header" d="M520,228 L520,202 Q520,188 534,188 L826,188 Q840,188 840,202 L840,228 Z" fill="#eef5fa" />
    <text x="680" y="206" class="tiny" text-anchor="middle">&lt;&lt;test class&gt;&gt;</text>
    <text x="680" y="225" class="cardTitle" text-anchor="middle">Ex01_EncryptedColumn</text>
    <text x="540" y="250" class="detail" text-anchor="start">runTest + withTables</text>
  </g>
  <g data-card="Encryptor Algorithms" data-x="920" data-y="188" data-width="260" data-height="82">
    <rect x="920" y="188" width="260" height="82" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card" />
    <path class="header" d="M920,228 L920,202 Q920,188 934,188 L1166,188 Q1180,188 1180,202 L1180,228 Z" fill="#f5eee4" />
    <text x="1050" y="206" class="tiny" text-anchor="middle">&lt;&lt;provider&gt;&gt;</text>
    <text x="1050" y="225" class="cardTitle" text-anchor="middle">Encryptor Algorithms</text>
    <text x="940" y="250" class="detail" text-anchor="start">AES GCM/CBC, Blowfish, 3DES</text>
  </g>

  <g data-card="StringTable Insert" data-x="86" data-y="388" data-width="250" data-height="108">
    <rect x="86" y="388" width="250" height="108" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card" />
    <path class="header" d="M86,430 L86,402 Q86,388 100,388 L322,388 Q336,388 336,402 L336,430 Z" fill="#eef5fa" />
    <text x="211" y="406" class="tiny" text-anchor="middle">&lt;&lt;local table&gt;&gt;</text>
    <text x="211" y="425" class="cardTitle" text-anchor="middle">StringTable Insert</text>
    <text x="106" y="450" class="detail" text-anchor="start">name/city/address/age</text>
    <text x="106" y="469" class="detail" text-anchor="start">encryptedVarchar()</text>
  </g>
  <g data-card="StringTable Update" data-x="386" data-y="388" data-width="250" data-height="108">
    <rect x="386" y="388" width="250" height="108" rx="14" fill="#fff" stroke="#4f8f8b" stroke-width="2" class="card" />
    <path class="header" d="M386,430 L386,402 Q386,388 400,388 L622,388 Q636,388 636,402 L636,430 Z" fill="#eef7f6" />
    <text x="511" y="406" class="tiny" text-anchor="middle">&lt;&lt;local table&gt;&gt;</text>
    <text x="511" y="425" class="cardTitle" text-anchor="middle">StringTable Update</text>
    <text x="406" y="450" class="detail" text-anchor="start">varchar + binary columns</text>
    <text x="406" y="469" class="detail" text-anchor="start">encryptedBinary()</text>
  </g>
  <g data-card="Column Helpers" data-x="686" data-y="388" data-width="250" data-height="108">
    <rect x="686" y="388" width="250" height="108" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card" />
    <path class="header" d="M686,430 L686,402 Q686,388 700,388 L922,388 Q936,388 936,402 L936,430 Z" fill="#f5eee4" />
    <text x="811" y="406" class="tiny" text-anchor="middle">&lt;&lt;extension&gt;&gt;</text>
    <text x="811" y="425" class="cardTitle" text-anchor="middle">Column Helpers</text>
    <text x="706" y="450" class="detail" text-anchor="start">encryptedVarchar</text>
    <text x="706" y="469" class="detail" text-anchor="start">encryptedBinary</text>
  </g>
  <g data-card="SQL Log Captor" data-x="986" data-y="388" data-width="250" data-height="108">
    <rect x="986" y="388" width="250" height="108" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card" />
    <path class="header" d="M986,430 L986,402 Q986,388 1000,388 L1222,388 Q1236,388 1236,402 L1236,430 Z" fill="#f5eef2" />
    <text x="1111" y="406" class="tiny" text-anchor="middle">&lt;&lt;assertion helper&gt;&gt;</text>
    <text x="1111" y="425" class="cardTitle" text-anchor="middle">SQL Log Captor</text>
    <text x="1006" y="450" class="detail" text-anchor="start">LogCaptor.forName()</text>
    <text x="1006" y="469" class="detail" text-anchor="start">plaintext not logged</text>
  </g>

  <g data-card="Search Limitation" data-x="104" data-y="650" data-width="250" data-height="82">
    <rect x="104" y="650" width="250" height="82" rx="14" fill="#fff" stroke="#a66a3f" stroke-width="2" class="card" />
    <path class="header" d="M104,690 L104,664 Q104,650 118,650 L340,650 Q354,650 354,664 L354,690 Z" fill="#f5eee4" />
    <text x="229" y="668" class="tiny" text-anchor="middle">&lt;&lt;test&gt;&gt;</text>
    <text x="229" y="687" class="cardTitle" text-anchor="middle">Search Limitation</text>
    <text x="124" y="712" class="detail" text-anchor="start">eq encrypted value fails</text>
  </g>
  <g data-card="Transparent CRUD" data-x="386" data-y="650" data-width="250" data-height="82">
    <rect x="386" y="650" width="250" height="82" rx="14" fill="#fff" stroke="#4f86c6" stroke-width="2" class="card" />
    <path class="header" d="M386,690 L386,664 Q386,650 400,650 L622,650 Q636,650 636,664 L636,690 Z" fill="#eef5fa" />
    <text x="511" y="668" class="tiny" text-anchor="middle">&lt;&lt;test&gt;&gt;</text>
    <text x="511" y="687" class="cardTitle" text-anchor="middle">Transparent CRUD</text>
    <text x="406" y="712" class="detail" text-anchor="start">insert/update then decrypt</text>
  </g>
  <g data-card="Length Contract" data-x="668" data-y="650" data-width="250" data-height="82">
    <rect x="668" y="650" width="250" height="82" rx="14" fill="#fff" stroke="#6f8f52" stroke-width="2" class="card" />
    <path class="header" d="M668,690 L668,664 Q668,650 682,650 L904,650 Q918,650 918,664 L918,690 Z" fill="#f1f6ec" />
    <text x="793" y="668" class="tiny" text-anchor="middle">&lt;&lt;test&gt;&gt;</text>
    <text x="793" y="687" class="cardTitle" text-anchor="middle">Length Contract</text>
    <text x="688" y="712" class="detail" text-anchor="start">maxColLength matches output</text>
  </g>
  <g data-card="No Plaintext SQL" data-x="950" data-y="650" data-width="250" data-height="82">
    <rect x="950" y="650" width="250" height="82" rx="14" fill="#fff" stroke="#a85f7f" stroke-width="2" class="card" />
    <path class="header" d="M950,690 L950,664 Q950,650 964,650 L1186,650 Q1200,650 1200,664 L1200,690 Z" fill="#f5eef2" />
    <text x="1075" y="668" class="tiny" text-anchor="middle">&lt;&lt;test&gt;&gt;</text>
    <text x="1075" y="687" class="cardTitle" text-anchor="middle">No Plaintext SQL</text>
    <text x="970" y="712" class="detail" text-anchor="start">logs contain no secrets</text>
  </g>

  <path class="inherit" data-connector="inherits"  d="M520 229 L456 229" />
  <polygon class="head"  points="440,229 456,220 456,238"  stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="connector" data-connector="class-algorithms" d="M840 229 L920 229" stroke="#a66a3f" marker-end="url(#arrow-brown)" />
  <path class="connector" data-connector="class-insert-table" d="M680 270 L680 302 Q680 318 664 318 L227 318 Q211 318 211 334 L211 388" stroke="#4f86c6" marker-end="url(#arrow-blue)" />
  <path class="connector" data-connector="class-update-table" d="M680 270 L680 302 Q680 318 664 318 L527 318 Q511 318 511 334 L511 388" stroke="#4f8f8b" marker-end="url(#arrow-teal)" />
  <path class="connector" data-connector="algorithms-helpers" d="M1050 270 L1050 318 Q1050 334 1034 334 L827 334 Q811 334 811 350 L811 388" stroke="#a66a3f" marker-end="url(#arrow-brown)" />
  <path class="connector" data-connector="helpers-log" d="M936 442 L986 442" stroke="#a85f7f" marker-end="url(#arrow-rose)" />
  <path class="connector" data-connector="update-crud" d="M511 496 L511 650" stroke="#4f8f8b" marker-end="url(#arrow-teal)" />
  <path class="connector" data-connector="helpers-length" d="M811 496 L811 650" stroke="#6f8f52" marker-end="url(#arrow-green)" />
  <path class="connector" data-connector="log-no-plain" d="M1111 496 L1111 650" stroke="#a85f7f" marker-end="url(#arrow-rose)" />
  <path class="connector" data-connector="insert-search" d="M211 496 L211 650" stroke="#a66a3f" marker-end="url(#arrow-brown)" />

  <rect x="86" y="788" width="1148" height="30" rx="10" class="noteBox" />
  <text x="660" y="808" class="note" text-anchor="middle">Default encryptors are non-deterministic: plaintext is transparent to Kotlin code, hidden from SQL logs, and unsuitable for equality search.</text>
</svg>
