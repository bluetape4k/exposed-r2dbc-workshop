server:
    port: 8080
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
        min-response-size: 1024

    shutdown: graceful  # WebServer Graceful shutdown (https://www.baeldung.com/spring-boot-web-server-shutdown)

spring:
    aot:
        enabled: true

    application:
        name: Tenant Onboarding WebFlux Example

    profiles:
        default: "h2"

    jackson:
        serialization:
            indent-output: true
    lifecycle:
        timeout-per-shutdown-phase: 10s     # Graceful Shutdown 시간

    netty:
        leak-detection: simple

app:
    onboarding:
        admin-token: workshop-admin
        max-tenants: 4
        registry-url: r2dbc:h2:mem:///tenant_onboarding_registry;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        tenant-url-prefix: r2dbc:h2:mem:///
        tenant-url-options: DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        overall-timeout: 60s
        reservation-timeout: 10s
        schema-timeout: 30s
        pool:
            max-size: 4
            initial-size: 1
            min-idle: 0
            max-idle-time: 30s
            max-life-time: 30m
            max-create-connection-time: 10s
            max-acquire-time: 5s
            acquire-retry: 3
            background-eviction-interval: 1m

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

    metrics:
        tags:
            application: ${spring.application.name}
        distribution:
            percentiles-histogram:
                http.server.requests: true
                resilience4j.circuitbreaker.calls: true
