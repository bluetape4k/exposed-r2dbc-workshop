server:
    port: 8080
    compression:
        enabled: true
        mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
        min-response-size: 1024

    shutdown: graceful  # WebServer Graceful shutdown (https://www.baeldung.com/spring-boot-web-server-shutdown)

spring:
    aot:
        enabled: true

    application:
        name: Connection Factory Per Tenant WebFlux Example

    profiles:
        default: "h2"

    jackson:
        serialization:
            indent-output: true
    lifecycle:
        timeout-per-shutdown-phase: 10s     # Graceful Shutdown 시간

    netty:
        leak-detection: simple

app:
    tenants:
        default-tenant: korean
        definitions:
            korean:
                url: r2dbc:h2:mem:///tenant_cf_korean;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
            english:
                url: r2dbc:h2:mem:///tenant_cf_english;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    r2dbc:
        pool:
            max-size: 8
            initial-size: 1
            min-idle: 1
            max-idle-time: 10m
            max-life-time: 30m
            max-create-connection-time: 10s
            max-acquire-time: 3s
            acquire-retry: 3
            background-eviction-interval: 1m

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

    metrics:
        tags:
            application: ${spring.application.name}
        distribution:
            percentiles-histogram:
                http.server.requests: true
                resilience4j.circuitbreaker.calls: true
