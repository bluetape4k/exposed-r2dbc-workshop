name: Examples

on:
  push:
    branches: [ develop ]
    paths:
      - '12-production-integration/**'
      - '00-shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/Examples.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - '12-production-integration/**'
      - '00-shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/Examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  chapter-12:
    name: Chapter 12 production integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run production integration examples
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: >-
          ./gradlew
          :01-spring-production-integration:test
          :02-ktor-production-integration:test
          "-PuseDB=H2"
          --continue

      - name: Upload example test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter-12-example-test-results
          path: |
            12-production-integration/**/build/test-results/test/*.xml
            12-production-integration/**/build/reports/tests/test/
          retention-days: 7
