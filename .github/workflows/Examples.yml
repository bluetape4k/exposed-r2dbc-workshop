name: Examples

on:
  schedule:
    - cron: '30 21 * * 0'  # Weekly R2DBC example coverage, Sunday UTC 21:30 (Monday KST 06:30)
  push:
    branches: [ develop ]
    paths:
      - '10-multi-tenant/03-multitenant-spring-webflux/**'
      - '10-multi-tenant/04-connection-factory-per-tenant-spring-webflux/**'
      - '10-multi-tenant/05-spring-security-tenant-authorization-spring-webflux/**'
      - '10-multi-tenant/06-tenant-onboarding-spring-webflux/**'
      - '10-multi-tenant/07-multitenant-ktor/**'
      - '10-multi-tenant/08-resilient-tenant-onboarding-spring-webflux/**'
      - '11-high-performance/02-cache-strategies-r2dbc/**'
      - '11-high-performance/03-routing-datasource/**'
      - '11-high-performance/04-cache-strategies-ktor-r2dbc/**'
      - '11-high-performance/05-cache-strategies-ktor-r2dbc-coroutines/**'
      - '11-high-performance/06-routing-datasource-ktor-r2dbc/**'
      - '12-production-integration/**'
      - '13-ecosystem-integrations/**'
      - 'README.md'
      - 'README.ko.md'
      - 'docs/assets/readme-diagrams/**'
      - 'docs/images/readme-diagrams/**'
      - '00-shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/Examples.yml'
  pull_request:
    branches: [ develop ]
    paths:
      - '10-multi-tenant/03-multitenant-spring-webflux/**'
      - '10-multi-tenant/04-connection-factory-per-tenant-spring-webflux/**'
      - '10-multi-tenant/05-spring-security-tenant-authorization-spring-webflux/**'
      - '10-multi-tenant/06-tenant-onboarding-spring-webflux/**'
      - '10-multi-tenant/07-multitenant-ktor/**'
      - '10-multi-tenant/08-resilient-tenant-onboarding-spring-webflux/**'
      - '11-high-performance/02-cache-strategies-r2dbc/**'
      - '11-high-performance/03-routing-datasource/**'
      - '11-high-performance/04-cache-strategies-ktor-r2dbc/**'
      - '11-high-performance/05-cache-strategies-ktor-r2dbc-coroutines/**'
      - '11-high-performance/06-routing-datasource-ktor-r2dbc/**'
      - '12-production-integration/**'
      - '13-ecosystem-integrations/**'
      - 'README.md'
      - 'README.ko.md'
      - 'docs/assets/readme-diagrams/**'
      - 'docs/images/readme-diagrams/**'
      - '00-shared/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/Examples.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  chapter-10:
    name: Chapter 10 multi-tenant examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run multi-tenant examples
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        # Weekly downstream gate: Spring WebFlux and Ktor R2DBC multi-tenant
        # examples use the H2/default smoke path for PRs and scheduled runs.
        run: >-
          ./gradlew
          :03-multitenant-spring-webflux:test
          :04-connection-factory-per-tenant-spring-webflux:test
          :05-spring-security-tenant-authorization-spring-webflux:test
          :06-tenant-onboarding-spring-webflux:test
          :07-multitenant-ktor:test
          :08-resilient-tenant-onboarding-spring-webflux:test
          "-PuseDB=H2"
          --continue

      - name: Upload chapter 10 example test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter-10-example-test-results
          path: |
            10-multi-tenant/03-multitenant-spring-webflux/build/test-results/test/*.xml
            10-multi-tenant/03-multitenant-spring-webflux/build/reports/tests/test/
            10-multi-tenant/04-connection-factory-per-tenant-spring-webflux/build/test-results/test/*.xml
            10-multi-tenant/04-connection-factory-per-tenant-spring-webflux/build/reports/tests/test/
            10-multi-tenant/05-spring-security-tenant-authorization-spring-webflux/build/test-results/test/*.xml
            10-multi-tenant/05-spring-security-tenant-authorization-spring-webflux/build/reports/tests/test/
            10-multi-tenant/06-tenant-onboarding-spring-webflux/build/test-results/test/*.xml
            10-multi-tenant/06-tenant-onboarding-spring-webflux/build/reports/tests/test/
            10-multi-tenant/07-multitenant-ktor/build/test-results/test/*.xml
            10-multi-tenant/07-multitenant-ktor/build/reports/tests/test/
            10-multi-tenant/08-resilient-tenant-onboarding-spring-webflux/build/test-results/test/*.xml
            10-multi-tenant/08-resilient-tenant-onboarding-spring-webflux/build/reports/tests/test/
          retention-days: 7

  chapter-11:
    name: Chapter 11 high-performance examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run high-performance examples
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        # Weekly downstream gate: R2DBC cache and routing examples stay on
        # H2 to avoid Testcontainers cost in this consumer-facing workflow.
        run: >-
          ./gradlew
          :02-cache-strategies-r2dbc:test
          :03-routing-datasource:test
          :04-cache-strategies-ktor-r2dbc:test
          :05-cache-strategies-ktor-r2dbc-coroutines:test
          :06-routing-datasource-ktor-r2dbc:test
          "-PuseDB=H2"
          --continue

      - name: Upload chapter 11 example test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter-11-example-test-results
          path: |
            11-high-performance/02-cache-strategies-r2dbc/build/test-results/test/*.xml
            11-high-performance/02-cache-strategies-r2dbc/build/reports/tests/test/
            11-high-performance/03-routing-datasource/build/test-results/test/*.xml
            11-high-performance/03-routing-datasource/build/reports/tests/test/
            11-high-performance/04-cache-strategies-ktor-r2dbc/build/test-results/test/*.xml
            11-high-performance/04-cache-strategies-ktor-r2dbc/build/reports/tests/test/
            11-high-performance/05-cache-strategies-ktor-r2dbc-coroutines/build/test-results/test/*.xml
            11-high-performance/05-cache-strategies-ktor-r2dbc-coroutines/build/reports/tests/test/
            11-high-performance/06-routing-datasource-ktor-r2dbc/build/test-results/test/*.xml
            11-high-performance/06-routing-datasource-ktor-r2dbc/build/reports/tests/test/
          retention-days: 7

  chapter-12:
    name: Chapter 12 production integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run production integration examples
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        # Weekly downstream gate: production integration smoke tests validate
        # R2DBC/WebFlux/Ktor consumer paths without external DB credentials.
        run: >-
          ./gradlew
          :01-spring-production-integration:test
          :02-ktor-production-integration:test
          "-PuseDB=H2"
          --continue

      - name: Upload example test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter-12-example-test-results
          path: |
            12-production-integration/**/build/test-results/test/*.xml
            12-production-integration/**/build/reports/tests/test/
          retention-days: 7

  chapter-13:
    name: Chapter 13 ecosystem integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run CockroachDB ecosystem example
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        # Weekly downstream gate: Chapter 13 keeps only the real R2DBC-shaped
        # ecosystem example, using H2 to smoke-test CockroachDB retry behavior.
        run: >-
          ./gradlew
          :03-cockroachdb-retry:test
          "-PuseDB=H2"
          --continue

      - name: Upload chapter 13 example test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chapter-13-example-test-results
          path: |
            13-ecosystem-integrations/**/build/test-results/test/*.xml
            13-ecosystem-integrations/**/build/reports/tests/test/
          retention-days: 7
